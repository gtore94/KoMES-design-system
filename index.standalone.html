<script type="text/babel">
// KoMES — 보험 청구 메인 화면 (orchestrator)

const { useState: useS, useMemo: useM, useEffect: useE } = React;

function InsuranceClaimScreen() {
  // claim type tab
  const [type, setType] = useS("health"); // health / herbal / auto

  // period setup
  const [period, setPeriod] = useS({
    mode: "month", year: 2026, month: 4,
    from: "2026-04-01", to: "2026-04-30",
  });
  const [weekendOpt, setWeekendOpt] = useS(false);
  const [claimGroup, setClaimGroup] = useS("원청구");
  const [diffRate, setDiffRate] = useS("apply");

  // list state — keyed per claim type
  const [loaded, setLoaded] = useS({ health: true, herbal: false, auto: false });
  const [search, setSearch] = useS("");
  const [kindFilter, setKindFilter] = useS("");
  const [errorOnly, setErrorOnly] = useS(false);
  const [density, setDensity] = useS("comfortable");
  const [selected, setSelected] = useS(new Set());
  const [excluded, setExcluded] = useS(new Set());

  // submission flow
  const [submission, setSubmission] = useS(null); // { items, type } | null

  // load source data per type
  const allItems = useM(() => {
    if (type === "health") return HEALTH_CLAIMS_SEED;
    if (type === "herbal") return HERBAL_CLAIMS_SEED;
    return AUTO_CLAIMS_SEED;
  }, [type]);

  // filtered items
  const filteredItems = useM(() => {
    let xs = allItems;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      xs = xs.filter(it =>
        it.patientName.toLowerCase().includes(q) ||
        it.chartNo.toLowerCase().includes(q) ||
        it.rrn.toLowerCase().includes(q)
      );
    }
    if (kindFilter) {
      xs = xs.filter(it => (it.kind === kindFilter) || (it.autoInsurer === kindFilter));
    }
    if (errorOnly) {
      xs = xs.filter(it => !!it.error);
    }
    return xs;
  }, [allItems, search, kindFilter, errorOnly]);

  const kindOptions = useM(() => {
    if (type === "health") return ["보험", "의료급여"];
    if (type === "herbal") return ["시범사업"];
    return AUTO_INSURERS;
  }, [type]);

  // counts for tabs
  const counts = {
    health: HEALTH_CLAIMS_SEED.length,
    herbal: HERBAL_CLAIMS_SEED.length,
    auto: AUTO_CLAIMS_SEED.length,
  };

  // selection on type change
  useE(() => {
    setSelected(new Set());
    setExcluded(new Set());
    setSearch("");
    setKindFilter("");
    setErrorOnly(false);
  }, [type]);

  // load claims
  const handleLoad = () => {
    setLoaded({ ...loaded, [type]: true });
    // auto-select all
    setSelected(new Set(allItems.map(it => it.id)));
  };

  // summary
  const summary = useM(() => {
    const visible = allItems.filter(it => !excluded.has(it.id));
    const totalCount = visible.length;
    const healthOnly = visible.filter(it => it.kind === "보험").length;
    const medicaidOnly = visible.filter(it => it.kind === "의료급여").length;
    const healthAmount = visible.filter(it => it.kind === "보험").reduce((s, it) => s + (it.coveredTotal || it.claimAmount), 0);
    const medicaidAmount = visible.filter(it => it.kind === "의료급여").reduce((s, it) => s + (it.coveredTotal || it.claimAmount), 0);
    const totalClaim = visible.reduce((s, it) => s + (it.coveredTotal || it.claimAmount), 0);
    const copayTotal = visible.reduce((s, it) => s + (it.copay || 0), 0);
    const periodFrom = period.mode === "month"
      ? `${period.year}-${String(period.month).padStart(2, "0")}-01`
      : period.from;
    const periodTo = period.mode === "month"
      ? `${period.year}-${String(period.month).padStart(2, "0")}-30`
      : period.to;
    return {
      totalCount, healthOnly, medicaidOnly,
      healthAmount, medicaidAmount, totalClaim,
      copayTotal, periodFrom, periodTo,
    };
  }, [allItems, excluded, period]);

  // selection actions
  const handleRemoveSelected = () => {
    const newEx = new Set(excluded);
    selected.forEach(id => newEx.add(id));
    setExcluded(newEx);
    setSelected(new Set());
  };

  const errorCount = useM(() => {
    return allItems.filter(it => selected.has(it.id) && it.error).length;
  }, [allItems, selected]);

  const handleSubmitAll = () => {
    const items = allItems.filter(it => !excluded.has(it.id));
    setSubmission({ items, type });
  };
  const handleSubmitSelected = () => {
    const items = allItems.filter(it => selected.has(it.id) && !excluded.has(it.id));
    if (items.length === 0) return;
    setSubmission({ items, type });
  };
  const handleCloseSubmission = (mode) => {
    if (mode === "fix") {
      // auto-filter to error only
      setErrorOnly(true);
      // exclude the just-attempted set (no — leave them visible)
    }
    setSubmission(null);
  };

  // stats for top bar
  const totalToClaim = summary.totalCount;
  const totalErrors = useM(() => allItems.filter(it => it.error && !excluded.has(it.id)).length, [allItems, excluded]);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="보험 청구"
        subtitle="한차트 명세서 → 심평원 진료비 청구 (HIRA API 연동)"
        actions={<>
          <PillStat icon="files" label="청구 대상" value={`${totalToClaim}건`} tone="neutral" />
          <PillStat icon="alert-triangle"
            label="오류 의심"
            value={`${totalErrors}건`}
            tone={totalErrors > 0 ? "danger" : "neutral"} />
          <PillStat icon="banknote" label="청구 합계" value={KRW2(summary.totalClaim)} tone="brand" mono />
        </>}
      />

      <ClaimTypeTabs active={type} onChange={setType} counts={counts} />

      <div style={{ flex: 1, display: "flex", minHeight: 0, overflow: "hidden" }}>
        <PeriodAndSummary
          type={type}
          period={period} setPeriod={setPeriod}
          claimGroup={claimGroup} setClaimGroup={setClaimGroup}
          diffRate={diffRate} setDiffRate={setDiffRate}
          weekendOpt={weekendOpt} setWeekendOpt={setWeekendOpt}
          doctors={CLAIM_DOCTORS}
          summary={summary}
          onLoadClaims={handleLoad}
          loaded={loaded[type]}
        />

        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
          {!loaded[type] ? (
            <EmptyState type={type} onLoad={handleLoad} />
          ) : (
            <>
              <FilterBar
                search={search} setSearch={setSearch}
                kindFilter={kindFilter} setKindFilter={setKindFilter}
                errorOnly={errorOnly} setErrorOnly={setErrorOnly}
                density={density} setDensity={setDensity}
                selected={selected.size} onRemoveSelected={handleRemoveSelected}
                kindOptions={kindOptions}
              />
              <ClaimsTable
                type={type}
                items={filteredItems}
                selected={selected} setSelected={setSelected}
                excluded={excluded} setExcluded={setExcluded}
                density={density}
              />
              <ActionBar
                type={type}
                summary={summary}
                selected={selected.size}
                errorCount={errorCount}
                onSubmitAll={handleSubmitAll}
                onSubmitSelected={handleSubmitSelected}
                onOpenPhysioRecords={() => alert("물리치료 내역 (모의)")}
                onOpenChunaRecords={() => alert("추나치료 내역 (모의)")}
              />
            </>
          )}
        </div>
      </div>

      {submission && (
        <ClaimSubmissionFlow
          items={submission.items}
          type={submission.type}
          summary={summary}
          onClose={handleCloseSubmission}
        />
      )}
    </div>
  );
}

function PillStat({ icon, label, value, tone, mono }) {
  const tones = {
    neutral: { bg: "var(--bg-raised)", fg: "var(--text-secondary)", bd: "var(--border-subtle)", iconColor: "var(--text-muted)" },
    brand:   { bg: "var(--brand-subtle)", fg: "var(--text-brand)", bd: "var(--brand-muted)", iconColor: "var(--jade-600)" },
    danger:  { bg: "var(--status-danger-bg)", fg: "var(--status-danger-text)", bd: "var(--status-danger-border)", iconColor: "var(--cinnabar-600)" },
  };
  const t = tones[tone] || tones.neutral;
  return (
    <div style={{
      display: "inline-flex", alignItems: "center", gap: 8,
      padding: "5px 12px",
      background: t.bg, border: `1px solid ${t.bd}`,
      borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
    }}>
      <Icon name={icon} size={13} style={{ color: t.iconColor }} />
      <span style={{ fontSize: 11, fontWeight: 500, color: t.fg, fontFamily: "var(--font-sans)" }}>{label}</span>
      <span style={{
        fontSize: 12, fontWeight: 700, color: t.fg,
        fontFamily: mono ? "var(--font-mono)" : "var(--font-sans)",
      }}>{value}</span>
    </div>
  );
}

function EmptyState({ type, onLoad }) {
  const t = CLAIM_TYPES.find(x => x.key === type);
  return (
    <div style={{
      flex: 1,
      display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", gap: 14,
      background: "var(--bg-page)",
      padding: 40,
    }}>
      <div style={{
        width: 64, height: 64, borderRadius: "var(--radius-xl)",
        background: "var(--bg-surface)",
        border: "1px dashed var(--border-default)",
        display: "flex", alignItems: "center", justifyContent: "center",
        color: "var(--text-muted)",
      }}>
        <Icon name="folder-open" size={28} />
      </div>
      <div style={{ textAlign: "center", maxWidth: 380 }}>
        <div style={{
          fontFamily: "var(--font-serif)", fontSize: 20, fontWeight: 500,
          color: "var(--text-primary)", marginBottom: 6, letterSpacing: "-0.01em",
        }}>{t.label} 명세서를 불러와 주세요</div>
        <div style={{ fontSize: 13, color: "var(--text-muted)", lineHeight: 1.6, fontFamily: "var(--font-sans)" }}>
          좌측에서 청구 기간을 선택한 뒤 <b>명세서 불러오기</b>를 클릭하면<br />
          한차트에서 진료 명세서를 자동으로 추출합니다.
        </div>
      </div>
      <button onClick={onLoad} style={{
        marginTop: 6, padding: "10px 22px", fontSize: 13, fontWeight: 600,
        background: "var(--jade-500)", color: "#fff",
        border: "none", borderRadius: "var(--radius-md)",
        cursor: "pointer", fontFamily: "var(--font-sans)",
        display: "inline-flex", alignItems: "center", gap: 8,
        boxShadow: "var(--shadow-sm)",
      }}>
        <Icon name="download" size={14} />
        명세서 불러오기
      </button>
    </div>
  );
}

Object.assign(window, { InsuranceClaimScreen });

</script>

// ── Main Modal ───────────────────────────────────────────────────
function PatientPickerModal({ currentPatientId, onClose, onSelect }) {
  const [search, setSearch] = useStatePM("");
  const [filter, setFilter] = useStatePM("all"); // all | today | recent7 | vip | jabo | new
  const [pickedId, setPickedId] = useStatePM(currentPatientId);
  const inputRef = useRefPM(null);

  useEffectPM(() => { inputRef.current?.focus(); }, []);
  useEffectPM(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const filtered = useMemoPM(() => {
    const q = search.trim();
    return window.PP_PATIENTS.filter(p => {
      if (filter === "today")    { if (p.lastVisit !== window.PP_TODAY_STR) return false; }
      if (filter === "recent7")  { if (p.lastVisit < "2026-05-09") return false; }
      if (filter === "vip")      { if (!p.tags.includes("VIP")) return false; }
      if (filter === "jabo")     { if (!p.tags.includes("자보")) return false; }
      if (filter === "new")      { if (!p.tags.includes("초진")) return false; }
      if (q && !(p.name.includes(q) || p.phone.includes(q) || p.chartNo.includes(q) || p.chief.includes(q))) return false;
      return true;
    });
  }, [search, filter]);

  const counts = useMemoPM(() => ({
    all:     window.PP_PATIENTS.length,
    today:   window.PP_PATIENTS.filter(p => p.lastVisit === window.PP_TODAY_STR).length,
    recent7: window.PP_PATIENTS.filter(p => p.lastVisit >= "2026-05-09").length,
    vip:     window.PP_PATIENTS.filter(p => p.tags.includes("VIP")).length,
    jabo:    window.PP_PATIENTS.filter(p => p.tags.includes("자보")).length,
    new:     window.PP_PATIENTS.filter(p => p.tags.includes("초진")).length,
  }), []);

  const picked = window.PP_PATIENTS.find(p => p.id === pickedId);
  const confirm = () => { if (picked) { onSelect(picked); onClose(); } };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 200,
        background: "var(--bg-overlay)",
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: 24, backdropFilter: "blur(2px)",

const splitYMD = (s) => {
  if (!s) return { y: "", m: "", d: "" };
  const [y, m, d] = s.split("-");
  return { y: y || "", m: (m || "").replace(/^0/, ""), d: (d || "").replace(/^0/, "") };
};

            <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>{patient.name}</div>
              <div style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{patient.rrn}</div>
            </div>
            <div style={{ fontSize: 11, color: "var(--text-secondary)", marginTop: 2 }}>차트번호 {patient.chartNo} · {patient.phone}</div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

            <MiniField label="시작일"><TextField type="date" value={data.startDate} onChange={set("startDate")} mono /></MiniField>
            <MiniField label="종료일"><TextField type="date" value={data.endDate} onChange={set("endDate")} mono /></MiniField>
            {isOutpatient && (

// ── Editor Panel Components ──────────────────────────────────────
function PanelSection({ title, hint, children, right }) {
  return (
    <div style={{ padding: "16px 18px", borderBottom: "1px solid var(--border-subtle)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--ink-500)" }}>{title}</div>
        {right}
      </div>
      {hint && <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 8, lineHeight: 1.6 }}>{hint}</div>}
      {children}
    </div>
  );
}

function MiniField({ label, children, span = 1 }) {
  return (
    <div style={{ gridColumn: `span ${span}`, display: "flex", flexDirection: "column", gap: 4 }}>
      <label style={{ fontSize: 11, color: "var(--text-secondary)", fontWeight: 500 }}>{label}</label>
      {children}
    </div>
  );
}

const fieldInput = {
  fontFamily: "var(--font-sans)", fontSize: 12.5, color: "var(--text-primary)",
  background: "var(--bg-surface)", border: "1px solid var(--border-default)",
  borderRadius: "var(--radius-sm)", padding: "6px 9px", outline: "none", width: "100%",
};

function TextField({ value, onChange, placeholder, mono, type = "text" }) {
  return <input
    type={type}
    value={value || ""}
    placeholder={placeholder}
    onChange={(e) => onChange(e.target.value)}
    style={{ ...fieldInput, fontFamily: mono ? "var(--font-mono)" : fieldInput.fontFamily }}
  />;
}

function TextArea({ value, onChange, rows = 4, placeholder }) {
  return <textarea
    rows={rows}
    value={value || ""}
    placeholder={placeholder}
    onChange={(e) => onChange(e.target.value)}
    style={{ ...fieldInput, resize: "vertical", lineHeight: 1.55 }}
  />;
}

function RadioPills({ options, value, onChange }) {
  return (
    <div style={{ display: "inline-flex", background: "var(--bg-raised)", borderRadius: "var(--radius-md)", padding: 3, border: "1px solid var(--border-subtle)" }}>
      {options.map((o) => (
        <button key={o.value} onClick={() => onChange(o.value)} style={{
          border: "none", padding: "6px 12px", borderRadius: "var(--radius-sm)",
          fontSize: 12, fontFamily: "var(--font-sans)", fontWeight: 500,
          cursor: "pointer",
          background: value === o.value ? "var(--bg-surface)" : "transparent",
          color: value === o.value ? "var(--text-primary)" : "var(--text-secondary)",
          boxShadow: value === o.value ? "var(--shadow-sm)" : "none",
        }}>{o.label}</button>
      ))}
    </div>
  );
}

  const [opinionData, setOpinionData] = useStateMF(MF_DEFAULT_OPINION);
  const [treatmentProofData, setTreatmentProofData] = useStateMF(MF_DEFAULT_TREATMENT_PROOF);
  const [admissionProofData, setAdmissionProofData] = useStateMF(MF_DEFAULT_ADMISSION_PROOF);
  const [outpatientProofData, setOutpatientProofData] = useStateMF(MF_DEFAULT_OUTPATIENT_PROOF);
  const [patient, setPatient] = useStateMF(MF_PATIENT);
  const [pickerOpen, setPickerOpen] = useStateMF(false);
  const [historyOpen, setHistoryOpen] = useStateMF(false);
  const [panelWidth, setPanelWidth] = useStateMF(400);
  const stageRef = useRefMF(null);
  const isDragging = useRefMF(false);

  useEffectMF(() => {
    const onMouseMove = (e) => {
      if (!isDragging.current) return;
      const bodyEl = stageRef.current?.parentElement;
      if (!bodyEl) return;
      const rect = bodyEl.getBoundingClientRect();
      const newWidth = Math.max(280, Math.min(700, rect.right - e.clientX));
      setPanelWidth(newWidth);
    };
    const onMouseUp = () => {
      if (isDragging.current) {
        isDragging.current = false;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      }
    };
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);
    return () => {
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    };
  }, []);

  const handlePatientChange = (newPatient) => {
    setPatient({
      id: newPatient.id,
      name: newPatient.name,
      rrn: newPatient.rrn,
      rrnFull: newPatient.rrnFull,
      address: newPatient.address,
      phone: newPatient.phone,
      chartNo: newPatient.chartNo,
    });
    // 등록번호는 차트번호 기반으로 갱신
    setData((d) => ({ ...d, registry: newPatient.chartNo }));
  };

  const previewWidth = 794;
  const isDiagnosis = activeTab === "diagnosis";
  const isInjury     = activeTab === "injury";
  const isFeeDetail      = activeTab === "fee_detail";
  const isCalcDetail     = activeTab === "calc_detail";
  const isReferral       = activeTab === "referral";
  const isOpinion        = activeTab === "opinion";
  const isTreatmentProof = activeTab === "treatment_proof";
  const isAdmissionProof = activeTab === "admission_proof";
  const isOutpatientProof= activeTab === "outpatient_proof";

        </button>
        {historyOpen && (
          <div style={{ padding: "0 24px 20px" }}>
            <IssueHistory />
          </div>
        )}
      </div>

      {/* Patient picker modal */}
      {pickerOpen && (
        <PatientPickerModal
          currentPatientId={patient.id}
          onClose={() => setPickerOpen(false)}
          onSelect={handlePatientChange}
        />
      )}
    </div>
  );
}

        width: "100%", padding: "8px 30px 8px 10px", fontSize: 13,
        fontFamily: "var(--font-sans)", color: "var(--text-primary)",
        background: "var(--bg-surface)", border: "1px solid var(--border-default)",
        borderRadius: "var(--radius-md)", appearance: "none", cursor: "pointer", outline: "none",
        boxSizing: "border-box",
      }}>
        {options.map(o => <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>)}
      </select>
      <span style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", pointerEvents: "none", color: "var(--text-muted)" }}>
        <Icon name="chevron-down" size={14} />
      </span>
    </div>
  );
}

function SRSegmented({ options, value, onChange }) {
  return (
    <div style={{ display: "inline-flex", background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", padding: 2, gap: 2 }}>
      {options.map(opt => (
        <button key={opt} onClick={() => onChange(opt)} style={{
          padding: "5px 12px", border: "none", cursor: "pointer",
          fontSize: 12, fontWeight: value === opt ? 600 : 400,
          background: value === opt ? "var(--bg-surface)" : "transparent",
          color: value === opt ? "var(--text-primary)" : "var(--text-muted)",
          borderRadius: "var(--radius-sm)",
          boxShadow: value === opt ? "var(--shadow-sm)" : "none",
          fontFamily: "var(--font-sans)", transition: "all 0.12s",
        }}>{opt}</button>
      ))}
    </div>
  );
}

function SRSectionCard({ step, icon, title, hint, children }) {
  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)", overflow: "hidden", flexShrink: 0 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px", borderBottom: "1px solid var(--border-subtle)", background: "var(--bg-raised)" }}>
        <div style={{ width: 24, height: 24, borderRadius: "50%", background: "var(--brand-muted)", color: "var(--text-brand)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 700 }}>{step}</div>
        <Icon name={icon} size={15} style={{ color: "var(--jade-600)" }} />
        <span style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{title}</span>
        {hint && <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{hint}</span>}
      </div>
      <div style={{ padding: "16px 18px" }}>{children}</div>
    </div>
  );
}

// ── Main Modal ──────────────────────────────────────────────────────
function staffToForm(s) {
  if (!s) return initialSR;
  return {
    ...initialSR,
    name: s.name ?? "",
    gender: s.gender ?? "여",
    birth: s.birth ?? "", rrnTail: "",
    phone: s.phone ?? "", email: s.email ?? "",
    postcode: "", address: s.address ?? "", addressDetail: "",
    role: s.role ?? "한의사", roleKey: s.roleKey ?? "doctor", dept: s.dept ?? "진료부",
    specialty: s.specialty ?? "", workType: s.workType ?? "정규직",
    licenses: Array.isArray(s.licenses) ? s.licenses.join(", ") : (s.licenses ?? ""),
    joinDate: s.joinDate ?? "2026-05-16",
    schedule: s.schedule ? { ...DEFAULT_SCHEDULE_SR, ...s.schedule } : { ...DEFAULT_SCHEDULE_SR },
    permissions: s.permissions ? [...s.permissions] : [],
    salaryType: s.salary?.type ?? "월급제",
    note: s.note ?? "",
  };
}

function NewStaffModal({ onClose, onSubmit, initialData }) {
  const [d, setD] = useStateSR(() => staffToForm(initialData));
  const isEdit = !!initialData;
  const set = (k, v) => setD(prev => ({ ...prev, [k]: v }));

  const togglePermission = (key) => {
    setD(prev => ({
      ...prev,
      permissions: prev.permissions.includes(key)
        ? prev.permissions.filter(p => p !== key)
        : [...prev.permissions, key],
    }));
  };

  const setScheduleDay = (day, val) => {
    setD(prev => ({ ...prev, schedule: { ...prev.schedule, [day]: val } }));
  };

  const handleRoleChange = (roleName) => {
    const found = ALL_ROLES_SR.find(r => r.role === roleName);
    if (found) setD(prev => ({ ...prev, role: found.role, roleKey: found.roleKey, dept: found.dept }));
  };

  const required = ["name", "phone", "role", "joinDate"];
  const filled = required.filter(k => d[k]).length;
  const allRequired = filled === required.length;

  const computedAge = (() => {
    if (!d.birth || d.birth.length < 6) return null;
    let y = parseInt(d.birth.slice(0, 2), 10);
    if (isNaN(y)) return null;
    const tail = d.rrnTail?.[0];
    y += (tail === "1" || tail === "2" || tail === "5" || tail === "6") ? 1900 : 2000;
    const age = new Date(2026, 4, 16).getFullYear() - y;
    return age >= 0 && age < 80 ? age : null;
  })();

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 100,
      background: "var(--bg-overlay)", backdropFilter: "blur(4px)",
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: 24, fontFamily: "var(--font-sans)",
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        width: "100%", maxWidth: 920, maxHeight: "calc(100vh - 48px)",
        background: "var(--bg-page)", borderRadius: "var(--radius-xl)",
        overflow: "hidden", display: "flex", flexDirection: "column",
        boxShadow: "var(--shadow-xl)",
      }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 22px", background: "var(--bg-surface)", borderBottom: "1px solid var(--border-subtle)" }}>
          <div style={{ width: 38, height: 38, borderRadius: "var(--radius-md)", background: "var(--brand-muted)", color: "var(--text-brand)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="user-plus" size={18} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text-primary)", letterSpacing: "-0.01em" }}>{isEdit ? "직원 정보 수정" : "신규 직원 등록"}</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>
              {isEdit ? `${initialData.name} · 필수 항목 ${filled}/${required.length} 입력됨` : `필수 항목 ${filled}/${required.length} 입력됨 · 등록 후 즉시 직원 목록에 추가됩니다`}
            </div>
          </div>
          <button onClick={onClose} style={{ width: 28, height: 28, display: "inline-flex", alignItems: "center", justifyContent: "center", background: "transparent", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)", cursor: "pointer", color: "var(--text-secondary)" }}>
            <Icon name="x" size={16} />
          </button>
        </div>

        {/* Body */}
        <div style={{ flex: 1, overflowY: "auto", padding: "18px 22px", display: "flex", flexDirection: "column", gap: 14 }}>

          {/* Section 1: 기본 정보 */}
          <SRSectionCard step="1" icon="user" title="기본 정보">
            <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 14 }}>
              <div>
                <SRFieldLabel required>이름</SRFieldLabel>
                <SRTextField value={d.name} onChange={v => set("name", v)} placeholder="홍길동" />
              </div>
              <div>
                <SRFieldLabel>성별</SRFieldLabel>
                <SRSegmented options={["여", "남"]} value={d.gender} onChange={v => set("gender", v)} />
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 14 }}>
              <div>
                <SRFieldLabel hint={computedAge != null ? `만 ${computedAge}세` : ""}>주민등록번호</SRFieldLabel>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 14px 1fr", alignItems: "center", gap: 6 }}>
                  <SRTextField value={d.birth} onChange={v => set("birth", v.replace(/[^0-9]/g,"").slice(0,6))} placeholder="900101" mono />
                  <span style={{ textAlign: "center", color: "var(--text-muted)" }}>-</span>
                  <SRTextField value={d.rrnTail} onChange={v => set("rrnTail", v.replace(/[^0-9*]/g,"").slice(0,7))} placeholder="*******" mono />
                </div>
              </div>
              <div>
                <SRFieldLabel required>휴대폰</SRFieldLabel>
                <SRTextField value={d.phone} onChange={v => set("phone", v)} placeholder="010-0000-0000" mono />
              </div>
            </div>

            <div style={{ marginTop: 14 }}>
              <SRFieldLabel>이메일</SRFieldLabel>
              <SRTextField value={d.email} onChange={v => set("email", v)} placeholder="example@komes.kr" />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "auto 1fr 1.4fr", gap: 8, marginTop: 14 }}>
              <div style={{ gridColumn: "1 / -1" }}>
                <SRFieldLabel>주소</SRFieldLabel>
              </div>
              <SRTextField value={d.postcode} onChange={v => set("postcode", v)} placeholder="우편번호" mono />
              <SRTextField value={d.address} onChange={v => set("address", v)} placeholder="기본 주소" />
              <SRTextField value={d.addressDetail} onChange={v => set("addressDetail", v)} placeholder="상세 주소" />
            </div>
          </SRSectionCard>

          {/* Section 2: 직무 정보 */}
          <SRSectionCard step="2" icon="briefcase" title="직무 정보">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
              <div>
                <SRFieldLabel required>직책</SRFieldLabel>
                <SRSelect value={d.role} onChange={handleRoleChange}
                  options={ALL_ROLES_SR.map(r => r.role)} />
              </div>
              <div>
                <SRFieldLabel>부서</SRFieldLabel>
                <SRSelect value={d.dept} onChange={v => set("dept", v)}
                  options={["진료부","간호부","원무부","치료부","조제실"]} />
              </div>
              <div>
                <SRFieldLabel>고용 형태</SRFieldLabel>
                <SRSelect value={d.workType} onChange={v => set("workType", v)}
                  options={["정규직","계약직","파트타임","인턴"]} />
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginTop: 14 }}>
              <div>
                <SRFieldLabel>전문 분야</SRFieldLabel>
                <SRTextField value={d.specialty} onChange={v => set("specialty", v)} placeholder="예: 침구·내과" />
              </div>
              <div>
                <SRFieldLabel required>입사일</SRFieldLabel>
                <SRTextField value={d.joinDate} onChange={v => set("joinDate", v)} placeholder="YYYY-MM-DD" mono />
              </div>
            </div>

            <div style={{ marginTop: 14 }}>
              <SRFieldLabel>면허 · 자격증</SRFieldLabel>
              <SRTextField value={d.licenses} onChange={v => set("licenses", v)} placeholder="예: 한의사 면허 #12345" />
            </div>

            <div style={{ marginTop: 14 }}>
              <SRFieldLabel>메모</SRFieldLabel>
              <textarea value={d.note} onChange={e => set("note", e.target.value)}
                placeholder="특이사항, 주의사항 등"
                style={{
                  width: "100%", minHeight: 56, padding: "9px 11px",
                  fontSize: 13, fontFamily: "var(--font-sans)", color: "var(--text-primary)",
                  background: "var(--bg-surface)", border: "1px solid var(--border-default)",
                  borderRadius: "var(--radius-md)", outline: "none", resize: "vertical", boxSizing: "border-box",
                }}
              />
            </div>
          </SRSectionCard>

          {/* Section 3: 근무 일정 */}
          <SRSectionCard step="3" icon="calendar" title="근무 일정" hint="기본 주간 근무 시간">
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 8 }}>
              {KO_WEEK_SR.map(day => {
                const val = d.schedule[day] ?? "휴무";
                const isOff = val === "휴무" || val === "휴진";
                return (
                  <div key={day} style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.05em", textAlign: "center", color: day === "토" || day === "일" ? "var(--cinnabar-600)" : "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{day}</div>
                    <select value={isOff ? val : "custom"} onChange={e => {
                      if (e.target.value === "휴무" || e.target.value === "휴진") setScheduleDay(day, e.target.value);
                      else setScheduleDay(day, "09–18");
                    }} style={{
                      fontSize: 11, padding: "4px 6px", border: "1px solid var(--border-default)",
                      borderRadius: "var(--radius-sm)", background: "var(--bg-surface)",
                      color: "var(--text-primary)", fontFamily: "var(--font-sans)", outline: "none", cursor: "pointer",
                    }}>
                      <option value="custom">직접 입력</option>
                      <option value="휴무">휴무</option>
                      <option value="휴진">휴진</option>
                    </select>
                    {!isOff && (
                      <input value={val} onChange={e => setScheduleDay(day, e.target.value)}
                        placeholder="09–18"
                        style={{
                          fontSize: 11, padding: "5px 6px", border: "1px solid var(--border-default)",
                          borderRadius: "var(--radius-sm)", background: "var(--bg-surface)",
                          color: "var(--text-primary)", fontFamily: "var(--font-mono)",
                          outline: "none", width: "100%", boxSizing: "border-box", textAlign: "center",
                        }}
                      />
                    )}
                    {isOff && (
                      <div style={{ fontSize: 11, padding: "5px 6px", background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)", textAlign: "center", color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
                        {val}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </SRSectionCard>

          {/* Section 4: 초기 권한 */}
          <SRSectionCard step="4" icon="shield-check" title="초기 권한 설정" hint={`${d.permissions.length}개 선택됨`}>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {/* 권한 세트 프리셋 */}
              <div>
                <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 7 }}>권한 세트</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {PERMISSION_PRESETS.map(preset => {
                    const active = preset.perms.length === d.permissions.length &&
                      preset.perms.every(p => d.permissions.includes(p));
                    return (
                      <button key={preset.key} onClick={() => set("permissions", [...preset.perms])} style={{
                        display: "inline-flex", alignItems: "center", gap: 5,
                        padding: "5px 12px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                        border: `1px solid ${active ? "var(--jade-300)" : "var(--border-default)"}`,
                        background: active ? "var(--brand-muted)" : "var(--bg-surface)",
                        color: active ? "var(--text-brand)" : "var(--text-secondary)",
                        fontSize: 12, fontWeight: active ? 600 : 400, cursor: "pointer",
                        fontFamily: "var(--font-sans)", transition: "all 0.12s",
                      }}>
                        <Icon name={preset.icon} size={11} />
                        {preset.label}
                        <span style={{ fontSize: 10, color: active ? "var(--jade-600)" : "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
                          {preset.perms.length}
                        </span>
                      </button>
                    );
                  })}
                  <button onClick={() => set("permissions", [])} style={{
                    display: "inline-flex", alignItems: "center", gap: 5,
                    padding: "5px 12px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                    border: "1px solid var(--border-subtle)",
                    background: "transparent", color: "var(--text-muted)",
                    fontSize: 12, cursor: "pointer", fontFamily: "var(--font-sans)",
                  }}>
                    <Icon name="x" size={10} />전체 해제
                  </button>
                </div>
              </div>
              {PERMISSION_GROUPS_SR.map(group => (
                <div key={group.section}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 9, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 6 }}>
                    <Icon name={group.icon} size={10} />{group.section}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 5 }}>
                    {group.items.map(p => {
                      const active = d.permissions.includes(p.key);
                      return (
                        <label key={p.key} style={{
                          display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                          border: `1px solid ${active ? "var(--brand-muted)" : "var(--border-subtle)"}`,
                          background: active ? "var(--brand-subtle)" : "var(--bg-surface)",
                          borderRadius: "var(--radius-md)", cursor: "pointer",
                        }}>
                          <input type="checkbox" checked={active} onChange={() => togglePermission(p.key)}
                            style={{ accentColor: "var(--jade-500)", cursor: "pointer", flexShrink: 0 }} />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{p.label}</div>
                            <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginTop: 1 }}>{p.desc}</div>
                          </div>
                        </label>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </SRSectionCard>

          {/* Section 5: 급여 */}
          <SRSectionCard step="5" icon="banknote" title="급여 정보">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <div>
                <SRFieldLabel>급여 유형</SRFieldLabel>
                <SRSegmented options={["월급제","연봉제","시급제"]} value={d.salaryType} onChange={v => set("salaryType", v)} />
              </div>
            </div>
            <div style={{ marginTop: 12, padding: "10px 12px", background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", display: "flex", alignItems: "center", gap: 10 }}>
              <Icon name="lock" size={14} style={{ color: "var(--text-muted)" }} />
              <span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>급여 금액은 등록 후 원장 권한으로 별도 입력합니다.</span>
            </div>
          </SRSectionCard>
        </div>

        {/* Footer */}
        <div style={{ padding: "12px 22px", background: "var(--bg-surface)", borderTop: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 11, color: "var(--text-muted)", display: "flex", alignItems: "center", gap: 5 }}>
            <Icon name="info" size={12} />
            {isEdit ? "변경 사항이 즉시 반영됩니다." : "등록 즉시 직원 목록에 추가됩니다."}
          </span>
          <div style={{ flex: 1 }} />
          <button onClick={onClose} style={{ padding: "8px 16px", fontSize: 13, fontWeight: 500, background: "transparent", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", color: "var(--text-secondary)", cursor: "pointer", fontFamily: "var(--font-sans)" }}>
            취소
          </button>
          <button
            onClick={() => onSubmit && onSubmit(d)}
            disabled={!allRequired}
            style={{
              padding: "8px 18px", fontSize: 13, fontWeight: 600,
              background: allRequired ? "var(--jade-500)" : "var(--stone-300)",
              border: "none", borderRadius: "var(--radius-md)", color: "#fff",
              cursor: allRequired ? "pointer" : "not-allowed",
              fontFamily: "var(--font-sans)",
              display: "inline-flex", alignItems: "center", gap: 6,
              boxShadow: allRequired ? "var(--shadow-sm)" : "none",
            }}>
            <Icon name={isEdit ? "save" : "user-plus"} size={13} />{isEdit ? "수정 완료" : "직원 등록"}
          </button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { NewStaffModal, PERMISSION_PRESETS });

</script>

<script type="text/babel">
// KoMES — Staff Management (직원 관리)
// 한의원 직원 등록부 · 필터 · 검색 · 상세 (프로필/근무/권한/인사)
const { useState: useStateStaff, useMemo: useMemoStaff, useEffect: useEffectStaff } = React;

const KO_WEEK = ["월","화","수","목","금","토","일"];

// ── Filter Sidebar ───────────────────────────────────────────────
function StaffFilterSidebar({ filter, setFilter, counts }) {
  const statusItems = [
    { key: "all",      icon: "users",       label: "전체 직원" },
    { key: "active",   icon: "user-check",  label: "재직" },
    { key: "leave",    icon: "user-minus",  label: "휴직" },
    { key: "resigned", icon: "user-x",      label: "퇴직" },
  ];
  const roleItems = ROLE_GROUPS.map(g => ({
    key: `role:${g.key}`, icon: g.icon, label: g.label, color: g.color,
  }));
  const today = [
    { key: "today:on",  icon: "circle-dot", label: "오늘 출근" },
    { key: "today:off", icon: "moon",        label: "오늘 비번" },
  ];

  const renderRow = (item) => {
    const active = filter === item.key;
    return (
      <div key={item.key} onClick={() => setFilter(item.key)} style={{
        display: "flex", alignItems: "center", gap: 8, padding: "7px 10px",
        borderRadius: "var(--radius-md)", cursor: "pointer",
        background: active ? "var(--brand-muted)" : "transparent",
        color: active ? "var(--text-brand)" : "var(--text-secondary)",
        fontSize: 12, fontWeight: active ? 600 : 400,
        fontFamily: "var(--font-sans)", transition: "all 0.12s",
      }}>
        <Icon name={item.icon} size={13} style={item.color && !active ? { color: item.color } : undefined} />
        <span style={{ flex: 1 }}>{item.label}</span>

function yearsOfService(joinDate) {
  if (!joinDate) return "—";
  const [y, m] = joinDate.split("-").map(Number);
  const now = new Date(2026, 4, 16); // 고정 기준일
  const months = (now.getFullYear() - y) * 12 + (now.getMonth() - (m - 1));
  if (months < 12) return `${months}개월차`;
  const yrs = Math.floor(months / 12);
  const rem = months % 12;
  return rem ? `${yrs}년 ${rem}개월차` : `${yrs}년차`;
}

                        background: granted ? "var(--brand-subtle)" : "var(--bg-surface)",
                        borderRadius: "var(--radius-md)",

                        <div style={{ flex: 1, minWidth: 0 }}>

<script type="text/babel">
// KoMES — 발주서 초안 편집 화면
// AI 추천 → "발주서 초안 만들기" 클릭 시 진입
// 좌: 공급처별 초안 리스트 / 메인: 선택된 초안의 편집 영역

const { useState: useStPOD, useMemo: useMemoPOD, useEffect: useEffPOD } = React;

const TODAY_STR = "2026-05-16";
const STAFF_OPTIONS = ["김민준 (원장)", "이수민 (간호조무)", "박지원 (간호조무)"];
const PAYMENT_OPTIONS = ["월말 정산", "선결제", "후불 30일", "현금 결제"];

function PurchaseOrderDraftScreen({ onClose, onSubmit, initialRecommendations }) {
  // 초기 초안 구성: 추천 결과 → drafts 배열
  const [drafts, setDrafts] = useStPOD(() => {
    const recs = initialRecommendations || computeRecommendations(REC_DEFAULTS);
    return recs.map((g, i) => {
      const meta = SUPPLIERS[g.supplier] || {};
      const expected = addDays(TODAY_STR, (meta.avgLead || 7));
      return {
        id: `DRAFT-${String(i + 1).padStart(3, "0")}`,
        supplier: g.supplier,
        orderDate: TODAY_STR,
        expectedDate: expected,
        placedBy: STAFF_OPTIONS[0],
        paymentTerms: meta.payment || "월말 정산",
        note: "",
        items: g.items.map(it => ({ ...it, key: `${it.id}-${Math.random().toString(36).slice(2, 8)}` })),
        deletedItems: [],
      };
    });
  });

  const [selectedIdx, setSelectedIdx] = useStPOD(0);
  const [activeItemKey, setActiveItemKey] = useStPOD(null);
  const [toast, setToast] = useStPOD(null);
  const [confirmSubmit, setConfirmSubmit] = useStPOD(false);

  // 자동으로 첫 라인 활성화
  useEffPOD(() => {
    const d = drafts[selectedIdx];
    if (d && d.items.length > 0 && !activeItemKey) {
      setActiveItemKey(d.items[0].key);
    }
  }, [selectedIdx, drafts.length]);

  const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 2400); };

  // ── Mutators ────────────────────────────────────────────────
  const updateDraft = (idx, patch) => {
    setDrafts(d => d.map((x, i) => i === idx ? { ...x, ...patch } : x));
  };
  const updateItem = (draftIdx, itemKey, patch) => {
    setDrafts(d => d.map((x, i) => i !== draftIdx ? x : {
      ...x,
      items: x.items.map(it => it.key === itemKey ? { ...it, ...patch } : it),
    }));
  };
  const removeItem = (draftIdx, itemKey) => {
    setDrafts(d => d.map((x, i) => i !== draftIdx ? x : {
      ...x,
      items: x.items.filter(it => it.key !== itemKey),
      deletedItems: [...x.deletedItems, x.items.find(it => it.key === itemKey)],
    }));
    showToast("품목이 제거되었습니다. 우측 상단 '복원'에서 되돌릴 수 있습니다.");
  };
  const restoreDeleted = (draftIdx) => {
    setDrafts(d => d.map((x, i) => i !== draftIdx ? x : {
      ...x,
      items: [...x.items, ...x.deletedItems],
      deletedItems: [],
    }));
    showToast("삭제된 품목이 복원되었습니다.");
  };
  const removeDraft = (idx) => {
    setDrafts(d => d.filter((_, i) => i !== idx));
    setSelectedIdx(Math.max(0, idx - 1));
    showToast("초안이 삭제되었습니다.");
  };
  const resetItemQty = (draftIdx, itemKey) => {
    setDrafts(d => d.map((x, i) => i !== draftIdx ? x : {
      ...x,
      items: x.items.map(it => {
        if (it.key !== itemKey) return it;
        // 원본 추천 수량으로 재계산: targetCoverDays 기준 그대로
        const need = (it.monthly / 30) * REC_DEFAULTS.targetCoverDays - it.currentStock;
        const round = it.kind === "herb" ? REC_DEFAULTS.roundingHerb : REC_DEFAULTS.roundingSupply;
        const qty = Math.max(it.threshold, Math.ceil(need / round) * round);
        return { ...it, qty };
      }),
    }));
  };

  const current = drafts[selectedIdx] || null;
  const totalAll = drafts.reduce((s, d) =>
    s + d.items.reduce((ss, i) => ss + i.qty * i.unitPrice, 0), 0);
  const totalItems = drafts.reduce((s, d) => s + d.items.length, 0);

  if (drafts.length === 0) {
    return (
      <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)", alignItems: "center", justifyContent: "center", gap: 16 }}>
        <Icon name="inbox" size={32} style={{ color: "var(--text-muted)" }} />
        <div style={{ fontSize: 14, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>모든 초안이 삭제되었습니다</div>
        <Button variant="secondary" size="md" icon="arrow-left" onClick={onClose}>돌아가기</Button>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      {/* Mode banner */}
      <div style={{
        background: "linear-gradient(90deg, var(--jade-800) 0%, var(--jade-700) 100%)",
        color: "white", padding: "10px 24px",
        display: "flex", alignItems: "center", gap: 12,
      }}>
        <Icon name="sparkles" size={16} style={{ color: "var(--brand-muted)" }} />
        <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.04em" }}>AI 추천 발주서 초안</div>
        <div style={{ width: 1, height: 14, background: "rgba(255,255,255,0.2)" }}></div>
        <div style={{ fontSize: 11, color: "var(--brand-muted)" }}>
          공급처 {drafts.length}곳 · 총 {totalItems}품목 · 합계 {won(totalAll)} — 검토 후 승인 요청
        </div>
        <div style={{ flex: 1 }}></div>
        <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--brand-muted)" }}>
          작성 시각 {TODAY_STR} 14:32
        </div>
      </div>

      <TopBar
        title="발주서 초안 편집"
        subtitle={`${current?.supplier} · ${current?.items.length}품목 선택됨`}
        actions={<>
          <Button variant="ghost" size="sm" icon="x" onClick={onClose}>닫기</Button>
          <Button variant="secondary" size="sm" icon="save" onClick={() => onSubmit && onSubmit({ draft: true, drafts })}>임시 저장</Button>
          <Button variant="primary" size="sm" icon="send" onClick={() => setConfirmSubmit(true)}
            disabled={drafts.length === 0 || totalItems === 0}>승인 요청 ({drafts.length}건)</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        {/* Left — drafts sidebar */}
        <PODraftSidebar
          drafts={drafts}
          selectedIdx={selectedIdx}
          onSelect={i => { setSelectedIdx(i); setActiveItemKey(null); }}
          totalAll={totalAll}
        />

        {/* Main — selected draft edit */}
        <div style={{ flex: 1, overflowY: "auto", minWidth: 0, background: "var(--bg-raised)" }}>
          {current && (
            <PODraftEditor
              draft={current}
              draftIdx={selectedIdx}
              activeItemKey={activeItemKey}
              onSelectItem={setActiveItemKey}
              onUpdateDraft={(patch) => updateDraft(selectedIdx, patch)}
              onUpdateItem={(key, patch) => updateItem(selectedIdx, key, patch)}
              onRemoveItem={(key) => removeItem(selectedIdx, key)}
              onResetQty={(key) => resetItemQty(selectedIdx, key)}
              onRestore={() => restoreDeleted(selectedIdx)}
              onRemoveDraft={() => removeDraft(selectedIdx)}
            />
          )}
        </div>

        {/* Right — line reason / supplier info panel */}
        <PODraftRightPanel
          draft={current}
          activeItemKey={activeItemKey}
        />
      </div>

      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--text-primary)", color: "var(--bg-raised)",
          padding: "10px 18px", borderRadius: "var(--radius-md)",
          fontSize: 13, fontFamily: "var(--font-sans)", boxShadow: "var(--shadow-lg)",
          display: "flex", alignItems: "center", gap: 8, zIndex: 100,
        }}>
          <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
          {toast}
        </div>
      )}

      {confirmSubmit && (
        <PODraftConfirmModal
          drafts={drafts} totalAll={totalAll} totalItems={totalItems}
          onClose={() => setConfirmSubmit(false)}
          onConfirm={() => { setConfirmSubmit(false); onSubmit && onSubmit({ draft: false, drafts }); }}
        />
      )}
    </div>
  );
}

// ── 좌측 초안 사이드바 ───────────────────────────────────────────
function PODraftSidebar({ drafts, selectedIdx, onSelect, totalAll }) {
  return (
    <div style={{
      width: 280, background: "var(--bg-surface)", borderRight: "1px solid var(--border-subtle)",
      display: "flex", flexDirection: "column", flexShrink: 0, overflow: "hidden",
    }}>
      <div style={{
        padding: "16px 16px 12px",
        background: "linear-gradient(180deg, var(--brand-subtle), var(--bg-surface))",
        borderBottom: "1px solid var(--border-subtle)",
      }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 4 }}>총 합계</div>
        <div style={{ fontSize: 24, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)", letterSpacing: "-0.01em" }}>{won(totalAll)}</div>
        <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 2, fontFamily: "var(--font-sans)" }}>
          {drafts.length}개 발주서 초안
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "8px 8px" }}>
        {drafts.map((d, i) => {
          const total = d.items.reduce((s, x) => s + x.qty * x.unitPrice, 0);
          const meta = SUPPLIERS[d.supplier] || {};
          const belowMin = meta.minOrder && total < meta.minOrder;
          const urgent = d.items.filter(x => x.urgency === "high").length;
          const isSel = i === selectedIdx;
          return (
            <div key={d.id} onClick={() => onSelect(i)} style={{
              padding: "11px 12px", marginBottom: 4,
              borderRadius: "var(--radius-md)", cursor: "pointer",
              background: isSel ? "var(--brand-subtle)" : "transparent",
              border: `1px solid ${isSel ? "var(--jade-300)" : "transparent"}`,
              transition: "all 0.1s ease",
            }}
            onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = "var(--bg-raised)"; }}
            onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = "transparent"; }}>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 3 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: isSel ? "var(--text-brand)" : "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{d.supplier}</span>
                <span style={{ fontSize: 9, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{d.id}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <span style={{ fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>{d.items.length}품목</span>
                <span style={{ fontSize: 13, fontWeight: 600, fontFamily: "var(--font-mono)", color: "var(--text-primary)" }}>{won(total)}</span>
              </div>
              <div style={{ display: "flex", gap: 5, marginTop: 6, flexWrap: "wrap" }}>
                {urgent > 0 && (
                  <span style={{ fontSize: 9, fontWeight: 600, background: "var(--status-danger-bg)", color: "var(--status-danger-text)", padding: "1px 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)" }}>긴급 {urgent}</span>
                )}
                {belowMin && (
                  <span title={`최소 발주 ${won(meta.minOrder)}`}
                        style={{ fontSize: 9, fontWeight: 600, background: "var(--status-warning-bg)", color: "var(--status-warning-text)", padding: "1px 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)" }}>
                    최소금액 미달
                  </span>
                )}
                {!urgent && !belowMin && (
                  <span style={{ fontSize: 9, fontWeight: 500, background: "var(--brand-muted)", color: "var(--text-brand)", padding: "1px 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)" }}>준비됨</span>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── 메인 편집 영역 ───────────────────────────────────────────────
function PODraftEditor({ draft, draftIdx, activeItemKey, onSelectItem, onUpdateDraft, onUpdateItem, onRemoveItem, onResetQty, onRestore, onRemoveDraft }) {
  const meta = SUPPLIERS[draft.supplier] || {};
  const total = draft.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);
  const belowMin = meta.minOrder && total < meta.minOrder;

  return (
    <div style={{ padding: "20px 28px 32px", display: "flex", flexDirection: "column", gap: 18, maxWidth: 1100, minWidth: 0 }}>

      {/* 공급처 헤더 카드 */}
      <div style={{
        background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-lg)", padding: "18px 22px",
        boxShadow: "var(--shadow-sm)",
      }}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 16 }}>
          <div style={{
            width: 44, height: 44, borderRadius: "var(--radius-md)",
            background: "var(--brand-muted)", color: "var(--text-brand)",
            display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
          }}>
            <Icon name="building-2" size={20} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 22, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)", letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>{draft.supplier}</span>
              <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)", whiteSpace: "nowrap" }}>{draft.id}</span>
            </div>
            <div style={{ display: "flex", gap: 14, marginTop: 6, fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)", flexWrap: "wrap", rowGap: 4 }}>
              {meta.contact && <span style={{ whiteSpace: "nowrap" }}><Icon name="user" size={11} style={{ verticalAlign: "-1px", color: "var(--text-muted)" }} /> {meta.contact}</span>}
              {meta.phone && <span style={{ fontFamily: "var(--font-mono)", whiteSpace: "nowrap" }}><Icon name="phone" size={11} style={{ verticalAlign: "-1px", color: "var(--text-muted)" }} /> {meta.phone}</span>}
              {meta.avgLead != null && <span style={{ whiteSpace: "nowrap" }}><Icon name="truck" size={11} style={{ verticalAlign: "-1px", color: "var(--text-muted)" }} /> 평균 리드 {meta.avgLead}일</span>}
              {meta.minOrder != null && <span style={{ whiteSpace: "nowrap" }}><Icon name="banknote" size={11} style={{ verticalAlign: "-1px", color: "var(--text-muted)" }} /> 최소 {won(meta.minOrder)}</span>}
            </div>
            {meta.note && (
              <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 6, fontStyle: "italic", fontFamily: "var(--font-sans)" }}>{meta.note}</div>
            )}
          </div>
          <Button variant="ghost" size="sm" icon="trash-2" onClick={onRemoveDraft}>이 초안 삭제</Button>
        </div>
      </div>

      {/* 발주 기본 정보 */}
      <div style={{
        background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-lg)", padding: "16px 22px", boxShadow: "var(--shadow-sm)",
      }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 12 }}>발주 기본 정보</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 14 }}>
          <PODField label="발주일">
            <input type="date" value={draft.orderDate}
              onChange={e => onUpdateDraft({ orderDate: e.target.value })}
              style={fieldStyle} />
          </PODField>
          <PODField label="입고 예정일">
            <input type="date" value={draft.expectedDate}
              onChange={e => onUpdateDraft({ expectedDate: e.target.value })}
              style={fieldStyle} />
          </PODField>
          <PODField label="담당자">
            <select value={draft.placedBy} onChange={e => onUpdateDraft({ placedBy: e.target.value })}
              style={{ ...fieldStyle, appearance: "none",
                backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9E9A' d='M0 0l5 6 5-6z'/></svg>\")",
                backgroundRepeat: "no-repeat", backgroundPosition: "right 10px center", paddingRight: 28 }}>
              {STAFF_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}

          </PODField>
          <PODField label="결제 조건">
            <select value={draft.paymentTerms} onChange={e => onUpdateDraft({ paymentTerms: e.target.value })}
              style={{ ...fieldStyle, appearance: "none",
                backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9E9A' d='M0 0l5 6 5-6z'/></svg>\")",
                backgroundRepeat: "no-repeat", backgroundPosition: "right 10px center", paddingRight: 28 }}>
              {PAYMENT_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}

      {/* 품목 테이블 */}

        background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", overflow: "hidden",

        <div style={{ padding: "12px 18px", borderBottom: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)" }}>발주 품목</span>

          <div style={{ flex: 1 }}></div>
          {draft.deletedItems.length > 0 && (
            <Button variant="ghost" size="sm" icon="rotate-ccw" onClick={onRestore}>

          <Button variant="ghost" size="sm" icon="plus" onClick={() => {}}>품목 추가</Button>
        </div>

        {draft.items.length === 0 ? (
          <div style={{ padding: "40px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13 }}>
            품목이 없습니다 — 위의 "복원" 또는 "품목 추가"로 추가하세요

              <tr style={{ background: "var(--bg-raised)" }}>

                <th style={dHdrL}>추천 사유</th>
                <th style={dHdrR}>현재 재고</th>
                <th style={{ ...dHdrC, width: 170 }}>발주 수량</th>
                <th style={{ ...dHdrR, width: 110 }}>단가</th>

                <th style={{ ...dHdrC, width: 32 }}></th>
              </tr>
            </thead>
            <tbody>
              {draft.items.map(it => {
                const isActive = activeItemKey === it.key;
                const subtotal = it.qty * it.unitPrice;
                return (
                  <tr key={it.key}
                    onClick={() => onSelectItem(it.key)}
                    style={{
                      borderTop: "1px solid var(--border-subtle)",
                      background: isActive ? "var(--brand-subtle)" : "transparent",
                      cursor: "pointer", transition: "background 0.1s ease",
                    }}
                    onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = "var(--bg-raised)"; }}
                    onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = "transparent"; }}>
                    <td style={{ padding: "10px 14px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{
                          display: "inline-flex", alignItems: "center", justifyContent: "center",
                          width: 22, height: 22, borderRadius: "var(--radius-sm)",
                          background: it.kind === "herb" ? "var(--brand-muted)" : "var(--bg-raised)",
                          color: it.kind === "herb" ? "var(--text-brand)" : "var(--text-secondary)",
                          flexShrink: 0,
                        }}>
                          <Icon name={it.kind === "herb" ? "leaf" : "package"} size={11} />
                        </span>
                        <div style={{ minWidth: 0 }}>
                          <div style={{ fontSize: 13, fontWeight: 500, color: "var(--text-primary)", whiteSpace: "nowrap" }}>{it.name}</div>
                          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 1, whiteSpace: "nowrap" }}>{it.category}{it.pack ? ` · ${it.pack}` : ""}</div>
                        </div>
                      </div>
                    </td>
                    <td style={{ padding: "10px 14px" }}>
                      <span style={{
                        display: "inline-block",
                        fontSize: 11, fontWeight: 600, fontFamily: "var(--font-sans)",
                        color: it.urgency === "high" ? "var(--status-danger-text)" :
                               it.urgency === "med"  ? "var(--status-warning-text)" : "var(--text-brand)",
                        padding: "2px 8px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                        background: it.urgency === "high" ? "var(--status-danger-bg)" :
                                    it.urgency === "med"  ? "var(--status-warning-bg)" : "var(--brand-muted)",
                        whiteSpace: "nowrap",
                      }}>
                        {it.urgency === "high" ? "긴급" : it.urgency === "med" ? "주의" : "여유"} · {it.reason}
                      </span>
                    </td>
                    <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-mono)", whiteSpace: "nowrap" }}>
                      {it.kind === "herb" ? fmtMass(it.currentStock) : `${it.currentStock} ${it.unit}`}
                    </td>
                    <td style={{ padding: "8px 12px" }}>
                      <QtyStepper
                        value={it.qty}
                        unit={it.unit}
                        kind={it.kind}
                        onChange={v => onUpdateItem(it.key, { qty: Math.max(0, v) })}
                        onReset={() => onResetQty(it.key)}
                      />
                    </td>
                    <td style={{ padding: "8px 12px", textAlign: "right" }}>
                      <input type="number" value={it.unitPrice}
                        onClick={e => e.stopPropagation()}
                        onChange={e => onUpdateItem(it.key, { unitPrice: Math.max(0, Number(e.target.value) || 0) })}
                        style={{
                          width: 90, padding: "6px 10px", textAlign: "right",
                          fontFamily: "var(--font-mono)", fontSize: 12,
                          border: "1px solid var(--border-default)",
                          borderRadius: "var(--radius-sm)", outline: "none",
                          background: "var(--bg-surface)",
                        }} />
                    </td>
                    <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-mono)" }}>
                      {won(subtotal)}
                    </td>
                    <td style={{ padding: "10px 8px", textAlign: "center" }}>
                      <button onClick={e => { e.stopPropagation(); onRemoveItem(it.key); }}
                        style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", padding: 4 }}
                        title="이 품목 삭제">
                        <Icon name="x" size={13} />
                      </button>
                    </td>
                  </tr>
                );
              })}
              <tr style={{ background: "var(--bg-raised)", borderTop: "2px solid var(--border-default)" }}>
                <td colSpan={5} style={{ padding: "10px 14px", textAlign: "right", fontSize: 12, fontWeight: 600, color: "var(--text-secondary)" }}>합계</td>
                <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 15, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-mono)" }}>{won(total)}</td>
                <td></td>
              </tr>
            </tbody>
          </table>
          </div>
        )}
      </div>

      {/* 최소 발주 금액 경고 */}
      {belowMin && (
        <div style={{
          padding: "12px 16px", background: "var(--status-warning-bg)",
          border: "1px solid var(--status-warning-border)", borderRadius: "var(--radius-md)",
          display: "flex", alignItems: "flex-start", gap: 10,
        }}>
          <Icon name="alert-triangle" size={15} style={{ color: "var(--status-warning-text)", flexShrink: 0, marginTop: 1 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--status-warning-text)" }}>최소 발주 금액 미달</div>
            <div style={{ fontSize: 11, color: "var(--status-warning-text)", marginTop: 2, lineHeight: 1.5 }}>
              {draft.supplier}의 최소 발주 금액은 {won(meta.minOrder)}입니다. 현재 {won(total)} — {won(meta.minOrder - total)} 더 필요합니다.
              승인은 가능하나 공급처 처리 시 배송비가 추가될 수 있습니다.
            </div>
          </div>
        </div>
      )}

      {/* 메모 */}
      <div style={{
        background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-lg)", padding: "14px 18px", boxShadow: "var(--shadow-sm)",
      }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>공급처 전달 메모</div>
        <textarea value={draft.note} onChange={e => onUpdateDraft({ note: e.target.value })}
          placeholder="배송 시 주의 사항, 분할 입고 요청, 결제 조건 변경 등을 입력하세요"
          style={{
            width: "100%", minHeight: 56, padding: "8px 11px",
            fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
            background: "var(--bg-surface)", border: "1px solid var(--border-default)",
            borderRadius: "var(--radius-md)", outline: "none", resize: "vertical",
          }} />
      </div>
    </div>
  );
}

// ── 수량 스텝퍼 ──────────────────────────────────────────────────
function QtyStepper({ value, unit, kind, onChange, onReset }) {
  const step = kind === "herb" ? 100 : 1;
  return (
    <div onClick={e => e.stopPropagation()} style={{
      display: "flex", alignItems: "center", gap: 4,
      border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)",
      background: "var(--bg-surface)", padding: 2,
    }}>
      <button onClick={() => onChange(value - step)}
        style={stepBtn}>
        <Icon name="minus" size={11} />
      </button>
      <input type="number" value={value}
        onChange={e => onChange(Number(e.target.value) || 0)}
        style={{
          width: 64, padding: "5px 6px", textAlign: "right",
          fontFamily: "var(--font-mono)", fontSize: 13, fontWeight: 600,
          color: "var(--text-primary)", border: "none", outline: "none",
          background: "transparent",
        }} />
      <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)", paddingRight: 4 }}>{unit}</span>
      <button onClick={() => onChange(value + step)}
        style={stepBtn}>
        <Icon name="plus" size={11} />
      </button>
      <button onClick={onReset} title="추천 수량으로 복원"
        style={{ ...stepBtn, marginLeft: 2, color: "var(--text-brand)" }}>
        <Icon name="sparkles" size={10} />
      </button>
    </div>
  );
}

const stepBtn = {
  width: 22, height: 22, border: "none", background: "transparent",
  cursor: "pointer", color: "var(--text-secondary)",
  display: "inline-flex", alignItems: "center", justifyContent: "center",
  borderRadius: "var(--radius-sm)",
};

// ── 우측 추천 사유 / 공급처 상세 패널 ────────────────────────────
function PODraftRightPanel({ draft, activeItemKey }) {
  if (!draft) return <div style={{ width: 320, background: "var(--bg-surface)", borderLeft: "1px solid var(--border-subtle)" }}></div>;

  const item = draft.items.find(it => it.key === activeItemKey);

  return (
    <div style={{
      width: 320, background: "var(--bg-surface)",
      borderLeft: "1px solid var(--border-subtle)",
      padding: "16px 18px", display: "flex", flexDirection: "column", gap: 16,
      flexShrink: 0, overflowY: "auto",
    }}>
      {item ? (
        <PODItemDetail item={item} draft={draft} />
      ) : (
        <div style={{
          color: "var(--text-muted)", fontSize: 12, fontFamily: "var(--font-sans)",
          padding: "24px 12px", textAlign: "center",
          background: "var(--bg-raised)", borderRadius: "var(--radius-md)",
          border: "1px dashed var(--border-subtle)",
        }}>
          품목을 선택하면<br/>추천 사유와 가격 이력이 표시됩니다
        </div>
      )}

      {/* Draft summary */}
      <div style={{
        marginTop: "auto", padding: "12px 14px", background: "var(--bg-raised)",

<script type="text/babel">
// KoMES — AI 발주 추천 조건 조정 모달
// 좌: 설정 폼 (트리거 · 발주 목표 · 그룹핑 · 알림 · 예외)
// 우: 라이브 프리뷰 (현재 설정으로 생성되는 추천 결과)

const { useState: useStRS, useMemo: useMemoRS } = React;

function RecommendationSettingsModal({ onClose, onSave, initial = REC_DEFAULTS }) {
  const [s, setS]       = useStRS({ ...initial });
  const [tab, setTab]   = useStRS("trigger"); // trigger | target | group | alert | except

  const set = (patch) => setS(prev => ({ ...prev, ...patch }));
  const toggleArr = (key, value) => {
    const arr = s[key] || [];
    const next = arr.includes(value) ? arr.filter(x => x !== value) : [...arr, value];
    set({ [key]: next });
  };

  // 현재 설정 기준 추천 시뮬레이션 (약재 + 소모품)
  const preview = useMemoRS(() => {
    const items = [];

    if (s.scope === "both" || s.scope === "herb") {
      HERBS.forEach(h => {
        if (s.excludeCats?.includes(h.category)) return;
        const daysLeft = projectedRunOutDays(h);
        const belowThreshold = h.stock < h.threshold * s.thresholdMultiplier;
        if (daysLeft > s.daysLeftTrigger && !belowThreshold) return;
        const need = (h.monthly / 30) * s.targetCoverDays - h.stock;
        const round = s.roundingHerb || 1;
        const qty = Math.max(h.threshold, Math.ceil(need / round) * round);
        items.push({
          kind: "herb", id: h.id, name: h.name, supplier: h.supplier,
          unit: "g", daysLeft, qty, cost: qty * h.unitPrice,
          category: h.category, urgency: daysLeft <= 7 ? "high" : daysLeft <= 14 ? "med" : "low",
        });
      });
    }
    if (s.scope === "both" || s.scope === "supply") {
      SUPPLIES.forEach(it => {
        if (s.excludeSupCats?.includes(it.category)) return;
        const daysLeft = supRunOut(it);
        const belowThreshold = it.stock < it.threshold * s.thresholdMultiplier;
        if (daysLeft > s.daysLeftTrigger && !belowThreshold) return;
        const need = (it.monthly / 30) * s.targetCoverDays - it.stock;
        const round = s.roundingSupply || 1;
        const qty = Math.max(it.threshold, Math.ceil(need / round) * round);
        items.push({
          kind: "supply", id: it.id, name: it.name, supplier: it.supplier,
          unit: it.unit, daysLeft, qty, cost: qty * it.unitPrice,
          category: it.category, urgency: daysLeft <= 7 ? "high" : daysLeft <= 14 ? "med" : "low",
        });
      });
    }

    items.sort((a, b) => a.daysLeft - b.daysLeft);

    // 공급처 그룹핑 & 최소금액 필터
    const groups = {};
    items.forEach(i => {
      const k = i.supplier;
      if (!groups[k]) groups[k] = { supplier: k, items: [], total: 0 };
      groups[k].items.push(i);
      groups[k].total += i.cost;
    });
    let groupList = Object.values(groups).sort((a, b) => b.total - a.total);
    const skipped = groupList.filter(g => g.total < s.minOrderValue);
    if (s.groupBySupplier && s.minOrderValue > 0) {
      groupList = groupList.filter(g => g.total >= s.minOrderValue);
    }

    return {
      items, groups: groupList, totalCount: items.length,
      totalValue: items.reduce((sum, i) => sum + i.cost, 0),
      skippedCount: skipped.length, skippedValue: skipped.reduce((sum, g) => sum + g.total, 0),
    };
  }, [s]);

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "var(--bg-overlay)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200,
      fontFamily: "var(--font-sans)",
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "var(--bg-surface)", borderRadius: "var(--radius-xl)",
        width: 1080, height: "88vh", display: "flex", flexDirection: "column",
        boxShadow: "var(--shadow-xl)", overflow: "hidden",
      }}>
        {/* Header */}
        <div style={{
          padding: "18px 24px", borderBottom: "1px solid var(--border-subtle)",
          display: "flex", alignItems: "center", gap: 12,
          background: "linear-gradient(180deg, var(--brand-subtle) 0%, var(--bg-surface) 100%)",
        }}>
          <div style={{
            width: 38, height: 38, borderRadius: "var(--radius-md)",
            background: "var(--brand-muted)", color: "var(--text-brand)",
            display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
          }}>
            <Icon name="sparkles" size={18} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 18, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)", letterSpacing: "-0.01em" }}>AI 발주 추천 조건</div>
            <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 2 }}>
              트리거 임계값과 발주 정책을 조정하면 우측 프리뷰에 즉시 반영됩니다
            </div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", padding: 4 }}>
            <Icon name="x" size={20} />
          </button>
        </div>

        <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
          {/* Left — settings */}
          <div style={{ flex: "1 1 56%", display: "flex", flexDirection: "column", borderRight: "1px solid var(--border-subtle)", minWidth: 0 }}>
            {/* Tabs */}
            <div style={{ padding: "0 24px", display: "flex", gap: 0, borderBottom: "1px solid var(--border-subtle)" }}>
              {[
                { key: "trigger", label: "발주 트리거", icon: "zap" },
                { key: "target",  label: "발주 목표",   icon: "target" },
                { key: "group",   label: "그룹핑/공급처", icon: "boxes" },
                { key: "alert",   label: "알림 / 자동화", icon: "bell" },
                { key: "except",  label: "예외",        icon: "filter-x" },
              ].map(t => (
                <button key={t.key} onClick={() => setTab(t.key)}
                  style={{
                    background: "none", border: "none", cursor: "pointer",
                    padding: "12px 14px", fontFamily: "var(--font-sans)", fontSize: 12,
                    color: tab === t.key ? "var(--text-brand)" : "var(--text-secondary)",
                    fontWeight: tab === t.key ? 600 : 400,
                    borderBottom: `2px solid ${tab === t.key ? "var(--jade-500)" : "transparent"}`,
                    display: "inline-flex", alignItems: "center", gap: 6,
                    marginBottom: -1,
                  }}>
                  <Icon name={t.icon} size={13} />
                  {t.label}
                </button>
              ))}
            </div>

            {/* Panels */}
            <div style={{ flex: 1, overflowY: "auto", padding: "20px 24px" }}>
              {tab === "trigger" && <TriggerPanel s={s} set={set} />}
              {tab === "target"  && <TargetPanel s={s} set={set} />}
              {tab === "group"   && <GroupPanel s={s} set={set} />}
              {tab === "alert"   && <AlertPanel s={s} set={set} />}
              {tab === "except"  && <ExceptionPanel s={s} set={set} toggleArr={toggleArr} />}
            </div>
          </div>

          {/* Right — live preview */}
          <RSPreviewPanel preview={preview} settings={s} />
        </div>

        {/* Footer */}
        <div style={{
          padding: "14px 24px", borderTop: "1px solid var(--border-subtle)",
          display: "flex", alignItems: "center", gap: 10, background: "var(--bg-raised)",
        }}>
          <Button variant="ghost" size="sm" icon="rotate-ccw" onClick={() => setS({ ...REC_DEFAULTS })}>기본값으로</Button>
          <div style={{ flex: 1 }}></div>
          <span style={{ fontSize: 11, color: "var(--text-muted)" }}>
            저장 시 모든 사용자에게 적용됩니다 · 마지막 수정 김민준 · 2일 전
          </span>
          <Button variant="secondary" size="md" onClick={onClose}>취소</Button>
          <Button variant="primary" size="md" icon="check" onClick={() => onSave && onSave(s)}>저장</Button>
        </div>
      </div>
    </div>
  );
}

// ── 1. 발주 트리거 패널 ───────────────────────────────────────────
function TriggerPanel({ s, set }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <RSSection title="적용 범위" desc="추천 시스템이 동작할 재고 유형을 선택합니다">
        <div style={{ display: "flex", gap: 8 }}>
          {[
            { key: "both",   label: "약재 + 소모품", icon: "boxes" },
            { key: "herb",   label: "약재만",        icon: "leaf" },
            { key: "supply", label: "소모품만",      icon: "package" },
          ].map(o => (
            <button key={o.key} onClick={() => set({ scope: o.key })}
              style={{
                flex: 1, padding: "14px 12px", fontFamily: "var(--font-sans)", fontSize: 13,

// ── 작은 도우미 ─────────────────────────────────────────────────
function RSSection({ title, desc, children }) {
  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{title}</div>
      {desc && <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 2, marginBottom: 12 }}>{desc}</div>}
      {!desc && <div style={{ marginBottom: 12 }}></div>}
      {children}
    </div>
  );
}

function RSField({ label, children }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <label style={{ fontSize: 12, fontWeight: 500, color: "var(--text-secondary)" }}>{label}</label>
      {children}
    </div>
  );
}

function RSSlider({ label, desc, value, min, max, step, unit, decimals = 0, marks, onChange }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ padding: "12px 0" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <span style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{label}</span>
        <span style={{ fontSize: 18, fontWeight: 600, fontFamily: "var(--font-mono)", color: "var(--text-brand)" }}>
          {decimals ? value.toFixed(decimals) : value} <span style={{ fontSize: 12, color: "var(--text-muted)", fontWeight: 400 }}>{unit}</span>
        </span>
      </div>
      {desc && <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 10 }}>{desc}</div>}
      <div style={{ position: "relative", padding: "10px 0" }}>
        <input type="range" min={min} max={max} step={step} value={value}
          onChange={e => onChange(Number(e.target.value))}
          style={{
            width: "100%", accentColor: "var(--jade-500)", cursor: "pointer",
          }} />
        {marks && (
          <div style={{ position: "relative", marginTop: -4, fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
            {marks.map(m => {
              const p = ((m - min) / (max - min)) * 100;
              return (
                <span key={m} style={{
                  position: "absolute", left: `${p}%`, transform: "translateX(-50%)",
                  cursor: "pointer",
                }} onClick={() => onChange(m)}>{decimals ? m.toFixed(decimals) : m}</span>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function RSToggle({ label, desc, value, onChange }) {
  return (
    <div onClick={() => onChange(!value)} style={{
      display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "12px 14px",
      border: `1px solid ${value ? "var(--brand-muted)" : "var(--border-subtle)"}`,
      background: value ? "var(--brand-subtle)" : "var(--bg-surface)",
      borderRadius: "var(--radius-md)", cursor: "pointer",
      transition: "all 0.12s ease",
    }}>

              <span>의사</span>
              <span>주민번호</span>
              <span style={{ textAlign: "right" }}>일수</span>

            </div>
            {doctors.map((d, i) => (
              <div key={d.id} style={{
                display: "grid", gridTemplateColumns: "60px 1fr 36px 24px",

                <span style={{ color: "var(--text-secondary)", fontFamily: "var(--font-mono)", fontSize: 11 }}>{d.rrn}</span>
                <span style={{ textAlign: "right", fontFamily: "var(--font-mono)", color: "var(--text-primary)", fontWeight: 500 }}>{d.visitDays}</span>
                <span style={{
                  width: 18, height: 18, borderRadius: "var(--radius-sm)",
                  border: "1px solid var(--stone-300)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  color: "var(--text-muted)", cursor: "pointer",
                }}><Icon name="x" size={10} /></span>
              </div>
            ))}
          </div>

          {/* 합계 라인 */}
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <SumLine label="명세서 건수">
              <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>{summary.totalCount}건</span>
              {type === "health" && (
                <span style={{ fontSize: 11, color: "var(--text-muted)", marginLeft: 6 }}>
                  (보험 {summary.healthOnly}건, 의료급여 {summary.medicaidOnly}건)
                </span>
              )}
            </SumLine>
            <SumLine label="청구 합계" bold>
              <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: "var(--text-brand)", fontSize: 14 }}>
                {KRW2(summary.totalClaim)}
              </span>
            </SumLine>
            {type === "health" && (
              <div style={{ paddingLeft: 8, fontSize: 11, color: "var(--text-muted)", lineHeight: 1.6 }}>
                보험 {KRW2(summary.healthAmount)}<br />
                의료급여 {KRW2(summary.medicaidAmount)}
              </div>
            )}
            <SumLine label="본인부담금">
              <span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>{KRW2(summary.copayTotal)}</span>
            </SumLine>
          </div>
        </div>
      )}
    </div>
  );
}

// helpers

        flex: 1, display: "flex", alignItems: "center", gap: 6,

}
const pillBtn = (active) => ({
  flex: 1, padding: "6px 8px", fontSize: 12, fontWeight: 500,

  color: active ? "#fff" : "var(--text-secondary)",
  border: `1px solid ${active ? "var(--jade-500)" : "var(--border-default)"}`,
  borderRadius: "var(--radius-sm)",
  cursor: "pointer", fontFamily: "var(--font-sans)",
  transition: "all 0.12s",
});
const selectStyle = {
  padding: "5px 8px", fontSize: 12,
  border: "1px solid var(--border-default)",
  borderRadius: "var(--radius-sm)", background: "var(--bg-surface)",
  fontFamily: "var(--font-sans)", color: "var(--text-primary)",
  outline: "none", cursor: "pointer",
};
const dateStyle = {
  padding: "5px 8px", fontSize: 11, flex: 1,
  border: "1px solid var(--border-default)",
  borderRadius: "var(--radius-sm)", background: "var(--bg-surface)",
  fontFamily: "var(--font-mono)", color: "var(--text-primary)",
  outline: "none", minWidth: 0,
};

Object.assign(window, {
  ClaimTypeTabs, PeriodAndSummary,

});

<script type="text/babel">
// KoMES — 명세서 리스트 & 액션 (Center + Right combined)

const { useState: useStLst, useMemo: useMmLst } = React;

// ── Filter Bar ─────────────────────────────────────────────────
function FilterBar({ search, setSearch, kindFilter, setKindFilter,
  errorOnly, setErrorOnly, density, setDensity,
  selected, onRemoveSelected, kindOptions }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 8,
      padding: "10px 16px", borderBottom: "1px solid var(--border-subtle)",
      background: "var(--bg-surface)", flexShrink: 0,
    }}>
      <div style={{ position: "relative", width: 200 }}>
        <span style={{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-muted)" }}>
          <Icon name="search" size={13} />
        </span>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="환자명·차트번호로 검색" style={{
            width: "100%", padding: "7px 10px 7px 28px", fontSize: 12,
            border: "1px solid var(--border-default)",
            borderRadius: "var(--radius-md)", background: "var(--bg-surface)",
            outline: "none", fontFamily: "var(--font-sans)",
          }} />
      </div>
      <select value={kindFilter} onChange={e => setKindFilter(e.target.value)} style={{
        padding: "7px 24px 7px 10px", fontSize: 12,
        border: "1px solid var(--border-default)",
        borderRadius: "var(--radius-md)", background: "var(--bg-surface)",
        outline: "none", fontFamily: "var(--font-sans)", color: "var(--text-primary)",
        cursor: "pointer", minWidth: 130,
      }}>
        <option value="">전체 종류</option>
        {kindOptions.map(k => <option key={k} value={k}>{k}</option>)}
      </select>
      <button onClick={() => setErrorOnly(!errorOnly)} style={{
        display: "inline-flex", alignItems: "center", gap: 5,
        padding: "7px 12px", fontSize: 12, fontWeight: 500,
        background: errorOnly ? "var(--status-danger-bg)" : "var(--bg-surface)",
        color: errorOnly ? "var(--status-danger-text)" : "var(--text-secondary)",
        border: `1px solid ${errorOnly ? "var(--cinnabar-300)" : "var(--border-default)"}`,
        borderRadius: "var(--radius-md)",
        cursor: "pointer", fontFamily: "var(--font-sans)",
      }}>
        <Icon name="alert-triangle" size={12} />
        오류만 보기
      </button>

      <div style={{ flex: 1 }}></div>

      {selected > 0 && (
        <button onClick={onRemoveSelected} style={{
          display: "inline-flex", alignItems: "center", gap: 5,
          padding: "7px 12px", fontSize: 12, fontWeight: 500,
          background: "var(--bg-surface)",
          color: "var(--text-secondary)",
          border: "1px solid var(--border-default)",
          borderRadius: "var(--radius-md)",
          cursor: "pointer", fontFamily: "var(--font-sans)",
        }}>
          <Icon name="x-circle" size={12} />
          선택 항목 제외 ({selected})
        </button>
      )}

      <div style={{
        display: "inline-flex", padding: 2,
        background: "var(--bg-raised)",
        borderRadius: "var(--radius-md)",
        border: "1px solid var(--border-subtle)",
      }}>
        {[
          { k: "comfortable", icon: "rows-3" },
          { k: "compact", icon: "menu" },
        ].map(d => (
          <button key={d.k} onClick={() => setDensity(d.k)} style={{
            padding: "4px 8px",
            background: density === d.k ? "var(--bg-surface)" : "transparent",
            border: "none", borderRadius: "var(--radius-sm)",
            cursor: "pointer",
            color: density === d.k ? "var(--text-brand)" : "var(--text-muted)",
            display: "inline-flex", alignItems: "center",
            boxShadow: density === d.k ? "var(--shadow-sm)" : "none",
            transition: "all 0.12s",
          }}>
            <Icon name={d.icon} size={13} />
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Claims Table ────────────────────────────────────────────────
function ClaimsTable({ type, items, selected, setSelected, excluded, setExcluded, density }) {
  const allSelectable = items.filter(it => !excluded.has(it.id)).map(it => it.id);
  const allSelected = allSelectable.length > 0 && allSelectable.every(id => selected.has(id));

  const toggleAll = () => {
    if (allSelected) setSelected(new Set());
    else setSelected(new Set(allSelectable));
  };
  const toggleOne = (id) => {
    const n = new Set(selected);
    if (n.has(id)) n.delete(id);
    else n.add(id);
    setSelected(n);
  };
  const toggleExclude = (id) => {
    const n = new Set(excluded);
    if (n.has(id)) n.delete(id);
    else n.add(id);
    setExcluded(n);
    // also remove from selected
    const s = new Set(selected); s.delete(id); setSelected(s);
  };

  // columns differ per type
  let cols, header;
  if (type === "health") {
    cols = "32px 80px 88px 80px 96px 70px 50px 48px 100px 90px 64px 56px";
    header = ["", "명세서", "진료일", "환자명", "주민번호", "진료의", "종류", "내원", "건보청구액", "본인부담금", "급여총액", "제외"];
  } else if (type === "herbal") {
    cols = "32px 80px 88px 80px 96px 70px 80px 60px 110px 90px 56px";
    header = ["", "명세서", "진료일", "환자명", "주민번호", "진료의", "처방", "일수", "약재비", "진찰료", "제외"];
  } else {
    cols = "32px 80px 88px 80px 96px 70px 110px 110px 100px 56px";
    header = ["", "청구서", "진료일", "환자명", "주민번호", "진료의", "보험사", "사고번호", "청구액", "제외"];
  }

  const rowHeight = density === "compact" ? 34 : 42;
  const cellPad = density === "compact" ? "6px 10px" : "10px 10px";

  return (
    <div style={{ flex: 1, minHeight: 0, overflow: "auto", background: "var(--bg-surface)" }}>
      <div style={{ minWidth: 900 }}>
        {/* Header */}
        <div style={{
          display: "grid", gridTemplateColumns: cols,
          padding: "8px 10px", position: "sticky", top: 0,
          background: "var(--bg-raised)", borderBottom: "2px solid var(--border-default)",
          fontSize: 10, fontWeight: 700, letterSpacing: "0.04em",
          color: "var(--text-secondary)", fontFamily: "var(--font-sans)",
          textTransform: "uppercase", zIndex: 2,
        }}>
          <span style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
            <input type="checkbox" checked={allSelected} onChange={toggleAll}
              style={{ accentColor: "var(--jade-500)", cursor: "pointer", width: 14, height: 14 }} />
          </span>
          {header.slice(1).map((h, i) => {
            // numeric right-align (last few cols based on type)
            const numericIdx = type === "health" ? [7, 8, 9, 10] : type === "herbal" ? [7, 8, 9] : [8];
            const isNum = numericIdx.includes(i + 1);
            const isLast = i === header.length - 2;
            return <span key={i} style={{ textAlign: isLast ? "center" : isNum ? "right" : "left", display: "block" }}>{h}</span>;
          })}
        </div>

        {items.length === 0 && (
          <div style={{
            padding: "60px 20px", textAlign: "center",
            color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)",
          }}>
            <Icon name="file-search" size={36} style={{ color: "var(--stone-400)", marginBottom: 12 }} />
            <div>해당 조건에 해당하는 명세서가 없습니다.</div>
          </div>
        )}

        {items.map((it) => {
          const isExcluded = excluded.has(it.id);
          const isError = !!it.error;
          const isSelected = selected.has(it.id);
          return (
            <div key={it.id} style={{
              display: "grid", gridTemplateColumns: cols,
              alignItems: "center", padding: cellPad,
              minHeight: rowHeight,
              borderBottom: "1px solid var(--bg-raised)",
              background: isExcluded ? "var(--bg-raised)"
                : isError ? "var(--status-danger-bg)"
                : isSelected ? "var(--brand-subtle)" : "transparent",
              opacity: isExcluded ? 0.55 : 1,
              transition: "background 0.1s",
              cursor: isExcluded ? "default" : "pointer",
              position: "relative",
            }} onClick={() => !isExcluded && toggleOne(it.id)}>
              {/* checkbox */}
              <span style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
                {isError && (
                  <span title={it.error.msg} style={{ marginRight: 4 }}>
                    <Icon name="alert-triangle" size={12} style={{ color: "var(--status-danger-text)" }} />
                  </span>
                )}
                <input type="checkbox"
                  checked={isSelected && !isExcluded}
                  disabled={isExcluded}
                  onChange={e => { e.stopPropagation(); toggleOne(it.id); }}
                  onClick={e => e.stopPropagation()}
                  style={{ accentColor: "var(--jade-500)", cursor: "pointer", width: 14, height: 14 }} />
              </span>

              {type === "health" && (<>
                <Mono>{it.seq}</Mono>
                <Mono>{it.visitDate.replace(/-/g, "")}</Mono>
                <Cell>{it.patientName}</Cell>
                <Mono>{it.rrn}</Mono>
                <Cell>{it.doctor}</Cell>
                <KindBadge value={it.kind} />
                <Mono>{it.visitCount}</Mono>
                <NumCell>{NUM(it.claimAmount - it.copay)}</NumCell>
                <NumCell>{NUM(it.copay)}</NumCell>
                <NumCell strong>{NUM(it.coveredTotal)}</NumCell>
              </>)}

              {type === "herbal" && (<>
                <Mono>{it.seq}</Mono>
                <Mono>{it.visitDate.replace(/-/g, "")}</Mono>
                <Cell>{it.patientName}</Cell>
                <Mono>{it.rrn}</Mono>
                <Cell>{it.doctor}</Cell>
                <Cell>{it.formula}</Cell>
                <NumCell>{it.herbalDays}일</NumCell>
                <NumCell>{NUM(it.ingredientCost)}</NumCell>
                <NumCell strong>{NUM(it.consultFee)}</NumCell>
              </>)}

              {type === "auto" && (<>
                <Mono>{it.claimDocNo}</Mono>
                <Mono>{it.visitDate.replace(/-/g, "")}</Mono>
                <Cell>{it.patientName}</Cell>
                <Mono>{it.rrn}</Mono>
                <Cell>{it.doctor}</Cell>
                <Cell>{it.autoInsurer}</Cell>
                <Mono small>{it.accidentNo}</Mono>
                <NumCell strong>{NUM(it.claimAmount)}</NumCell>
              </>)}

              {/* 제외 button */}
              <span style={{ display: "flex", justifyContent: "center" }}>
                <button onClick={e => { e.stopPropagation(); toggleExclude(it.id); }}
                  title={isExcluded ? "제외 해제" : "이번 청구에서 제외"}
                  style={{
                    padding: "3px 8px", fontSize: 10, fontWeight: 500,
                    background: isExcluded ? "var(--stone-300)" : "var(--bg-surface)",
                    color: isExcluded ? "var(--text-primary)" : "var(--text-muted)",
                    border: "1px solid var(--border-default)",
                    borderRadius: "var(--radius-sm)",
                    cursor: "pointer", fontFamily: "var(--font-sans)",
                  }}>
                  {isExcluded ? "복원" : "제외"}
                </button>
              </span>

              {/* error tooltip strip */}
              {isError && !isExcluded && (
                <div style={{
                  gridColumn: "1 / -1",
                  marginTop: 4, padding: "4px 12px 4px 28px",
                  fontSize: 11, color: "var(--status-danger-text)",
                  fontFamily: "var(--font-sans)",
                  background: "var(--status-danger-bg)",
                  borderTop: "1px dashed var(--cinnabar-300)",
                  display: "flex", alignItems: "center", gap: 6,
                }}>
                  <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 10, color: "var(--status-danger-text)" }}>{it.error.code}</span>
                  <span>{it.error.msg}</span>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Mono({ children, small }) {
  return <span style={{
    fontFamily: "var(--font-mono)", fontSize: small ? 11 : 12,
    color: "var(--text-secondary)",
  }}>{children}</span>;
}
function Cell({ children }) {
  return <span style={{
    fontFamily: "var(--font-sans)", fontSize: 12,
    color: "var(--text-primary)",
  }}>{children}</span>;
}
function NumCell({ children, strong }) {
  return <span style={{
    fontFamily: "var(--font-mono)", fontSize: 12,
    color: strong ? "var(--text-primary)" : "var(--text-secondary)",
    fontWeight: strong ? 600 : 400,
    textAlign: "right",
  }}>{children}</span>;
}
function KindBadge({ value }) {
  const colors = {
    "보험": { bg: "var(--brand-subtle)", fg: "var(--text-brand)", bd: "var(--brand-muted)" },
    "의료급여": { bg: "var(--status-warning-bg)", fg: "var(--status-warning-text)", bd: "var(--status-warning-border)" },
    "시범사업": { bg: "var(--status-warning-bg)", fg: "var(--status-warning-text)", bd: "var(--status-warning-border)" },
    "자동차": { bg: "var(--status-danger-bg)", fg: "var(--status-danger-text)", bd: "var(--status-danger-border)" },
  };
  const c = colors[value] || colors["보험"];
  return <span style={{
    display: "inline-flex", alignItems: "center", fontSize: 10, fontWeight: 600,
    padding: "1px 7px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
    background: c.bg, color: c.fg, border: `1px solid ${c.bd}`,
    fontFamily: "var(--font-sans)", width: "fit-content",
  }}>{value}</span>;
}

// ── Bottom Action Bar ───────────────────────────────────────
function ActionBar({ type, summary, selected, errorCount, onSubmitAll, onSubmitSelected, onOpenPhysioRecords, onOpenChunaRecords }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 10,
      padding: "12px 18px",
      background: "var(--bg-surface)",
      borderTop: "1px solid var(--border-subtle)",
      boxShadow: "0 -2px 8px rgba(17, 30, 28, 0.04)",
      flexShrink: 0,
    }}>
      {/* Secondary records (건보/첩약만) */}
      {type !== "auto" && (
        <>
          <SmallBtn icon="activity" onClick={onOpenPhysioRecords}>물리치료 내역</SmallBtn>
          <SmallBtn icon="hand" onClick={onOpenChunaRecords}>추나치료 내역</SmallBtn>
          <div style={{ width: 1, height: 22, background: "var(--border-subtle)" }}></div>
        </>
      )}

      {/* Selection status */}
      <div style={{
        display: "flex", alignItems: "center", gap: 10,
        padding: "6px 12px",
        background: "var(--bg-raised)",
        border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-md)",
      }}>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <span style={{ fontSize: 10, color: "var(--text-muted)", letterSpacing: "0.04em" }}>선택</span>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700, color: "var(--text-primary)", lineHeight: 1.1 }}>
            {selected}건
          </span>
        </div>
        {errorCount > 0 && (
          <div style={{
            display: "flex", flexDirection: "column",
            paddingLeft: 10, borderLeft: "1px solid var(--stone-300)",
          }}>
            <span style={{ fontSize: 10, color: "var(--status-danger-text)", letterSpacing: "0.04em" }}>오류</span>
            <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700, color: "var(--status-danger-text)", lineHeight: 1.1 }}>
              {errorCount}건
            </span>
          </div>
        )}
      </div>

      <div style={{ flex: 1 }}></div>

      <button onClick={onSubmitSelected}
        disabled={selected === 0}
        style={{
          padding: "10px 18px", fontSize: 13, fontWeight: 600,
          background: selected === 0 ? "var(--bg-raised)" : "var(--bg-surface)",
          color: selected === 0 ? "var(--text-disabled)" : "var(--text-brand)",
          border: `1px solid ${selected === 0 ? "var(--border-subtle)" : "var(--jade-300)"}`,
          borderRadius: "var(--radius-md)",
          cursor: selected === 0 ? "not-allowed" : "pointer",
          fontFamily: "var(--font-sans)",
          display: "inline-flex", alignItems: "center", gap: 6,
        }}>
        <Icon name="check-square" size={13} />
        선택 항목 청구 ({selected})
      </button>

      <button onClick={onSubmitAll} style={{
        padding: "10px 22px", fontSize: 14, fontWeight: 600,
        background: "var(--jade-500)", color: "#fff",
        border: "none",
        borderRadius: "var(--radius-md)",
        cursor: "pointer", fontFamily: "var(--font-sans)",
        display: "inline-flex", alignItems: "center", gap: 8,
        boxShadow: "var(--shadow-sm)",
      }}>
        <Icon name="send" size={14} />
        바로 청구하기 · {KRW2(summary.totalClaim)}
      </button>
    </div>
  );
}

function SmallBtn({ icon, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      display: "inline-flex", alignItems: "center", gap: 5,

<script type="text/babel">
// KoMES — 보험 청구 제출 플로우 모달
// 4단계: 청구파일 생성 → 청구파일 점검 → 사전점검 송신 → 실청구

const { useState: useStMd, useEffect: useEfMd, useRef: useRfMd } = React;

// 가짜 진행 단계
const STAGES = [
  {
    key: "build",
    label: "청구파일 생성",
    desc: "선택된 명세서를 심평원 표준 포맷(XML)으로 변환합니다",
    icon: "file-cog",
    sim: 1200,
  },
  {
    key: "validate",
    label: "청구파일 점검",
    desc: "내부 유효성 검증 — 코드·금액·자격 정합성 확인",
    icon: "shield-check",
    sim: 1800,
  },
  {
    key: "pretest",
    label: "심평원 사전점검 1차 송신",
    desc: "HIRA 사전점검 API로 송신 후 결과 수신 대기",
    icon: "satellite",
    sim: 2400,
  },
  {
    key: "submit",
    label: "실청구 진행",
    desc: "이상 없음 확인 후 본 청구를 송신합니다",
    icon: "send",
    sim: 1600,
  },
];

function ClaimSubmissionFlow({ items, type, summary, onClose, scenario }) {
  // scenario: "ok" | "errors" | "all-pass"
  const [stage, setStage] = useStMd(0);
  const [statusByKey, setStatusByKey] = useStMd({
    build: "running", validate: "pending", pretest: "pending", submit: "pending",
  });
  const [waitingApproval, setWaitingApproval] = useStMd(false);
  const [pretestResults, setPretestResults] = useStMd(null); // null | { errors: [], passed: [] }
  const [done, setDone] = useStMd(false);
  const timerRef = useRfMd(null);

  // detect errors in items
  const errorItems = items.filter(it => it.error);
  const hasErrors = errorItems.length > 0 || scenario === "errors";

  useEfMd(() => {
    const s = STAGES[stage];
    if (!s) return;
    if (statusByKey[s.key] !== "running") return;
    timerRef.current = setTimeout(() => {
      // Done with this stage
      const next = { ...statusByKey };
      if (s.key === "pretest") {
        // produce results
        const fakeResults = {
          errors: errorItems.map(it => ({
            id: it.id, patientName: it.patientName,
            chartNo: it.chartNo, seq: it.seq,
            code: it.error.code, msg: it.error.msg,
          })),
          passedCount: items.length - errorItems.length,
          totalCount: items.length,
        };
        setPretestResults(fakeResults);
        if (fakeResults.errors.length > 0) {
          next[s.key] = "warning";
          setStatusByKey(next);
          setWaitingApproval(true); // require user decision
        } else {
          next[s.key] = "success";
          setStatusByKey(next);
          // advance
          const nextStageIdx = stage + 1;
          if (nextStageIdx < STAGES.length) {
            next[STAGES[nextStageIdx].key] = "running";
            setStatusByKey(next);
            setStage(nextStageIdx);
          }
        }
      } else if (s.key === "submit") {
        next[s.key] = "success";
        setStatusByKey(next);
        setDone(true);
      } else {
        next[s.key] = "success";
        const nextStageIdx = stage + 1;
        if (nextStageIdx < STAGES.length) {
          next[STAGES[nextStageIdx].key] = "running";
          setStage(nextStageIdx);
        }
        setStatusByKey(next);
      }
    }, s.sim);
    return () => clearTimeout(timerRef.current);
  }, [stage]);

  const handleResubmitExcludingErrors = () => {
    // proceed with non-error items
    const next = { ...statusByKey };
    next.submit = "running";
    setStatusByKey(next);
    setStage(3);
    setWaitingApproval(false);
  };
  const handleFixErrors = () => {
    onClose("fix"); // back to list, pre-filter errors
  };

  const totalNonError = items.length - errorItems.length;
  const totalAmount = items.reduce((s, it) => s + it.claimAmount, 0);

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 100,
      background: "var(--bg-overlay)", backdropFilter: "blur(6px)",
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: 40,
    }}>
      <div style={{
        width: 720, maxHeight: "90vh", overflow: "hidden",
        background: "var(--bg-surface)",
        borderRadius: "var(--radius-xl)",
        boxShadow: "var(--shadow-xl)",
        display: "flex", flexDirection: "column",
      }}>
        {/* Header */}
        <div style={{
          padding: "20px 28px",
          background: "linear-gradient(135deg, var(--jade-700), var(--jade-800))",
          color: "#fff",
          display: "flex", alignItems: "center", gap: 14,
        }}>
          <div style={{
            width: 42, height: 42, borderRadius: "var(--radius-md)",
            background: "rgba(255,255,255,0.15)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <Icon name="send-horizonal" size={20} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{
              fontSize: 11, fontWeight: 600, letterSpacing: "0.08em",
              color: "var(--brand-muted)", textTransform: "uppercase",
              fontFamily: "var(--font-sans)",
            }}>심평원 진료비 청구 · HIRA Claim API</div>
            <div style={{
              fontFamily: "var(--font-serif)", fontSize: 22, fontWeight: 500,
              letterSpacing: "-0.01em", marginTop: 2,
            }}>
              {CLAIM_TYPES.find(t => t.key === type)?.label} 청구 진행
            </div>
          </div>
          <button onClick={() => onClose("cancel")} style={{
            width: 32, height: 32, borderRadius: "var(--radius-md)",
            background: "rgba(255,255,255,0.1)", border: "none",
            color: "rgba(255,255,255,0.8)", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <Icon name="x" size={16} />
          </button>
        </div>

        {/* Summary strip */}
        <div style={{
          padding: "14px 28px",
          background: "var(--bg-raised)",
          borderBottom: "1px solid var(--border-subtle)",
          display: "flex", gap: 28,
        }}>
          <StripStat label="청구 건수" value={`${items.length}건`} />
          <StripStat label="정상" value={`${totalNonError}건`} color="var(--text-brand)" />
          <StripStat label="오류 의심" value={`${errorItems.length}건`} color={errorItems.length > 0 ? "var(--status-danger-text)" : "var(--text-muted)"} />
          <StripStat label="청구 합계" value={KRW2(totalAmount)} mono />
        </div>

        {/* Stages */}
        <div style={{ flex: 1, overflowY: "auto", padding: "8px 0" }}>
          {STAGES.map((s, idx) => (
            <StageRow
              key={s.key}
              stage={s}
              idx={idx}
              status={statusByKey[s.key]}
              isLast={idx === STAGES.length - 1}
              // Stage 3 expands to show results
              expanded={s.key === "pretest" && pretestResults}
              details={s.key === "pretest" && pretestResults ? (
                <PretestResults results={pretestResults} />
              ) : null}
            />
          ))}
        </div>

        {/* Footer */}
        <div style={{
          padding: "16px 24px",
          borderTop: "1px solid var(--border-subtle)",
          background: "var(--bg-raised)",
          display: "flex", alignItems: "center", gap: 10,
        }}>
          {waitingApproval && (
            <>
              <div style={{
                display: "flex", alignItems: "center", gap: 8,
                padding: "6px 12px",
                background: "var(--status-warning-bg)",
                border: "1px solid var(--status-warning-border)",
                borderRadius: "var(--radius-md)",
              }}>
                <Icon name="alert-circle" size={14} style={{ color: "var(--status-warning-text)" }} />
                <span style={{ fontSize: 12, color: "var(--status-warning-text)", fontWeight: 500, fontFamily: "var(--font-sans)" }}>
                  사전점검 결과 오류가 발견되었습니다. 진행 방식을 선택하세요.
                </span>
              </div>
              <div style={{ flex: 1 }}></div>
              <button onClick={handleFixErrors} style={ftrBtnSecondary}>
                <Icon name="arrow-left" size={13} />
                오류 수정으로 돌아가기
              </button>
              <button onClick={handleResubmitExcludingErrors} style={ftrBtnPrimary}>
                <Icon name="send" size={13} />
                정상 {totalNonError}건만 실청구
              </button>
            </>
          )}
          {!waitingApproval && !done && (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--text-muted)" }}>
                <span style={{
                  width: 8, height: 8, borderRadius: "50%",
                  background: "var(--jade-500)",
                  animation: "pulse 1.4s infinite",
                }}></span>
                <span style={{ fontFamily: "var(--font-sans)" }}>
                  {STAGES[stage]?.label} 진행 중…
                </span>
              </div>
              <div style={{ flex: 1 }}></div>
              <button onClick={() => onClose("cancel")} style={ftrBtnSecondary}>중단</button>
            </>
          )}
          {done && (
            <>
              <div style={{
                display: "flex", alignItems: "center", gap: 8,
                padding: "6px 12px",
                background: "var(--brand-subtle)",
                border: "1px solid var(--brand-muted)",
                borderRadius: "var(--radius-md)",
              }}>
                <Icon name="check-circle-2" size={14} style={{ color: "var(--text-brand)" }} />
                <span style={{ fontSize: 12, color: "var(--text-brand)", fontWeight: 600, fontFamily: "var(--font-sans)" }}>
                  실청구 완료 — 접수번호 HIRA-2026-{String(Math.floor(Math.random() * 90000) + 10000)}
                </span>
              </div>
              <div style={{ flex: 1 }}></div>
              <button onClick={() => onClose("done")} style={ftrBtnSecondary}>
                <Icon name="file-text" size={13} />
                접수증 출력
              </button>
              <button onClick={() => onClose("done")} style={ftrBtnPrimary}>
                <Icon name="check" size={13} />
                확인
              </button>
            </>
          )}
        </div>
      </div>
      <style>{`@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }
        @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
        @keyframes barPulse { 0% { background-position: 0 0 } 100% { background-position: 24px 0 } }
      `}</style>
    </div>
  );
}

function StripStat({ label, value, color, mono }) {
  return (
    <div style={{ display: "flex", flexDirection: "column" }}>
      <span style={{
        fontSize: 10, fontWeight: 600, letterSpacing: "0.06em",
        color: "var(--text-muted)", fontFamily: "var(--font-sans)",
        textTransform: "uppercase",
      }}>{label}</span>
      <span style={{
        fontFamily: mono ? "var(--font-mono)" : "var(--font-sans)",
        fontSize: 16, fontWeight: 700,
        color: color || "var(--text-primary)",
        marginTop: 2,
      }}>{value}</span>
    </div>
  );
}

function StageRow({ stage, idx, status, isLast, expanded, details }) {
  const statusConfig = {
    pending: { icon: "circle", color: "var(--text-disabled)", bg: "var(--bg-raised)", label: "대기" },
    running: { icon: "loader-2", color: "var(--jade-600)", bg: "var(--brand-subtle)", label: "진행 중" },
    success: { icon: "check", color: "var(--text-brand)", bg: "var(--brand-muted)", label: "완료" },
    warning: { icon: "alert-triangle", color: "var(--status-warning-text)", bg: "var(--status-warning-bg)", label: "검토 필요" },
    error:   { icon: "x", color: "var(--status-danger-text)", bg: "var(--status-danger-bg)", label: "실패" },
  };
  const s = statusConfig[status] || statusConfig.pending;
  const isActive = status === "running" || status === "warning";

  return (
    <div style={{ position: "relative" }}>
      <div style={{ padding: "16px 28px", display: "flex", alignItems: "flex-start", gap: 14 }}>
        {/* circle */}
        <div style={{ position: "relative", flexShrink: 0 }}>
          <div style={{
            width: 38, height: 38, borderRadius: "50%",
            background: s.bg,
            border: `2px solid ${s.color}`,
            display: "flex", alignItems: "center", justifyContent: "center",
            color: s.color,
            animation: status === "running" ? "spin 1s linear infinite" : "none",
          }}>
            <Icon name={s.icon} size={16} />
          </div>
          {/* connector */}
          {!isLast && (
            <div style={{
              position: "absolute", top: 38, left: "50%", transform: "translateX(-50%)",
              width: 2, height: expanded ? "calc(100% + 12px)" : 22,
              background: status === "success" || status === "warning" ? "var(--jade-300)" : "var(--bg-raised)",
            }}></div>
          )}
        </div>

        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
            <span style={{
              fontSize: 10, fontWeight: 700, letterSpacing: "0.08em",
              color: "var(--text-muted)", fontFamily: "var(--font-sans)",
            }}>STEP {idx + 1}</span>
            <span style={{
              fontSize: 11, fontWeight: 600,
              color: s.color, fontFamily: "var(--font-sans)",
              padding: "1px 8px", background: s.bg,
              borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
              border: `1px solid ${s.color}`,
              opacity: 0.85,
            }}>{s.label}</span>
          </div>
          <div style={{
            fontFamily: "var(--font-sans)", fontSize: 15, fontWeight: 600,
            color: "var(--text-primary)", marginTop: 4, lineHeight: 1.3,
          }}>{stage.label}</div>
          <div style={{
            fontFamily: "var(--font-sans)", fontSize: 12,
            color: "var(--text-muted)", marginTop: 3, lineHeight: 1.5,
          }}>{stage.desc}</div>

          {/* Progress bar when running */}
          {status === "running" && (
            <div style={{
              marginTop: 10, height: 4, borderRadius: 2,
              background: "var(--bg-raised)", overflow: "hidden",
            }}>
              <div style={{
                height: "100%", width: "60%",
                background: `linear-gradient(90deg, var(--jade-300) 0%, var(--jade-500) 50%, var(--jade-300) 100%)`,
                backgroundSize: "200% 100%",
                animation: "shimmer 1.5s infinite",
                borderRadius: 2,
              }}></div>
            </div>
          )}
          {expanded && details && <div style={{ marginTop: 14 }}>{details}</div>}
        </div>
      </div>
      <style>{`@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }`}</style>
    </div>
  );
}

function PretestResults({ results }) {
  const { errors, passedCount, totalCount } = results;
  return (
    <div style={{
      background: "var(--bg-raised)",
      border: "1px solid var(--border-subtle)",
      borderRadius: "var(--radius-md)", overflow: "hidden",
    }}>
      {/* header */}
      <div style={{
        padding: "10px 14px",
        background: "var(--bg-surface)",
        borderBottom: "1px solid var(--border-subtle)",
        display: "flex", alignItems: "center", gap: 10,
      }}>
        <Icon name="clipboard-check" size={13} style={{ color: "var(--text-brand)" }} />
        <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }}>
          심평원 점검 결과
        </span>
        <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>
          정상 {passedCount}건 · 오류 {errors.length}건
        </span>
      </div>
      {errors.length === 0 ? (
        <div style={{
          padding: "16px 14px", textAlign: "center",
          color: "var(--text-brand)", fontSize: 13, fontWeight: 500,
        }}>
          <Icon name="check-circle-2" size={18} style={{ color: "var(--jade-600)", marginBottom: 6 }} />
          <div>모든 명세서가 사전점검을 통과했습니다.</div>

      ) : (
        <div style={{ maxHeight: 180, overflowY: "auto" }}>
          {errors.map((e, i) => (

              }}>{e.code}</span>
              <div style={{ flex: 1, minWidth: 0 }}>

                  {e.msg}

                  {e.seq && `명세서 ${e.seq} · `}{e.patientName} · {e.chartNo}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>

}

const ftrBtnSecondary = {
  padding: "8px 14px", fontSize: 12, fontWeight: 500,
  background: "var(--bg-surface)",

const ftrBtnPrimary = {

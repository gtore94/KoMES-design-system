      "tag:자보":     patients.filter(p => p.insurance === "자보").length,
      "tag:알러지":   tagSet("알러지"),
      "tag:노인":     tagSet("노인"),
      "tag:산정특례": tagSet("산정특례"),
      "rel:any":   patients.filter(p => p.relations.length > 0).length,
      "rel:none":  patients.filter(p => p.relations.length === 0).length,
    };
  }, [patients]);

  const filtered = useMemoMgr(() => {
    let list = patients;
    if (filter === "active")        list = list.filter(p => p.status === "active");
    else if (filter === "new")      list = list.filter(p => p.regDate >= "2026-04-01");
    else if (filter === "dormant")  list = list.filter(p => p.status === "dormant");
    else if (filter.startsWith("tag:")) {
      const tag = filter.slice(4);
      if (tag === "자보") list = list.filter(p => p.insurance === "자보");
      else list = list.filter(p => p.tags.includes(tag));
    }
    else if (filter === "rel:any")  list = list.filter(p => p.relations.length > 0);
    else if (filter === "rel:none") list = list.filter(p => p.relations.length === 0);

    if (search.trim()) {
      const q = search.trim();
      list = list.filter(p => p.name.includes(q) || p.phone.includes(q) || p.chief.includes(q));
    }

    return [...list].sort((a, b) => {
      if (sort === "visits") return b.visitCount - a.visitCount;
      if (sort === "name")   return a.name.localeCompare(b.name, "ko");
      if (sort === "reg")    return b.regDate.localeCompare(a.regDate);
      // recent
      const aV = a.lastVisit === "—" ? "0000-00-00" : a.lastVisit;
      const bV = b.lastVisit === "—" ? "0000-00-00" : b.lastVisit;
      return bV.localeCompare(aV);
    });
  }, [patients, filter, search, sort]);

  const selected = patients.find(p => p.id === selectedId);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="환자 관리"
        subtitle={`등록 환자 ${patients.length}명 · 활동 ${counts.active}명 · 이달 신규 ${counts.new}명`}
        actions={<>
          <div style={{ width: 240 }}>
            <Input placeholder="이름·연락처·주소증 검색…" value={search} onChange={setSearch} icon="search" />
          </div>
          <Button variant="secondary" size="sm" icon="download">내보내기</Button>
          <Button variant="primary" icon="user-plus" onClick={() => setShowNewPatient(true)}>신규 등록</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", minHeight: 0, overflow: "hidden" }}>
        <MgrFilterSidebar filter={filter} setFilter={setFilter} counts={counts} />

        {/* Patient list */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
          {/* Sort/toolbar */}
          <div style={{ padding: "10px 16px", borderBottom: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 12, background: "var(--bg-surface)" }}>
            <span style={{ fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>
              <span style={{ fontWeight: 600, color: "var(--text-primary)" }}>{filtered.length}</span>명
            </span>
            <div style={{ width: 1, height: 16, background: "var(--border-subtle)" }} />
            <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>정렬</span>
            <div style={{ display: "flex", gap: 2, background: "var(--bg-raised)", borderRadius: "var(--radius-sm)", padding: 2 }}>
              {[
                { k: "recent", l: "최근 내원" },
                { k: "visits", l: "내원 횟수" },
                { k: "reg",    l: "등록일" },
                { k: "name",   l: "가나다순" },
              ].map(o => (
                <button key={o.k} onClick={() => setSort(o.k)} style={{
                  fontSize: 11, fontWeight: sort === o.k ? 600 : 400,
                  padding: "3px 9px", borderRadius: "var(--radius-sm)",
                  border: "none", cursor: "pointer", fontFamily: "var(--font-sans)",
                  background: sort === o.k ? "var(--bg-surface)" : "transparent",
                  color: sort === o.k ? "var(--text-primary)" : "var(--text-muted)",
                  boxShadow: sort === o.k ? "var(--shadow-sm)" : "none",
                }}>{o.l}</button>
              ))}
            </div>
          </div>

          {/* Column headers */}
          <div style={{
            display: "grid",
            gridTemplateColumns: "32px 1.2fr 0.7fr 1fr 0.8fr 1.2fr 0.7fr 0.9fr",
            alignItems: "center", gap: 10,
            padding: "8px 16px", background: "var(--bg-raised)",
            borderBottom: "1px solid var(--border-subtle)",
            fontSize: 9, fontWeight: 700, letterSpacing: "0.06em",
            textTransform: "uppercase", color: "var(--text-muted)",
            fontFamily: "var(--font-sans)",
          }}>
            <span></span>
            <span>환자</span>
            <span>연락처</span>
            <span>주소증</span>
            <span>보험</span>
            <span>태그</span>
            <span style={{ textAlign: "right" }}>내원/최근</span>
            <span></span>
          </div>

          {/* Rows */}
          <div style={{ flex: 1, overflowY: "auto" }}>
            {filtered.length === 0 ? (
              <div style={{ padding: "60px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)" }}>
                <Icon name="users" size={32} style={{ color: "var(--stone-300)", marginBottom: 10 }} />
                <div>조건에 맞는 환자가 없습니다.</div>
              </div>
            ) : filtered.map(p => (
              <PatientRow key={p.id} p={p} selected={selectedId === p.id} onSelect={() => setSelectedId(p.id)} />
            ))}
          </div>
        </div>

        {/* Detail panel */}
        {selected && (
          <PatientDetailPanel
            patient={selected}
            allPatients={patients}
            onClose={() => setSelectedId(null)}
            onSelectPatient={(p) => setSelectedId(p.id)}
            onOpenChart={onOpenChart}
          />
        )}
      </div>

      {showNewPatient && (
        <NewPatientModal
          onClose={() => setShowNewPatient(false)}
          onSubmit={() => setShowNewPatient(false)}
        />
      )}
    </div>
  );
}

Object.assign(window, { PatientManagementScreen, PATIENT_MASTER, RELATION_TYPES });

</script>

  const [items, setItems] = useStateChart(orders);

  const [newType, setNewType] = useStateChart("체침");
  const [newSites, setNewSites] = useStateChart("");

  const toggleDone = (i) => {
    if (!editable) return;

  const addItem = () => {

  { name: "백출", latin: "Atractylodes", category: "보기", defaultDose: 8 },
  { name: "복신", latin: "Poria cocos", category: "안신", defaultDose: 10 },

  { name: "당귀", latin: "Angelica", category: "보혈", defaultDose: 10 },
  { name: "천궁", latin: "Ligusticum", category: "활혈", defaultDose: 8 },

const AI_SUGGESTION = {
  name: "귀비탕 가감",
  confidence: 87,
  herbs: [
    { name: "황기", dose: 10 },
    { name: "백출", dose: 8 },
    { name: "복신", dose: 10 },
    { name: "산조인", dose: 12 },
    { name: "용안육", dose: 8 },
    { name: "감초", dose: 6 },
  ],
  rationale: "기허혈허 + 불면 패턴에 적합. 최근 6개월 내 유사 증례 23건 기반.",
};

function PrescriptionScreen({ patient, onBack }) {
  const [herbs, setHerbs] = useStateRx([
    { name: "황기", dose: 10 },
    { name: "백출", dose: 8 },
    { name: "감초", dose: 6 },
  ]);
  const [days, setDays] = useStateRx("14");
  const [memo, setMemo] = useStateRx("");
  const [showAI, setShowAI] = useStateRx(true);
  const [herbSearch, setHerbSearch] = useStateRx("");
  const [saved, setSaved] = useStateRx(false);

  const totalWeight = herbs.reduce((s, h) => s + Number(h.dose), 0);

  const addHerb = (herb) => {
    if (!herbs.find(h => h.name === herb.name)) {
      setHerbs([...herbs, { name: herb.name, dose: herb.defaultDose }]);
    }
    setHerbSearch("");
  };

  const removeHerb = (name) => setHerbs(herbs.filter(h => h.name !== name));
  const updateDose = (name, val) => setHerbs(herbs.map(h => h.name === name ? { ...h, dose: val } : h));

  const applyAI = () => setHerbs(AI_SUGGESTION.herbs.map(h => ({ ...h })));

  const handleSave = () => { setSaved(true); setTimeout(() => setSaved(false), 2000); };

  const filteredSuggestions = herbSearch
    ? HERB_SUGGESTIONS.filter(h => h.name.includes(herbSearch) && !herbs.find(x => x.name === h.name))
    : [];

  return <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>

      title="신규 처방"
      subtitle={patient ? `${patient.name} · ${patient.gender} · ${patient.age}세` : ""}
      actions={<>
        <Button variant="secondary" size="sm" icon="arrow-left" onClick={onBack}>취소</Button>
        <Button variant="primary" icon={saved ? "check" : "save"} onClick={handleSave}>
          {saved ? "저장 완료" : "처방 저장"}
        </Button>
      </>}
    />

    <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
      {/* Left — Herb editor */}
      <div style={{ flex: 1, padding: "20px 24px", overflowY: "auto", display: "flex", flexDirection: "column", gap: 16 }}>

        {/* AI Suggestion banner */}
        {showAI && (
          <div style={{ background: "var(--brand-subtle)", border: "1px solid var(--brand-muted)", borderRadius: "var(--radius-lg)", padding: "14px 18px" }}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Icon name="sparkles" size={16} style={{ color: "var(--jade-600)" }} />
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-sans)" }}>AI 추천: {AI_SUGGESTION.name}</span>
                <span style={{ fontSize: 12, background: "var(--brand-muted)", color: "var(--text-brand)", padding: "1px 7px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)" }}>적합도 {AI_SUGGESTION.confidence}%</span>
              </div>
              <button onClick={() => setShowAI(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--jade-400)", fontSize: 16, lineHeight: 1, padding: 0 }}>×</button>
            </div>
            <div style={{ fontSize: 12, color: "var(--jade-600)", fontFamily: "var(--font-sans)", marginBottom: 10, lineHeight: 1.5 }}>{AI_SUGGESTION.rationale}</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
              {AI_SUGGESTION.herbs.map(h => (
                <span key={h.name} style={{ fontSize: 11, background: "var(--brand-muted)", color: "var(--text-brand)", padding: "3px 9px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-mono)" }}>
                  {h.name} {h.dose}g

// ── Overlap layout: assigns col / totalCols to each appt ──────
function layoutApptsSch(appts) {
  if (!appts.length) return [];
  const sorted = [...appts].sort((a, b) => minsFromTimeSch(a.start) - minsFromTimeSch(b.start));
  const colAssign = new Array(sorted.length).fill(0);
  const colEnds = [];
  for (let i = 0; i < sorted.length; i++) {
    const s = minsFromTimeSch(sorted[i].start);
    const e = s + sorted[i].mins;
    let c = 0;
    while (c < colEnds.length && colEnds[c] > s) c++;
    colAssign[i] = c;
    colEnds[c] = e;
  }
  return sorted.map((a, i) => {
    const s = minsFromTimeSch(a.start);
    const e = s + a.mins;
    let maxCol = colAssign[i];
    for (let j = 0; j < sorted.length; j++) {
      if (i === j) continue;
      const s2 = minsFromTimeSch(sorted[j].start);
      const e2 = s2 + sorted[j].mins;
      if (s < e2 && e > s2) maxCol = Math.max(maxCol, colAssign[j]);
    }
    return { ...a, col: colAssign[i], totalCols: maxCol + 1 };
  });
}

// ── Appointment Block (Day/Week) ───────────────────────────────
function ApptBlock({ appt, onClick, hourHeightPx, col = 0, totalCols = 1 }) {
  const startMin = minsFromTimeSch(appt.start);
  const top = ((startMin - 9*60) / 60) * hourHeightPx;
  const height = (appt.mins / 60) * hourHeightPx;
  const doc = DOCTORS_SCH.find(x => x.id === appt.doctor);
  const status = STATUS_SCH[appt.status] || STATUS_SCH["확정"];
  const leftPct = (col / totalCols * 100).toFixed(1);
  const rightPct = ((totalCols - col - 1) / totalCols * 100).toFixed(1);
  return (
    <div onClick={(e) => { e.stopPropagation(); onClick && onClick(appt); }}
      style={{
        position: "absolute",
        left: `calc(${leftPct}% + 2px)`,
        right: `calc(${rightPct}% + 2px)`,
        top: top + 2, height: Math.max(height - 4, 22),
        background: doc.bg,
        border: `1px solid ${doc.border}`,
        borderLeft: `3px solid ${doc.color}`,
        borderRadius: "var(--radius-sm)",
        padding: "4px 6px",
        cursor: "pointer",
        overflow: "hidden",
        whiteSpace: "nowrap",
        fontFamily: "var(--font-sans)",
        opacity: appt.status === "노쇼" || appt.status === "취소" ? 0.6 : 1,
        textDecoration: appt.status === "취소" ? "line-through" : "none",
      }}>
      <div style={{ display: "flex", alignItems: "center", gap: 4, overflow: "hidden", whiteSpace: "nowrap" }}>
        <span style={{ fontSize: 9, fontFamily: "var(--font-mono)", fontWeight: 600, color: doc.color, flexShrink: 0 }}>
          {appt.start}
        </span>
        <span style={{ width: 4, height: 4, borderRadius: "50%", background: status.dot, flexShrink: 0 }} />
        <span style={{ fontSize: 11, fontWeight: 600, color: "var(--text-primary)", overflow: "hidden", textOverflow: "ellipsis", flex: 1, minWidth: 0 }}>
          {appt.patient}
        </span>
      </div>

          {appt.chief}

  );
}

// ── Month View ─────────────────────────────────────────────────
function MonthView({ date, appts, onCellClick, onDayClick, onApptClick, doctorFilter }) {
  const view = { y: date.getFullYear(), m: date.getMonth() };
  const filtered = doctorFilter ? appts.filter(a => a.doctor === doctorFilter) : appts;

  const cells = useMemoSch(() => {
    const first = new Date(view.y, view.m, 1);
    const last = new Date(view.y, view.m + 1, 0);
    const startWk = first.getDay();
    const days = last.getDate();
    const prevDays = new Date(view.y, view.m, 0).getDate();
    const out = [];
    for (let i = startWk - 1; i >= 0; i--) {
      const d = new Date(view.y, view.m - 1, prevDays - i);
      out.push({ d, muted: true });
    }
    for (let dn = 1; dn <= days; dn++) {
      out.push({ d: new Date(view.y, view.m, dn), muted: false });
    }
    while (out.length % 7 !== 0) {
      const last = out[out.length - 1].d;
      out.push({ d: new Date(last.getFullYear(), last.getMonth(), last.getDate()+1), muted: true });
    }
    return out;
  }, [view.y, view.m]);

  const todayStr = ymdSch(TODAY_SCH);

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, background: "var(--bg-surface)" }}>
      {/* Day-of-week header */}
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(7, 1fr)",
        borderBottom: "1px solid var(--border-subtle)",
        background: "var(--bg-raised)", flexShrink: 0,
      }}>
        {KO_WEEKDAYS_SCH.map((w, i) => (
          <div key={w} style={{
            padding: "8px 10px",
            borderLeft: i > 0 ? "1px solid var(--border-subtle)" : "none",
            fontSize: 11, fontWeight: 700,
            color: i === 0 ? "var(--cinnabar-600)" : i === 6 ? "var(--jade-600)" : "var(--text-secondary)",
            fontFamily: "var(--font-sans)", letterSpacing: "0.04em",
          }}>{w}요일</div>
        ))}
      </div>
      {/* Cells */}
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gridAutoRows: "1fr", overflowY: "auto" }}>
        {cells.map((c, i) => {
          const dayStr = ymdSch(c.d);
          const dayAppts = filtered.filter(a => a.date === dayStr);
          const isToday = dayStr === todayStr;
          const dow = c.d.getDay();
          return (
            <div key={i}
              onClick={() => onDayClick && onDayClick(c.d)}
              style={{
                minHeight: 110,
                borderTop: i >= 7 ? "1px solid var(--border-subtle)" : "none",
                borderLeft: i % 7 !== 0 ? "1px solid var(--border-subtle)" : "none",
                background: c.muted ? "var(--bg-raised)" : isToday ? "var(--brand-subtle)" : "var(--bg-surface)",
                padding: "6px 8px",
                cursor: c.muted ? "default" : "pointer",
                display: "flex", flexDirection: "column", gap: 3,
                opacity: c.muted ? 0.4 : 1,
                position: "relative",
              }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{
                  fontFamily: "var(--font-mono)",
                  fontSize: 12, fontWeight: isToday ? 700 : 500,
                  color: isToday ? "#fff" : dow === 0 ? "var(--cinnabar-600)" : dow === 6 ? "var(--jade-600)" : "var(--text-primary)",
                  background: isToday ? "var(--jade-500)" : "transparent",
                  borderRadius: "50%",
                  width: 22, height: 22,
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>{c.d.getDate()}</span>
                {dayAppts.length > 0 && (
                  <span style={{
                    fontSize: 10, fontWeight: 600,
                    color: "var(--text-brand)", fontFamily: "var(--font-mono)",
                  }}>{dayAppts.length}건</span>
                )}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 2, overflow: "hidden" }}>
                {dayAppts.slice(0, 3).map(a => {
                  const doc = DOCTORS_SCH.find(x => x.id === a.doctor);
                  return (
                    <div key={a.id} onClick={(e) => { e.stopPropagation(); onApptClick && onApptClick(a); }}
                      style={{
                        display: "flex", alignItems: "center", gap: 5,
                        padding: "2px 5px",

                        borderRadius: 2, fontSize: 10,
                        fontFamily: "var(--font-sans)",

                      <span style={{ fontFamily: "var(--font-mono)", color: doc.color, fontWeight: 600, flexShrink: 0 }}>

                      <span style={{ color: "var(--text-primary)", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis" }}>{a.patient}</span>
                    </div>
                  );
                })}

  const goPrev = () => {
    if (view === "day") setDate(addDaysSch(date, -1));
    else if (view === "week") setDate(addDaysSch(date, -7));
    else setDate(new Date(date.getFullYear(), date.getMonth() - 1, 1));
  };
  const goNext = () => {
    if (view === "day") setDate(addDaysSch(date, 1));
    else if (view === "week") setDate(addDaysSch(date, 7));
    else setDate(new Date(date.getFullYear(), date.getMonth() + 1, 1));
  };

  const headerLabel = (() => {
    if (view === "day") return `${date.getFullYear()}년 ${KO_MONTHS_SCH[date.getMonth()]} ${date.getDate()}일 (${KO_WEEKDAYS_SCH[date.getDay()]})`;
    if (view === "week") {
      const s = startOfWeekSch(date), e = addDaysSch(s, 6);
      return `${s.getFullYear()}년 ${s.getMonth()+1}월 ${s.getDate()}일 — ${e.getDate()}일`;
    }
    return `${date.getFullYear()}년 ${KO_MONTHS_SCH[date.getMonth()]}`;
  })();

  // Counts for header
  const periodAppts = (() => {
    if (view === "day") return appts.filter(a => a.date === ymdSch(date));

          </div>
        </div>

        {/* Main area */}
        <div style={{ flex: 1, minHeight: 0, padding: "0 24px 16px", display: "flex", flexDirection: "column" }}>
          <div style={{
            flex: 1, minHeight: 0, marginTop: 16,
            background: "var(--bg-surface)",
            border: "1px solid var(--border-subtle)",
            borderRadius: "var(--radius-lg)",
            overflow: "hidden",
            display: "flex", flexDirection: "column",
            boxShadow: "var(--shadow-sm)",
          }}>
            {view === "day"   && <DayView   date={date} appts={appts} onCellClick={onCellClick} onApptClick={setSelectedAppt} doctorFilter={doctorFilter} />}
            {view === "week"  && <WeekView  date={date} appts={appts} onCellClick={onCellClick} onApptClick={setSelectedAppt} doctorFilter={doctorFilter} />}
            {view === "month" && <MonthView date={date} appts={appts} onApptClick={setSelectedAppt} onDayClick={(d) => { setDate(d); setView("day"); }} doctorFilter={doctorFilter} />}
          </div>

          {/* Status legend */}
          <div style={{ display: "flex", gap: 14, padding: "10px 4px", flexShrink: 0 }}>
            {Object.keys(STATUS_SCH).map(s => {
              const sc = STATUS_SCH[s];
              return (
                <div key={s} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: sc.dot }} />
                  <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{s}</span>

            <div style={{ width: 1, height: 14, background: "var(--border-subtle)" }} />
            {DOCTORS_SCH.map(doc => (
              <div key={doc.id} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: doc.bg, border: `2px solid ${doc.color}` }} />
                <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{doc.name}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {showNew && (
        <NewAppointmentModal initial={newInitial} onClose={() => setShowNew(false)} onSubmit={onNewSubmit} />
      )}
      {selectedAppt && (
        <ApptDetail appt={selectedAppt} onClose={() => setSelectedAppt(null)} onChangeStatus={onChangeStatus} />
      )}
    </div>
  );
}

const navIconBtn = {

  borderRadius: "var(--radius-md)", cursor: "pointer", color: "var(--text-secondary)",

  },

const KRW = (n) => `${Math.round(n).toLocaleString("ko-KR")}원`;

function calcAmounts(p) {
  const total = p.items.reduce((s, it) => s + it.amount, 0);
  const insuranceCovered = p.items.reduce((s, it) => s + it.amount * (1 - it.copay), 0);
  const subjectToCopay = p.items.reduce((s, it) => s + it.amount * it.copay, 0);
  let discount = 0;
  if (p.discountType === "percent") discount = subjectToCopay * (p.discountValue / 100);
  else if (p.discountType === "fixed") discount = p.discountValue;
  const net = Math.max(0, subjectToCopay - discount);
  return { total, insuranceCovered, copay: subjectToCopay, discount, net };
}

// ── Patient row (queue) ────────────────────────────────────────
function QueueRow({ p, selected, onSelect }) {

        </span>
      </div>
    </div>
  );
}

// ── Main Payment Screen ────────────────────────────────────────
function PaymentScreen() {
  const [list, setList] = useStatePay(() => {
    try {
      const saved = localStorage.getItem("komes_payments_v1");
      return saved ? JSON.parse(saved) : PAYMENT_QUEUE_SEED;
    } catch { return PAYMENT_QUEUE_SEED; }
  });
  useEffectPay(() => { localStorage.setItem("komes_payments_v1", JSON.stringify(list)); }, [list]);

  const [tab, setTab] = useStatePay("대기"); // 대기 / 완료
  const [selectedId, setSelectedId] = useStatePay(() => list.find(p => p.status === "대기")?.id || list[0]?.id);
  const [confirmMethod, setConfirmMethod] = useStatePay(null);

  const tabList = list.filter(p => p.status === tab);
  const selected = list.find(p => p.id === selectedId);

  const update = (id, patch) => setList(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));

  // Stats
  const pendingCount = list.filter(p => p.status === "대기").length;
  const pendingTotal = list.filter(p => p.status === "대기").reduce((s, p) => s + calcAmounts(p).net, 0);
  const doneCount = list.filter(p => p.status === "완료").length;
  const doneTotal = list.filter(p => p.status === "완료").reduce((s, p) => s + calcAmounts(p).net, 0);

  // Reset
  const reset = () => setList(PAYMENT_QUEUE_SEED);

  const handlePay = (method) => {
    if (!selected) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    update(selected.id, { status: "완료", paidAt: `${hh}:${mm}`, paidBy: method });
    setConfirmMethod(null);
    // Move to next pending
    const next = list.find(p => p.id !== selected.id && p.status === "대기");
    if (next) setSelectedId(next.id);
  };

  const setDiscount = (type, value) => {
    if (!selected) return;
    update(selected.id, { discountType: type, discountValue: value });
  };

  const amounts = selected ? calcAmounts(selected) : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="수납"
        subtitle="진료 완료 환자의 본인 부담금 수납 및 결제 처리"
        actions={<>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 8, padding: "5px 12px",
            background: "var(--status-warning-bg)", border: "1px solid var(--status-warning-border)",
            borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
          }}>
            <Icon name="clock" size={13} style={{ color: "var(--status-warning-text)" }} />
            <span style={{ fontSize: 12, fontWeight: 600, color: "var(--status-warning-text)", fontFamily: "var(--font-sans)" }}>
              대기 {pendingCount}건
            </span>
            <span style={{ fontSize: 12, fontWeight: 700, color: "var(--status-warning-text)", fontFamily: "var(--font-mono)" }}>
              {KRW(pendingTotal)}
            </span>
          </div>
          <div style={{
            display: "inline-flex", alignItems: "center", gap: 8, padding: "5px 12px",
            background: "var(--brand-subtle)", border: "1px solid var(--brand-muted)",
            borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
          }}>
            <Icon name="check-circle-2" size={13} style={{ color: "var(--text-brand)" }} />
            <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-sans)" }}>
              완료 {doneCount}건
            </span>
            <span style={{ fontSize: 12, fontWeight: 700, color: "var(--text-brand)", fontFamily: "var(--font-mono)" }}>
              {KRW(doneTotal)}
            </span>
          </div>
          <button onClick={reset} title="시드 초기화" style={{
            width: 30, height: 30, borderRadius: "var(--radius-md)",
            background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
            cursor: "pointer", color: "var(--text-muted)",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
          }}>
            <Icon name="rotate-ccw" size={14} />
          </button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", minHeight: 0, overflow: "hidden" }}>
        {/* Queue panel */}
        <div style={{
          width: 320, flexShrink: 0,
          background: "var(--bg-surface)",
          borderRight: "1px solid var(--border-subtle)",
          display: "flex", flexDirection: "column", minHeight: 0,
        }}>
          {/* Tabs */}
          <div style={{ display: "flex", borderBottom: "1px solid var(--border-subtle)", flexShrink: 0 }}>
            {[
              { k: "대기", l: "수납 대기", n: pendingCount, color: "var(--amber-600)" },
              { k: "완료", l: "수납 완료", n: doneCount,    color: "var(--jade-600)" },
            ].map(t => {
              const active = tab === t.k;
              return (
                <button key={t.k} onClick={() => {
                  setTab(t.k);
                  const first = list.find(p => p.status === t.k);
                  if (first) setSelectedId(first.id);
                }} style={{
                  flex: 1, padding: "12px 8px",
                  background: "transparent", border: "none",
                  borderBottom: active ? `2px solid ${t.color}` : "2px solid transparent",
                  cursor: "pointer", fontFamily: "var(--font-sans)",
                  display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
                  color: active ? t.color : "var(--text-muted)",
                  fontWeight: active ? 600 : 500, fontSize: 13,
                }}>
                  {t.l}
                  <span style={{
                    fontSize: 10, fontWeight: 700, padding: "1px 7px",
                    borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                    background: active ? t.color : "var(--bg-raised)",
                    color: active ? "#fff" : "var(--text-muted)",
                    fontFamily: "var(--font-mono)",
                  }}>{t.n}</span>
                </button>
              );
            })}
          </div>

          {/* List */}
          <div style={{ flex: 1, overflowY: "auto" }}>
            {tabList.length === 0 ? (
              <div style={{
                padding: "40px 20px", textAlign: "center",
                color: "var(--text-muted)", fontSize: 12,
                fontFamily: "var(--font-sans)",
              }}>
                <Icon name="inbox" size={28} style={{ color: "var(--stone-400)", marginBottom: 8 }} />
                <div>수납 {tab === "대기" ? "대기" : "완료"} 환자가 없습니다.</div>
              </div>
            ) : tabList.map(p => (
              <QueueRow key={p.id} p={p} selected={selectedId === p.id} onSelect={setSelectedId} />
            ))}
          </div>
        </div>

        {/* Center: charge breakdown */}
        <div style={{ flex: 1, minWidth: 0, overflow: "auto", padding: "20px 24px", display: "flex", flexDirection: "column", gap: 16 }}>
          {!selected ? (
            <div style={{
              flex: 1, display: "flex", flexDirection: "column",
              alignItems: "center", justifyContent: "center", gap: 10,
              color: "var(--text-muted)",
            }}>
              <Icon name="credit-card" size={36} style={{ color: "var(--stone-400)" }} />
              <span style={{ fontSize: 13, fontFamily: "var(--font-sans)" }}>왼쪽에서 환자를 선택하세요</span>
            </div>
          ) : (
            <>
              {/* Patient header */}
              <div style={{
                background: "var(--bg-surface)",
                border: "1px solid var(--border-subtle)",
                borderRadius: "var(--radius-lg)",
                padding: "16px 20px",
                display: "flex", alignItems: "center", gap: 14,
                boxShadow: "var(--shadow-sm)",
              }}>
                <Avatar name={selected.name} size={46} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontFamily: "var(--font-serif)", fontSize: 22, fontWeight: 500, color: "var(--text-primary)", letterSpacing: "-0.01em" }}>
                      {selected.name}
                    </span>
                    <Badge variant="brand">{selected.insurance}</Badge>
                    <Badge variant={selected.visit === "초진" ? "danger" : "neutral"}>{selected.visit}</Badge>
                  </div>
                  <div style={{ display: "flex", gap: 10, marginTop: 4, fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
                    <span style={{ fontFamily: "var(--font-mono)" }}>{selected.chartNo}</span>
                    <span>·</span>
                    <span>{selected.gender}/{selected.age}세 · {selected.dob}</span>
                    <span>·</span>
                    <span>{selected.department} · {selected.doctor}</span>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)", letterSpacing: "0.06em", textTransform: "uppercase" }}>진료 완료</div>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 14, color: "var(--text-secondary)" }}>{selected.visitTime}</div>
                </div>
              </div>

              {/* Diagnosis + Items */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 16 }}>
                <div style={panelStyle}>
                  <div style={panelHeader}>
                    <Icon name="clipboard-list" size={14} style={{ color: "var(--jade-600)" }} />
                    <span>진단 (상병)</span>
                  </div>
                  <div style={{ padding: "12px 16px", display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {selected.diagnoses.length === 0 ? (
                      <span style={{ fontSize: 12, color: "var(--text-muted)" }}>진단 정보 없음</span>
                    ) : selected.diagnoses.map(d => (
                      <span key={d.code} style={{
                        display: "inline-flex", alignItems: "center", gap: 6,
                        padding: "4px 10px", fontSize: 12,
                        background: "var(--brand-subtle)", border: "1px solid var(--brand-muted)",
                        color: "var(--text-brand)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                        fontFamily: "var(--font-sans)",
                      }}>
                        <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>{d.code}</span>
                        <span>{d.label}</span>
                      </span>
                    ))}
                  </div>
                </div>

                <div style={panelStyle}>
                  <div style={panelHeader}>
                    <Icon name="receipt" size={14} style={{ color: "var(--jade-600)" }} />
                    <span>시행 내역 (처치/시술)</span>
                    <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
                      총 {selected.items.length}건
                    </span>
                  </div>
                  <div>
                    <div style={{
                      display: "grid", gridTemplateColumns: "60px 1fr 90px 80px",
                      padding: "6px 16px", borderBottom: "1px solid var(--border-subtle)",
                      background: "var(--bg-raised)", fontSize: 10, fontWeight: 700, letterSpacing: "0.06em",
                      color: "var(--text-muted)", textTransform: "uppercase", fontFamily: "var(--font-sans)",
                    }}>
                      <span>구분</span>
                      <span>항목</span>
                      <span style={{ textAlign: "right" }}>금액</span>
                      <span style={{ textAlign: "right" }}>본인부담</span>
                    </div>
                    {selected.items.map((it, i) => (
                      <div key={i} style={{
                        display: "grid", gridTemplateColumns: "60px 1fr 90px 80px",
                        padding: "10px 16px",
                        borderBottom: i < selected.items.length - 1 ? "1px solid var(--border-subtle)" : "none",
                        alignItems: "center",
                      }}>
                        <span style={{
                          fontSize: 10, fontWeight: 600, padding: "2px 8px",
                          borderRadius: "var(--radius-sm)",
                          background: it.kind === "한약" ? "var(--status-warning-bg)" : it.kind === "시술" ? "var(--brand-subtle)" : "var(--bg-raised)",
                          color: it.kind === "한약" ? "var(--status-warning-text)" : it.kind === "시술" ? "var(--text-brand)" : "var(--text-secondary)",
                          fontFamily: "var(--font-sans)",
                          width: "fit-content",
                        }}>{it.kind}</span>
                        <span style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{it.label}</span>
                        <span style={{ fontSize: 13, color: "var(--text-secondary)", fontFamily: "var(--font-mono)", textAlign: "right" }}>
                          {KRW(it.amount)}
                        </span>
                        <span style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)", fontWeight: 500, textAlign: "right" }}>
                          {KRW(it.amount * it.copay)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Memo */}
              <div style={panelStyle}>
                <div style={panelHeader}>
                  <Icon name="edit-3" size={14} style={{ color: "var(--jade-600)" }} />
                  <span>수납 메모</span>
                </div>
                <div style={{ padding: 12 }}>
                  <textarea
                    value={selected.note}
                    onChange={e => update(selected.id, { note: e.target.value })}
                    placeholder="할인 사유, 특이사항 등을 기록하세요"
                    disabled={selected.status === "완료"}
                    style={{
                      width: "100%", minHeight: 56,
                      padding: "9px 11px", fontSize: 13,
                      fontFamily: "var(--font-sans)", color: "var(--text-primary)",
                      background: selected.status === "완료" ? "var(--bg-raised)" : "var(--bg-surface)",
                      border: "1px solid var(--border-default)",
                      borderRadius: "var(--radius-md)", outline: "none", resize: "vertical",
                    }}
                  />
                </div>
              </div>
            </>
          )}
        </div>

        {/* Right: payment summary + actions */}
        {selected && (
          <div style={{
            width: 360, flexShrink: 0,
            background: "var(--bg-surface)",
            borderLeft: "1px solid var(--border-subtle)",
            display: "flex", flexDirection: "column", minHeight: 0,
          }}>
            <div style={{ flex: 1, overflowY: "auto", padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
              {/* Amounts */}
              <div>
                <div style={{
                  fontSize: 10, fontWeight: 700, color: "var(--text-muted)",
                  letterSpacing: "0.08em", textTransform: "uppercase",
                  fontFamily: "var(--font-sans)", marginBottom: 8,
                  display: "flex", alignItems: "center", gap: 6,
                }}>
                  <Icon name="calculator" size={12} />
                  금액 명세
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <SumRow label="총 진료비" value={KRW(amounts.total)} />
                  <SumRow label="급여 부담금" value={`-${KRW(amounts.insuranceCovered)}`} muted />
                  <SumRow label="본인 부담금" value={KRW(amounts.copay)} bold />
                </div>
              </div>

              {/* Discount */}
              <div>
                <div style={{
                  fontSize: 10, fontWeight: 700, color: "var(--text-muted)",
                  letterSpacing: "0.08em", textTransform: "uppercase",
                  fontFamily: "var(--font-sans)", marginBottom: 8,
                  display: "flex", alignItems: "center", gap: 6,
                }}>
                  <Icon name="percent" size={12} />
                  할인 적용
                </div>
                <div style={{
                  background: "var(--bg-raised)",
                  border: "1px dashed var(--border-default)",
                  borderRadius: "var(--radius-md)", padding: 10,
                  display: "flex", flexDirection: "column", gap: 8,
                }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    {[
                      { k: "none", l: "없음" },
                      { k: "percent", l: "% 할인" },
                      { k: "fixed", l: "정액 할인" },
                    ].map(o => (
                      <button key={o.k} onClick={() => setDiscount(o.k, 0)}
                        disabled={selected.status === "완료"}
                        style={{
                          flex: 1, padding: "5px 8px", fontSize: 11, fontWeight: 600,
                          background: selected.discountType === o.k ? "var(--jade-500)" : "var(--bg-surface)",
                          color: selected.discountType === o.k ? "#fff" : "var(--text-secondary)",
                          border: `1px solid ${selected.discountType === o.k ? "var(--jade-500)" : "var(--border-default)"}`,
                          borderRadius: "var(--radius-sm)",
                          cursor: selected.status === "완료" ? "not-allowed" : "pointer",
                          fontFamily: "var(--font-sans)",
                          opacity: selected.status === "완료" ? 0.5 : 1,
                        }}>{o.l}</button>
                    ))}
                  </div>
                  {selected.discountType !== "none" && (
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <input
                        type="number" min={0}
                        value={selected.discountValue || ""}
                        onChange={e => setDiscount(selected.discountType, parseFloat(e.target.value) || 0)}
                        disabled={selected.status === "완료"}
                        placeholder="0"
                        style={{
                          flex: 1, padding: "6px 10px", fontSize: 13,
                          fontFamily: "var(--font-mono)", textAlign: "right",
                          border: "1px solid var(--border-default)",
                          borderRadius: "var(--radius-sm)", outline: "none",
                          background: selected.status === "완료" ? "var(--bg-raised)" : "var(--bg-surface)",
                        }}
                      />
                      <span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", minWidth: 24 }}>
                        {selected.discountType === "percent" ? "%" : "원"}
                      </span>
                    </div>
                  )}
                  {amounts.discount > 0 && (
                    <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 6, borderTop: "1px dashed var(--border-default)" }}>
                      <span style={{ fontSize: 12, color: "var(--status-danger-text)", fontFamily: "var(--font-sans)" }}>할인액</span>
                      <span style={{ fontSize: 13, fontWeight: 600, color: "var(--status-danger-text)", fontFamily: "var(--font-mono)" }}>
                        -{KRW(amounts.discount)}
                      </span>
                    </div>
                  )}
                </div>
              </div>

              {/* Final amount */}
              <div style={{
                background: "var(--brand-subtle)",
                border: "1.5px solid var(--jade-300)",
                borderRadius: "var(--radius-lg)",
                padding: "14px 16px",
              }}>
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-sans)" }}>
                    최종 수납액
                  </span>
                  <span style={{ fontSize: 26, fontWeight: 700, color: "var(--text-brand)", fontFamily: "var(--font-serif)", letterSpacing: "-0.02em" }}>
                    {KRW(amounts.net)}
                  </span>
                </div>
                {selected.status === "완료" && (
                  <div style={{
                    marginTop: 8, fontSize: 11, color: "var(--text-brand)", fontFamily: "var(--font-sans)",
                    display: "flex", alignItems: "center", gap: 5,
                  }}>
                    <Icon name="check-circle-2" size={12} />
                    {selected.paidAt}에 {selected.paidBy}로 수납 완료
                  </div>
                )}
              </div>

              {/* Pay methods (only if 대기) */}
              {selected.status === "대기" ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <div style={{
                    fontSize: 10, fontWeight: 700, color: "var(--text-muted)",
                    letterSpacing: "0.08em", textTransform: "uppercase",
                    fontFamily: "var(--font-sans)",
                    display: "flex", alignItems: "center", gap: 6,
                  }}>
                    <Icon name="wallet" size={12} />
                    결제 수단
                  </div>
                  <PayMethodBtn icon="credit-card" label="카드 결제" hint="신용·체크카드 단말기 연동" primary onClick={() => setConfirmMethod("카드")} />
                  <PayMethodBtn icon="banknote" label="현금" hint="현금 영수증 발행 가능" onClick={() => setConfirmMethod("현금")} />
                  <PayMethodBtn icon="repeat" label="계좌 이체" hint="실시간 입금 확인" onClick={() => setConfirmMethod("이체")} />
                  <PayMethodBtn icon="layers" label="복합 결제" hint="카드 + 현금 분할 결제" onClick={() => setConfirmMethod("복합")} />
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <button style={completedActionBtn}>
                    <Icon name="rotate-ccw" size={14} />수납 취소
                  </button>
                  <button style={{ ...completedActionBtn, background: "var(--jade-500)", color: "#fff", border: "none" }}>
                    <Icon name="printer" size={14} />영수증 출력
                  </button>
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      {/* Confirm modal */}
      {confirmMethod && selected && (
        <div onClick={() => setConfirmMethod(null)} style={{
          position: "fixed", inset: 0, zIndex: 100,
          background: "var(--bg-overlay)", backdropFilter: "blur(4px)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: 380, background: "var(--bg-surface)",
            borderRadius: "var(--radius-xl)", overflow: "hidden",
            boxShadow: "var(--shadow-xl)",
          }}>
            <div style={{ padding: "18px 22px", borderBottom: "1px solid var(--border-subtle)" }}>
              <div style={{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text-primary)" }}>
                {confirmMethod} 결제 확인
              </div>
              <div style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginTop: 4 }}>
                아래 금액을 {confirmMethod}(으)로 수납 처리합니다.
              </div>
            </div>
            <div style={{ padding: 22, display: "flex", flexDirection: "column", gap: 12 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>환자</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>{selected.name} ({selected.chartNo})</span>
              </div>
              <div style={{
                background: "var(--brand-subtle)", border: "1px solid var(--brand-muted)",
                borderRadius: "var(--radius-md)", padding: "14px 16px",
                display: "flex", alignItems: "baseline", justifyContent: "space-between",
              }}>
                <span style={{ fontSize: 13, color: "var(--text-brand)", fontWeight: 600 }}>수납 금액</span>
                <span style={{ fontSize: 24, fontWeight: 700, color: "var(--text-brand)", fontFamily: "var(--font-serif)", letterSpacing: "-0.02em" }}>
                  {KRW(amounts.net)}
                </span>
              </div>
              {confirmMethod === "현금" && (
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>
                  <input type="checkbox" defaultChecked style={{ accentColor: "var(--jade-500)" }} />
                  현금영수증 발행 (소득공제용)
                </label>
              )}
            </div>
            <div style={{
              padding: 14, borderTop: "1px solid var(--border-subtle)",
              display: "flex", gap: 8, justifyContent: "flex-end",
            }}>
              <button onClick={() => setConfirmMethod(null)} style={{
                padding: "8px 16px", fontSize: 13, fontWeight: 500,
                background: "transparent", border: "1px solid var(--border-default)",
                borderRadius: "var(--radius-md)", color: "var(--text-secondary)",
                cursor: "pointer", fontFamily: "var(--font-sans)",
              }}>취소</button>
              <button onClick={() => handlePay(confirmMethod)} style={{
                padding: "8px 18px", fontSize: 13, fontWeight: 600,
                background: "var(--jade-500)", border: "none",
                borderRadius: "var(--radius-md)", color: "#fff",
                cursor: "pointer", fontFamily: "var(--font-sans)",
                display: "inline-flex", alignItems: "center", gap: 6,
                boxShadow: "var(--shadow-sm)",
              }}>
                <Icon name="check" size={13} />
                {KRW(amounts.net)} 수납 완료
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function SumRow({ label, value, muted, bold }) {
  return (
    <div style={{
      display: "flex", justifyContent: "space-between", alignItems: "center",
      padding: "6px 0",
      borderBottom: bold ? "1px solid var(--border-subtle)" : "none",
    }}>
      <span style={{
        fontSize: bold ? 13 : 12,
        fontWeight: bold ? 600 : 400,
        color: muted ? "var(--text-muted)" : "var(--text-secondary)",
        fontFamily: "var(--font-sans)",
      }}>{label}</span>
      <span style={{
        fontSize: bold ? 14 : 13,
        fontWeight: bold ? 700 : 500,
        color: muted ? "var(--text-muted)" : "var(--text-primary)",
        fontFamily: "var(--font-mono)",
      }}>{value}</span>
    </div>
  );
}

const panelStyle = {
  background: "var(--bg-surface)",

// 유틸 — 오늘 기준 만료 D-일수
const TODAY = new Date("2026-05-16");
function daysUntil(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / (1000 * 60 * 60 * 24));
}

// 유틸 — 약재 상태 판정
function herbStatus(h) {
  const stockRatio = h.stock / h.threshold;
  const dExpiry = daysUntil(h.expiry);
  if (h.stock <= h.threshold * 0.5)         return { key: "critical", label: "소진 임박", tone: "danger"  };
  if (h.stock <  h.threshold)               return { key: "low",      label: "재고 부족", tone: "warning" };
  if (dExpiry <= 90)                        return { key: "expiring", label: "유효기간 임박", tone: "warning" };
  return                                            { key: "ok",      label: "정상",     tone: "success" };
}

// 유틸 — 추정 소진일
function projectedRunOutDays(h) {
  const daily = h.monthly / 30;
  if (daily <= 0) return 999;
  return Math.round(h.stock / daily);
}

          const reason = st.key === "critical" ? `잔여 ${projectedRunOutDays(a)}일` :
                         st.key === "low"      ? `임계치 ${Math.round((a.threshold - a.stock) / a.threshold * 100)}% 미달` :
                         `유효기간 D-${dExpiry}`;
          return (
            <div key={a.id} onClick={() => onPick(a.id)} style={{
              background: "var(--bg-surface)", padding: "10px 14px", cursor: "pointer",
              transition: "background 0.12s ease",
            }}
            onMouseEnter={e => e.currentTarget.style.background = "var(--status-danger-bg)"}
            onMouseLeave={e => e.currentTarget.style.background = "var(--bg-surface)"}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{a.name}</span>
                <Badge variant={st.tone}>{st.label}</Badge>
              </div>
              <div style={{ fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-sans)", display: "flex", justifyContent: "space-between" }}>
                <span>{a.category} · {fmtMass(a.stock)}</span>
                <span style={{ color: "var(--status-danger-text)", fontFamily: "var(--font-mono)" }}>{reason}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

<script type="text/babel">
// KoMES — 소모품 재고 조정 (실사 모드) 화면

const { useState: useStSA, useMemo: useMemoSA } = React;

const SUP_ADJ_REASONS = [
  { key: "count",   label: "실사 보정",     hint: "정기 재고 실사로 발견된 차이" },
  { key: "damage",  label: "파손/오염",     hint: "보관 중 파손 또는 변색" },
  { key: "expire",  label: "유효기간 폐기", hint: "유효기간 경과 폐기" },
  { key: "open",    label: "개봉 분배",     hint: "단위 분할로 인한 보정" },
  { key: "loss",    label: "분실",          hint: "도난 또는 식별 불가" },
  { key: "return",  label: "공급처 반품",   hint: "품질 이상으로 반품" },
  { key: "other",   label: "기타",          hint: "직접 메모 필요" },
];

function SupplyAdjustmentScreen({ onClose, onSubmit }) {
  const [edits, setEdits]         = useStSA({});
  const [category, setCategory]   = useStSA("all");
  const [filter, setFilter]       = useStSA("all");
  const [search, setSearch]       = useStSA("");
  const [confirmOpen, setConfirm] = useStSA(false);

  const rows = useMemoSA(() => {
    let out = SUPPLIES.slice();
    if (category !== "all") out = out.filter(s => s.category === category);
    if (search) {
      const q = search.toLowerCase();
      out = out.filter(s => s.name.toLowerCase().includes(q) || s.sku.toLowerCase().includes(q));
    }
    if (filter === "edited") out = out.filter(s => edits[s.id]?.counted !== undefined && edits[s.id]?.counted !== "");
    if (filter === "diff")   out = out.filter(s => {
      const c = edits[s.id]?.counted;
      return c !== undefined && c !== "" && Number(c) !== s.stock;
    });
    if (filter === "empty")  out = out.filter(s => edits[s.id]?.counted === undefined || edits[s.id]?.counted === "");
    return out;
  }, [category, search, filter, edits]);

  const summary = useMemoSA(() => {
    let counted = 0, items = 0, valueDelta = 0, diffPlus = 0, diffMinus = 0;
    Object.keys(edits).forEach(id => {
      const e = edits[id];
      const s = SUPPLIES.find(x => x.id === id);
      if (!s || e.counted === "" || e.counted === undefined) return;
      counted++;
      const c = Number(e.counted);
      const d = c - s.stock;
      if (d > 0) diffPlus++; else if (d < 0) diffMinus++;
      if (d !== 0) items++;
      valueDelta += d * s.unitPrice;
    });
    return { counted, items, valueDelta, diffPlus, diffMinus, total: SUPPLIES.length };
  }, [edits]);

  const setEdit = (id, patch) =>
    setEdits(e => ({ ...e, [id]: { counted: "", reason: "count", memo: "", ...e[id], ...patch } }));
  const fillSystem = (s) => setEdit(s.id, { counted: s.stock });
  const clearRow = (id) =>
    setEdits(e => { const next = { ...e }; delete next[id]; return next; });

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <div style={{
        background: "linear-gradient(90deg, var(--ink-800) 0%, var(--ink-700) 100%)",
        color: "white", padding: "10px 24px",
        display: "flex", alignItems: "center", gap: 12,
        boxShadow: "0 2px 4px rgba(17,30,28,0.1)",
      }}>
        <Icon name="clipboard-check" size={16} style={{ color: "var(--stone-300)" }} />
        <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.04em" }}>재고 실사 모드</div>
        <div style={{ width: 1, height: 14, background: "rgba(255,255,255,0.2)" }}></div>
        <div style={{ fontSize: 11, color: "var(--stone-300)" }}>소모품 · 의료·포장재·사무·청소 품목의 실사를 진행합니다</div>
        <div style={{ flex: 1 }}></div>
        <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--stone-300)" }}>
          담당 김민준 · 2026-05-16 14:32
        </div>
      </div>

      <TopBar
        title="소모품 재고 조정"
        subtitle={`실측 ${summary.counted} / ${summary.total}품목 · 차이 발생 ${summary.items}건`}
        actions={<>
          <Button variant="ghost" size="sm" icon="x" onClick={onClose}>취소</Button>
          <Button variant="secondary" size="sm" icon="save" onClick={() => onSubmit && onSubmit({ draft: true, edits })}>임시 저장</Button>
          <Button variant="primary" size="sm" icon="check-check"
            onClick={() => setConfirm(true)}
            disabled={summary.counted === 0}>조정 확정 ({summary.items})</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>

          {/* Stats */}
          <div style={{ padding: "12px 24px 0", display: "flex", gap: 10 }}>
            <SAStatCard icon="boxes" label="실사 진행률" value={`${summary.counted}/${summary.total}`} sub={`${Math.round(summary.counted / summary.total * 100)}% 완료`} />
            <SAStatCard icon="trending-up" label="증가 품목" value={`${summary.diffPlus}건`} sub="실측 > 시스템" tone="success" />
            <SAStatCard icon="trending-down" label="감소 품목" value={`${summary.diffMinus}건`} sub="실측 < 시스템" tone="danger" />
            <SAStatCard icon="banknote" label="가치 변동" value={(summary.valueDelta >= 0 ? "+" : "") + won(summary.valueDelta)} sub={`${summary.items}품목 차이`} tone={summary.valueDelta < 0 ? "danger" : summary.valueDelta > 0 ? "success" : "neutral"} />
          </div>

          {/* Category quick filter */}
          <div style={{ padding: "16px 24px 8px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 4, background: "var(--bg-raised)", padding: 3, borderRadius: "var(--radius-md)", border: "1px solid var(--border-subtle)" }}>
              {[
                { key: "all",    label: "전체",    count: SUPPLIES.length },
                { key: "empty",  label: "미실사",  count: SUPPLIES.length - summary.counted },
                { key: "edited", label: "실사 완료", count: summary.counted },
                { key: "diff",   label: "차이 발생", count: summary.items },
              ].map(t => (
                <button key={t.key} onClick={() => setFilter(t.key)}
                  style={{
                    padding: "5px 12px", fontFamily: "var(--font-sans)", fontSize: 12,
                    border: "none", cursor: "pointer", borderRadius: "var(--radius-sm)",
                    background: filter === t.key ? "var(--bg-surface)" : "transparent",
                    color: filter === t.key ? "var(--text-primary)" : "var(--text-secondary)",
                    fontWeight: filter === t.key ? 600 : 400,
                    boxShadow: filter === t.key ? "var(--shadow-sm)" : "none",
                    display: "inline-flex", alignItems: "center", gap: 6,
                  }}>
                  {t.label}
                  <span style={{
                    fontSize: 10, fontFamily: "var(--font-mono)",
                    background: filter === t.key ? (t.key === "diff" ? "var(--status-danger-bg)" : "var(--brand-muted)") : "var(--bg-raised)",
                    color: filter === t.key ? (t.key === "diff" ? "var(--status-danger-text)" : "var(--text-brand)") : "var(--text-muted)",
                    padding: "0 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                  }}>{t.count}</span>
                </button>
              ))}
            </div>
            <div style={{ flex: 1 }}></div>
            <div style={{ width: 220 }}>
              <Input value={search} onChange={setSearch} placeholder="품명 / SKU" icon="search" />
            </div>
          </div>

          {/* Category chips */}
          <div style={{ padding: "0 24px 14px", display: "flex", gap: 6, flexWrap: "wrap" }}>
            {SUP_CATEGORIES.map(c => {
              const sel = category === c.key;
              const tone = c.key === "all" ? null : SUP_CAT_COLOR[c.label];
              return (
                <button key={c.key} onClick={() => setCategory(c.key)}
                  style={{
                    fontFamily: "var(--font-sans)", fontSize: 12, padding: "5px 12px",
                    border: `1px solid ${sel ? (tone?.fg || "var(--text-secondary)") : "var(--border-default)"}`,
                    background: sel ? (tone?.bg || "var(--bg-raised)") : "var(--bg-surface)",
                    color: sel ? (tone?.fg || "var(--text-primary)") : "var(--text-secondary)",
                    borderRadius: "var(--radius-full)", whiteSpace: "nowrap", cursor: "pointer",
                    fontWeight: sel ? 600 : 400,
                  }}>
                  {c.key === "all" ? "분류 전체" : c.label}
                </button>
              );
            })}
          </div>

          <div style={{ flex: 1, overflowY: "auto", padding: "0 24px 20px" }}>
            <div style={{
              background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
              borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", overflow: "hidden",
            }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--font-sans)" }}>
                <thead>
                  <tr style={{ background: "var(--bg-raised)" }}>
                    <th style={hdrLs}>품목</th>
                    <th style={hdrLs}>위치</th>
                    <th style={hdrRs}>시스템 재고</th>
                    <th style={{ ...hdrCs, width: 200 }}>실측 수량</th>
                    <th style={hdrRs}>차이</th>
                    <th style={hdrLs}>조정 사유</th>
                    <th style={hdrLs}>메모</th>
                    <th style={{ ...hdrCs, width: 40 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(s => {
                    const e = edits[s.id];
                    const counted = e?.counted;
                    const hasCount = counted !== undefined && counted !== "";
                    const diff = hasCount ? Number(counted) - s.stock : 0;
                    const diffPct = hasCount && s.stock > 0 ? (diff / s.stock) * 100 : 0;
                    const reason = e?.reason || "count";
                    const memo = e?.memo || "";
                    const cat = SUP_CAT_COLOR[s.category] || SUP_CAT_COLOR["사무"];

                    const tone = !hasCount ? "muted" :
                      diff === 0 ? "match" :
                      Math.abs(diffPct) > 20 ? "alert" : "diff";

                    return (
                      <tr key={s.id} style={{
                        borderTop: "1px solid var(--border-subtle)",
                        background: tone === "match" ? "var(--brand-subtle)" :
                                    tone === "alert" ? "var(--status-danger-bg)" :
                                    tone === "diff"  ? "var(--status-warning-bg)" : "transparent",
                      }}>
                        <td style={{ padding: "10px 14px" }}>
                          <div style={{ fontSize: 13, fontWeight: 500, color: "var(--text-primary)" }}>{s.name}</div>
                          <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 1 }}>
                            <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{s.sku}</span>
                            <span style={{ fontSize: 10, background: cat.bg, color: cat.fg, padding: "0 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", border: `1px solid ${cat.border}` }}>{s.category}</span>
                            <span style={{ fontSize: 10, color: "var(--text-muted)" }}>{s.pack}</span>
                          </div>
                        </td>
                        <td style={{ padding: "10px 14px", fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{s.location}</td>
                        <td style={{ padding: "10px 14px", textAlign: "right" }}>
                          <div style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)", fontWeight: 500 }}>{supFmt(s.stock, s.unit)}</div>
                          <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)", marginTop: 1 }}>{won(s.stock * s.unitPrice)}</div>
                        </td>
                        <td style={{ padding: "8px 12px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <input type="number" value={counted ?? ""} placeholder="—"
                              onChange={ev => setEdit(s.id, { counted: ev.target.value })}
                              style={{
                                width: 110, padding: "7px 10px", textAlign: "right",
                                fontFamily: "var(--font-mono)", fontSize: 13, fontWeight: 600,
                                color: tone === "alert" ? "var(--status-danger-text)" :
                                       tone === "diff"  ? "var(--status-warning-text)" :
                                       tone === "match" ? "var(--text-brand)" : "var(--text-primary)",
                                background: "var(--bg-surface)",
                                border: `1px solid ${
                                  tone === "alert" ? "var(--cinnabar-400)" :
                                  tone === "diff"  ? "var(--amber-400)" :
                                  tone === "match" ? "var(--jade-300)" : "var(--border-default)"}`,
                                borderRadius: "var(--radius-md)", outline: "none",
                              }} />
                            <button onClick={() => fillSystem(s)} title="시스템 재고와 동일"
                              style={{
                                padding: "6px 7px", border: "1px solid var(--border-default)",
                                background: "var(--bg-surface)", borderRadius: "var(--radius-sm)",
                                cursor: "pointer", color: "var(--text-muted)",
                                display: "inline-flex", alignItems: "center",
                              }}>
                              <Icon name="equal" size={12} />
                            </button>
                            <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)", minWidth: 24 }}>{s.unit}</span>
                          </div>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right" }}>
                          {hasCount ? (
                            <>
                              <div style={{
                                fontSize: 13, fontFamily: "var(--font-mono)", fontWeight: 600,
                                color: diff > 0 ? "var(--text-brand)" :
                                       diff < 0 ? "var(--status-danger-text)" : "var(--text-muted)",
                              }}>
                                {diff > 0 ? "+" : ""}{diff} {s.unit}
                              </div>
                              {diff !== 0 && (
                                <div style={{
                                  fontSize: 10, fontFamily: "var(--font-mono)", marginTop: 1,
                                  color: Math.abs(diffPct) > 20 ? "var(--status-danger-text)" : "var(--text-muted)",
                                }}>
                                  {diffPct > 0 ? "+" : ""}{diffPct.toFixed(1)}%
                                </div>
                              )}
                            </>
                          ) : <span style={{ fontSize: 11, color: "var(--text-muted)" }}>대기</span>}
                        </td>
                        <td style={{ padding: "8px 12px" }}>
                          <select value={reason} disabled={!hasCount || diff === 0}
                            onChange={ev => setEdit(s.id, { reason: ev.target.value })}
                            style={{
                              fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
                              background: !hasCount || diff === 0 ? "var(--bg-raised)" : "var(--bg-surface)",
                              border: "1px solid var(--border-default)",
                              borderRadius: "var(--radius-md)", padding: "6px 24px 6px 8px",
                              outline: "none", appearance: "none",
                              cursor: hasCount && diff !== 0 ? "pointer" : "not-allowed",
                              opacity: !hasCount || diff === 0 ? 0.5 : 1, width: 120,
                              backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path fill='%238A9E9A' d='M0 0l4 5 4-5z'/></svg>\")",
                              backgroundRepeat: "no-repeat", backgroundPosition: "right 8px center",
                            }}>
                            {SUP_ADJ_REASONS.map(r => <option key={r.key} value={r.key}>{r.label}</option>)}
                          </select>
                        </td>
                        <td style={{ padding: "8px 12px" }}>
                          <input value={memo} disabled={!hasCount}
                            onChange={ev => setEdit(s.id, { memo: ev.target.value })}
                            placeholder={hasCount ? (reason === "other" ? "사유 입력" : "선택") : "—"}
                            style={{
                              width: "100%", padding: "7px 10px",
                              fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
                              background: !hasCount ? "var(--bg-raised)" : "var(--bg-surface)",
                              border: "1px solid var(--border-default)",
                              borderRadius: "var(--radius-md)", outline: "none",
                              opacity: !hasCount ? 0.5 : 1, minWidth: 110,
                            }} />
                        </td>
                        <td style={{ padding: "10px 8px", textAlign: "center" }}>
                          {hasCount && (
                            <button onClick={() => clearRow(s.id)} title="실측값 삭제"
                              style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", padding: 4 }}>
                              <Icon name="rotate-ccw" size={13} />
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {rows.length === 0 && (
                <div style={{ padding: "40px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13 }}>
                  조건에 맞는 품목이 없습니다
                </div>
              )}
            </div>
          </div>
        </div>

        <SAReviewPanel summary={summary} edits={edits} />
      </div>

      {confirmOpen && (
        <SAConfirmModal
          summary={summary} edits={edits}
          onClose={() => setConfirm(false)}
          onConfirm={() => { setConfirm(false); onSubmit && onSubmit({ draft: false, edits, summary }); }}
        />
      )}
    </div>
  );
}

const hdrBaseS = {
  padding: "10px 14px", fontSize: 10, fontWeight: 700,
  color: "var(--text-muted)", letterSpacing: "0.06em",
  textTransform: "uppercase", whiteSpace: "nowrap",
};
const hdrLs = { ...hdrBaseS, textAlign: "left" };
const hdrRs = { ...hdrBaseS, textAlign: "right" };
const hdrCs = { ...hdrBaseS, textAlign: "center" };

function SAStatCard({ icon, label, value, sub, tone = "neutral" }) {
  const tones = {
    neutral: { fg: "var(--text-primary)",  bg: "var(--bg-raised)",  iconFg: "var(--text-secondary)" },
    success: { fg: "var(--text-brand)",      bg: "var(--brand-subtle)",    iconFg: "var(--text-brand)" },
    danger:  { fg: "var(--status-danger-text)",  bg: "var(--status-danger-bg)", iconFg: "var(--status-danger-text)" },
  };
  const t = tones[tone];
  return (
    <div style={{
      flex: 1, background: "var(--bg-surface)",
      border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)",
      padding: "12px 14px", display: "flex", alignItems: "center", gap: 12,
      boxShadow: "var(--shadow-sm)",
    }}>
      <div style={{
        width: 32, height: 32, borderRadius: "var(--radius-md)",
        background: t.bg, color: t.iconFg,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Icon name={icon} size={16} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)" }}>{label}</div>
        <div style={{ fontSize: 18, fontWeight: 600, color: t.fg, fontFamily: "var(--font-mono)", marginTop: 2, lineHeight: 1.1 }}>{value}</div>
        <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 1 }}>{sub}</div>
      </div>
    </div>
  );
}

function SAReviewPanel({ summary, edits }) {
  const changes = Object.keys(edits)
    .map(id => {
      const s = SUPPLIES.find(x => x.id === id);
      const e = edits[id];
      if (!s || e.counted === "" || e.counted === undefined) return null;
      const diff = Number(e.counted) - s.stock;
      if (diff === 0) return null;
      return { s, diff, reason: e.reason };
    })
    .filter(Boolean)
    .sort((a, b) => Math.abs(b.diff * b.s.unitPrice) - Math.abs(a.diff * a.s.unitPrice));

  return (
    <div style={{
      width: 300, background: "var(--bg-surface)",
      borderLeft: "1px solid var(--border-subtle)", padding: "16px 18px",
      display: "flex", flexDirection: "column", gap: 16, flexShrink: 0, overflowY: "auto",
    }}>
      <div>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 6 }}>실사 진행</div>
        <div style={{ position: "relative", height: 8, background: "var(--bg-raised)", borderRadius: 4, overflow: "hidden" }}>
          <div style={{
            position: "absolute", top: 0, bottom: 0, left: 0,
            width: `${(summary.counted / summary.total) * 100}%`,
            background: "var(--jade-500)", transition: "width 0.2s ease",
          }}></div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 11, fontFamily: "var(--font-mono)" }}>
          <span style={{ color: "var(--text-secondary)" }}>{summary.counted} / {summary.total}품목</span>
          <span style={{ color: "var(--text-muted)" }}>{Math.round(summary.counted / summary.total * 100)}%</span>
        </div>
      </div>

      <div>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>
          가장 큰 차이 ({changes.length}건)
        </div>
        {changes.length === 0 ? (
          <div style={{
            padding: "20px 12px", textAlign: "center", color: "var(--text-muted)",
            fontSize: 12, background: "var(--bg-raised)", borderRadius: "var(--radius-md)",
            border: "1px dashed var(--border-subtle)",
          }}>
            아직 차이가 발생한<br/>품목이 없습니다
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {changes.slice(0, 8).map(({ s, diff, reason }) => {
              const r = SUP_ADJ_REASONS.find(x => x.key === reason);
              const valueDelta = diff * s.unitPrice;
              return (
                <div key={s.id} style={{
                  padding: "8px 10px", border: "1px solid var(--border-subtle)",
                  borderRadius: "var(--radius-md)", background: "var(--bg-raised)",
                  display: "flex", flexDirection: "column", gap: 2,
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 6 }}>
                    <span style={{ fontSize: 12, fontWeight: 500, color: "var(--text-primary)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</span>
                    <span style={{
                      fontSize: 12, fontFamily: "var(--font-mono)", fontWeight: 600,
                      color: diff > 0 ? "var(--text-brand)" : "var(--status-danger-text)", flexShrink: 0,
                    }}>
                      {diff > 0 ? "+" : ""}{diff} {s.unit}
                    </span>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "var(--text-muted)" }}>
                    <span>{r?.label}</span>
                    <span style={{ fontFamily: "var(--font-mono)" }}>{valueDelta > 0 ? "+" : ""}{won(valueDelta)}</span>
                  </div>
                </div>
              );
            })}
            {changes.length > 8 && (
              <div style={{ fontSize: 10, color: "var(--text-muted)", textAlign: "center", padding: "4px 0", fontFamily: "var(--font-mono)" }}>
                + {changes.length - 8}건 더
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{
        marginTop: "auto", padding: "12px 14px", background: "var(--brand-subtle)",
        border: "1px solid var(--brand-muted)", borderRadius: "var(--radius-md)",
        display: "flex", flexDirection: "column", gap: 8,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <span style={{ fontSize: 11, color: "var(--text-secondary)" }}>총 가치 변동</span>
          <span style={{
            fontSize: 16, fontWeight: 600, fontFamily: "var(--font-mono)",
            color: summary.valueDelta < 0 ? "var(--status-danger-text)" : summary.valueDelta > 0 ? "var(--text-brand)" : "var(--text-primary)",
          }}>
            {summary.valueDelta > 0 ? "+" : ""}{won(summary.valueDelta)}
          </span>
        </div>
        <div style={{ fontSize: 10, color: "var(--text-muted)", lineHeight: 1.5 }}>
          조정 확정 시 모든 차이는 재고 이력에 사유와 함께 기록됩니다.
        </div>
      </div>
    </div>
  );
}

function SAConfirmModal({ summary, edits, onClose, onConfirm }) {
  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "var(--bg-overlay)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200,
      fontFamily: "var(--font-sans)",
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "var(--bg-surface)", borderRadius: "var(--radius-xl)",
        width: 460, padding: "24px 26px", boxShadow: "var(--shadow-xl)",
      }}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 16 }}>
          <div style={{
            width: 36, height: 36, borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
            background: "var(--brand-muted)", color: "var(--text-brand)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <Icon name="check-check" size={18} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 17, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)" }}>재고 조정 확정</div>
            <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 2 }}>아래 내용으로 시스템 재고를 보정합니다</div>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 1, background: "var(--border-subtle)", borderRadius: "var(--radius-md)", overflow: "hidden", border: "1px solid var(--border-subtle)" }}>
          <SACfRow label="실사 완료" value={`${summary.counted}품목 / 전체 ${summary.total}품목`} />
          <SACfRow label="차이 발생" value={`${summary.items}품목`} />
          <SACfRow label="증가 / 감소" value={`+${summary.diffPlus} / −${summary.diffMinus}`} />
          <SACfRow label="가치 변동" value={`${summary.valueDelta > 0 ? "+" : ""}${won(summary.valueDelta)}`}
                   accent={summary.valueDelta < 0 ? "var(--status-danger-text)" : "var(--text-brand)"} bold />
        </div>

        <div style={{
          marginTop: 14, padding: "10px 12px", background: "var(--status-warning-bg)",
          border: "1px solid var(--status-warning-border)", borderRadius: "var(--radius-md)",
          fontSize: 11, color: "var(--status-warning-text)", display: "flex", gap: 8,
        }}>
          <Icon name="alert-triangle" size={13} style={{ flexShrink: 0, marginTop: 1 }} />
          <span>확정 후에는 개별 항목별 사유만 수정 가능하며 전체 취소는 불가능합니다.</span>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
          <Button variant="secondary" size="md" onClick={onClose}>취소</Button>
          <Button variant="primary" size="md" icon="check-check" onClick={onConfirm}>조정 확정</Button>
        </div>
      </div>
    </div>
  );
}

function SACfRow({ label, value, accent, bold }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 12px", background: "var(--bg-surface)" }}>
      <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{label}</span>
      <span style={{
        fontSize: bold ? 14 : 12, fontFamily: "var(--font-mono)",
        color: accent || "var(--text-primary)", fontWeight: bold ? 600 : 400,
      }}>{value}</span>
    </div>
  );
}

Object.assign(window, { SupplyAdjustmentScreen });

</script>

<script type="text/babel">
// KoMES — 소모품 관리 화면 (의료/포장재/사무/청소)

const { useState: useStSup, useMemo: useMemoSup } = React;

function SuppliesScreen({ onNavigate, onOpenRecSettings, onCreateDrafts }) {
  const [selectedId, setSelectedId]     = useStSup("s-009");
  const [category, setCategory]         = useStSup("all");
  const [statusFilter, setStatusFilter] = useStSup("all");
  const [supplier, setSupplier]         = useStSup("all");
  const [search, setSearch]             = useStSup("");
  const [showAI, setShowAI]             = useStSup(true);
  const [sortKey, setSortKey]           = useStSup("name");
  const [sortDir, setSortDir]           = useStSup("asc");
  const [toast, setToast]               = useStSup(null);
  const [intakeOpen, setIntakeOpen]     = useStSup(false);
  const [registerOpen, setRegister]     = useStSup(false);
  const [adjustMode, setAdjustMode]     = useStSup(false);

  const alerts = useMemoSup(() => SUPPLIES.filter(s => supStatus(s).key !== "ok"), []);

  const aiSuggestions = useMemoSup(() => {
    return SUPPLIES
      .filter(s => s.stock < s.threshold || supRunOut(s) <= 14)
      .map(s => {
        const targetDays = 60;
        const need = Math.ceil((s.monthly / 30) * targetDays - s.stock);
        const suggestQty = Math.max(s.threshold, Math.ceil(need));
        return { id: s.id, name: s.name, supplier: s.supplier, unit: s.unit,
                 monthly: s.monthly, daysLeft: supRunOut(s), suggestQty, unitPrice: s.unitPrice };
      })
      .sort((a, b) => a.daysLeft - b.daysLeft);
  }, []);

  const suppliers = useMemoSup(() => {
    const set = new Set(SUPPLIES.map(s => s.supplier));
    return ["all", ...Array.from(set)];
  }, []);

  const rows = useMemoSup(() => {
    let out = SUPPLIES.slice();
    if (category !== "all")     out = out.filter(s => s.category === category);
    if (supplier !== "all")     out = out.filter(s => s.supplier === supplier);
    if (statusFilter !== "all") out = out.filter(s => supStatus(s).key === statusFilter);
    if (search) {
      const q = search.toLowerCase();
      out = out.filter(s => s.name.toLowerCase().includes(q) || s.sku.toLowerCase().includes(q));
    }
    out.sort((a, b) => {
      const dir = sortDir === "asc" ? 1 : -1;
      if (sortKey === "stock")    return (a.stock - b.stock) * dir;
      if (sortKey === "monthly")  return (a.monthly - b.monthly) * dir;
      if (sortKey === "value")    return (a.stock * a.unitPrice - b.stock * b.unitPrice) * dir;
      if (sortKey === "expiry")   {
        const da = a.expiry ? daysUntil(a.expiry) : 9999;
        const db = b.expiry ? daysUntil(b.expiry) : 9999;
        return (da - db) * dir;
      }
      if (sortKey === "lastIn")   return (new Date(a.lastIn) - new Date(b.lastIn)) * dir;
      if (sortKey === "category") return a.category.localeCompare(b.category, "ko") * dir;
      return a.name.localeCompare(b.name, "ko") * dir;
    });
    return out;
  }, [category, supplier, statusFilter, search, sortKey, sortDir]);

  const selected = SUPPLIES.find(s => s.id === selectedId) || null;
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };
  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(sortDir === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir("asc"); }
  };

  if (adjustMode) {
    return <SupplyAdjustmentScreen
      onClose={() => setAdjustMode(false)}
      onSubmit={({ draft, summary }) => {
        setAdjustMode(false);
        showToast(draft
          ? "재고 조정 내역이 임시 저장되었습니다."
          : `재고 조정 ${summary?.items || 0}건이 확정되었습니다.`);
      }} />;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="소모품"
        subtitle={`현재 ${SUPPLIES.length}품목 · 마지막 동기화 4분 전`}
        actions={<>
          <Button variant="ghost" size="sm" icon="download" onClick={() => showToast("소모품 재고 엑셀을 내려받았습니다.")}>엑셀</Button>
          <Button variant="secondary" size="sm" icon="clipboard-edit" onClick={() => setAdjustMode(true)}>재고 조정</Button>
          <Button variant="secondary" size="sm" icon="plus" onClick={() => setRegister(true)}>품목 등록</Button>
          <Button variant="primary" size="sm" icon="package-plus" onClick={() => setIntakeOpen(true)}>입고 등록</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        <div style={{ flex: 1, overflowY: "auto", minWidth: 0 }}>
        <div style={{ padding: "20px 24px", display: "flex", flexDirection: "column", gap: 16 }}>
          <SPKpiStrip items={SUPPLIES} alerts={alerts} openPOs={SUP_OPEN_POS} />

          {showAI && (
            <SPAICard
              suggestions={aiSuggestions}
              onApply={() => { setShowAI(false); onCreateDrafts && onCreateDrafts("supply"); }}
              onDismiss={() => setShowAI(false)}
              onOpenSettings={onOpenRecSettings}
            />
          )}

          <SPAlertSection alerts={alerts} onPick={setSelectedId} />

          <SPOpenPOs pos={SUP_OPEN_POS} onOpenHistory={() => onNavigate && onNavigate("orders")} />

          <div style={{
            background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
            borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", overflow: "hidden",
          }}>
            <div style={{ padding: "12px 16px", borderBottom: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)", marginRight: 8 }}>전체 소모품</span>
              <span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{rows.length} / {SUPPLIES.length}품목</span>
              <div style={{ flex: 1 }}></div>
              <div style={{ width: 220 }}>
                <Input value={search} onChange={setSearch} placeholder="품명 / SKU 검색" icon="search" />
              </div>
              <SPSelect value={category} onChange={setCategory}
                options={SUP_CATEGORIES.map(c => ({ value: c.key, label: c.label }))} />
              <SPSelect value={supplier} onChange={setSupplier}
                options={suppliers.map(s => ({ value: s, label: s === "all" ? "공급처 전체" : s }))} />
              <SPSelect value={statusFilter} onChange={setStatusFilter} options={[
                { value: "all",      label: "상태 전체" },
                { value: "ok",       label: "정상" },
                { value: "low",      label: "재고 부족" },
                { value: "critical", label: "소진 임박" },
                { value: "expiring", label: "유효기간 임박" },
              ]} />
            </div>

            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--font-sans)" }}>
                <thead>
                  <tr style={{ background: "var(--bg-raised)" }}>
                    <SPTh label="품목" sortable onClick={() => toggleSort("name")} active={sortKey==="name"} dir={sortDir} />
                    <SPTh label="분류" sortable onClick={() => toggleSort("category")} active={sortKey==="category"} dir={sortDir} />
                    <SPTh label="SKU" />
                    <SPTh label="재고 / 임계치" right sortable onClick={() => toggleSort("stock")} active={sortKey==="stock"} dir={sortDir} />
                    <SPTh label="월 소비" right sortable onClick={() => toggleSort("monthly")} active={sortKey==="monthly"} dir={sortDir} />
                    <SPTh label="최근 입고" sortable onClick={() => toggleSort("lastIn")} active={sortKey==="lastIn"} dir={sortDir} />
                    <SPTh label="유효기간" sortable onClick={() => toggleSort("expiry")} active={sortKey==="expiry"} dir={sortDir} />
                    <SPTh label="공급처" />
                    <SPTh label="재고가치" right sortable onClick={() => toggleSort("value")} active={sortKey==="value"} dir={sortDir} />
                    <SPTh label="위치" />
                    <SPTh label="상태" />
                  </tr>
                </thead>
                <tbody>
                  {rows.map(s => {
                    const st = supStatus(s);
                    const dExpiry = s.expiry ? daysUntil(s.expiry) : null;
                    const isSel = s.id === selectedId;
                    const value = s.stock * s.unitPrice;
                    const ratio = Math.min(s.stock / (s.threshold * 2), 1);
                    const cat = SUP_CAT_COLOR[s.category] || SUP_CAT_COLOR["사무"];
                    return (
                      <tr key={s.id} onClick={() => setSelectedId(s.id)}
                        style={{
                          borderTop: "1px solid var(--border-subtle)",
                          background: isSel ? "var(--brand-subtle)" : "transparent",
                          cursor: "pointer", transition: "background 0.1s ease",
                        }}
                        onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = "var(--bg-raised)"; }}
                        onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = "transparent"; }}>
                        <td style={{ padding: "10px 14px" }}>
                          <div style={{ fontSize: 13, fontWeight: 500, color: "var(--text-primary)" }}>{s.name}</div>
                          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 1 }}>{s.pack}</div>
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          <span style={{ fontSize: 11, background: cat.bg, color: cat.fg, padding: "2px 8px", borderRadius: "var(--radius-full)", border: `1px solid ${cat.border}`, whiteSpace: "nowrap" }}>{s.category}</span>
                        </td>
                        <td style={{ padding: "10px 14px", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{s.sku}</td>
                        <td style={{ padding: "10px 14px", textAlign: "right", minWidth: 150 }}>
                          <div style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)", fontWeight: 500 }}>{supFmt(s.stock, s.unit)}</div>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "flex-end", marginTop: 4 }}>
                            <div style={{ width: 64, height: 4, background: "var(--bg-raised)", borderRadius: 2, overflow: "hidden" }}>
                              <div style={{
                                width: `${ratio * 100}%`, height: "100%",
                                background: st.key === "critical" ? "var(--cinnabar-500)" :
                                            st.key === "low"      ? "var(--amber-500)" :
                                                                    "var(--jade-500)",
                              }}></div>
                            </div>
                            <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>임 {supFmt(s.threshold, s.unit)}</span>
                          </div>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 13, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{supFmt(s.monthly, s.unit)}</td>
                        <td style={{ padding: "10px 14px", fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{s.lastIn}</td>
                        <td style={{ padding: "10px 14px" }}>
                          {s.expiry ? <>
                            <div style={{ fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{s.expiry}</div>
                            <div style={{ fontSize: 10, color: dExpiry <= 90 ? "var(--status-danger-text)" : "var(--text-muted)", fontFamily: "var(--font-mono)", marginTop: 1 }}>D-{dExpiry}</div>
                          </> : <span style={{ fontSize: 11, color: "var(--text-muted)" }}>—</span>}
                        </td>
                        <td style={{ padding: "10px 14px", fontSize: 12, color: "var(--text-primary)" }}>{s.supplier}</td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)" }}>{won(value)}</td>
                        <td style={{ padding: "10px 14px", fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{s.location}</td>
                        <td style={{ padding: "10px 14px" }}>
                          {st.key === "ok"
                            ? <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>정상</span>
                            : <Badge variant={st.tone}>{st.label}</Badge>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {rows.length === 0 && (
                <div style={{ padding: "32px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)" }}>
                  조건에 맞는 품목이 없습니다.
                </div>
              )}
            </div>
          </div>
        </div>
        </div>

        <SPDetailPanel item={selected} onIntake={() => setIntakeOpen(true)} onToast={showToast} />
      </div>

      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--text-primary)", color: "var(--bg-raised)",
          padding: "10px 18px", borderRadius: "var(--radius-md)",
          fontSize: 13, fontFamily: "var(--font-sans)", boxShadow: "var(--shadow-lg)",
          display: "flex", alignItems: "center", gap: 8, zIndex: 100,
        }}>
          <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
          {toast}
        </div>
      )}

      {intakeOpen && (
        <SPIntakeModal item={selected} onClose={() => setIntakeOpen(false)}
          onSubmit={(qty) => { setIntakeOpen(false); showToast(`${selected?.name} ${supFmt(qty, selected?.unit || "")} 입고 처리되었습니다.`); }} />
      )}

      {/* 신규 품목 등록 모달 */}
      {registerOpen && (
        <SupplyRegistrationModal
          onClose={() => setRegister(false)}
          onSubmit={(data) => {
            setRegister(false);
            showToast(`신규 품목 '${data.name}'이(가) 등록되었습니다.`);
          }} />
      )}
    </div>
  );
}

function SPTh({ label, sortable, onClick, active, dir, right }) {
  return (
    <th onClick={sortable ? onClick : undefined}
      style={{
        padding: "8px 14px", fontSize: 10, fontWeight: 700,
        color: active ? "var(--text-primary)" : "var(--text-muted)",
        textAlign: right ? "right" : "left", letterSpacing: "0.06em",
        textTransform: "uppercase", cursor: sortable ? "pointer" : "default",
        userSelect: "none", whiteSpace: "nowrap",
      }}>
      {label}
      {sortable && active && <span style={{ marginLeft: 4, fontSize: 9 }}>{dir === "asc" ? "▲" : "▼"}</span>}
    </th>
  );
}

function SPSelect({ value, onChange, options }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)}
      style={{
        fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
        background: "var(--bg-surface)", border: "1px solid var(--border-default)",
        borderRadius: "var(--radius-md)", padding: "6px 28px 6px 10px", outline: "none",
        appearance: "none",
        backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9E9A' d='M0 0l5 6 5-6z'/></svg>\")",
        backgroundRepeat: "no-repeat", backgroundPosition: "right 10px center",
        cursor: "pointer",
      }}>
      {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

function SPDetailPanel({ item, onIntake, onToast }) {
  if (!item) {
    return (
      <div style={{ width: 320, background: "var(--bg-surface)", borderLeft: "1px solid var(--border-subtle)", padding: 20, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)" }}>
        품목을 선택하면 상세가 표시됩니다
      </div>
    );
  }
  const st = supStatus(item);
  const dExpiry = item.expiry ? daysUntil(item.expiry) : null;
  const runOut = supRunOut(item);
  const value = item.stock * item.unitPrice;
  const history = SUP_HISTORY[item.id] || [];
  const cat = SUP_CAT_COLOR[item.category] || SUP_CAT_COLOR["사무"];

  return (
    <div style={{
      width: 320, background: "var(--bg-surface)", borderLeft: "1px solid var(--border-subtle)",
      padding: "16px 18px", display: "flex", flexDirection: "column", gap: 16,
      flexShrink: 0, overflowY: "auto",
    }}>
      <div>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 4 }}>
          <div style={{ fontSize: 19, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)", letterSpacing: "-0.01em", flex: 1, lineHeight: 1.2 }}>{item.name}</div>
          <Badge variant={st.tone}>{st.label}</Badge>
        </div>
        <div style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{item.sku} · {item.pack}</div>
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          <span style={{ fontSize: 11, background: cat.bg, color: cat.fg, padding: "2px 8px", borderRadius: "var(--radius-full)", border: `1px solid ${cat.border}`, fontFamily: "var(--font-sans)", whiteSpace: "nowrap" }}>{item.category}</span>
        </div>
      </div>

      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>현재 재고</span>
          <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>잔여 {runOut}일</span>
        </div>
        <div style={{ fontSize: 24, fontWeight: 600, fontFamily: "var(--font-mono)", color: "var(--text-primary)" }}>{supFmt(item.stock, item.unit)}</div>
        <div style={{ position: "relative", height: 6, background: "var(--bg-raised)", borderRadius: 3, overflow: "hidden", marginTop: 6 }}>
          <div style={{
            position: "absolute", left: 0, top: 0, bottom: 0,
            width: `${Math.min(item.stock / (item.threshold * 2), 1) * 100}%`,
            background: st.key === "critical" ? "var(--cinnabar-500)" :
                        st.key === "low"      ? "var(--amber-500)" :
                                                "var(--jade-500)",
          }}></div>
          <div style={{
            position: "absolute", top: -2, bottom: -2,
            left: `${Math.min(item.threshold / (item.threshold * 2), 1) * 100}%`,
            width: 2, background: "var(--ink-500)",
          }}></div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>0</span>
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>임계치 {supFmt(item.threshold, item.unit)}</span>
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{supFmt(item.threshold * 2, item.unit)}</span>
        </div>
      </div>

      <div style={{ display: "flex", gap: 6 }}>
        <Button variant="primary" size="sm" icon="package-plus" onClick={onIntake}>입고</Button>
        <Button variant="secondary" size="sm" icon="clipboard-edit" onClick={() => onToast("실사 보정 화면을 엽니다.")}>조정</Button>
        <Button variant="secondary" size="sm" icon="send" onClick={() => onToast(`${item.name} 발주 라인이 추가되었습니다.`)}>발주</Button>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 1, background: "var(--border-subtle)", borderRadius: "var(--radius-md)", overflow: "hidden", border: "1px solid var(--border-subtle)" }}>
        <SPFact label="공급처"      value={item.supplier} />
        <SPFact label="단가"        value={`${won(item.unitPrice)} / ${item.unit}`} />
        <SPFact label="재고가치"    value={won(value)} />
        <SPFact label="월 소비"     value={supFmt(item.monthly, item.unit)} />
        <SPFact label="안전 임계치" value={supFmt(item.threshold, item.unit)} />
        <SPFact label="최근 입고"    value={item.lastIn} />
        <SPFact label="유효기간"
                value={item.expiry ? `${item.expiry} · D-${dExpiry}` : "해당 없음"}
                accent={item.expiry && dExpiry <= 90 ? "var(--status-danger-text)" : undefined} />
        <SPFact label="보관 위치"    value={item.location} />
      </div>

      <div>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 8 }}>최근 이력</div>
        {history.length === 0
          ? <div style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", padding: "8px 0" }}>최근 90일간 이력이 없습니다.</div>
          : <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {history.map((h, i) => (
                <div key={i} style={{
                  display: "grid", gridTemplateColumns: "82px 38px 1fr auto", gap: 8, alignItems: "center",
                  padding: "7px 10px", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)",
                  background: "var(--bg-raised)",
                }}>
                  <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{h.date}</span>
                  <span style={{
                    fontSize: 10, fontWeight: 600, fontFamily: "var(--font-sans)",
                    color: h.type === "입고" ? "var(--text-brand)" : h.type === "사용" ? "var(--text-secondary)" : "var(--status-warning-text)",
                    background: h.type === "입고" ? "var(--brand-muted)" : h.type === "사용" ? "var(--bg-raised)" : "var(--status-warning-bg)",
                    padding: "1px 6px", borderRadius: "var(--radius-sm)", textAlign: "center",
                  }}>{h.type}</span>
                  <span style={{ fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-sans)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.note}</span>
                  <span style={{ fontSize: 12, fontFamily: "var(--font-mono)", color: h.qty > 0 ? "var(--text-brand)" : "var(--text-primary)" }}>
                    {h.qty > 0 ? "+" : ""}{h.qty} {item.unit}
                  </span>
                </div>
              ))}
            </div>}
      </div>
    </div>
  );
}

function SPFact({ label, value, accent }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "8px 12px", background: "var(--bg-surface)" }}>
      <span style={{ fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>{label}</span>
      <span style={{ fontSize: 12, color: accent || "var(--text-primary)", fontFamily: "var(--font-mono)", textAlign: "right" }}>{value}</span>
    </div>
  );
}

function SPIntakeModal({ item, onClose, onSubmit }) {
  const [qty, setQty]    = useStSup("");
  const [lot, setLot]    = useStSup("");
  const [expiry, setExp] = useStSup("");
  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "var(--bg-overlay)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "var(--bg-surface)", borderRadius: "var(--radius-xl)",
        width: 440, padding: "22px 24px", boxShadow: "var(--shadow-xl)",
        fontFamily: "var(--font-sans)",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-serif)" }}>입고 등록</div>
            <div style={{ fontSize: 12, color: "var(--text-muted)" }}>{item ? `${item.name} · 현재 ${supFmt(item.stock, item.unit)}` : "품목 선택 필요"}</div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", fontSize: 20, lineHeight: 1 }}>×</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <Input label={`입고 수량 (${item?.unit || ""})`} value={qty} onChange={setQty} placeholder="예: 12" type="number" />
          <Input label="공급처 / 로트번호" value={lot} onChange={setLot} placeholder={item ? item.supplier : "공급처"} />
          <Input label="유효기간 (있을 경우)" value={expiry} onChange={setExp} placeholder="YYYY-MM-DD" />
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
          <Button variant="secondary" size="md" onClick={onClose}>취소</Button>
          <Button variant="primary" size="md" icon="check"
            onClick={() => onSubmit(Number(qty) || 0)} disabled={!qty || !item}>입고 처리</Button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { SuppliesScreen });

</script>

    status: "received", placedBy: "이수민",
    items: [
      L("A4 복사용지", 4, "박스", 22000, "supply"),

    ],
    timeline: [
      { date: "2026-02-10 11:00", who: "이수민", text: "발주" },
      { date: "2026-02-15 09:40", who: "이수민", text: "입고 완료" },
    ],
  },
];

// 추천 기본 설정 (RecommendationSettingsModal 기본값)
const REC_DEFAULTS = {
  scope: "both",          // both | herb | supply
  daysLeftTrigger: 14,    // 잔여 일수가 이 값 이하일 때 추천
  thresholdMultiplier: 1, // 안전 임계치 × 배수 미만일 때 추천 (1=임계치 그대로)
  targetCoverDays: 60,    // 발주 후 보유 목표 일수
  roundingHerb: 100,      // 약재 수량 라운딩 (g)
  roundingSupply: 1,      // 소모품 수량 라운딩 (단위)
  groupBySupplier: true,  // 공급처별 자동 그룹핑
  minOrderValue: 200000,  // 공급처당 최소 발주 금액 (원)
  autoApprove: false,     // 자동 승인 여부
  autoApproveLimit: 500000, // 자동 승인 가능 최대 금액 (원)
  channels: { dashboard: true, email: true, sms: false },
  excludeCats: [],        // 추천에서 제외할 효능 분류 (약재)
  excludeSupCats: [],     // 추천에서 제외할 소모품 분류
  leadTimeBuffer: 3,      // 공급처 리드타임 추가 여유일
};

// PO 토탈 헬퍼
function poTotal(po) {
  return po.items.reduce((s, i) => s + i.subtotal, 0);
}
function poItemCount(po) {
  return po.items.length;
}
function poQtyCount(po) {
  return po.items.reduce((s, i) => s + i.qty, 0);
}

// 평균 리드 타임 계산 (received - date)
function poLeadDays(po) {
  if (!po.received) return null;
  const a = new Date(po.date);
  const b = new Date(po.received);
  return Math.round((b - a) / (1000 * 60 * 60 * 24));
}

// 공급처 메타데이터 (담당자 · 연락처 · 평균 리드타임 · 결제 조건 · 최소 발주 금액)
const SUPPLIERS = {
  "동방한약":     { contact: "박지영 차장", phone: "02-3456-7890",  avgLead: 7,  payment: "월말 정산",  minOrder: 200000, note: "정기 발주 거래처" },
  "신원약업":     { contact: "김태호 과장", phone: "02-2345-6789",  avgLead: 7,  payment: "선결제",      minOrder: 100000, note: "" },
  "광동무역":     { contact: "이미라 부장", phone: "02-4567-8901",  avgLead: 10, payment: "후불 30일",   minOrder: 300000, note: "수입 약재 전문" },
  "금산인삼조합": { contact: "정현우 팀장", phone: "041-789-0123",  avgLead: 8,  payment: "선결제",      minOrder: 100000, note: "" },
  "제주한방":     { contact: "강지수 차장", phone: "064-712-3456",  avgLead: 6,  payment: "월말 정산",  minOrder: 100000, note: "" },
  "동방의료기":   { contact: "임철수 과장", phone: "02-5678-9012",  avgLead: 5,  payment: "월말 정산",  minOrder:  50000, note: "" },
  "삼성약품":     { contact: "최영민 부장", phone: "02-6789-0123",  avgLead: 4,  payment: "월말 정산",  minOrder:  50000, note: "" },
  "케어웍스":     { contact: "윤서연 차장", phone: "031-345-6789", avgLead: 5,  payment: "월말 정산",  minOrder: 100000, note: "" },
  "에코파우치":   { contact: "한지훈 과장", phone: "031-456-7890", avgLead: 7,  payment: "후불 30일",   minOrder: 150000, note: "" },
  "한방약업사":   { contact: "조경아 팀장", phone: "031-567-8901", avgLead: 6,  payment: "선결제",      minOrder:  50000, note: "" },
  "한지문화사":   { contact: "오민석 대리", phone: "031-678-9012", avgLead: 5,  payment: "월말 정산",  minOrder:  50000, note: "" },
  "프린텍":       { contact: "신유진 사원", phone: "031-789-0123", avgLead: 3,  payment: "선결제",      minOrder:  30000, note: "" },
  "오피스나라":   { contact: "황현태 대리", phone: "1588-1234",    avgLead: 2,  payment: "월말 정산",  minOrder:  30000, note: "" },
};

// 추천 계산 (RecommendationSettingsModal 프리뷰와 동일 로직)
function computeRecommendations(settings = REC_DEFAULTS) {
  const items = [];

  if (settings.scope === "both" || settings.scope === "herb") {
    HERBS.forEach(h => {
      if (settings.excludeCats?.includes(h.category)) return;
      const daysLeft = projectedRunOutDays(h);
      const belowThreshold = h.stock < h.threshold * settings.thresholdMultiplier;
      if (daysLeft > settings.daysLeftTrigger && !belowThreshold) return;
      const need = (h.monthly / 30) * settings.targetCoverDays - h.stock;
      const round = settings.roundingHerb || 1;
      const qty = Math.max(h.threshold, Math.ceil(need / round) * round);
      const thresholdGap = Math.round((h.threshold - h.stock) / h.threshold * 100);
      items.push({
        kind: "herb", id: h.id, name: h.name, supplier: h.supplier,
        unit: "g", category: h.category,
        currentStock: h.stock, threshold: h.threshold, monthly: h.monthly,
        daysLeft, qty, unitPrice: h.unitPrice,
        reason: daysLeft <= settings.daysLeftTrigger
          ? `잔여 ${daysLeft}일` : `임계치 ${thresholdGap}% 미달`,
        urgency: daysLeft <= 7 ? "high" : daysLeft <= 14 ? "med" : "low",
      });
    });
  }
  if (settings.scope === "both" || settings.scope === "supply") {
    SUPPLIES.forEach(s => {
      if (settings.excludeSupCats?.includes(s.category)) return;
      const daysLeft = supRunOut(s);
      const belowThreshold = s.stock < s.threshold * settings.thresholdMultiplier;
      if (daysLeft > settings.daysLeftTrigger && !belowThreshold) return;
      const need = (s.monthly / 30) * settings.targetCoverDays - s.stock;
      const round = settings.roundingSupply || 1;
      const qty = Math.max(s.threshold, Math.ceil(need / round) * round);
      const thresholdGap = Math.round((s.threshold - s.stock) / s.threshold * 100);
      items.push({
        kind: "supply", id: s.id, name: s.name, supplier: s.supplier,
        unit: s.unit, category: s.category, pack: s.pack,
        currentStock: s.stock, threshold: s.threshold, monthly: s.monthly,
        daysLeft, qty, unitPrice: s.unitPrice,
        reason: daysLeft <= settings.daysLeftTrigger
          ? `잔여 ${daysLeft}일` : `임계치 ${thresholdGap}% 미달`,
        urgency: daysLeft <= 7 ? "high" : daysLeft <= 14 ? "med" : "low",
      });
    });
  }

  // 공급처별 그룹핑
  const groups = {};
  items.forEach(i => {
    if (!groups[i.supplier]) groups[i.supplier] = { supplier: i.supplier, items: [] };
    groups[i.supplier].items.push(i);
  });

  return Object.values(groups)
    .map(g => ({
      ...g,
      total: g.items.reduce((s, i) => s + i.qty * i.unitPrice, 0),
    }))
    .sort((a, b) => {
      // 긴급도 우선, 그 다음 금액 큰 순
      const aUrg = a.items.some(i => i.urgency === "high") ? 0 : 1;
      const bUrg = b.items.some(i => i.urgency === "high") ? 0 : 1;
      if (aUrg !== bUrg) return aUrg - bUrg;
      return b.total - a.total;
    });
}

Object.assign(window, {
  PURCHASE_ORDERS, PO_STATUS, REC_DEFAULTS, SUPPLIERS,
  poTotal, poItemCount, poQtyCount, poLeadDays, computeRecommendations,
});

</script>

<script type="text/babel">

      if (typeFilter !== "all"   && p.type   !== typeFilter)   return false;
      if (supplier !== "all"     && p.supplier !== supplier)   return false;
      const d = (TODAY - new Date(p.date)) / (1000 * 60 * 60 * 24);
      if (d > cutoffDays) return false;
      if (search) {
        const q = search.toLowerCase();

        const matchSup = p.supplier.toLowerCase().includes(q);
        const matchItem = p.items.some(i => i.name.toLowerCase().includes(q));
        if (!matchId && !matchSup && !matchItem) return false;

              ].map(t => (
                <button key={t.key} onClick={() => setPeriod(t.key)}
                  style={{

// ── Status pipeline bar ─────────────────────────────────────────
function POStatusBar({ orders, statusFilter, onClick }) {
  const stages = [
    { key: "pending",  label: "승인 대기" },
    { key: "sent",     label: "발주 완료" },
    { key: "partial",  label: "부분 입고" },
    { key: "received", label: "입고 완료" },
    { key: "cancelled",label: "취소/반품" },
  ];
  const counts = stages.map(s => ({
    ...s,
    count: s.key === "cancelled"
      ? orders.filter(o => o.status === "cancelled" || o.status === "returned").length
      : orders.filter(o => o.status === s.key).length,
  }));

  return (
    <div style={{
      background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
      borderRadius: "var(--radius-lg)", padding: "10px 14px", boxShadow: "var(--shadow-sm)",
      display: "flex", alignItems: "center", gap: 8,
    }}>
      {counts.map((s, i) => {
        const active = statusFilter === s.key;
        return (
          <React.Fragment key={s.key}>
            <button onClick={() => onClick(active ? "all" : s.key)}
              style={{
                flex: 1, padding: "8px 12px", border: "none", cursor: "pointer",
                background: active ? "var(--brand-subtle)" : "transparent",
                borderRadius: "var(--radius-md)", textAlign: "left",
                transition: "background 0.12s ease",
                fontFamily: "var(--font-sans)",
              }}
              onMouseEnter={e => { if (!active) e.currentTarget.style.background = "var(--bg-raised)"; }}
              onMouseLeave={e => { if (!active) e.currentTarget.style.background = "transparent"; }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <span style={{ fontSize: 22, fontWeight: 600, fontFamily: "var(--font-mono)", color: active ? "var(--text-brand)" : "var(--text-primary)", lineHeight: 1 }}>{s.count}</span>
                <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>건</span>
              </div>
              <div style={{ fontSize: 11, color: active ? "var(--text-brand)" : "var(--text-secondary)", marginTop: 3, fontWeight: active ? 600 : 400 }}>{s.label}</div>
            </button>
            {i < counts.length - 1 && (
              <Icon name="chevron-right" size={14} style={{ color: "var(--ink-200)", flexShrink: 0 }} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

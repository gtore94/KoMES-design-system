<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoMES — UI Kit (Standalone)</title>

<!-- ============================================================
     KoMES Design System — Colors & Typography (inlined)
     ============================================================ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink-900: #111E1C; --ink-800: #1C2B2B; --ink-700: #2A3C3A; --ink-600: #3A4F4C;
  --ink-500: #4A5E5B; --ink-400: #6B7E7B; --ink-300: #8A9E9A; --ink-200: #B5C5C2;
  --ink-100: #D8E4E2; --ink-50:  #EEF4F3;

  --jade-900: #1A3C34; --jade-800: #2A5548; --jade-700: #2E5C52; --jade-600: #3A7065;
  --jade-500: #4A7C6F; --jade-400: #6B9E90; --jade-300: #8DBFB3; --jade-200: #B3D8D1;
  --jade-100: #D4EDE9; --jade-50:  #EEF8F6;

  --stone-900: #5C5248; --stone-800: #7A6E62; --stone-700: #9A8E82; --stone-600: #B8AFA4;
  --stone-500: #CEC6BC; --stone-400: #D8D0C4; --stone-300: #E4DDD4; --stone-200: #EDE7D9;
  --stone-100: #F5F0E8; --stone-50:  #FDFAF5;

  --cinnabar-900: #6B1A14; --cinnabar-800: #922420; --cinnabar-700: #B03028;
  --cinnabar-600: #C4594B; --cinnabar-500: #D4756A; --cinnabar-400: #E09690;
  --cinnabar-300: #EBB8B3; --cinnabar-200: #F3D4D1; --cinnabar-100: #FAEDEC;

  --amber-700: #8C5A1A; --amber-600: #B47A28; --amber-500: #C4974B; --amber-400: #D4AE78;
  --amber-200: #F0DFC0; --amber-100: #FAF2E4;

  --bg-page: var(--stone-50); --bg-surface: #FFFFFF;
  --bg-raised: var(--stone-100); --bg-sunken: var(--stone-200);
  --bg-overlay: rgba(17, 30, 28, 0.48);

  --text-primary: var(--ink-800); --text-secondary: var(--ink-500);
  --text-muted: var(--ink-300); --text-disabled: var(--ink-200);
  --text-inverse: var(--stone-50); --text-brand: var(--jade-700);
  --text-danger: var(--cinnabar-600); --text-warning: var(--amber-600);

  --border-subtle: var(--stone-300); --border-default: var(--stone-400);
  --border-strong: var(--ink-200); --border-brand: var(--jade-500);
  --border-danger: var(--cinnabar-400);

  --brand: var(--jade-500); --brand-hover: var(--jade-600);
  --brand-active: var(--jade-700); --brand-subtle: var(--jade-50);
  --brand-muted: var(--jade-100);

  --status-success-bg: var(--jade-50); --status-success-text: var(--jade-700); --status-success-border: var(--jade-200);
  --status-warning-bg: var(--amber-100); --status-warning-text: var(--amber-700); --status-warning-border: var(--amber-200);
  --status-danger-bg: var(--cinnabar-100); --status-danger-text: var(--cinnabar-700); --status-danger-border: var(--cinnabar-200);
  --status-neutral-bg: var(--stone-100); --status-neutral-text: var(--ink-600); --status-neutral-border: var(--stone-300);

  --shadow-sm:  0 1px 2px rgba(17, 30, 28, 0.06), 0 1px 4px rgba(17, 30, 28, 0.04);
  --shadow-md:  0 2px 8px rgba(17, 30, 28, 0.08), 0 1px 3px rgba(17, 30, 28, 0.05);
  --shadow-lg:  0 4px 16px rgba(17, 30, 28, 0.10), 0 2px 6px rgba(17, 30, 28, 0.06);
  --shadow-xl:  0 8px 32px rgba(17, 30, 28, 0.12), 0 4px 12px rgba(17, 30, 28, 0.07);

  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;

  --font-serif: 'Noto Serif KR', 'Georgia', serif;
  --font-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: var(--font-sans);
  background-color: var(--bg-page);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
</style>

<!-- React production builds + htm (no Babel) -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";
  const { useState, useRef, useEffect, useMemo } = React;
  const html = htm.bind(React.createElement);
  const F = React.Fragment;

  // ════════════════════════════════════════════════════════════════
  // Shared Components
  // ════════════════════════════════════════════════════════════════

  function Icon({ name, size = 16, style = {}, className = "" }) {
    const ref = useRef(null);
    useEffect(() => {
      if (ref.current && window.lucide) window.lucide.createIcons({ nodes: [ref.current] });
    }, [name]);
    return html`<span ref=${ref} style=${{ display: "inline-flex", alignItems: "center", ...style }} className=${className}>
      <i data-lucide=${name} style=${{ width: size, height: size }}></i>
    </span>`;
  }

  function Avatar({ name, size = 28 }) {
    const char = name ? name[0] : "?";
    return html`<div style=${{
      width: size, height: size, borderRadius: "50%",
      background: "var(--jade-200)", color: "var(--jade-700)",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: size * 0.42, fontWeight: 600, flexShrink: 0,
      fontFamily: "var(--font-sans)"
    }}>${char}</div>`;
  }

  function Badge({ variant = "neutral", children }) {
    const styles = {
      success: { background: "var(--status-success-bg)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)" },
      warning: { background: "var(--status-warning-bg)", color: "var(--status-warning-text)", border: "1px solid var(--status-warning-border)" },
      danger:  { background: "var(--status-danger-bg)",  color: "var(--status-danger-text)",  border: "1px solid var(--status-danger-border)" },
      neutral: { background: "var(--status-neutral-bg)", color: "var(--status-neutral-text)", border: "1px solid var(--status-neutral-border)" },
      brand:   { background: "var(--jade-50)", color: "var(--jade-700)", border: "1px solid var(--jade-200)" },
    };
    return html`<span style=${{
      display: "inline-flex", alignItems: "center", gap: 4,
      fontSize: 11, fontWeight: 500, padding: "2px 8px",
      borderRadius: "var(--radius-full)", ...styles[variant],
      fontFamily: "var(--font-sans)"
    }}>${children}</span>`;
  }

  function Button({ variant = "primary", size = "md", onClick, children, disabled, icon }) {
    const base = {
      display: "inline-flex", alignItems: "center", gap: 6,
      fontFamily: "var(--font-sans)", fontWeight: 500, border: "none",
      cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1,
      transition: "all 0.12s ease", letterSpacing: "0.01em", whiteSpace: "nowrap"
    };
    const sizes = {
      sm: { fontSize: 11, padding: "5px 11px", borderRadius: "var(--radius-sm)" },
      md: { fontSize: 13, padding: "8px 16px", borderRadius: "var(--radius-md)" },
    };
    const variants = {
      primary:   { background: "var(--jade-500)", color: "white", boxShadow: "var(--shadow-sm)" },
      secondary: { background: "var(--bg-surface)", color: "var(--text-primary)", border: "1px solid var(--border-default)", boxShadow: "var(--shadow-sm)" },
      ghost:     { background: "transparent", color: "var(--jade-700)" },
      danger:    { background: "var(--cinnabar-600)", color: "white" },
    };
    return html`<button onClick=${onClick} disabled=${disabled} style=${{ ...base, ...sizes[size], ...variants[variant] }}>
      ${icon && html`<${Icon} name=${icon} size=${13} />`}
      ${children}
    </button>`;
  }

  function Input({ label, value, onChange, placeholder, type = "text", hint, error, icon }) {
    const [focused, setFocused] = useState(false);
    return html`<div style=${{ display: "flex", flexDirection: "column", gap: 4 }}>
      ${label && html`<label style=${{ fontSize: 12, fontWeight: 500, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>${label}</label>`}
      <div style=${{ position: "relative" }}>
        ${icon && html`<span style=${{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-muted)", display: "flex" }}>
          <${Icon} name=${icon} size=${14} />
        </span>`}
        <input type=${type} value=${value} onChange=${e => onChange && onChange(e.target.value)}
          placeholder=${placeholder}
          onFocus=${() => setFocused(true)} onBlur=${() => setFocused(false)}
          style=${{
            fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-primary)",
            background: "var(--bg-surface)", border: `1px solid ${error ? "var(--border-danger)" : focused ? "var(--border-brand)" : "var(--border-default)"}`,
            borderRadius: "var(--radius-md)", padding: icon ? "7px 10px 7px 30px" : "7px 10px",
            outline: "none", width: "100%", boxShadow: focused ? "0 0 0 3px var(--jade-100)" : "none",
            transition: "all 0.12s ease", boxSizing: "border-box"
          }} />
      </div>
      ${error && html`<span style=${{ fontSize: 11, color: "var(--text-danger)", fontFamily: "var(--font-sans)" }}>${error}</span>`}
      ${hint && !error && html`<span style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${hint}</span>`}
    </div>`;
  }

  function Sidebar({ activeScreen, onNavigate }) {
    const navGroups = [
      { label: "진료", items: [
        { key: "patients",  icon: "layout-dashboard", label: "진료 현황" },
        { key: "chart",     icon: "file-heart",       label: "진료 차트" },
        { key: "registry",  icon: "users",            label: "환자 관리" },
        { key: "schedule",  icon: "calendar",          label: "예약 관리" },
        { key: "payment",   icon: "credit-card",       label: "수납" },
      ]},
      { label: "처방", items: [
        { key: "prescriptions", icon: "flask-conical", label: "처방 관리" },
        { key: "inventory",     icon: "package",        label: "약재 재고" },
      ]},
      { label: "분석", items: [
        { key: "stats", icon: "bar-chart-2", label: "통계" },
        { key: "ai",    icon: "sparkles",    label: "AI 분석" },
      ]},
    ];

    const s = {
      root: { width: 220, background: "var(--ink-800)", display: "flex", flexDirection: "column", flexShrink: 0, height: "100%" },
      logo: { display: "flex", alignItems: "center", gap: 10, padding: "14px 14px 12px", borderBottom: "1px solid rgba(255,255,255,0.08)" },
      mark: { width: 30, height: 30, background: "var(--jade-500)", borderRadius: "var(--radius-sm)", display: "flex", alignItems: "center", justifyContent: "center" },
      markLetter: { fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 600, color: "white" },
      brandName: { fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 400, color: "var(--stone-50)", letterSpacing: "-0.01em" },
      section: { padding: "10px 8px 2px" },
      sectionLabel: { fontSize: 9, fontWeight: 700, letterSpacing: "0.1em", color: "var(--ink-300)", textTransform: "uppercase", padding: "0 6px", marginBottom: 3 },
      footer: { marginTop: "auto", padding: "10px 8px", borderTop: "1px solid rgba(255,255,255,0.08)" },
    };

    return html`<div style=${s.root}>
      <div style=${s.logo}>
        <div style=${s.mark}><span style=${s.markLetter}>K</span></div>
        <span style=${s.brandName}>KoMES</span>
      </div>
      ${navGroups.map(g => html`
        <div key=${g.label} style=${s.section}>
          <div style=${s.sectionLabel}>${g.label}</div>
          ${g.items.map(item => html`
            <div key=${item.key} onClick=${() => onNavigate(item.key)}
              style=${{
                display: "flex", alignItems: "center", gap: 8, padding: "7px 8px",
                borderRadius: "var(--radius-md)", cursor: "pointer",
                background: activeScreen === item.key ? "var(--jade-600)" : "transparent",
                color: activeScreen === item.key ? "white" : "var(--ink-200)",
                fontSize: 13, fontWeight: activeScreen === item.key ? 500 : 400,
                transition: "all 0.12s ease", fontFamily: "var(--font-sans)",
              }}>
              <${Icon} name=${item.icon} size=${15} />
              ${item.label}
            </div>
          `)}
        </div>
      `)}
      <div style=${s.section}>
        <div onClick=${() => onNavigate("settings")} style=${{
          display: "flex", alignItems: "center", gap: 8, padding: "7px 8px",
          borderRadius: "var(--radius-md)", cursor: "pointer",
          background: activeScreen === "settings" ? "var(--jade-600)" : "transparent",
          color: "var(--ink-200)", fontSize: 13, fontFamily: "var(--font-sans)",
        }}>
          <${Icon} name="settings" size=${15} />설정
        </div>
      </div>
      <div style=${s.footer}>
        <div style=${{ display: "flex", alignItems: "center", gap: 8, padding: "6px 6px", borderRadius: "var(--radius-md)", cursor: "pointer" }}>
          <${Avatar} name="김" size=${26} />
          <div>
            <div style=${{ fontSize: 12, color: "var(--stone-100)", fontWeight: 500, fontFamily: "var(--font-sans)" }}>김민준</div>
            <div style=${{ fontSize: 10, color: "var(--ink-300)", fontFamily: "var(--font-sans)" }}>원장</div>
          </div>
          <${Icon} name="chevrons-up-down" size=${13} style=${{ marginLeft: "auto", color: "var(--ink-300)" }} />
        </div>
      </div>
    </div>`;
  }

  function TopBar({ title, subtitle, actions }) {
    return html`<div style=${{
      height: 54, background: "var(--bg-surface)", borderBottom: "1px solid var(--border-subtle)",
      display: "flex", alignItems: "center", padding: "0 24px", gap: 12, flexShrink: 0
    }}>
      <div style=${{ flex: 1 }}>
        <div style=${{ fontSize: 15, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>${title}</div>
        ${subtitle && html`<div style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${subtitle}</div>`}
      </div>
      <div style=${{ display: "flex", gap: 8, alignItems: "center" }}>
        ${actions}
        <div style=${{ width: 1, height: 20, background: "var(--border-subtle)", margin: "0 4px" }}></div>
        <${Icon} name="bell" size=${17} style=${{ color: "var(--text-muted)", cursor: "pointer" }} />
      </div>
    </div>`;
  }

  // ════════════════════════════════════════════════════════════════
  // PatientListScreen
  // ════════════════════════════════════════════════════════════════

  const PATIENTS = [
    { id: 11, name: "한지민", gender: "여", dob: "1991-08-14", age: 34, phone: "010-4455-1100", lastVisit: "2026-04-15", stage: "예약",     chief: "어지러움 (10:30)",   waitMins: 0,  visitType: "재진" },
    { id: 12, name: "장우성", gender: "남", dob: "1983-12-02", age: 42, phone: "010-7711-9922", lastVisit: "—",         stage: "예약",     chief: "허리 통증 (11:00)", waitMins: 0,  visitType: "초진", insurance: "자보", injuryDate: "2026-05-01" },
    { id: 13, name: "송재호", gender: "남", dob: "1976-05-18", age: 49, phone: "010-3322-7755", lastVisit: "2026-04-26", stage: "진료대기", chief: "교통사고 후 경항통", waitMins: 12, visitType: "재진", insurance: "자보", injuryDate: "2026-04-12" },
    { id: 14, name: "안세영", gender: "여", dob: "1995-09-23", age: 30, phone: "010-6677-2244", lastVisit: "2026-03-20", stage: "치료실",   chief: "교통사고 후 요통",   waitMins: 9,  visitType: "재진", insurance: "자보", injuryDate: "2026-03-10" },
    { id: 1,  name: "홍길동", gender: "남", dob: "1985-04-12", age: 40, phone: "010-1234-5678", lastVisit: "2026-04-22", stage: "진료대기", chief: "두통, 어지러움",     waitMins: 18, visitType: "재진", insurance: "자보", injuryDate: "2026-04-04" },
    { id: 2,  name: "김수진", gender: "여", dob: "1972-11-30", age: 52, phone: "010-9876-5432", lastVisit: "2026-04-22", stage: "진료실",   chief: "요통, 피로감",     waitMins: 7,  visitType: "재진" },
    { id: 3,  name: "이민호", gender: "남", dob: "1990-07-22", age: 34, phone: "010-5555-1234", lastVisit: "2026-04-22", stage: "치료대기", chief: "소화불량, 복통",    waitMins: 5,  visitType: "초진" },
    { id: 4,  name: "박지현", gender: "여", dob: "1968-02-14", age: 57, phone: "010-3344-7788", lastVisit: "2026-04-22", stage: "치료실",   chief: "불면증, 심계항진", waitMins: 22, visitType: "재진" },
    { id: 5,  name: "최동욱", gender: "남", dob: "2001-09-05", age: 23, phone: "010-7722-9900", lastVisit: "2026-04-22", stage: "수납대기", chief: "비염, 두통",        waitMins: 3,  visitType: "재진" },
    { id: 6,  name: "정유미", gender: "여", dob: "1995-03-18", age: 30, phone: "010-6611-2233", lastVisit: "2026-04-22", stage: "수납완료", chief: "생리통, 빈혈",      waitMins: 0,  visitType: "초진" },
    { id: 7,  name: "오세훈", gender: "남", dob: "1979-06-20", age: 46, phone: "010-8800-4411", lastVisit: "2026-04-22", stage: "진료대기", chief: "어깨 통증",         waitMins: 31, visitType: "재진" },
    { id: 8,  name: "윤지영", gender: "여", dob: "2000-01-11", age: 26, phone: "010-2200-8833", lastVisit: "2026-04-22", stage: "치료실",   chief: "피부 트러블",       waitMins: 14, visitType: "초진" },
    { id: 9,  name: "강민재", gender: "남", dob: "1988-11-03", age: 37, phone: "010-1122-5566", lastVisit: "2026-04-22", stage: "수납대기", chief: "무릎 통증",         waitMins: 8,  visitType: "재진" },
    { id: 10, name: "임소연", gender: "여", dob: "1993-04-25", age: 33, phone: "010-9911-3344", lastVisit: "2026-04-22", stage: "수납완료", chief: "갱년기 증상",       waitMins: 0,  visitType: "재진" },
  ];

  const STAGES = [
    { key: "예약",     icon: "calendar-clock", color: "#5A6E8A", bg: "#EEF1F6", border: "#CFD7E3", label: "예약" },
    { key: "진료대기", icon: "clock",         color: "#C4974B", bg: "#FAF2E4", border: "#F0DFC0", label: "진료 대기" },
    { key: "진료실",   icon: "stethoscope",   color: "#3A7065", bg: "#EEF8F6", border: "#B3D8D1", label: "진료 중" },
    { key: "치료대기", icon: "hourglass",     color: "#6B7E7B", bg: "#EEF4F3", border: "#D8E4E2", label: "치료 대기" },
    { key: "치료실",   icon: "activity",      color: "#4A7C6F", bg: "#EEF8F6", border: "#8DBFB3", label: "치료 중" },
    { key: "수납대기", icon: "credit-card",   color: "#9A8E82", bg: "#F5F0E8", border: "#E4DDD4", label: "수납 대기" },
    { key: "수납완료", icon: "check-circle-2",color: "#2E5C52", bg: "#D4EDE9", border: "#8DBFB3", label: "수납 완료" },
  ];
  const STAGE_BY_KEY = STAGES.reduce((a, s) => (a[s.key] = s, a), {});

  const GROUPS = [
    { key: "예약", label: "예약", icon: "calendar-clock", color: "#5A6E8A", bg: "#EEF1F6", border: "#CFD7E3", subStages: ["예약"] },
    { key: "대기", label: "대기", icon: "clock",          color: "#B5873E", bg: "#FAF2E4", border: "#F0DFC0", subStages: ["진료대기", "치료대기"] },
    { key: "치료", label: "치료", icon: "activity",       color: "#3A7065", bg: "#EAF4F1", border: "#B3D8D1", subStages: ["진료실", "치료실"] },
    { key: "수납", label: "수납", icon: "credit-card",    color: "#7A6E60", bg: "#F5F0E8", border: "#E4DDD4", subStages: ["수납대기", "수납완료"] },
  ];

  const NEXT_STAGE = {
    "예약": "진료대기", "진료대기": "진료실", "진료실": "치료대기",
    "치료대기": "치료실", "치료실": "수납대기", "수납대기": "수납완료",
  };

  function WaitChip({ mins, stage }) {
    if (stage === "수납완료") return null;
    const urgent = mins >= 20;
    return html`<span style=${{
      display: "inline-flex", alignItems: "center", gap: 3,
      fontSize: 10, fontFamily: "var(--font-mono)",
      color: urgent ? "var(--cinnabar-700)" : "var(--text-muted)",
      background: urgent ? "var(--cinnabar-100)" : "var(--stone-100)",
      border: `1px solid ${urgent ? "var(--cinnabar-200)" : "var(--border-subtle)"}`,
      borderRadius: "var(--radius-full)", padding: "1px 7px",
    }}>
      <${Icon} name="clock" size=${9} />
      ${mins}분
    </span>`;
  }

  function PatientCard({ patient, stage, onSelect, onAdvance }) {
    const [hovered, setHovered] = useState(false);
    const nextStage = NEXT_STAGE[patient.stage];
    const isDone = patient.stage === "수납완료";

    return html`<div
      onMouseEnter=${() => setHovered(true)}
      onMouseLeave=${() => setHovered(false)}
      onClick=${() => onSelect(patient)}
      style=${{
        background: hovered ? "var(--jade-50)" : "var(--bg-surface)",
        border: `1px solid ${hovered ? "var(--jade-200)" : "var(--border-subtle)"}`,
        borderRadius: "var(--radius-md)",
        padding: "10px 12px",
        cursor: "pointer",
        transition: "all 0.15s ease",
        boxShadow: hovered ? "var(--shadow-md)" : "var(--shadow-sm)",
        opacity: isDone ? 0.7 : 1,
      }}>
      <div style=${{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 6 }}>
        <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
          <${Avatar} name=${patient.name} size=${26} />
          <div>
            <div style=${{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)", lineHeight: 1.2 }}>${patient.name}</div>
            <div style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${patient.gender} · ${patient.age}세</div>
          </div>
        </div>
        <${WaitChip} mins=${patient.waitMins} stage=${patient.stage} />
      </div>

      <div style=${{ fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-sans)", marginBottom: 8, lineHeight: 1.4, paddingLeft: 34 }}>
        ${patient.chief}
      </div>

      <div style=${{ paddingLeft: 34, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style=${{ display: "flex", alignItems: "center", gap: 4 }}>
          <span style=${{
            fontSize: 10, fontWeight: 600, letterSpacing: "0.04em",
            color: patient.visitType === "초진" ? "var(--cinnabar-600)" : "var(--jade-600)",
            background: patient.visitType === "초진" ? "var(--cinnabar-100)" : "var(--jade-50)",
            border: `1px solid ${patient.visitType === "초진" ? "var(--cinnabar-200)" : "var(--jade-200)"}`,
            borderRadius: "var(--radius-full)", padding: "2px 7px",
            fontFamily: "var(--font-sans)",
          }}>${patient.visitType}</span>
          ${patient.insurance === "자보" && html`<span style=${{
            fontSize: 10, fontWeight: 700, letterSpacing: "0.04em",
            color: "#7A4F1A", background: "#FEF3C7",
            border: "1px solid #FCD34D",
            borderRadius: "var(--radius-full)", padding: "2px 7px",
            fontFamily: "var(--font-sans)",
          }}>자보</span>`}
        </div>

        ${nextStage && hovered && html`
          <button
            onClick=${e => { e.stopPropagation(); onAdvance(patient.id, nextStage); }}
            style=${{
              display: "flex", alignItems: "center", gap: 4,
              fontSize: 11, fontWeight: 500, color: "var(--jade-700)",
              background: "var(--jade-100)", border: "1px solid var(--jade-200)",
              borderRadius: "var(--radius-sm)", padding: "3px 9px",
              cursor: "pointer", fontFamily: "var(--font-sans)", transition: "all 0.12s",
            }}>
            ${nextStage} →
          </button>
        `}
        ${isDone && html`<${Icon} name="check-circle-2" size=${14} style=${{ color: "var(--jade-500)" }} />`}
      </div>
    </div>`;
  }

  function SubStageSection({ stage, patients, onSelect, onAdvance, showDivider }) {
    return html`<div>
      <div style=${{
        display: "flex", alignItems: "center", gap: 6,
        padding: "8px 12px 6px",
        borderTop: showDivider ? "1px dashed rgba(0,0,0,0.08)" : "none",
      }}>
        <${Icon} name=${stage.icon} size=${11} style=${{ color: stage.color }} />

      <div style=${{ padding: "0 10px 10px", display: "flex", flexDirection: "column", gap: 8 }}>

  function GroupColumn({ group, patients, onSelect, onAdvance }) {
    const groupTotal = patients.length;
    return html`<div style=${{

        <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
          <${Icon} name=${group.icon} size=${16} style=${{ color: group.color }} />
          <span style=${{
            fontSize: 14, fontWeight: 700, color: group.color,
            fontFamily: "var(--font-sans)", letterSpacing: "0.02em",
          }}>${group.label}</span>
        </div>
        <span style=${{
          fontSize: 11, fontWeight: 700,
          background: group.color, color: "#fff",
          borderRadius: "var(--radius-full)", minWidth: 22, height: 22,
          padding: "0 7px",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "var(--font-mono)",

      </div>

      <div style=${{ flex: 1, minHeight: 80 }}>
        ${group.subStages.map((stageKey, i) => {
          const stage = STAGE_BY_KEY[stageKey];
          const stagePatients = patients.filter(p => p.stage === stageKey);
          return html`<${SubStageSection}

            patients=${stagePatients}

  // ════════════════════════════════════════════════════════════════
  // LeftRail — Mini Calendar + Tasks
  // ════════════════════════════════════════════════════════════════

  const KO_WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const KO_MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const DAY_DENSITY = {
    3: 2, 4: 1, 5: 3, 8: 1, 10: 2, 11: 4, 12: 1, 15: 2, 17: 5, 18: 3,
    19: 2, 22: 1, 24: 3, 25: 2, 26: 4, 28: 1, 29: 2,
  };
  const SEED_TASKS = [
    { id: "t1", text: "한지민 환자 보험 청구 확인",      who: "김간호", due: "오늘 15:00", done: false, priority: "high" },
    { id: "t2", text: "재고 부족 약재 발주 (당귀, 황기)", who: "박실장", due: "오늘",       done: false, priority: "med"  },
    { id: "t3", text: "이민호 초진 차트 검토",            who: "원장",   due: "내일 09:00", done: false, priority: "med"  },
    { id: "t4", text: "정유미 처방 결과 추적 통화",       who: "김간호", due: "내일",       done: true,  priority: "low"  },
    { id: "t5", text: "주간 매출 보고서 정리",            who: "박실장", due: "금요일",     due_far: true, done: false, priority: "low" },
  ];
  const navBtnRail = {
    width: 24, height: 24, display: "inline-flex", alignItems: "center", justifyContent: "center",
    background: "transparent", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)",
    cursor: "pointer", color: "var(--text-secondary)",
  };

  function MiniCalendar() {
    const today = new Date();
    const [calView, setCalView] = useState({ y: today.getFullYear(), m: today.getMonth() });
    const [selected, setSelected] = useState(today.getDate());
    const cells = useMemo(() => {
      const first = new Date(calView.y, calView.m, 1);
      const last = new Date(calView.y, calView.m + 1, 0);
      const startWeekday = first.getDay();
      const daysInMonth = last.getDate();
      const prevMonthLast = new Date(calView.y, calView.m, 0).getDate();
      const cs = [];
      for (let i = startWeekday - 1; i >= 0; i--) cs.push({ d: prevMonthLast - i, muted: true });
      for (let d = 1; d <= daysInMonth; d++) cs.push({ d, muted: false });
      while (cs.length % 7 !== 0) cs.push({ d: cs.length - daysInMonth - startWeekday + 1, muted: true });
      return cs;
    }, [calView]);
    const isToday = (cell) => !cell.muted && cell.d === today.getDate() && calView.m === today.getMonth() && calView.y === today.getFullYear();
    const move = (delta) => {
      const m = calView.m + delta;
      if (m < 0) setCalView({ y: calView.y - 1, m: 11 });
      else if (m > 11) setCalView({ y: calView.y + 1, m: 0 });
      else setCalView({ y: calView.y, m });
    };
    return html`<div style=${{ padding: "12px 14px 14px" }}>
      <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <div style=${{ display: "flex", alignItems: "baseline", gap: 6 }}>
          <span style=${{ fontFamily: "var(--font-serif)", fontSize: 16, fontWeight: 500, color: "var(--text-primary)", letterSpacing: "-0.01em" }}>
            ${calView.y}.${String(calView.m + 1).padStart(2, "0")}
          </span>
          <span style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${KO_MONTHS[calView.m]}</span>
        </div>
        <div style=${{ display: "flex", gap: 2 }}>
          <button onClick=${() => move(-1)} style=${navBtnRail}><${Icon} name="chevron-left" size=${13} /></button>
          <button onClick=${() => { setCalView({ y: today.getFullYear(), m: today.getMonth() }); setSelected(today.getDate()); }}
            style=${{ ...navBtnRail, fontSize: 10, fontWeight: 600, color: "var(--text-secondary)", padding: "0 8px", width: "auto" }}>오늘</button>
          <button onClick=${() => move(1)} style=${navBtnRail}><${Icon} name="chevron-right" size=${13} /></button>
        </div>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", marginBottom: 4 }}>
        ${KO_WEEKDAYS.map((d, i) => html`
          <div key=${d} style=${{
            textAlign: "center", fontSize: 10, fontWeight: 600,
            color: i === 0 ? "var(--cinnabar-600)" : i === 6 ? "var(--jade-600)" : "var(--text-muted)",
            fontFamily: "var(--font-sans)", padding: "4px 0",
          }}>${d}</div>
        `)}
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
        ${cells.map((cell, i) => {
          const dow = i % 7;
          const sel = !cell.muted && cell.d === selected;
          const td = isToday(cell);
          const density = !cell.muted ? DAY_DENSITY[cell.d] || 0 : 0;
          return html`<div key=${i} onClick=${() => !cell.muted && setSelected(cell.d)}
            style=${{
              aspectRatio: "1", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              position: "relative", borderRadius: "var(--radius-sm)",
              cursor: cell.muted ? "default" : "pointer",
              background: sel ? "var(--jade-500)" : td ? "var(--jade-50)" : "transparent",
              border: td && !sel ? "1px solid var(--jade-300)" : "1px solid transparent",
              transition: "all 0.12s",
            }}>
            <span style=${{
              fontSize: 12, fontWeight: sel || td ? 600 : 400, fontFamily: "var(--font-mono)",
              color: sel ? "#fff" : cell.muted ? "var(--stone-400)" : dow === 0 ? "var(--cinnabar-600)" : dow === 6 ? "var(--jade-600)" : "var(--text-primary)",
            }}>${cell.d}</span>
            ${density > 0 && !cell.muted && html`<div style=${{ position: "absolute", bottom: 3, display: "flex", gap: 1.5 }}>
              ${Array.from({ length: Math.min(density, 3) }).map((_, k) => html`<span key=${k} style=${{ width: 3, height: 3, borderRadius: "50%", background: sel ? "rgba(255,255,255,0.85)" : "var(--jade-500)" }} />`)}
            </div>`}
          </div>`;
        })}
      </div>
      <div style=${{
        marginTop: 12, padding: "10px 12px",
        background: "var(--jade-50)", border: "1px solid var(--jade-100)", borderRadius: "var(--radius-md)",
        display: "flex", alignItems: "center", gap: 10,
      }}>
        <div style=${{ fontFamily: "var(--font-serif)", fontSize: 22, fontWeight: 500, color: "var(--jade-700)", lineHeight: 1, minWidth: 26, textAlign: "center" }}>${selected}</div>
        <div style=${{ flex: 1 }}>
          <div style=${{ fontSize: 11, fontWeight: 600, color: "var(--jade-700)", fontFamily: "var(--font-sans)" }}>예약 ${DAY_DENSITY[selected] || 0}건 · 대기 0건</div>
          <div style=${{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${KO_MONTHS[calView.m]} ${selected}일 (${KO_WEEKDAYS[new Date(calView.y, calView.m, selected).getDay()]})</div>
        </div>
        <${Icon} name="chevron-right" size=${14} style=${{ color: "var(--jade-500)" }} />
      </div>
    </div>`;
  }

  function TaskItem({ task, onToggle }) {
    const priColors = {
      high: { dot: "var(--cinnabar-600)", text: "var(--cinnabar-700)", bg: "var(--cinnabar-100)" },
      med:  { dot: "var(--amber-500)",    text: "var(--amber-700)",    bg: "var(--amber-100)" },
      low:  { dot: "var(--ink-300)",      text: "var(--text-muted)",   bg: "var(--stone-100)" },
    }[task.priority] || {};
    return html`<div style=${{
      display: "flex", gap: 9, padding: "9px 12px",
      borderBottom: "1px solid var(--stone-200)",
      opacity: task.done ? 0.55 : 1, cursor: "pointer",
    }} onClick=${() => onToggle(task.id)}>
      <div style=${{
        width: 14, height: 14, marginTop: 2, borderRadius: "var(--radius-sm)",
        border: task.done ? "1.5px solid var(--jade-500)" : "1.5px solid var(--border-default)",
        background: task.done ? "var(--jade-500)" : "transparent",
        display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
      }}>
        ${task.done && html`<${Icon} name="check" size=${9} style=${{ color: "#fff" }} />`}
      </div>
      <div style=${{ flex: 1, minWidth: 0 }}>
        <div style=${{
          fontSize: 12, fontWeight: 500, color: "var(--text-primary)",
          fontFamily: "var(--font-sans)", lineHeight: 1.4,
          textDecoration: task.done ? "line-through" : "none",
        }}>${task.text}</div>
        <div style=${{ display: "flex", alignItems: "center", gap: 7, marginTop: 4, flexWrap: "wrap" }}>
          <span style=${{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
            <${Icon} name="user" size=${9} />${task.who}
          </span>
          <span style=${{ fontSize: 10, fontFamily: "var(--font-mono)", color: task.due_far ? "var(--text-muted)" : "var(--text-secondary)", display: "inline-flex", alignItems: "center", gap: 3 }}>
            <${Icon} name="clock" size=${9} />${task.due}
          </span>
          <span style=${{
            display: "inline-flex", alignItems: "center", gap: 4,
            fontSize: 9, fontWeight: 600, color: priColors.text, background: priColors.bg,
            borderRadius: "var(--radius-full)", padding: "1px 7px", fontFamily: "var(--font-sans)",
          }}>
            <span style=${{ width: 5, height: 5, borderRadius: "50%", background: priColors.dot }} />
            ${task.priority === "high" ? "높음" : task.priority === "med" ? "보통" : "낮음"}
          </span>
        </div>
      </div>
    </div>`;
  }

  function TasksPanel() {
    const [tasks, setTasks] = useState(SEED_TASKS);
    const [filter, setFilter] = useState("open");
    const visible = tasks.filter(t => filter === "all" ? true : filter === "done" ? t.done : !t.done);
    const openCount = tasks.filter(t => !t.done).length;
    return html`<div style=${{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div style=${{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px 8px", borderBottom: "1px solid var(--border-subtle)" }}>
        <${Icon} name="clipboard-list" size=${14} style=${{ color: "var(--jade-600)" }} />
        <span style=${{ fontFamily: "var(--font-sans)", fontSize: 13, fontWeight: 600, color: "var(--text-primary)" }}>업무</span>
        <span style=${{ fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 700, color: "var(--jade-700)", background: "var(--jade-100)", borderRadius: "var(--radius-full)", padding: "1px 7px" }}>${openCount}</span>
        <button style=${{ marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 3, fontSize: 10, fontWeight: 500, color: "var(--jade-700)", background: "transparent", border: "1px solid var(--jade-200)", borderRadius: "var(--radius-sm)", padding: "2px 7px", cursor: "pointer", fontFamily: "var(--font-sans)" }}>
          <${Icon} name="plus" size=${10} />추가
        </button>
      </div>
      <div style=${{ display: "flex", gap: 4, padding: "8px 12px", borderBottom: "1px solid var(--stone-200)" }}>
        ${[{ k: "open", l: "진행 중" }, { k: "done", l: "완료" }, { k: "all", l: "전체" }].map(t => html`
          <button key=${t.k} onClick=${() => setFilter(t.k)} style=${{
            fontSize: 11, fontWeight: filter === t.k ? 600 : 400, padding: "3px 8px", borderRadius: "var(--radius-sm)",
            background: filter === t.k ? "var(--bg-surface)" : "transparent",
            border: filter === t.k ? "1px solid var(--border-subtle)" : "1px solid transparent",
            color: filter === t.k ? "var(--text-primary)" : "var(--text-muted)",
            cursor: "pointer", fontFamily: "var(--font-sans)",
          }}>${t.l}</button>

      <div style=${{ flex: 1, overflowY: "auto", minHeight: 0 }}>
        ${visible.length === 0 ? html`<div style=${{ padding: "24px 16px", textAlign: "center", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>업무가 없습니다.</div>`
          : visible.map(t => html`<${TaskItem} key=${t.id} task=${t} onToggle=${(id) => {
            setTasks(prev => prev.map(x => x.id === id ? { ...x, done: !x.done } : x));
          }} />`)}
      </div>
    </div>`;
  }

  function LeftRail() {
    return html`<div style=${{
      width: 280, flexShrink: 0,
      background: "var(--bg-surface)", borderRight: "1px solid var(--border-subtle)",
      display: "flex", flexDirection: "column", minHeight: 0,
    }}>
      <${MiniCalendar} />
      <div style=${{ height: 8, background: "var(--stone-100)", borderTop: "1px solid var(--border-subtle)", borderBottom: "1px solid var(--border-subtle)" }} />
      <${TasksPanel} />
    </div>`;
  }

  function PatientListScreen({ onSelectPatient }) {
    const [patients, setPatients] = useState(() => {
      try {
        const saved = localStorage.getItem("komes_dashboard_patients_v3");
        return saved ? JSON.parse(saved) : PATIENTS;
      } catch { return PATIENTS; }
    });

    useEffect(() => {
      localStorage.setItem("komes_dashboard_patients_v3", JSON.stringify(patients));
    }, [patients]);

    const [search, setSearch] = useState("");
    const [view, setView] = useState("board");

    const advanceStage = (id, newStage) => {
      setPatients(prev => prev.map(p => p.id === id ? { ...p, stage: newStage, waitMins: 0 } : p));
    };

    const resetPatients = () => setPatients(PATIENTS);

    const filtered = search
      ? patients.filter(p => p.name.includes(search) || p.chief.includes(search))
      : patients;

    const totalActive = patients.filter(p => p.stage !== "수납완료").length;
    const totalDone = patients.filter(p => p.stage === "수납완료").length;

    const actions = html`<${F}>
      <div style=${{ display: "flex", background: "var(--stone-200)", borderRadius: "var(--radius-md)", padding: 2, gap: 2 }}>
        ${[{ key: "board", icon: "layout-dashboard" }, { key: "list", icon: "list" }].map(v => html`
          <button key=${v.key} onClick=${() => setView(v.key)} style=${{
            display: "flex", alignItems: "center", padding: "5px 10px", borderRadius: "var(--radius-sm)",
            border: "none", cursor: "pointer", transition: "all 0.12s",
            background: view === v.key ? "var(--bg-surface)" : "transparent",
            boxShadow: view === v.key ? "var(--shadow-sm)" : "none",
            color: view === v.key ? "var(--text-primary)" : "var(--text-muted)",
          }}>

      setNewSites(""); setAdding(false);

      return {
        "all": patients.length, "active": patients.filter(p => p.status === "active").length,
        "new": patients.filter(p => p.regDate >= "2026-04-01").length,
        "dormant": patients.filter(p => p.status === "dormant").length,
        "tag:VIP": tagSet("VIP"), "tag:자보": patients.filter(p => p.insurance === "자보").length,
        "tag:알러지": tagSet("알러지"), "tag:노인": tagSet("노인"), "tag:산정특례": tagSet("산정특례"),
        "rel:any": patients.filter(p => p.relations.length > 0).length,
        "rel:none": patients.filter(p => p.relations.length === 0).length,
      };
    }, [patients]);
    const filtered = useMemo(() => {
      let list = patients;
      if (filter === "active")             list = list.filter(p => p.status === "active");
      else if (filter === "new")           list = list.filter(p => p.regDate >= "2026-04-01");
      else if (filter === "dormant")       list = list.filter(p => p.status === "dormant");
      else if (filter.startsWith("tag:")) { const tag = filter.slice(4); list = tag === "자보" ? list.filter(p => p.insurance === "자보") : list.filter(p => p.tags.includes(tag)); }
      else if (filter === "rel:any")       list = list.filter(p => p.relations.length > 0);
      else if (filter === "rel:none")      list = list.filter(p => p.relations.length === 0);
      if (search.trim()) { const q = search.trim(); list = list.filter(p => p.name.includes(q) || p.phone.includes(q) || p.chief.includes(q)); }

        if (sort === "visits") return b.visitCount - a.visitCount;

        const aV = a.lastVisit === "—" ? "0000-00-00" : a.lastVisit;

  function layoutAppts(appts) {
    if (!appts.length) return [];
    const sorted = [...appts].sort((a, b) => minsFromTime(a.start) - minsFromTime(b.start));
    const colAssign = new Array(sorted.length).fill(0);
    const colEnds = [];
    for (let i = 0; i < sorted.length; i++) {
      const s = minsFromTime(sorted[i].start);
      const e = s + sorted[i].mins;
      let c = 0;
      while (c < colEnds.length && colEnds[c] > s) c++;
      colAssign[i] = c;
      colEnds[c] = e;
    }
    return sorted.map((a, i) => {
      const s = minsFromTime(a.start);
      const e = s + a.mins;
      let maxCol = colAssign[i];
      for (let j = 0; j < sorted.length; j++) {
        if (i === j) continue;
        const s2 = minsFromTime(sorted[j].start);
        const e2 = s2 + sorted[j].mins;
        if (s < e2 && e > s2) maxCol = Math.max(maxCol, colAssign[j]);
      }
      return { ...a, col: colAssign[i], totalCols: maxCol + 1 };
    });
  }

            <span style=${{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: isToday ? 600 : 400, color: isToday ? "var(--jade-700)" : "var(--text-primary)", letterSpacing: "-0.01em" }}>${d.getDate()}</span>

        <div style=${{ display: "grid", gridTemplateColumns: "56px repeat(7, 1fr)", position: "relative" }}>
          <div>${Array.from({ length: 10 }).map((_, i) => html`<div key=${i} style=${{ height: HOUR_PX, padding: "4px 8px", borderTop: "1px solid var(--stone-200)", fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)", textAlign: "right" }}>${String(9+i).padStart(2,"0")}:00</div>`)}</div>
          ${days.map((d, di) => { const dayStr = ymd(d); const isToday = dayStr === todayStr; const dayAppts = filtered.filter(a => a.date === dayStr); return html`<div key=${di} style=${{ position: "relative", borderLeft: "1px solid var(--border-subtle)", background: isToday ? "rgba(74,124,111,0.03)" : "transparent" }}>
            ${Array.from({ length: 10 }).map((_, hi) => html`<div key=${hi} onClick=${() => onCellClick && onCellClick({ date: dayStr, start: `${String(9+hi).padStart(2,"0")}:00` })} style=${{ height: HOUR_PX, borderTop: "1px solid var(--stone-200)", cursor: "pointer", position: "relative" }}><div style=${{ position: "absolute", top: HOUR_PX/2, left: 0, right: 0, borderTop: "1px dashed var(--stone-200)" }} /></div>`)}

  function MonthView({ date, appts, onCellClick, onDayClick, onApptClick, doctorFilter }) {
    const view = { y: date.getFullYear(), m: date.getMonth() };
    const filtered = doctorFilter ? appts.filter(a => a.doctor === doctorFilter) : appts;
    const cells = useMemo(() => {
      const first = new Date(view.y, view.m, 1), last = new Date(view.y, view.m + 1, 0);
      const startWk = first.getDay(), days = last.getDate(), prevDays = new Date(view.y, view.m, 0).getDate();
      const out = [];
      for (let i = startWk - 1; i >= 0; i--) out.push({ d: new Date(view.y, view.m - 1, prevDays - i), muted: true });
      for (let dn = 1; dn <= days; dn++) out.push({ d: new Date(view.y, view.m, dn), muted: false });
      while (out.length % 7 !== 0) { const lx = out[out.length - 1].d; out.push({ d: new Date(lx.getFullYear(), lx.getMonth(), lx.getDate()+1), muted: true }); }
      return out;
    }, [view.y, view.m]);
    const todayStr = ymd(TODAY_SCH);
    return html`<div style=${{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, background: "var(--bg-surface)" }}>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", borderBottom: "1px solid var(--border-subtle)", background: "var(--stone-50)", flexShrink: 0 }}>
        ${KO_WEEKDAYS_SCH.map((w, i) => html`<div key=${w} style=${{ padding: "8px 10px", borderLeft: i > 0 ? "1px solid var(--border-subtle)" : "none", fontSize: 11, fontWeight: 700, color: i === 0 ? "var(--cinnabar-600)" : i === 6 ? "var(--jade-600)" : "var(--text-secondary)", fontFamily: "var(--font-sans)", letterSpacing: "0.04em" }}>${w}요일</div>`)}
      </div>
      <div style=${{ flex: 1, display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gridAutoRows: "1fr", overflowY: "auto" }}>
        ${cells.map((c, i) => { const dayStr = ymd(c.d); const dayAppts = filtered.filter(a => a.date === dayStr); const isToday = dayStr === todayStr; const dow = c.d.getDay(); return html`<div key=${i} onClick=${() => onDayClick && onDayClick(c.d)} style=${{ minHeight: 110, borderTop: i >= 7 ? "1px solid var(--stone-200)" : "none", borderLeft: i % 7 !== 0 ? "1px solid var(--stone-200)" : "none", background: c.muted ? "var(--stone-50)" : isToday ? "var(--jade-50)" : "var(--bg-surface)", padding: "6px 8px", cursor: c.muted ? "default" : "pointer", display: "flex", flexDirection: "column", gap: 3, opacity: c.muted ? 0.4 : 1, position: "relative" }}>
          <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style=${{ fontFamily: "var(--font-mono)", fontSize: 12, fontWeight: isToday ? 700 : 500, color: isToday ? "#fff" : dow === 0 ? "var(--cinnabar-600)" : dow === 6 ? "var(--jade-600)" : "var(--text-primary)", background: isToday ? "var(--jade-500)" : "transparent", borderRadius: "50%", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center" }}>${c.d.getDate()}</span>
            ${dayAppts.length > 0 && html`<span style=${{ fontSize: 10, fontWeight: 600, color: "var(--jade-700)", fontFamily: "var(--font-mono)" }}>${dayAppts.length}건</span>`}
          </div>
          <div style=${{ display: "flex", flexDirection: "column", gap: 2, overflow: "hidden" }}>
            ${dayAppts.slice(0, 3).map(a => { const doc = DOCTORS_SCH.find(x => x.id === a.doctor); return html`<div key=${a.id} onClick=${(e) => { e.stopPropagation(); onApptClick && onApptClick(a); }} style=${{ display: "flex", alignItems: "center", gap: 5, padding: "2px 5px", background: doc.bg, borderLeft: `2px solid ${doc.color}`, borderRadius: 2, fontSize: 10, fontFamily: "var(--font-sans)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><span style=${{ fontFamily: "var(--font-mono)", color: doc.color, fontWeight: 600, flexShrink: 0 }}>${a.start}</span><span style=${{ color: "var(--text-primary)", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis" }}>${a.patient}</span></div>`; })}
            ${dayAppts.length > 3 && html`<div style=${{ fontSize: 10, color: "var(--text-muted)", paddingLeft: 5, fontFamily: "var(--font-sans)" }}>+${dayAppts.length - 3}건 더</div>`}
          </div>
        </div>`; })}
      </div>
    </div>`;
  }

  function ApptDetail({ appt, onClose, onChangeStatus }) {
    if (!appt) return null;
    const doc = DOCTORS_SCH.find(x => x.id === appt.doctor);
    const status = STATUS_SCH[appt.status] || STATUS_SCH["확정"];
    const endMin = minsFromTime(appt.start) + appt.mins;
    return html`<div onClick=${onClose} style=${{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(17,30,28,0.3)", display: "flex", justifyContent: "flex-end" }}>

        <div style=${{ padding: "16px 20px", borderBottom: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 12, background: doc.bg, borderLeft: `4px solid ${doc.color}` }}>
          <${Avatar} name=${appt.patient} size=${40} />
          <div style=${{ flex: 1 }}>
            <div style=${{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text-primary)" }}>${appt.patient}</div>
            <div style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${appt.visit} · ${appt.insurance}</div>
          </div>
          <button onClick=${onClose} style=${{ width: 28, height: 28, borderRadius: "var(--radius-sm)", background: "rgba(255,255,255,0.6)", border: "1px solid var(--border-subtle)", cursor: "pointer", color: "var(--text-secondary)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}><${Icon} name="x" size=${15} /></button>
        </div>
        <div style=${{ flex: 1, overflowY: "auto", padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
          <div style=${detailRowSch}><${Icon} name="calendar" size=${14} style=${{ color: "var(--text-muted)" }} /><span style=${detailKeySch}>날짜</span><span style=${detailValSch}>${appt.date}</span></div>
          <div style=${detailRowSch}><${Icon} name="clock" size=${14} style=${{ color: "var(--text-muted)" }} /><span style=${detailKeySch}>시간</span><span style=${detailValSch}>${appt.start} – ${timeFromMins(endMin)} (${appt.mins}분)</span></div>
          <div style=${detailRowSch}><${Icon} name="stethoscope" size=${14} style=${{ color: "var(--text-muted)" }} /><span style=${detailKeySch}>담당의</span><span style=${detailValSch}>${doc.name} · ${doc.room}</span></div>
          <div style=${detailRowSch}><${Icon} name="file-text" size=${14} style=${{ color: "var(--text-muted)" }} /><span style=${detailKeySch}>주소증</span><span style=${detailValSch}>${appt.chief}</span></div>
          <div style=${detailRowSch}><${Icon} name="circle-dot" size=${14} style=${{ color: status.dot }} /><span style=${detailKeySch}>상태</span><span style=${{ ...detailValSch, color: status.text, background: status.bg, border: `1px solid ${status.border}`, borderRadius: "var(--radius-full)", padding: "2px 10px", fontSize: 11, fontWeight: 600 }}>${appt.status}</span></div>
          <div style=${{ marginTop: 4, padding: 12, background: "var(--stone-50)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", display: "flex", flexDirection: "column", gap: 6 }}>
            <div style=${{ fontSize: 10, fontWeight: 700, color: "var(--text-muted)", letterSpacing: "0.08em", textTransform: "uppercase", fontFamily: "var(--font-sans)" }}>상태 변경</div>
            <div style=${{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
              ${Object.keys(STATUS_SCH).map(s => { const sc = STATUS_SCH[s]; const sel = appt.status === s; return html`<button key=${s} onClick=${() => onChangeStatus && onChangeStatus(appt.id, s)} style=${{ padding: "6px 4px", borderRadius: "var(--radius-sm)", border: `1px solid ${sel ? sc.border : "var(--border-subtle)"}`, background: sel ? sc.bg : "var(--bg-surface)", color: sel ? sc.text : "var(--text-secondary)", fontSize: 11, fontWeight: sel ? 600 : 400, cursor: "pointer", fontFamily: "var(--font-sans)", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 4 }}><span style=${{ width: 6, height: 6, borderRadius: "50%", background: sc.dot }} />${s}</button>`; })}
            </div>
          </div>
        </div>
        <div style=${{ padding: 14, borderTop: "1px solid var(--border-subtle)", display: "flex", gap: 8 }}>
          <button style=${{ flex: 1, padding: "8px 12px", fontSize: 12, fontWeight: 500, background: "transparent", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", color: "var(--text-secondary)", cursor: "pointer", fontFamily: "var(--font-sans)", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 5 }}><${Icon} name="message-circle" size=${12} />SMS 발송</button>
          <button style=${{ flex: 1, padding: "8px 12px", fontSize: 12, fontWeight: 600, background: "var(--jade-500)", border: "none", borderRadius: "var(--radius-md)", color: "#fff", cursor: "pointer", fontFamily: "var(--font-sans)", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 5 }}><${Icon} name="user-check" size=${12} />접수 처리</button>
        </div>
      </div>
    </div>`;
  }

  function ScheduleScreen() {
    const [appts, setAppts] = useState(() => { try { const saved = localStorage.getItem("komes_appts_v1"); return saved ? JSON.parse(saved) : buildSeed(); } catch { return buildSeed(); } });
    useEffect(() => { localStorage.setItem("komes_appts_v1", JSON.stringify(appts)); }, [appts]);
    const [view, setView] = useState("week");
    const [date, setDate] = useState(TODAY_SCH);
    const [doctorFilter, setDoctorFilter] = useState("");
    const [showNew, setShowNew] = useState(false);
    const [newInitial, setNewInitial] = useState(null);
    const [selectedAppt, setSelectedAppt] = useState(null);
    const goPrev = () => { if (view === "day") setDate(addDaysSch(date, -1)); else if (view === "week") setDate(addDaysSch(date, -7)); else setDate(new Date(date.getFullYear(), date.getMonth() - 1, 1)); };
    const goNext = () => { if (view === "day") setDate(addDaysSch(date, 1)); else if (view === "week") setDate(addDaysSch(date, 7)); else setDate(new Date(date.getFullYear(), date.getMonth() + 1, 1)); };
    const headerLabel = (() => {
      if (view === "day") return `${date.getFullYear()}년 ${KO_MONTHS_SCH[date.getMonth()]} ${date.getDate()}일 (${KO_WEEKDAYS_SCH[date.getDay()]})`;
      if (view === "week") { const s = startOfWeekSch(date), e = addDaysSch(s, 6); return `${s.getFullYear()}년 ${s.getMonth()+1}월 ${s.getDate()}일 — ${e.getDate()}일`; }
      return `${date.getFullYear()}년 ${KO_MONTHS_SCH[date.getMonth()]}`;
    })();
    const periodAppts = (() => {
      if (view === "day") return appts.filter(a => a.date === ymd(date));
      if (view === "week") { const s = startOfWeekSch(date), e = addDaysSch(s, 6); return appts.filter(a => a.date >= ymd(s) && a.date <= ymd(e)); }
      const my = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
      return appts.filter(a => a.date.startsWith(my));
    })();
    const periodFiltered = doctorFilter ? periodAppts.filter(a => a.doctor === doctorFilter) : periodAppts;
    const newCnt = periodFiltered.filter(a => a.visit === "초진").length;
    const reCnt = periodFiltered.filter(a => a.visit === "재진").length;
    const noShowCnt = periodFiltered.filter(a => a.status === "노쇼").length;
    const onCellClick = (init) => { setNewInitial(init); setShowNew(true); };
    const onNewSubmit = (a) => { setAppts(prev => [...prev, { ...a, id: Math.max(0, ...prev.map(x => x.id)) + 1 }]); setShowNew(false); };
    const onChangeStatus = (id, status) => { setAppts(prev => prev.map(a => a.id === id ? { ...a, status } : a)); setSelectedAppt(prev => prev ? { ...prev, status } : null); };
    const schActions = html`<${F}>
      <div style=${{ display: "flex", background: "var(--stone-200)", borderRadius: "var(--radius-md)", padding: 2, gap: 2 }}>
        ${[{ key: "day", l: "일간" }, { key: "week", l: "주간" }, { key: "month", l: "월간" }].map(v => html`<button key=${v.key} onClick=${() => setView(v.key)} style=${{ padding: "5px 14px", border: "none", cursor: "pointer", borderRadius: "var(--radius-sm)", background: view === v.key ? "var(--bg-surface)" : "transparent", boxShadow: view === v.key ? "var(--shadow-sm)" : "none", color: view === v.key ? "var(--text-primary)" : "var(--text-muted)", fontWeight: view === v.key ? 600 : 400, fontSize: 12, fontFamily: "var(--font-sans)" }}>${v.l}</button>`)}
      </div>
      <${Button} variant="primary" icon="calendar-plus" onClick=${() => { setNewInitial(null); setShowNew(true); }}>새 예약</${Button}>
    </${F}>`;
    return html`<div style=${{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <${TopBar} title="예약 관리" subtitle=${`${headerLabel} · 총 ${periodFiltered.length}건 (초진 ${newCnt} · 재진 ${reCnt}${noShowCnt ? ` · 노쇼 ${noShowCnt}` : ""})`} actions=${schActions} />
      <div style=${{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
        <div style=${{ display: "flex", alignItems: "center", gap: 12, padding: "10px 24px", background: "var(--bg-surface)", borderBottom: "1px solid var(--border-subtle)", flexShrink: 0 }}>
          <div style=${{ display: "flex", alignItems: "center", gap: 4 }}>
            <button onClick=${goPrev} style=${navIconBtnSch}><${Icon} name="chevron-left" size=${16} /></button>
            <button onClick=${() => setDate(TODAY_SCH)} style=${{ padding: "5px 12px", fontSize: 12, fontWeight: 500, background: "var(--bg-surface)", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", color: "var(--text-secondary)", cursor: "pointer", fontFamily: "var(--font-sans)" }}>오늘</button>
            <button onClick=${goNext} style=${navIconBtnSch}><${Icon} name="chevron-right" size=${16} /></button>
          </div>
          <div style=${{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text-primary)", letterSpacing: "-0.01em" }}>${headerLabel}</div>
          <div style=${{ flex: 1 }} />
          <div style=${{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)", letterSpacing: "0.04em" }}>담당의</span>
            <button onClick=${() => setDoctorFilter("")} style=${{ padding: "4px 10px", fontSize: 11, fontWeight: doctorFilter === "" ? 600 : 400, background: doctorFilter === "" ? "var(--jade-500)" : "var(--bg-surface)", color: doctorFilter === "" ? "#fff" : "var(--text-secondary)", border: `1px solid ${doctorFilter === "" ? "var(--jade-500)" : "var(--border-subtle)"}`, borderRadius: "var(--radius-full)", cursor: "pointer", fontFamily: "var(--font-sans)" }}>전체</button>
            ${DOCTORS_SCH.map(doc => { const sel = doctorFilter === doc.id; return html`<button key=${doc.id} onClick=${() => setDoctorFilter(doc.id)} style=${{ padding: "4px 10px", fontSize: 11, fontWeight: sel ? 600 : 400, background: sel ? doc.bg : "var(--bg-surface)", color: sel ? doc.color : "var(--text-secondary)", border: `1px solid ${sel ? doc.color : "var(--border-subtle)"}`, borderRadius: "var(--radius-full)", cursor: "pointer", fontFamily: "var(--font-sans)", display: "inline-flex", alignItems: "center", gap: 5 }}><span style=${{ width: 6, height: 6, borderRadius: "50%", background: doc.color }} />${doc.name}</button>`; })}
          </div>
        </div>
        <div style=${{ flex: 1, minHeight: 0, padding: "0 24px 16px", display: "flex", flexDirection: "column" }}>
          <div style=${{ flex: 1, minHeight: 0, marginTop: 16, background: "var(--bg-surface)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)", overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "var(--shadow-sm)" }}>
            ${view === "day"   && html`<${DayView}   date=${date} appts=${appts} onCellClick=${onCellClick} onApptClick=${setSelectedAppt} doctorFilter=${doctorFilter} />`}
            ${view === "week"  && html`<${WeekView}  date=${date} appts=${appts} onCellClick=${onCellClick} onApptClick=${setSelectedAppt} doctorFilter=${doctorFilter} />`}
            ${view === "month" && html`<${MonthView} date=${date} appts=${appts} onApptClick=${setSelectedAppt} onDayClick=${(d) => { setDate(d); setView("day"); }} doctorFilter=${doctorFilter} />`}
          </div>
          <div style=${{ display: "flex", gap: 14, padding: "10px 4px", flexShrink: 0 }}>
            ${Object.keys(STATUS_SCH).map(s => { const sc = STATUS_SCH[s]; return html`<div key=${s} style=${{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style=${{ width: 8, height: 8, borderRadius: "50%", background: sc.dot }} /><span style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${s}</span></div>`; })}
            <div style=${{ width: 1, height: 14, background: "var(--border-subtle)" }} />
            ${DOCTORS_SCH.map(doc => html`<div key=${doc.id} style=${{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style=${{ width: 10, height: 10, borderRadius: 2, background: doc.bg, border: `2px solid ${doc.color}` }} /><span style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${doc.name}</span></div>`)}
          </div>
        </div>
      </div>
      ${showNew && html`<${NewAppointmentModal} initial=${newInitial} onClose=${() => setShowNew(false)} onSubmit=${onNewSubmit} />`}
      ${selectedAppt && html`<${ApptDetail} appt=${selectedAppt} onClose=${() => setSelectedAppt(null)} onChangeStatus=${onChangeStatus} />`}
    </div>`;
  }

  // PaymentScreen
  // ════════════════════════════════════════════════════════════════

                  <span style=${{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", minWidth: 24 }}>${selected.discountType === "percent" ? "%" : "원"}</span>
                </div>`}
                ${amounts.discount > 0 && html`<div style=${{ display: "flex", justifyContent: "space-between", paddingTop: 6, borderTop: "1px dashed var(--border-default)" }}><span style=${{ fontSize: 12, color: "var(--cinnabar-700)", fontFamily: "var(--font-sans)" }}>할인액</span><span style=${{ fontSize: 13, fontWeight: 600, color: "var(--cinnabar-700)", fontFamily: "var(--font-mono)" }}>-${KRW(amounts.discount)}</span></div>`}
              </div>
            </div>
            <div style=${{ background: "var(--jade-50)", border: "1.5px solid var(--jade-300)", borderRadius: "var(--radius-lg)", padding: "14px 16px" }}>
              <div style=${{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                <span style=${{ fontSize: 13, fontWeight: 600, color: "var(--jade-700)", fontFamily: "var(--font-sans)" }}>최종 수납액</span>
                <span style=${{ fontSize: 26, fontWeight: 700, color: "var(--jade-800)", fontFamily: "var(--font-serif)", letterSpacing: "-0.02em" }}>${KRW(amounts.net)}</span>
              </div>
              ${selected.status === "완료" && html`<div style=${{ marginTop: 8, fontSize: 11, color: "var(--jade-700)", fontFamily: "var(--font-sans)", display: "flex", alignItems: "center", gap: 5 }}><${Icon} name="check-circle-2" size=${12} />${selected.paidAt}에 ${selected.paidBy}로 수납 완료</div>`}
            </div>
            ${selected.status === "대기"
              ? html`<div style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <div style=${{ fontSize: 10, fontWeight: 700, color: "var(--text-muted)", letterSpacing: "0.08em", textTransform: "uppercase", fontFamily: "var(--font-sans)", display: "flex", alignItems: "center", gap: 6 }}><${Icon} name="wallet" size=${12} />결제 수단</div>
                  <${PayMethodBtn} icon="credit-card" label="카드 결제" hint="신용·체크카드 단말기 연동" primary=${true} onClick=${() => setConfirmMethod("카드")} />
                  <${PayMethodBtn} icon="banknote" label="현금" hint="현금 영수증 발행 가능" onClick=${() => setConfirmMethod("현금")} />
                  <${PayMethodBtn} icon="repeat" label="계좌 이체" hint="실시간 입금 확인" onClick=${() => setConfirmMethod("이체")} />
                  <${PayMethodBtn} icon="layers" label="복합 결제" hint="카드 + 현금 분할 결제" onClick=${() => setConfirmMethod("복합")} />
                </div>`
              : html`<div style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <button style=${completedActionBtn}><${Icon} name="rotate-ccw" size=${14} />수납 취소</button>
                  <button style=${{ ...completedActionBtn, background: "var(--jade-500)", color: "#fff", border: "none" }}><${Icon} name="printer" size=${14} />영수증 출력</button>
                </div>`}
          </div>
        </div>`}
      </div>
      ${confirmMethod && selected && html`<div onClick=${() => setConfirmMethod(null)} style=${{ position: "fixed", inset: 0, zIndex: 100, background: "var(--bg-overlay)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div onClick=${e => e.stopPropagation()} style=${{ width: 380, background: "var(--bg-surface)", borderRadius: "var(--radius-xl)", overflow: "hidden", boxShadow: "var(--shadow-xl)" }}>
          <div style=${{ padding: "18px 22px", borderBottom: "1px solid var(--border-subtle)" }}>
            <div style=${{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text-primary)" }}>${confirmMethod} 결제 확인</div>
            <div style=${{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginTop: 4 }}>아래 금액을 ${confirmMethod}(으)로 수납 처리합니다.</div>
          </div>
          <div style=${{ padding: 22, display: "flex", flexDirection: "column", gap: 12 }}>
            <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between" }}><span style=${{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>환자</span><span style=${{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)" }}>${selected.name} (${selected.chartNo})</span></div>
            <div style=${{ background: "var(--jade-50)", border: "1px solid var(--jade-200)", borderRadius: "var(--radius-md)", padding: "14px 16px", display: "flex", alignItems: "baseline", justifyContent: "space-between" }}><span style=${{ fontSize: 13, color: "var(--jade-700)", fontWeight: 600 }}>수납 금액</span><span style=${{ fontSize: 24, fontWeight: 700, color: "var(--jade-800)", fontFamily: "var(--font-serif)", letterSpacing: "-0.02em" }}>${KRW(amounts.net)}</span></div>
            ${confirmMethod === "현금" && html`<label style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}><input type="checkbox" defaultChecked=${true} style=${{ accentColor: "var(--jade-500)" }} />현금영수증 발행 (소득공제용)</label>`}
          </div>
          <div style=${{ padding: 14, borderTop: "1px solid var(--border-subtle)", display: "flex", gap: 8, justifyContent: "flex-end" }}>
            <button onClick=${() => setConfirmMethod(null)} style=${{ padding: "8px 16px", fontSize: 13, fontWeight: 500, background: "transparent", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", color: "var(--text-secondary)", cursor: "pointer", fontFamily: "var(--font-sans)" }}>취소</button>
            <button onClick=${() => handlePay(confirmMethod)} style=${{ padding: "8px 18px", fontSize: 13, fontWeight: 600, background: "var(--jade-500)", border: "none", borderRadius: "var(--radius-md)", color: "#fff", cursor: "pointer", fontFamily: "var(--font-sans)", display: "inline-flex", alignItems: "center", gap: 6, boxShadow: "var(--shadow-sm)" }}><${Icon} name="check" size=${13} />${KRW(amounts.net)} 수납 완료</button>
          </div>
        </div>
      </div>`}
    </div>`;
  }

  // ════════════════════════════════════════════════════════════════
  // App
  // ════════════════════════════════════════════════════════════════

  const SCREENS = { patients: "patients", chart: "chart", prescribe: "prescribe" };

  function PlaceholderScreen({ title }) {
    return html`<div style=${{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <${TopBar} title=${title} />
      <div style=${{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12 }}>
        <${Icon} name="construction" size=${32} style=${{ color: "var(--text-muted)" }} />
        <div style=${{ fontSize: 14, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>이 화면은 준비 중입니다</div>
      </div>
    </div>`;
  }

  function App() {
    const [nav, setNav] = useState(() => localStorage.getItem("komes_nav") || "patients");
    const [selectedPatient, setSelectedPatient] = useState(null);
    const [screen, setScreen] = useState(() => localStorage.getItem("komes_screen") || SCREENS.patients);

    useEffect(() => { localStorage.setItem("komes_nav", nav); }, [nav]);
    useEffect(() => { localStorage.setItem("komes_screen", screen); }, [screen]);

    const handleSelectPatient = (p) => {
      setSelectedPatient(p);
      setScreen(SCREENS.chart);
      setNav("chart");
    };

    const handlePrescribe = () => setScreen(SCREENS.prescribe);

    const handleNavBack = () => {
      if (screen === SCREENS.prescribe) { setScreen(SCREENS.chart); setNav("chart"); }
      else { setScreen(SCREENS.patients); setNav("patients"); setSelectedPatient(null); }
    };

    const renderMain = () => {
      if (nav === "patients") {
        return html`<${PatientListScreen} onSelectPatient=${handleSelectPatient} />`;
      }
      if (nav === "chart") {
        if (screen === SCREENS.prescribe && selectedPatient) {
          return html`<${PrescriptionScreen} patient=${selectedPatient} onBack=${handleNavBack} />`;
        }
        return html`<${PatientChartScreen} patient=${selectedPatient} onBack=${handleNavBack} onPrescribe=${handlePrescribe} />`;
      }
      if (nav === "registry") {
        return html`<${PatientManagementScreen} onOpenChart=${handleSelectPatient} />`;
      }
      if (nav === "schedule") {
        return html`<${ScheduleScreen} />`;
      }
      if (nav === "payment") {
        return html`<${PaymentScreen} />`;
      }
      const labels = {
        prescriptions: "처방 관리", inventory: "약재 재고",
        stats: "통계", ai: "AI 분석", settings: "설정"
      };
      return html`<${PlaceholderScreen} title=${labels[nav] || nav} />`;
    };

    const handleNavigate = (key) => {
      setNav(key);
      if (key === "patients") setScreen(SCREENS.patients);
      if (key === "chart") setScreen(SCREENS.chart);
    };

    return html`<div style=${{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <${Sidebar} activeScreen=${nav} onNavigate=${handleNavigate} />
      <div style=${{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        ${renderMain()}
      </div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>

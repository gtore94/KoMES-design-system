<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoMES — UI Kit (Standalone)</title>

<!-- ============================================================
     KoMES Design System — Colors & Typography (inlined)
     ============================================================ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink-900: #111E1C; --ink-800: #1C2B2B; --ink-700: #2A3C3A; --ink-600: #3A4F4C;
  --ink-500: #4A5E5B; --ink-400: #6B7E7B; --ink-300: #8A9E9A; --ink-200: #B5C5C2;
  --ink-100: #D8E4E2; --ink-50:  #EEF4F3;

  --jade-900: #1A3C34; --jade-800: #2A5548; --jade-700: #2E5C52; --jade-600: #3A7065;
  --jade-500: #4A7C6F; --jade-400: #6B9E90; --jade-300: #8DBFB3; --jade-200: #B3D8D1;
  --jade-100: #D4EDE9; --jade-50:  #EEF8F6;

  --stone-900: #5C5248; --stone-800: #7A6E62; --stone-700: #9A8E82; --stone-600: #B8AFA4;
  --stone-500: #CEC6BC; --stone-400: #D8D0C4; --stone-300: #E4DDD4; --stone-200: #EDE7D9;
  --stone-100: #F5F0E8; --stone-50:  #FDFAF5;

  --cinnabar-900: #6B1A14; --cinnabar-800: #922420; --cinnabar-700: #B03028;
  --cinnabar-600: #C4594B; --cinnabar-500: #D4756A; --cinnabar-400: #E09690;
  --cinnabar-300: #EBB8B3; --cinnabar-200: #F3D4D1; --cinnabar-100: #FAEDEC;

  --amber-700: #8C5A1A; --amber-600: #B47A28; --amber-500: #C4974B; --amber-400: #D4AE78;
  --amber-200: #F0DFC0; --amber-100: #FAF2E4;

  --bg-page: var(--stone-50); --bg-surface: #FFFFFF;
  --bg-raised: var(--stone-100); --bg-sunken: var(--stone-200);
  --bg-overlay: rgba(17, 30, 28, 0.48);

  --text-primary: var(--ink-800); --text-secondary: var(--ink-500);
  --text-muted: var(--ink-300); --text-disabled: var(--ink-200);
  --text-inverse: var(--stone-50); --text-brand: var(--jade-700);
  --text-danger: var(--cinnabar-600); --text-warning: var(--amber-600);

  --border-subtle: var(--stone-300); --border-default: var(--stone-400);
  --border-strong: var(--ink-200); --border-brand: var(--jade-500);
  --border-danger: var(--cinnabar-400);

  --brand: var(--jade-500); --brand-hover: var(--jade-600);
  --brand-active: var(--jade-700); --brand-subtle: var(--jade-50);
  --brand-muted: var(--jade-100);

  --status-success-bg: var(--jade-50); --status-success-text: var(--jade-700); --status-success-border: var(--jade-200);
  --status-warning-bg: var(--amber-100); --status-warning-text: var(--amber-700); --status-warning-border: var(--amber-200);
  --status-danger-bg: var(--cinnabar-100); --status-danger-text: var(--cinnabar-700); --status-danger-border: var(--cinnabar-200);
  --status-neutral-bg: var(--stone-100); --status-neutral-text: var(--ink-600); --status-neutral-border: var(--stone-300);

  --shadow-sm:  0 1px 2px rgba(17, 30, 28, 0.06), 0 1px 4px rgba(17, 30, 28, 0.04);
  --shadow-md:  0 2px 8px rgba(17, 30, 28, 0.08), 0 1px 3px rgba(17, 30, 28, 0.05);
  --shadow-lg:  0 4px 16px rgba(17, 30, 28, 0.10), 0 2px 6px rgba(17, 30, 28, 0.06);
  --shadow-xl:  0 8px 32px rgba(17, 30, 28, 0.12), 0 4px 12px rgba(17, 30, 28, 0.07);

  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;

  --font-serif: 'Noto Serif KR', 'Georgia', serif;
  --font-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: var(--font-sans);
  background-color: var(--bg-page);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
</style>

<!-- React production builds + htm (no Babel) -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";
  const { useState, useRef, useEffect } = React;
  const html = htm.bind(React.createElement);
  const F = React.Fragment;

  // ════════════════════════════════════════════════════════════════
  // Shared Components
  // ════════════════════════════════════════════════════════════════

  function Icon({ name, size = 16, style = {}, className = "" }) {
    const ref = useRef(null);
    useEffect(() => {
      if (ref.current && window.lucide) window.lucide.createIcons({ nodes: [ref.current] });
    }, [name]);
    return html`<span ref=${ref} style=${{ display: "inline-flex", alignItems: "center", ...style }} className=${className}>
      <i data-lucide=${name} style=${{ width: size, height: size }}></i>
    </span>`;
  }

  function Avatar({ name, size = 28 }) {
    const char = name ? name[0] : "?";
    return html`<div style=${{
      width: size, height: size, borderRadius: "50%",
      background: "var(--jade-200)", color: "var(--jade-700)",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: size * 0.42, fontWeight: 600, flexShrink: 0,
      fontFamily: "var(--font-sans)"
    }}>${char}</div>`;
  }

  function Badge({ variant = "neutral", children }) {
    const styles = {
      success: { background: "var(--status-success-bg)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)" },
      warning: { background: "var(--status-warning-bg)", color: "var(--status-warning-text)", border: "1px solid var(--status-warning-border)" },
      danger:  { background: "var(--status-danger-bg)",  color: "var(--status-danger-text)",  border: "1px solid var(--status-danger-border)" },
      neutral: { background: "var(--status-neutral-bg)", color: "var(--status-neutral-text)", border: "1px solid var(--status-neutral-border)" },
      brand:   { background: "var(--jade-50)", color: "var(--jade-700)", border: "1px solid var(--jade-200)" },
    };
    return html`<span style=${{
      display: "inline-flex", alignItems: "center", gap: 4,
      fontSize: 11, fontWeight: 500, padding: "2px 8px",
      borderRadius: "var(--radius-full)", ...styles[variant],
      fontFamily: "var(--font-sans)"
    }}>${children}</span>`;
  }

  function Button({ variant = "primary", size = "md", onClick, children, disabled, icon }) {
    const base = {
      display: "inline-flex", alignItems: "center", gap: 6,
      fontFamily: "var(--font-sans)", fontWeight: 500, border: "none",
      cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1,
      transition: "all 0.12s ease", letterSpacing: "0.01em", whiteSpace: "nowrap"
    };
    const sizes = {
      sm: { fontSize: 11, padding: "5px 11px", borderRadius: "var(--radius-sm)" },
      md: { fontSize: 13, padding: "8px 16px", borderRadius: "var(--radius-md)" },
    };
    const variants = {
      primary:   { background: "var(--jade-500)", color: "white", boxShadow: "var(--shadow-sm)" },
      secondary: { background: "var(--bg-surface)", color: "var(--text-primary)", border: "1px solid var(--border-default)", boxShadow: "var(--shadow-sm)" },
      ghost:     { background: "transparent", color: "var(--jade-700)" },
      danger:    { background: "var(--cinnabar-600)", color: "white" },
    };
    return html`<button onClick=${onClick} disabled=${disabled} style=${{ ...base, ...sizes[size], ...variants[variant] }}>
      ${icon && html`<${Icon} name=${icon} size=${13} />`}
      ${children}
    </button>`;
  }

  function Input({ label, value, onChange, placeholder, type = "text", hint, error, icon }) {
    const [focused, setFocused] = useState(false);
    return html`<div style=${{ display: "flex", flexDirection: "column", gap: 4 }}>
      ${label && html`<label style=${{ fontSize: 12, fontWeight: 500, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>${label}</label>`}
      <div style=${{ position: "relative" }}>
        ${icon && html`<span style=${{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-muted)", display: "flex" }}>
          <${Icon} name=${icon} size=${14} />
        </span>`}
        <input type=${type} value=${value} onChange=${e => onChange && onChange(e.target.value)}
          placeholder=${placeholder}
          onFocus=${() => setFocused(true)} onBlur=${() => setFocused(false)}
          style=${{
            fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-primary)",
            background: "var(--bg-surface)", border: `1px solid ${error ? "var(--border-danger)" : focused ? "var(--border-brand)" : "var(--border-default)"}`,
            borderRadius: "var(--radius-md)", padding: icon ? "7px 10px 7px 30px" : "7px 10px",
            outline: "none", width: "100%", boxShadow: focused ? "0 0 0 3px var(--jade-100)" : "none",
            transition: "all 0.12s ease", boxSizing: "border-box"
          }} />
      </div>
      ${error && html`<span style=${{ fontSize: 11, color: "var(--text-danger)", fontFamily: "var(--font-sans)" }}>${error}</span>`}
      ${hint && !error && html`<span style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${hint}</span>`}
    </div>`;
  }

  function Sidebar({ activeScreen, onNavigate }) {
    const navGroups = [
      { label: "진료", items: [
        { key: "patients", icon: "layout-dashboard", label: "진료 현황" },
        { key: "registry", icon: "users",            label: "환자 관리" },
        { key: "schedule", icon: "calendar",          label: "예약 관리" },
        { key: "payment",  icon: "credit-card",       label: "수납" },
      ]},
      { label: "청구", items: [
        { key: "claim",    icon: "file-text",         label: "보험 청구" },
      ]},
      { label: "처방", items: [
        { key: "prescriptions", icon: "flask-conical", label: "처방 관리" },
        { key: "inventory",     icon: "package",        label: "약재 재고" },
      ]},
      { label: "분석", items: [
        { key: "stats", icon: "bar-chart-2", label: "통계" },
        { key: "ai",    icon: "sparkles",    label: "AI 분석" },
      ]},
    ];

    const s = {
      root: { width: 220, background: "var(--ink-800)", display: "flex", flexDirection: "column", flexShrink: 0, height: "100%" },
      logo: { display: "flex", alignItems: "center", gap: 10, padding: "14px 14px 12px", borderBottom: "1px solid rgba(255,255,255,0.08)" },
      mark: { width: 30, height: 30, background: "var(--jade-500)", borderRadius: "var(--radius-sm)", display: "flex", alignItems: "center", justifyContent: "center" },
      markLetter: { fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 600, color: "white" },
      brandName: { fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 400, color: "var(--stone-50)", letterSpacing: "-0.01em" },
      section: { padding: "10px 8px 2px" },
      sectionLabel: { fontSize: 9, fontWeight: 700, letterSpacing: "0.1em", color: "var(--ink-300)", textTransform: "uppercase", padding: "0 6px", marginBottom: 3 },
      footer: { marginTop: "auto", padding: "10px 8px", borderTop: "1px solid rgba(255,255,255,0.08)" },
    };

    return html`<div style=${s.root}>
      <div style=${s.logo}>
        <div style=${s.mark}><span style=${s.markLetter}>K</span></div>
        <span style=${s.brandName}>KoMES</span>
      </div>
      ${navGroups.map(g => html`
        <div key=${g.label} style=${s.section}>
          <div style=${s.sectionLabel}>${g.label}</div>
          ${g.items.map(item => html`
            <div key=${item.key} onClick=${() => onNavigate(item.key)}
              style=${{
                display: "flex", alignItems: "center", gap: 8, padding: "7px 8px",
                borderRadius: "var(--radius-md)", cursor: "pointer",
                background: activeScreen === item.key ? "var(--jade-600)" : "transparent",
                color: activeScreen === item.key ? "white" : "var(--ink-200)",
                fontSize: 13, fontWeight: activeScreen === item.key ? 500 : 400,
                transition: "all 0.12s ease", fontFamily: "var(--font-sans)",
              }}>
              <${Icon} name=${item.icon} size=${15} />
              ${item.label}
            </div>
          `)}
        </div>
      `)}
      <div style=${s.section}>
        <div onClick=${() => onNavigate("settings")} style=${{
          display: "flex", alignItems: "center", gap: 8, padding: "7px 8px",
          borderRadius: "var(--radius-md)", cursor: "pointer",
          background: activeScreen === "settings" ? "var(--jade-600)" : "transparent",
          color: "var(--ink-200)", fontSize: 13, fontFamily: "var(--font-sans)",
        }}>
          <${Icon} name="settings" size=${15} />설정
        </div>
      </div>
      <div style=${s.footer}>
        <div style=${{ display: "flex", alignItems: "center", gap: 8, padding: "6px 6px", borderRadius: "var(--radius-md)", cursor: "pointer" }}>
          <${Avatar} name="김" size=${26} />
          <div>
            <div style=${{ fontSize: 12, color: "var(--stone-100)", fontWeight: 500, fontFamily: "var(--font-sans)" }}>김민준</div>
            <div style=${{ fontSize: 10, color: "var(--ink-300)", fontFamily: "var(--font-sans)" }}>원장</div>
          </div>
          <${Icon} name="chevrons-up-down" size=${13} style=${{ marginLeft: "auto", color: "var(--ink-300)" }} />
        </div>
      </div>
    </div>`;
  }

  function TopBar({ title, subtitle, actions }) {
    return html`<div style=${{
      height: 54, background: "var(--bg-surface)", borderBottom: "1px solid var(--border-subtle)",
      display: "flex", alignItems: "center", padding: "0 24px", gap: 12, flexShrink: 0
    }}>
      <div style=${{ flex: 1 }}>
        <div style=${{ fontSize: 15, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>${title}</div>
        ${subtitle && html`<div style=${{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>${subtitle}</div>`}
      </div>
      <div style=${{ display: "flex", gap: 8, alignItems: "center" }}>
        ${actions}
        <div style=${{ width: 1, height: 20, background: "var(--border-subtle)", margin: "0 4px" }}></div>
        <${Icon} name="bell" size=${17} style=${{ color: "var(--text-muted)", cursor: "pointer" }} />
      </div>
    </div>`;
  }

  // ════════════════════════════════════════════════════════════════
  // PatientListScreen
  // ════════════════════════════════════════════════════════════════

  const PATIENTS = [
    { id: 11, name: "한지민", gender: "여", dob: "1991-08-14", age: 34, phone: "010-4455-1100", lastVisit: "2026-04-15", stage: "예약",     chief: "어지러움 (10:30)",   waitMins: 0,  visitType: "재진" },
    { id: 12, name: "장우성", gender: "남", dob: "1983-12-02", age: 42, phone: "010-7711-9922", lastVisit: "—",         stage: "예약",     chief: "허리 통증 (11:00)", waitMins: 0,  visitType: "초진" },
    { id: 1,  name: "홍길동", gender: "남", dob: "1985-04-12", age: 40, phone: "010-1234-5678", lastVisit: "2026-04-22", stage: "진료대기", chief: "두통, 어지러움",     waitMins: 18, visitType: "재진" },
    { id: 2,  name: "김수진", gender: "여", dob: "1972-11-30", age: 52, phone: "010-9876-5432", lastVisit: "2026-04-22", stage: "진료실",   chief: "요통, 피로감",     waitMins: 7,  visitType: "재진" },
    { id: 3,  name: "이민호", gender: "남", dob: "1990-07-22", age: 34, phone: "010-5555-1234", lastVisit: "2026-04-22", stage: "치료대기", chief: "소화불량, 복통",    waitMins: 5,  visitType: "초진" },
    { id: 4,  name: "박지현", gender: "여", dob: "1968-02-14", age: 57, phone: "010-3344-7788", lastVisit: "2026-04-22", stage: "치료실",   chief: "불면증, 심계항진", waitMins: 22, visitType: "재진" },
    { id: 5,  name: "최동욱", gender: "남", dob: "2001-09-05", age: 23, phone: "010-7722-9900", lastVisit: "2026-04-22", stage: "수납대기", chief: "비염, 두통",        waitMins: 3,  visitType: "재진" },
    { id: 6,  name: "정유미", gender: "여", dob: "1995-03-18", age: 30, phone: "010-6611-2233", lastVisit: "2026-04-22", stage: "수납완료", chief: "생리통, 빈혈",      waitMins: 0,  visitType: "초진" },
    { id: 7,  name: "오세훈", gender: "남", dob: "1979-06-20", age: 46, phone: "010-8800-4411", lastVisit: "2026-04-22", stage: "진료대기", chief: "어깨 통증",         waitMins: 31, visitType: "재진" },
    { id: 8,  name: "윤지영", gender: "여", dob: "2000-01-11", age: 26, phone: "010-2200-8833", lastVisit: "2026-04-22", stage: "치료실",   chief: "피부 트러블",       waitMins: 14, visitType: "초진" },
    { id: 9,  name: "강민재", gender: "남", dob: "1988-11-03", age: 37, phone: "010-1122-5566", lastVisit: "2026-04-22", stage: "수납대기", chief: "무릎 통증",         waitMins: 8,  visitType: "재진" },
    { id: 10, name: "임소연", gender: "여", dob: "1993-04-25", age: 33, phone: "010-9911-3344", lastVisit: "2026-04-22", stage: "수납완료", chief: "갱년기 증상",       waitMins: 0,  visitType: "재진" },
  ];

  const STAGES = [
    { key: "예약",     icon: "calendar-clock", color: "#5A6E8A", bg: "#EEF1F6", border: "#CFD7E3", label: "예약" },
    { key: "진료대기", icon: "clock",         color: "#C4974B", bg: "#FAF2E4", border: "#F0DFC0", label: "진료 대기" },
    { key: "진료실",   icon: "stethoscope",   color: "#3A7065", bg: "#EEF8F6", border: "#B3D8D1", label: "진료 중" },
    { key: "치료대기", icon: "hourglass",     color: "#6B7E7B", bg: "#EEF4F3", border: "#D8E4E2", label: "치료 대기" },
    { key: "치료실",   icon: "activity",      color: "#4A7C6F", bg: "#EEF8F6", border: "#8DBFB3", label: "치료 중" },
    { key: "수납대기", icon: "credit-card",   color: "#9A8E82", bg: "#F5F0E8", border: "#E4DDD4", label: "수납 대기" },
    { key: "수납완료", icon: "check-circle-2",color: "#2E5C52", bg: "#D4EDE9", border: "#8DBFB3", label: "수납 완료" },
  ];
  const STAGE_BY_KEY = STAGES.reduce((a, s) => (a[s.key] = s, a), {});

  const GROUPS = [
    { key: "예약", label: "예약", icon: "calendar-clock", color: "#5A6E8A", bg: "#EEF1F6", border: "#CFD7E3", subStages: ["예약"] },
    { key: "대기", label: "대기", icon: "clock",          color: "#B5873E", bg: "#FAF2E4", border: "#F0DFC0", subStages: ["진료대기", "치료대기"] },
    { key: "치료", label: "치료", icon: "activity",       color: "#3A7065", bg: "#EAF4F1", border: "#B3D8D1", subStages: ["진료실", "치료실"] },
    { key: "수납", label: "수납", icon: "credit-card",    color: "#7A6E60", bg: "#F5F0E8", border: "#E4DDD4", subStages: ["수납대기", "수납완료"] },
  ];

  const NEXT_STAGE = {
    "예약": "진료대기", "진료대기": "진료실", "진료실": "치료대기",
    "치료대기": "치료실", "치료실": "수납대기", "수납대기": "수납완료",
  };

  function WaitChip({ mins, stage }) {
    if (stage === "수납완료") return null;
    const urgent = mins >= 20;
    return html`<span style=${{
      display: "inline-flex", alignItems: "center", gap: 3,
      fontSize: 10, fontFamily: "var(--font-mono)",
      color: urgent ? "var(--cinnabar-700)" : "var(--text-muted)",
      background: urgent ? "var(--cinnabar-100)" : "var(--stone-100)",
      border: `1px solid ${urgent ? "var(--cinnabar-200)" : "var(--border-subtle)"}`,
      borderRadius: "var(--radius-full)", padding: "1px 7px",
    }}>
      <${Icon} name="clock" size=${9} />
      ${mins}분
    </span>`;
  }

  function SoapBlock({ data, editable }) {
    const [vals, setVals] = useState(data);

      { key: "o", label: "O 객관적 소견",    rows: 3 },
      { key: "a", label: "A 진단",           rows: 2 },
      { key: "p", label: "P 치료 계획",      rows: 2 },
    ];
    return html`<div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
      ${fields.map(f => html`<div key=${f.key}>
        <div style=${{ fontSize: 10, fontWeight: 700, letterSpacing: "0.07em", color: "var(--text-muted)", textTransform: "uppercase", marginBottom: 4, fontFamily: "var(--font-sans)" }}>${f.label}</div>
        ${editable
          ? html`<textarea value=${vals[f.key]} onChange=${e => { const v = e.target.value; setVals(prev => ({ ...prev, [f.key]: v })); }}
              rows=${f.rows} style=${{ width: "100%", fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-primary)", background: "var(--stone-50)", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", padding: "7px 10px", outline: "none", resize: "vertical", lineHeight: 1.6, boxSizing: "border-box" }} />`
          : html`<div style=${{ fontSize: 13, color: "var(--text-primary)", lineHeight: 1.7, fontFamily: "var(--font-sans)", whiteSpace: "pre-line" }}>${vals[f.key]}</div>`

    const list = []; let n = 1;

      list.push({ id: `H${String(n).padStart(5,"0")}`, seq: String(n).padStart(5,"0"), type:"health",

            <div style=${{ fontSize:13, fontWeight:600, color: isActive ? "var(--text-primary)" : "var(--text-secondary)", lineHeight:1.2 }}>${t.label}</div>
            <div style=${{ fontSize:10, color:"var(--text-muted)", marginTop:2, lineHeight:1.2 }}>${t.sublabel}</div>
          </div>
          <span style=${{ fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:"var(--radius-full)",
            background: isActive ? t.pillColor : "var(--stone-200)",
            color: isActive ? "#fff" : "var(--text-muted)",
            fontFamily:"var(--font-mono)", marginLeft:4 }}>${counts[t.key]}</span>
        </button>`;
      })}
      <div style=${{ flex:1 }}></div>
    </div>`;
  }

  function ClaimLabel({ children }) {
    return html`<div style=${{ fontSize:11, fontWeight:600, color:"var(--text-secondary)", fontFamily:"var(--font-sans)", marginBottom:6, letterSpacing:"0.02em" }}>${children}</div>`;
  }

  function ClaimSumLine({ label, children, bold }) {
    return html`<div style=${{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"4px 0", borderBottom: bold ? "1px dashed var(--stone-300)" : "none", fontSize:12 }}>
      <span style=${{ color: bold ? "var(--text-primary)" : "var(--text-secondary)", fontWeight: bold ? 600 : 400, fontFamily:"var(--font-sans)" }}>${label}</span>
      <span style=${{ fontFamily:"var(--font-mono)", color:"var(--text-primary)", fontSize:12 }}>${children}</span>
    </div>`;
  }

  function ClaimRadioRow({ checked, onClick, children }) {
    return html`<div onClick=${onClick} style=${{
      display:"flex", alignItems:"center", gap:6, padding:"6px 8px", borderRadius:"var(--radius-sm)",
      background: checked ? "var(--jade-50)" : "transparent",
      border: `1px solid ${checked ? "var(--jade-200)" : "transparent"}`,
      cursor:"pointer", transition:"all 0.12s",
    }}>
      <span style=${{ width:14, height:14, borderRadius:"50%",
        border: `2px solid ${checked ? "var(--jade-500)" : "var(--border-default)"}`,
        background:"var(--bg-surface)", flexShrink:0,
        display:"flex", alignItems:"center", justifyContent:"center" }}>
        ${checked && html`<span style=${{ width:6, height:6, borderRadius:"50%", background:"var(--jade-500)" }}></span>`}
      </span>
      <div style=${{ flex:1, display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--text-primary)" }}>${children}</div>
    </div>`;
  }

  const claimPillBtn = (active) => ({
    flex:1, padding:"6px 8px", fontSize:12, fontWeight:500,
    background: active ? "var(--jade-500)" : "var(--bg-surface)",
    color: active ? "#fff" : "var(--text-secondary)",
    border: `1px solid ${active ? "var(--jade-500)" : "var(--border-default)"}`,
    borderRadius:"var(--radius-sm)", cursor:"pointer", fontFamily:"var(--font-sans)", transition:"all 0.12s",
  });
  const claimSelectSt = { padding:"5px 8px", fontSize:12, border:"1px solid var(--border-default)", borderRadius:"var(--radius-sm)", background:"var(--bg-surface)", fontFamily:"var(--font-sans)", color:"var(--text-primary)", outline:"none", cursor:"pointer" };
  const claimDateSt   = { padding:"5px 8px", fontSize:11, flex:1, border:"1px solid var(--border-default)", borderRadius:"var(--radius-sm)", background:"var(--bg-surface)", fontFamily:"var(--font-mono)", color:"var(--text-primary)", outline:"none", minWidth:0 };

  function PeriodAndSummary({ type, period, setPeriod, claimGroup, setClaimGroup, diffRate, setDiffRate, doctors, summary, weekendOpt, setWeekendOpt, onLoadClaims, loaded }) {
    return html`<div style=${{ width:340, flexShrink:0, background:"var(--bg-surface)", borderRight:"1px solid var(--border-subtle)", display:"flex", flexDirection:"column", minHeight:0, overflowY:"auto" }}>
      <div style=${{ padding:"18px 20px 14px", borderBottom:"1px solid var(--stone-200)" }}>
        <div style=${{ fontSize:10, fontWeight:700, color:"var(--text-muted)", letterSpacing:"0.08em", textTransform:"uppercase", fontFamily:"var(--font-sans)", marginBottom:6 }}>STEP 1 · 청구 기간 선택</div>
        <div style=${{ fontFamily:"var(--font-serif)", fontSize:18, fontWeight:500, color:"var(--text-primary)", letterSpacing:"-0.01em", lineHeight:1.3 }}>청구할 기간을<br />선택하십시오</div>
      </div>
      <div style=${{ padding:"16px 20px 8px", display:"flex", flexDirection:"column", gap:14 }}>
        <div>
          <${ClaimLabel}>청구 구분</${ClaimLabel}>
          <div style=${{ display:"flex", gap:6 }}>
            ${["원청구","추가청구","보완청구"].map(v => html`<button key=${v} onClick=${() => setClaimGroup(v)} style=${claimPillBtn(claimGroup===v)}>${v}</button>`)}
          </div>
        </div>
        <div>
          <${ClaimLabel}>청구 기간</${ClaimLabel}>
          <div style=${{ display:"flex", flexDirection:"column", gap:8 }}>
            <${ClaimRadioRow} checked=${period.mode==="month"} onClick=${() => setPeriod({...period,mode:"month"})}>
              <select value=${period.year} disabled=${period.mode!=="month"} onChange=${e => setPeriod({...period,year:parseInt(e.target.value)})} style=${claimSelectSt}>
                ${[2024,2025,2026].map(y => html`<option key=${y} value=${y}>${y}년</option>`)}
              </select>
              <select value=${period.month} disabled=${period.mode!=="month"} onChange=${e => setPeriod({...period,month:parseInt(e.target.value)})} style=${claimSelectSt}>
                ${Array.from({length:12},(_,i)=>i+1).map(m => html`<option key=${m} value=${m}>${String(m).padStart(2,"0")}월</option>`)}
              </select>
              <label style=${{ display:"inline-flex", alignItems:"center", gap:4, fontSize:12, color:"var(--text-secondary)", whiteSpace:"nowrap" }}>
                <input type="checkbox" checked=${weekendOpt} onChange=${e => setWeekendOpt(e.target.checked)} disabled=${period.mode!=="month"} style=${{ accentColor:"var(--jade-500)" }} />주단위
              </label>
            </${ClaimRadioRow}>
            <${ClaimRadioRow} checked=${period.mode==="range"} onClick=${() => setPeriod({...period,mode:"range"})}>
              <input type="date" value=${period.from} disabled=${period.mode!=="range"} onChange=${e => setPeriod({...period,from:e.target.value})} style=${claimDateSt} />
              <span style=${{ color:"var(--text-muted)" }}>—</span>
              <input type="date" value=${period.to} disabled=${period.mode!=="range"} onChange=${e => setPeriod({...period,to:e.target.value})} style=${claimDateSt} />
            </${ClaimRadioRow}>
          </div>
        </div>
        ${type==="health" && html`<div>
          <${ClaimLabel}>차등수가</${ClaimLabel}>
          <div style=${{ display:"flex", gap:6 }}>
            <button onClick=${() => setDiffRate("apply")}  style=${claimPillBtn(diffRate==="apply")}>토·일 포함</button>
            <button onClick=${() => setDiffRate("exclude")} style=${claimPillBtn(diffRate==="exclude")}>토·일 제외</button>
          </div>
        </div>`}
        <button onClick=${onLoadClaims} style=${{
          padding:"11px 14px", background: loaded ? "var(--bg-surface)" : "var(--jade-500)",
          color: loaded ? "var(--text-secondary)" : "#fff",
          border: loaded ? "1px solid var(--border-default)" : "none",
          borderRadius:"var(--radius-md)", fontFamily:"var(--font-sans)", fontSize:13, fontWeight:600,
          cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center", gap:6,
          boxShadow: loaded ? "none" : "var(--shadow-sm)", transition:"all 0.12s",
        }}>
          <${Icon} name=${loaded ? "rotate-ccw" : "download"} size=${14} />
          ${loaded ? "명세서 다시 불러오기" : "명세서 불러오기"}
        </button>
      </div>
      ${loaded && html`<div style=${{ padding:"16px 20px 20px", borderTop:"1px solid var(--stone-200)", marginTop:6 }}>
        <div style=${{ fontSize:10, fontWeight:700, color:"var(--text-muted)", letterSpacing:"0.08em", textTransform:"uppercase", fontFamily:"var(--font-sans)", marginBottom:6 }}>STEP 2 · 청구 내역 요약</div>
        <div style=${{ fontFamily:"var(--font-serif)", fontSize:16, fontWeight:500, color:"var(--text-primary)", letterSpacing:"-0.01em", marginBottom:14 }}>이번에 청구할 내역</div>
        <div style=${{ background:"var(--stone-50)", border:"1px solid var(--stone-200)", borderRadius:"var(--radius-md)", padding:"10px 12px", marginBottom:12 }}>
          <div style=${{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
            <span style=${{ fontSize:11, color:"var(--text-muted)" }}>청구 기간</span>
            <span style=${{ fontSize:12, fontWeight:500, fontFamily:"var(--font-mono)", color:"var(--text-primary)" }}>${summary.periodFrom} ~ ${summary.periodTo}</span>
          </div>
          <div style=${{ display:"flex", justifyContent:"space-between" }}>
            <span style=${{ fontSize:11, color:"var(--text-muted)" }}>진료일수</span>
            <span style=${{ fontSize:12, fontWeight:500, color:"var(--text-primary)" }}>의사 ${doctors.length}명 · 총 ${doctors.reduce((s,d)=>s+d.visitDays,0)}일</span>
          </div>
        </div>
        <div style=${{ marginBottom:14 }}>
          <div style=${{ display:"grid", gridTemplateColumns:"60px 1fr 36px 24px", padding:"4px 8px", marginBottom:4, fontSize:10, fontWeight:600, letterSpacing:"0.04em", color:"var(--text-muted)", fontFamily:"var(--font-sans)" }}>
            <span>의사</span><span>주민번호</span><span style=${{ textAlign:"right" }}>일수</span><span></span>
          </div>
          ${doctors.map((d,i) => html`<div key=${d.id} style=${{ display:"grid", gridTemplateColumns:"60px 1fr 36px 24px", padding:"7px 8px", alignItems:"center", borderBottom: i<doctors.length-1 ? "1px solid var(--stone-100)" : "none", fontSize:12 }}>
            <span style=${{ fontWeight:500, color:"var(--text-primary)" }}>${d.name}</span>
            <span style=${{ color:"var(--text-secondary)", fontFamily:"var(--font-mono)", fontSize:11 }}>${d.rrn}</span>
            <span style=${{ textAlign:"right", fontFamily:"var(--font-mono)", color:"var(--text-primary)", fontWeight:500 }}>${d.visitDays}</span>
            <span style=${{ width:18, height:18, borderRadius:"var(--radius-sm)", border:"1px solid var(--stone-300)", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-muted)", cursor:"pointer" }}><${Icon} name="x" size=${10} /></span>
          </div>`)}
        </div>
        <div style=${{ display:"flex", flexDirection:"column", gap:6 }}>
          <${ClaimSumLine} label="명세서 건수">
            <span style=${{ fontFamily:"var(--font-mono)", fontWeight:600 }}>${summary.totalCount}건</span>
            ${type==="health" && html`<span style=${{ fontSize:11, color:"var(--text-muted)", marginLeft:6 }}>(보험 ${summary.healthOnly}건, 의료급여 ${summary.medicaidOnly}건)</span>`}
          </${ClaimSumLine}>
          <${ClaimSumLine} label="청구 합계" bold=${true}>
            <span style=${{ fontFamily:"var(--font-mono)", fontWeight:700, color:"var(--jade-700)", fontSize:14 }}>${KRW2(summary.totalClaim)}</span>
          </${ClaimSumLine}>
          ${type==="health" && html`<div style=${{ paddingLeft:8, fontSize:11, color:"var(--text-muted)", lineHeight:1.6 }}>보험 ${KRW2(summary.healthAmount)}<br />의료급여 ${KRW2(summary.medicaidAmount)}</div>`}
          <${ClaimSumLine} label="본인부담금">
            <span style=${{ fontFamily:"var(--font-mono)", fontWeight:500 }}>${KRW2(summary.copayTotal)}</span>
          </${ClaimSumLine}>
        </div>
      </div>`}
    </div>`;
  }

  // ════════════════════════════════════════════════════════════════
  // ClaimList — FilterBar + ClaimsTable + ActionBar
  // ════════════════════════════════════════════════════════════════

  function FilterBar({ search, setSearch, kindFilter, setKindFilter, errorOnly, setErrorOnly, density, setDensity, selected, onRemoveSelected, kindOptions }) {
    return html`<div style=${{ display:"flex", alignItems:"center", gap:8, padding:"10px 16px", borderBottom:"1px solid var(--border-subtle)", background:"var(--bg-surface)", flexShrink:0 }}>
      <div style=${{ position:"relative", width:200 }}>
        <span style=${{ position:"absolute", left:9, top:"50%", transform:"translateY(-50%)", color:"var(--text-muted)" }}><${Icon} name="search" size=${13} /></span>
        <input value=${search} onChange=${e => setSearch(e.target.value)} placeholder="환자명·차트번호로 검색" style=${{ width:"100%", padding:"7px 10px 7px 28px", fontSize:12, border:"1px solid var(--border-default)", borderRadius:"var(--radius-md)", background:"var(--bg-surface)", outline:"none", fontFamily:"var(--font-sans)" }} />
      </div>
      <select value=${kindFilter} onChange=${e => setKindFilter(e.target.value)} style=${{ padding:"7px 24px 7px 10px", fontSize:12, border:"1px solid var(--border-default)", borderRadius:"var(--radius-md)", background:"var(--bg-surface)", outline:"none", fontFamily:"var(--font-sans)", color:"var(--text-primary)", cursor:"pointer", minWidth:130 }}>
        <option value="">전체 종류</option>
        ${kindOptions.map(k => html`<option key=${k} value=${k}>${k}</option>`)}
      </select>
      <button onClick=${() => setErrorOnly(!errorOnly)} style=${{ display:"inline-flex", alignItems:"center", gap:5, padding:"7px 12px", fontSize:12, fontWeight:500, background: errorOnly ? "var(--cinnabar-100)" : "var(--bg-surface)", color: errorOnly ? "var(--cinnabar-700)" : "var(--text-secondary)", border: `1px solid ${errorOnly ? "var(--cinnabar-300)" : "var(--border-default)"}`, borderRadius:"var(--radius-md)", cursor:"pointer", fontFamily:"var(--font-sans)" }}>
        <${Icon} name="alert-triangle" size=${12} />오류만 보기
      </button>
      <div style=${{ flex:1 }}></div>
      ${selected > 0 && html`<button onClick=${onRemoveSelected} style=${{ display:"inline-flex", alignItems:"center", gap:5, padding:"7px 12px", fontSize:12, fontWeight:500, background:"var(--bg-surface)", color:"var(--text-secondary)", border:"1px solid var(--border-default)", borderRadius:"var(--radius-md)", cursor:"pointer", fontFamily:"var(--font-sans)" }}>
        <${Icon} name="x-circle" size=${12} />선택 항목 제외 (${selected})
      </button>`}
      <div style=${{ display:"inline-flex", padding:2, background:"var(--stone-100)", borderRadius:"var(--radius-md)", border:"1px solid var(--border-subtle)" }}>
        ${[{k:"comfortable",icon:"rows-3"},{k:"compact",icon:"menu"}].map(d => html`<button key=${d.k} onClick=${() => setDensity(d.k)} style=${{ padding:"4px 8px", background: density===d.k ? "var(--bg-surface)" : "transparent", border:"none", borderRadius:"var(--radius-sm)", cursor:"pointer", color: density===d.k ? "var(--jade-700)" : "var(--text-muted)", display:"inline-flex", alignItems:"center", boxShadow: density===d.k ? "var(--shadow-sm)" : "none", transition:"all 0.12s" }}><${Icon} name=${d.icon} size=${13} /></button>`)}
      </div>
    </div>`;
  }

  function CMono({ children, small }) { return html`<span style=${{ fontFamily:"var(--font-mono)", fontSize: small?11:12, color:"var(--text-secondary)" }}>${children}</span>`; }
  function CCell({ children })        { return html`<span style=${{ fontFamily:"var(--font-sans)",  fontSize:12, color:"var(--text-primary)" }}>${children}</span>`; }
  function CNum({ children, strong }) { return html`<span style=${{ fontFamily:"var(--font-mono)", fontSize:12, color: strong?"var(--text-primary)":"var(--text-secondary)", fontWeight: strong?600:400, textAlign:"right" }}>${children}</span>`; }
  function KindBadge({ value }) {
    const c = { "보험":{bg:"var(--jade-50)",fg:"var(--jade-700)",bd:"var(--jade-200)"}, "의료급여":{bg:"var(--amber-100)",fg:"var(--amber-700)",bd:"var(--amber-200)"}, "시범사업":{bg:"var(--amber-100)",fg:"var(--amber-700)",bd:"var(--amber-200)"}, "자동차":{bg:"var(--cinnabar-100)",fg:"var(--cinnabar-700)",bd:"var(--cinnabar-200)"} }[value] || {bg:"var(--jade-50)",fg:"var(--jade-700)",bd:"var(--jade-200)"};
    return html`<span style=${{ display:"inline-flex", alignItems:"center", fontSize:10, fontWeight:600, padding:"1px 7px", borderRadius:"var(--radius-full)", background:c.bg, color:c.fg, border:`1px solid ${c.bd}`, fontFamily:"var(--font-sans)", width:"fit-content" }}>${value}</span>`;
  }

  function ClaimsTable({ type, items, selected, setSelected, excluded, setExcluded, density }) {
    const allSelectable = items.filter(it => !excluded.has(it.id)).map(it => it.id);
    const allSelected = allSelectable.length > 0 && allSelectable.every(id => selected.has(id));
    const toggleAll = () => { if (allSelected) setSelected(new Set()); else setSelected(new Set(allSelectable)); };
    const toggleOne = (id) => { const n = new Set(selected); n.has(id)?n.delete(id):n.add(id); setSelected(n); };
    const toggleExclude = (id) => { const n=new Set(excluded); n.has(id)?n.delete(id):n.add(id); setExcluded(n); const s=new Set(selected); s.delete(id); setSelected(s); };

    const [cols, header] = type==="health"
      ? ["32px 80px 88px 80px 96px 70px 50px 48px 100px 90px 64px 56px", ["","명세서","진료일","환자명","주민번호","진료의","종류","내원","건보청구액","본인부담금","급여총액","제외"]]
      : type==="herbal"
      ? ["32px 80px 88px 80px 96px 70px 80px 60px 110px 90px 56px",       ["","명세서","진료일","환자명","주민번호","진료의","처방","일수","약재비","진찰료","제외"]]
      : ["32px 80px 88px 80px 96px 70px 110px 110px 100px 56px",          ["","청구서","진료일","환자명","주민번호","진료의","보험사","사고번호","청구액","제외"]];

    const cellPad = density==="compact" ? "6px 10px" : "10px 10px";
    const rowH    = density==="compact" ? 34 : 42;

    return html`<div style=${{ flex:1, minHeight:0, overflow:"auto", background:"var(--bg-surface)" }}>
      <div style=${{ minWidth:900 }}>
        <div style=${{ display:"grid", gridTemplateColumns:cols, padding:"8px 10px", position:"sticky", top:0, background:"var(--stone-50)", borderBottom:"2px solid var(--border-default)", fontSize:10, fontWeight:700, letterSpacing:"0.04em", color:"var(--text-secondary)", fontFamily:"var(--font-sans)", textTransform:"uppercase", zIndex:2 }}>
          <span style=${{ display:"flex", alignItems:"center", justifyContent:"center" }}><input type="checkbox" checked=${allSelected} onChange=${toggleAll} style=${{ accentColor:"var(--jade-500)", cursor:"pointer", width:14, height:14 }} /></span>
          ${header.slice(1).map((h,i) => {
            const numIdx = type==="health"?[7,8,9,10]:type==="herbal"?[7,8,9]:[8];
            return html`<span key=${i} style=${{ textAlign: numIdx.includes(i+1)?"right":"left", display:"block" }}>${h}</span>`;
          })}
        </div>
        ${items.length===0 && html`<div style=${{ padding:"60px 20px", textAlign:"center", color:"var(--text-muted)", fontSize:13, fontFamily:"var(--font-sans)" }}>
          <${Icon} name="file-search" size=${36} style=${{ color:"var(--stone-400)", marginBottom:12 }} /><div>해당 조건에 해당하는 명세서가 없습니다.</div>
        </div>`}
        ${items.map(it => {
          const isEx=excluded.has(it.id), isErr=!!it.error, isSel=selected.has(it.id);
          return html`<div key=${it.id} style=${{ display:"grid", gridTemplateColumns:cols, alignItems:"center", padding:cellPad, minHeight:rowH, borderBottom:"1px solid var(--stone-100)", background: isEx?"var(--stone-100)":isErr?"var(--cinnabar-100)":isSel?"var(--jade-50)":"transparent", opacity: isEx?0.55:1, cursor: isEx?"default":"pointer", position:"relative" }} onClick=${() => !isEx&&toggleOne(it.id)}>
            <span style=${{ display:"flex", alignItems:"center", justifyContent:"center" }}>
              ${isErr && html`<span title=${it.error.msg} style=${{ marginRight:4 }}><${Icon} name="alert-triangle" size=${12} style=${{ color:"var(--cinnabar-700)" }} /></span>`}
              <input type="checkbox" checked=${isSel&&!isEx} disabled=${isEx} onChange=${e=>{e.stopPropagation();toggleOne(it.id);}} onClick=${e=>e.stopPropagation()} style=${{ accentColor:"var(--jade-500)", cursor:"pointer", width:14, height:14 }} />
            </span>
            ${type==="health" && html`<${F}><${CMono}>${it.seq}</${CMono}><${CMono}>${it.visitDate.replace(/-/g,"")}</${CMono}><${CCell}>${it.patientName}</${CCell}><${CMono}>${it.rrn}</${CMono}><${CCell}>${it.doctor}</${CCell}><${KindBadge} value=${it.kind} /><${CMono}>${it.visitCount}</${CMono}><${CNum}>${NUM(it.claimAmount-it.copay)}</${CNum}><${CNum}>${NUM(it.copay)}</${CNum}><${CNum} strong=${true}>${NUM(it.coveredTotal)}</${CNum}></${F}>`}
            ${type==="herbal" && html`<${F}><${CMono}>${it.seq}</${CMono}><${CMono}>${it.visitDate.replace(/-/g,"")}</${CMono}><${CCell}>${it.patientName}</${CCell}><${CMono}>${it.rrn}</${CMono}><${CCell}>${it.doctor}</${CCell}><${CCell}>${it.formula}</${CCell}><${CNum}>${it.herbalDays}일</${CNum}><${CNum}>${NUM(it.ingredientCost)}</${CNum}><${CNum} strong=${true}>${NUM(it.consultFee)}</${CNum}></${F}>`}
            ${type==="auto" && html`<${F}><${CMono}>${it.claimDocNo}</${CMono}><${CMono}>${it.visitDate.replace(/-/g,"")}</${CMono}><${CCell}>${it.patientName}</${CCell}><${CMono}>${it.rrn}</${CMono}><${CCell}>${it.doctor}</${CCell}><${CCell}>${it.autoInsurer}</${CCell}><${CMono} small=${true}>${it.accidentNo}</${CMono}><${CNum} strong=${true}>${NUM(it.claimAmount)}</${CNum}></${F}>`}
            <span style=${{ display:"flex", justifyContent:"center" }}>
              <button onClick=${e=>{e.stopPropagation();toggleExclude(it.id);}} style=${{ padding:"3px 8px", fontSize:10, fontWeight:500, background: isEx?"var(--stone-300)":"var(--bg-surface)", color: isEx?"var(--text-primary)":"var(--text-muted)", border:"1px solid var(--border-default)", borderRadius:"var(--radius-sm)", cursor:"pointer", fontFamily:"var(--font-sans)" }}>${isEx?"복원":"제외"}</button>
            </span>
            ${isErr && !isEx && html`<div style=${{ gridColumn:"1 / -1", marginTop:4, padding:"4px 12px 4px 28px", fontSize:11, color:"var(--cinnabar-800)", fontFamily:"var(--font-sans)", background:"var(--cinnabar-100)", borderTop:"1px dashed var(--cinnabar-300)", display:"flex", alignItems:"center", gap:6 }}>
              <span style=${{ fontFamily:"var(--font-mono)", fontWeight:700, fontSize:10, color:"var(--cinnabar-800)" }}>${it.error.code}</span>
              <span>${it.error.msg}</span>
            </div>`}
          </div>`;
        })}
      </div>
    </div>`;
  }

  function ClaimSubmissionFlow({ items, type, summary, onClose }) {
    const [stage, setStage] = useState(0);
    const [statusByKey, setStatusByKey] = useState({ build:"running", validate:"pending", pretest:"pending", submit:"pending" });
    const [waitingApproval, setWaitingApproval] = useState(false);
    const [pretestResults, setPretestResults] = useState(null);
    const [done, setDone] = useState(false);
    const timerRef = useRef(null);
    const errorItems = items.filter(it => it.error);

    useEffect(() => {
      const s = CLAIM_STAGES[stage];
      if (!s || statusByKey[s.key] !== "running") return;
      timerRef.current = setTimeout(() => {
        const next = { ...statusByKey };
        if (s.key === "pretest") {
          const results = { errors: errorItems.map(it => ({ id:it.id, patientName:it.patientName, chartNo:it.chartNo, seq:it.seq, code:it.error.code, msg:it.error.msg })), passedCount: items.length-errorItems.length, totalCount: items.length };
          setPretestResults(results);
          if (results.errors.length > 0) { next[s.key]="warning"; setStatusByKey(next); setWaitingApproval(true); }
          else { next[s.key]="success"; const ni=stage+1; if(ni<CLAIM_STAGES.length){next[CLAIM_STAGES[ni].key]="running"; setStage(ni);} setStatusByKey({...next}); }
        } else if (s.key === "submit") { next[s.key]="success"; setStatusByKey(next); setDone(true); }
        else { next[s.key]="success"; const ni=stage+1; if(ni<CLAIM_STAGES.length){next[CLAIM_STAGES[ni].key]="running"; setStage(ni);} setStatusByKey({...next}); }
      }, s.sim);
      return () => clearTimeout(timerRef.current);
    }, [stage]);

    const handleResubmit = () => { const n={...statusByKey}; n.submit="running"; setStatusByKey(n); setStage(3); setWaitingApproval(false); };
    const totalNonError = items.length - errorItems.length;
    const totalAmount   = items.reduce((s,it) => s+it.claimAmount, 0);

    const btnSec = { padding:"8px 14px", fontSize:12, fontWeight:500, background:"var(--bg-surface)", color:"var(--text-secondary)", border:"1px solid var(--border-default)", borderRadius:"var(--radius-md)", cursor:"pointer", fontFamily:"var(--font-sans)", display:"inline-flex", alignItems:"center", gap:5 };
    const btnPri = { padding:"8px 16px", fontSize:12, fontWeight:600, background:"var(--jade-500)", color:"#fff", border:"none", borderRadius:"var(--radius-md)", cursor:"pointer", fontFamily:"var(--font-sans)", display:"inline-flex", alignItems:"center", gap:5, boxShadow:"var(--shadow-sm)" };

    return html`<div style=${{ position:"fixed", inset:0, zIndex:100, background:"var(--bg-overlay)", backdropFilter:"blur(6px)", display:"flex", alignItems:"center", justifyContent:"center", padding:40 }}>

          <div style=${{ flex:1 }}>
            <div style=${{ fontSize:11, fontWeight:600, letterSpacing:"0.08em", color:"var(--jade-200)", textTransform:"uppercase", fontFamily:"var(--font-sans)" }}>심평원 진료비 청구 · HIRA Claim API</div>
            <div style=${{ fontFamily:"var(--font-serif)", fontSize:22, fontWeight:500, letterSpacing:"-0.01em", marginTop:2 }}>${CLAIM_TYPES.find(t=>t.key===type)?.label} 청구 진행</div>
          </div>
          <button onClick=${() => onClose("cancel")} style=${{ width:32, height:32, borderRadius:"var(--radius-md)", background:"rgba(255,255,255,0.1)", border:"none", color:"rgba(255,255,255,0.8)", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}><${Icon} name="x" size=${16} /></button>
        </div>
        <div style=${{ padding:"14px 28px", background:"var(--stone-50)", borderBottom:"1px solid var(--stone-200)", display:"flex", gap:28 }}>
          ${[{l:"청구 건수",v:`${items.length}건`},{l:"정상",v:`${totalNonError}건`,c:"var(--jade-700)"},{l:"오류 의심",v:`${errorItems.length}건`,c:errorItems.length>0?"var(--cinnabar-700)":"var(--text-muted)"},{l:"청구 합계",v:KRW2(totalAmount),m:true}].map((s,i) => html`<div key=${i} style=${{ display:"flex", flexDirection:"column" }}>
            <span style=${{ fontSize:10, fontWeight:600, letterSpacing:"0.06em", color:"var(--text-muted)", fontFamily:"var(--font-sans)", textTransform:"uppercase" }}>${s.l}</span>
            <span style=${{ fontFamily: s.m?"var(--font-mono)":"var(--font-sans)", fontSize:16, fontWeight:700, color: s.c||"var(--text-primary)", marginTop:2 }}>${s.v}</span>
          </div>`)}
        </div>
        <div style=${{ flex:1, overflowY:"auto", padding:"8px 0" }}>
          ${CLAIM_STAGES.map((s,idx) => html`<${ClaimStageRow} key=${s.key} stage=${s} idx=${idx} status=${statusByKey[s.key]} isLast=${idx===CLAIM_STAGES.length-1} expanded=${s.key==="pretest"&&pretestResults} details=${s.key==="pretest"&&pretestResults?html`<${PretestResults} results=${pretestResults} />`:null} />`)}
        </div>
        <div style=${{ padding:"16px 24px", borderTop:"1px solid var(--stone-200)", background:"var(--stone-50)", display:"flex", alignItems:"center", gap:10 }}>
          ${waitingApproval && html`<${F}>
            <div style=${{ display:"flex", alignItems:"center", gap:8, padding:"6px 12px", background:"var(--amber-100)", border:"1px solid var(--amber-200)", borderRadius:"var(--radius-md)" }}>
              <${Icon} name="alert-circle" size=${14} style=${{ color:"var(--amber-700)" }} />

            <button onClick=${() => onClose("fix")} style=${btnSec}><${Icon} name="arrow-left" size=${13} />오류 수정으로 돌아가기</button>
            <button onClick=${handleResubmit}        style=${btnPri}><${Icon} name="send"       size=${13} />정상 ${totalNonError}건만 실청구</button>
          </${F}>`}
          ${!waitingApproval && !done && html`<${F}>
            <div style=${{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--text-muted)" }}>
              <span style=${{ width:8, height:8, borderRadius:"50%", background:"var(--jade-500)", animation:"cPulse 1.4s infinite" }}></span>
              <span style=${{ fontFamily:"var(--font-sans)" }}>${CLAIM_STAGES[stage]?.label} 진행 중…</span>
            </div>
            <div style=${{ flex:1 }}></div>
            <button onClick=${() => onClose("cancel")} style=${btnSec}>중단</button>
          </${F}>`}
          ${done && html`<${F}>
            <div style=${{ display:"flex", alignItems:"center", gap:8, padding:"6px 12px", background:"var(--jade-50)", border:"1px solid var(--jade-200)", borderRadius:"var(--radius-md)" }}>
              <${Icon} name="check-circle-2" size=${14} style=${{ color:"var(--jade-700)" }} />
              <span style=${{ fontSize:12, color:"var(--jade-700)", fontWeight:600, fontFamily:"var(--font-sans)" }}>실청구 완료 — 접수번호 HIRA-2026-${String(Math.floor(Math.random()*90000)+10000)}</span>
            </div>
            <div style=${{ flex:1 }}></div>
            <button onClick=${() => onClose("done")} style=${btnSec}><${Icon} name="file-text" size=${13} />접수증 출력</button>
            <button onClick=${() => onClose("done")} style=${btnPri}><${Icon} name="check"     size=${13} />확인</button>

    </div>`;
  }

    const [type,        setType]        = useState("health");

    const [claimGroup,  setClaimGroup]  = useState("원청구");
    const [diffRate,    setDiffRate]    = useState("apply");
    const [loaded,      setLoaded]      = useState({ health:true, herbal:false, auto:false });
    const [search,      setSearch]      = useState("");
    const [kindFilter,  setKindFilter]  = useState("");
    const [errorOnly,   setErrorOnly]   = useState(false);
    const [density,     setDensity]     = useState("comfortable");
    const [selected,    setSelected]    = useState(new Set());
    const [excluded,    setExcluded]    = useState(new Set());
    const [submission,  setSubmission]  = useState(null);

    const allItems = React.useMemo(() => type==="health"?HEALTH_CLAIMS_SEED:type==="herbal"?HERBAL_CLAIMS_SEED:AUTO_CLAIMS_SEED, [type]);
    const filteredItems = React.useMemo(() => {
      let xs = allItems;
      if (search.trim()) { const q=search.trim().toLowerCase(); xs=xs.filter(it=>it.patientName.toLowerCase().includes(q)||it.chartNo.toLowerCase().includes(q)||it.rrn.toLowerCase().includes(q)); }
      if (kindFilter)  xs = xs.filter(it => it.kind===kindFilter || it.autoInsurer===kindFilter);
      if (errorOnly)   xs = xs.filter(it => !!it.error);
      return xs;
    }, [allItems, search, kindFilter, errorOnly]);
    const kindOptions = React.useMemo(() => type==="health"?["보험","의료급여"]:type==="herbal"?["시범사업"]:AUTO_INSURERS, [type]);
    const counts = { health:HEALTH_CLAIMS_SEED.length, herbal:HERBAL_CLAIMS_SEED.length, auto:AUTO_CLAIMS_SEED.length };

    useEffect(() => { setSelected(new Set()); setExcluded(new Set()); setSearch(""); setKindFilter(""); setErrorOnly(false); }, [type]);

    const handleLoad = () => { setLoaded({...loaded,[type]:true}); setSelected(new Set(allItems.map(it=>it.id))); };

    const summary = React.useMemo(() => {
      const vis = allItems.filter(it => !excluded.has(it.id));
      const hA = vis.filter(it=>it.kind==="보험").reduce((s,it)=>s+(it.coveredTotal||it.claimAmount),0);
      const mA = vis.filter(it=>it.kind==="의료급여").reduce((s,it)=>s+(it.coveredTotal||it.claimAmount),0);
      return {
        totalCount: vis.length,
        healthOnly: vis.filter(it=>it.kind==="보험").length,
        medicaidOnly: vis.filter(it=>it.kind==="의료급여").length,
        healthAmount: hA, medicaidAmount: mA,
        totalClaim: vis.reduce((s,it)=>s+(it.coveredTotal||it.claimAmount),0),
        copayTotal: vis.reduce((s,it)=>s+(it.copay||0),0),
        periodFrom: period.mode==="month"?`${period.year}-${String(period.month).padStart(2,"0")}-01`:period.from,
        periodTo:   period.mode==="month"?`${period.year}-${String(period.month).padStart(2,"0")}-30`:period.to,
      };
    }, [allItems, excluded, period]);

    const handleRemoveSelected = () => { const n=new Set(excluded); selected.forEach(id=>n.add(id)); setExcluded(n); setSelected(new Set()); };
    const errorCount  = React.useMemo(() => allItems.filter(it=>selected.has(it.id)&&it.error).length, [allItems,selected]);
    const totalErrors = React.useMemo(() => allItems.filter(it=>it.error&&!excluded.has(it.id)).length, [allItems,excluded]);

    const handleSubmitAll      = () => setSubmission({ items:allItems.filter(it=>!excluded.has(it.id)), type });
    const handleSubmitSelected = () => { const items=allItems.filter(it=>selected.has(it.id)&&!excluded.has(it.id)); if(items.length===0)return; setSubmission({items,type}); };
    const handleCloseSubmission = (mode) => { if(mode==="fix") setErrorOnly(true); setSubmission(null); };

    return html`<div style=${{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg-page)" }}>
      <${TopBar}
        title="보험 청구"
        subtitle="한차트 명세서 → 심평원 진료비 청구 (HIRA API 연동)"
        actions=${html`<${F}>
          <${ClaimPillStat} icon="files"          label="청구 대상" value=${`${summary.totalCount}건`}      tone="neutral" />
          <${ClaimPillStat} icon="alert-triangle" label="오류 의심" value=${`${totalErrors}건`}             tone=${totalErrors>0?"danger":"neutral"} />
          <${ClaimPillStat} icon="banknote"       label="청구 합계" value=${KRW2(summary.totalClaim)}       tone="brand" mono=${true} />
        </${F}>`}
      />
      <${ClaimTypeTabs} active=${type} onChange=${setType} counts=${counts} />
      <div style=${{ flex:1, display:"flex", minHeight:0, overflow:"hidden" }}>
        <${PeriodAndSummary}
          type=${type} period=${period} setPeriod=${setPeriod}
          claimGroup=${claimGroup} setClaimGroup=${setClaimGroup}
          diffRate=${diffRate} setDiffRate=${setDiffRate}
          weekendOpt=${weekendOpt} setWeekendOpt=${setWeekendOpt}
          doctors=${CLAIM_DOCTORS} summary=${summary}
          onLoadClaims=${handleLoad} loaded=${loaded[type]}
        />
        <div style=${{ flex:1, minWidth:0, display:"flex", flexDirection:"column" }}>
          ${!loaded[type]
            ? html`<${ClaimEmptyState} type=${type} onLoad=${handleLoad} />`
            : html`<${F}>
                <${FilterBar} search=${search} setSearch=${setSearch} kindFilter=${kindFilter} setKindFilter=${setKindFilter} errorOnly=${errorOnly} setErrorOnly=${setErrorOnly} density=${density} setDensity=${setDensity} selected=${selected.size} onRemoveSelected=${handleRemoveSelected} kindOptions=${kindOptions} />
                <${ClaimsTable} type=${type} items=${filteredItems} selected=${selected} setSelected=${setSelected} excluded=${excluded} setExcluded=${setExcluded} density=${density} />
                <${ActionBar} type=${type} summary=${summary} selected=${selected.size} errorCount=${errorCount} onSubmitAll=${handleSubmitAll} onSubmitSelected=${handleSubmitSelected} onOpenPhysioRecords=${()=>alert("물리치료 내역 (모의)")} onOpenChunaRecords=${()=>alert("추나치료 내역 (모의)")} />
              </${F}>`}
        </div>
      </div>
      ${submission && html`<${ClaimSubmissionFlow} items=${submission.items} type=${submission.type} summary=${summary} onClose=${handleCloseSubmission} />`}
    </div>`;
  }

  // ════════════════════════════════════════════════════════════════
  // App
  // ════════════════════════════════════════════════════════════════

  const SCREENS = { patients: "patients", chart: "chart", prescribe: "prescribe" };

  function PlaceholderScreen({ title }) {
    return html`<div style=${{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <${TopBar} title=${title} />
      <div style=${{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12 }}>
        <${Icon} name="construction" size=${32} style=${{ color: "var(--text-muted)" }} />
        <div style=${{ fontSize: 14, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>이 화면은 준비 중입니다</div>
      </div>
    </div>`;
  }

  function App() {
    const [nav, setNav] = useState(() => localStorage.getItem("komes_nav") || "patients");
    const [selectedPatient, setSelectedPatient] = useState(null);
    const [screen, setScreen] = useState(() => localStorage.getItem("komes_screen") || SCREENS.patients);

    useEffect(() => { localStorage.setItem("komes_nav", nav); }, [nav]);
    useEffect(() => { localStorage.setItem("komes_screen", screen); }, [screen]);

    const handleSelectPatient = (p) => {
      setSelectedPatient(p);
      setScreen(SCREENS.chart);
      setNav("chart");
    };

    const handlePrescribe = () => setScreen(SCREENS.prescribe);

    const handleNavBack = () => {
      if (screen === SCREENS.prescribe) { setScreen(SCREENS.chart); setNav("chart"); }
      else { setScreen(SCREENS.patients); setNav("patients"); setSelectedPatient(null); }
    };

    const renderMain = () => {
      if (nav === "patients") {
        return html`<${PatientListScreen} onSelectPatient=${handleSelectPatient} />`;
      }
      if (nav === "chart") {
        if (screen === SCREENS.prescribe && selectedPatient) {
          return html`<${PrescriptionScreen} patient=${selectedPatient} onBack=${handleNavBack} />`;
        }
        return html`<${PatientChartScreen} patient=${selectedPatient} onBack=${handleNavBack} onPrescribe=${handlePrescribe} />`;
      }
      if (nav === "claim") return html`<${InsuranceClaimScreen} />`;
      const labels = {
        schedule: "예약 관리",
        registry: "환자 관리", payment: "수납",
        prescriptions: "처방 관리", inventory: "약재 재고",
        stats: "통계", ai: "AI 분석", settings: "설정"
      };
      return html`<${PlaceholderScreen} title=${labels[nav] || nav} />`;
    };

    const handleNavigate = (key) => {
      setNav(key);
      if (key === "patients") setScreen(SCREENS.patients);
      if (key === "chart") setScreen(SCREENS.chart);
    };

    return html`<div style=${{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <${Sidebar} activeScreen=${nav} onNavigate=${handleNavigate} />
      <div style=${{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        ${renderMain()}
      </div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoMES — UI Kit (Standalone)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --ink-900: #111E1C; --ink-800: #1C2B2B; --ink-700: #2A3C3A; --ink-600: #3A4F4C;
  --ink-500: #4A5E5B; --ink-400: #6B7E7B; --ink-300: #8A9E9A; --ink-200: #B5C5C2;
  --ink-100: #D8E4E2; --ink-50:  #EEF4F3;
  --jade-900: #1A3C34; --jade-800: #2A5548; --jade-700: #2E5C52; --jade-600: #3A7065;
  --jade-500: #4A7C6F; --jade-400: #6B9E90; --jade-300: #8DBFB3; --jade-200: #B3D8D1;
  --jade-100: #D4EDE9; --jade-50:  #EEF8F6;
  --stone-900: #5C5248; --stone-800: #7A6E62; --stone-700: #9A8E82; --stone-600: #B8AFA4;
  --stone-500: #CEC6BC; --stone-400: #D8D0C4; --stone-300: #E4DDD4; --stone-200: #EDE7D9;
  --stone-100: #F5F0E8; --stone-50:  #FDFAF5;
  --cinnabar-900: #6B1A14; --cinnabar-800: #922420; --cinnabar-700: #B03028;
  --cinnabar-600: #C4594B; --cinnabar-500: #D4756A; --cinnabar-400: #E09690;
  --cinnabar-300: #EBB8B3; --cinnabar-200: #F3D4D1; --cinnabar-100: #FAEDEC;
  --amber-700: #8C5A1A; --amber-600: #B47A28; --amber-500: #C4974B; --amber-400: #D4AE78;
  --amber-200: #F0DFC0; --amber-100: #FAF2E4;
  --navy-900: #0E1A2E; --navy-800: #16263F; --navy-700: #1E3252; --navy-600: #294569;
  --navy-500: #355A82; --navy-400: #5878A3; --navy-300: #8298BF; --navy-200: #B3C0D7;
  --navy-100: #D6DEEB; --navy-50:  #EEF1F7;
  --bg-page: var(--stone-50); --bg-surface: #FFFFFF;
  --bg-raised: var(--stone-100); --bg-sunken: var(--stone-200);
  --bg-overlay: rgba(17, 30, 28, 0.48);
  --text-primary: var(--ink-800); --text-secondary: var(--ink-500);
  --text-muted: var(--ink-300); --text-disabled: var(--ink-200);
  --text-inverse: var(--stone-50); --text-brand: var(--jade-700);
  --text-danger: var(--cinnabar-600); --text-warning: var(--amber-600);
  --border-subtle: var(--stone-300); --border-default: var(--stone-400);
  --border-strong: var(--ink-200); --border-brand: var(--jade-500);
  --border-danger: var(--cinnabar-400);
  --brand: var(--jade-500); --brand-hover: var(--jade-600);
  --brand-active: var(--jade-700); --brand-subtle: var(--jade-50);
  --brand-muted: var(--jade-100);
  --status-success-bg: var(--jade-50); --status-success-text: var(--jade-700); --status-success-border: var(--jade-200);
  --status-warning-bg: var(--amber-100); --status-warning-text: var(--amber-700); --status-warning-border: var(--amber-200);
  --status-danger-bg: var(--cinnabar-100); --status-danger-text: var(--cinnabar-700); --status-danger-border: var(--cinnabar-200);
  --status-neutral-bg: var(--stone-100); --status-neutral-text: var(--ink-600); --status-neutral-border: var(--stone-300);
  --shadow-sm:  0 1px 2px rgba(17, 30, 28, 0.06), 0 1px 4px rgba(17, 30, 28, 0.04);
  --shadow-md:  0 2px 8px rgba(17, 30, 28, 0.08), 0 1px 3px rgba(17, 30, 28, 0.05);
  --shadow-lg:  0 4px 16px rgba(17, 30, 28, 0.10), 0 2px 6px rgba(17, 30, 28, 0.06);
  --shadow-xl:  0 8px 32px rgba(17, 30, 28, 0.12), 0 4px 12px rgba(17, 30, 28, 0.07);
  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;
  --font-serif: 'Noto Serif KR', 'Georgia', serif;
  --font-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
  --sidebar-bg: var(--ink-800);
  --sidebar-active: var(--jade-600);
  --rail-bg: var(--bg-surface);
  --rail-surface: var(--bg-surface);
  --rail-text: var(--text-primary);
  --rail-text-secondary: var(--text-secondary);
  --rail-text-muted: var(--text-muted);
  --rail-border: var(--border-subtle);
  --rail-stripe: var(--stone-100);
  --rail-divider: var(--stone-200);
  --board-appt-bg: #EEF1F6;  --board-appt-border: #CFD7E3;
  --board-wait-bg: #FAF2E4;  --board-wait-border: #F0DFC0;
  --board-treat-bg: #EAF4F1; --board-treat-border: #B3D8D1;
  --board-pay-bg: #F5F0E8;   --board-pay-border: #E4DDD4;
  --doc-d1-bg: #EEF8F6; --doc-d1-border: #B3D8D1;
  --doc-d2-bg: #FAF2E4; --doc-d2-border: #F0DFC0;
  --doc-d3-bg: #EEF1F6; --doc-d3-border: #CFD7E3;
}

/* ── Dark theme overrides ──────────────────────────────────── */
[data-theme="dark"] {
  --bg-page:    #0B1413;
  --bg-surface: #131F1D;
  --bg-raised:  #1A2826;
  --bg-sunken:  #070D0C;
  --bg-overlay: rgba(0, 0, 0, 0.62);

  --text-primary:   var(--ink-50);
  --text-secondary: var(--ink-200);
  --text-muted:     var(--ink-300);
  --text-disabled:  var(--ink-500);
  --text-inverse:   var(--ink-800);
  --text-brand:     var(--jade-300);
  --text-danger:    var(--cinnabar-400);
  --text-warning:   var(--amber-400);

  --border-subtle:  #1F302D;
  --border-default: var(--ink-700);
  --border-strong:  var(--ink-600);
  --border-brand:   var(--jade-500);
  --border-danger:  var(--cinnabar-600);

  --brand:          var(--jade-400);
  --brand-hover:    var(--jade-300);
  --brand-active:   var(--jade-200);
  --brand-subtle:   rgba(74, 124, 111, 0.12);
  --brand-muted:    rgba(74, 124, 111, 0.22);

  --status-success-bg:     rgba(74, 124, 111, 0.14);
  --status-success-text:   var(--jade-300);
  --status-success-border: rgba(74, 124, 111, 0.35);
  --status-warning-bg:     rgba(196, 151, 75, 0.12);
  --status-warning-text:   var(--amber-400);
  --status-warning-border: rgba(196, 151, 75, 0.30);
  --status-danger-bg:      rgba(196, 89, 75, 0.12);
  --status-danger-text:    var(--cinnabar-400);
  --status-danger-border:  rgba(196, 89, 75, 0.30);
  --status-neutral-bg:     #1A2826;
  --status-neutral-text:   var(--ink-200);
  --status-neutral-border: var(--ink-700);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.40), 0 1px 4px rgba(0,0,0,0.25);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.28);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.50), 0 2px 6px rgba(0,0,0,0.30);
  --shadow-xl: 0 8px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.32);
  --board-appt-bg: #141C2B;  --board-appt-border: #1E2D45;
  --board-wait-bg: #1D1810;  --board-wait-border: #2D2418;
  --board-treat-bg: #101E1C; --board-treat-border: #1A3330;
  --board-pay-bg: #1A1510;   --board-pay-border: #2A2218;
  --doc-d1-bg: #101E1C; --doc-d1-border: #1A3330;
  --doc-d2-bg: #1D1810; --doc-d2-border: #2D2418;
  --doc-d3-bg: #141C2B; --doc-d3-border: #1E2D45;
}

/* ── Navy color — jade scale → navy (light mode) ───── */
[data-color="navy"] {
  --sidebar-bg: var(--navy-800);
  --sidebar-active: var(--navy-400);
  --rail-bg: var(--navy-900);
  --rail-surface: var(--navy-800);
  --rail-text: var(--navy-50);
  --rail-text-secondary: var(--navy-200);
  --rail-text-muted: var(--navy-300);
  --rail-border: var(--navy-800);
  --rail-stripe: rgba(255,255,255,0.04);
  --rail-divider: rgba(255,255,255,0.07);
  --jade-900: #0E1A2E; --jade-800: #16263F; --jade-700: #1E3252; --jade-600: #294569;
  --jade-500: #355A82; --jade-400: #5878A3; --jade-300: #8298BF; --jade-200: #B3C0D7;
  --jade-100: #D6DEEB; --jade-50:  #EEF1F7;
  --brand:        #355A82;
  --brand-hover:  #294569;
  --brand-active: #1E3252;
  --brand-subtle: #EEF1F7;
  --brand-muted:  #D6DEEB;
  --text-brand:   #1E3252;
  --border-brand: #355A82;
  --status-success-bg:     #EEF1F7;
  --status-success-text:   #1E3252;
  --status-success-border: #B3C0D7;
}

/* ── Navy color — dark mode override ─────────────── */
[data-theme="dark"][data-color="navy"] {
  --bg-page:    #080F1C;
  --bg-surface: #0E1A2E;
  --bg-raised:  #16263F;
  --bg-sunken:  #040810;
  --border-subtle:  #16263F;
  --brand:          #5878A3;
  --brand-hover:    #8298BF;
  --brand-active:   #B3C0D7;
  --brand-subtle:   rgba(53, 90, 130, 0.15);
  --brand-muted:    rgba(53, 90, 130, 0.28);
  --text-brand:     #8298BF;
  --border-brand:   #355A82;
  --status-success-bg:     rgba(53, 90, 130, 0.14);
  --status-success-text:   #8298BF;
  --status-success-border: rgba(53, 90, 130, 0.35);
}

[data-theme="dark"] .a4-paper {
  filter: brightness(0.82);
}

[data-reduce-motion="true"] *,
[data-reduce-motion="true"] *::before,
[data-reduce-motion="true"] *::after {
  animation-duration: 0.001ms !important;
  transition-duration: 0.001ms !important;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { font-family: var(--font-sans); background-color: var(--bg-page); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: var(--bg-page); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>


<script type="text/babel">
// KoMES UI Kit — Shared Components
// Exported to window for use in index.html

const { useState, useRef, useEffect } = React;

// ── Icons (Lucide via CDN) ──────────────────────────────────────
function Icon({ name, size = 16, style = {}, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) window.lucide.createIcons({ nodes: [ref.current] });
  }, [name]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center", ...style }} className={className}>
    <i data-lucide={name} style={{ width: size, height: size }}></i>
  </span>;
}

// ── Avatar ──────────────────────────────────────────────────────
function Avatar({ name, size = 28 }) {
  const char = name ? name[0] : "?";
  return <div style={{
    width: size, height: size, borderRadius: "50%",
    background: "var(--brand-muted)", color: "var(--text-brand)",
    display: "flex", alignItems: "center", justifyContent: "center",
    fontSize: size * 0.42, fontWeight: 600, flexShrink: 0,
    fontFamily: "var(--font-sans)"
  }}>{char}</div>;
}

// ── Badge ───────────────────────────────────────────────────────
function Badge({ variant = "neutral", children }) {
  const styles = {
    success: { background: "var(--status-success-bg)", color: "var(--status-success-text)", border: "1px solid var(--status-success-border)" },
    warning: { background: "var(--status-warning-bg)", color: "var(--status-warning-text)", border: "1px solid var(--status-warning-border)" },
    danger:  { background: "var(--status-danger-bg)",  color: "var(--status-danger-text)",  border: "1px solid var(--status-danger-border)" },
    neutral: { background: "var(--status-neutral-bg)", color: "var(--status-neutral-text)", border: "1px solid var(--status-neutral-border)" },
    brand:   { background: "var(--brand-subtle)", color: "var(--text-brand)", border: "1px solid var(--brand-muted)" },
  };
  return <span style={{
    display: "inline-flex", alignItems: "center", gap: 4,
    fontSize: 11, fontWeight: 500, padding: "2px 8px",
    borderRadius: "var(--radius-full)", whiteSpace: "nowrap", ...styles[variant],
    fontFamily: "var(--font-sans)"
  }}>{children}</span>;
}

// ── Button ──────────────────────────────────────────────────────
function Button({ variant = "primary", size = "md", onClick, children, disabled, icon }) {
  const base = {
    display: "inline-flex", alignItems: "center", gap: 6,
    fontFamily: "var(--font-sans)", fontWeight: 500, border: "none",
    cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1,
    transition: "all 0.12s ease", letterSpacing: "0.01em", whiteSpace: "nowrap"
  };
  const sizes = {
    sm: { fontSize: 11, padding: "5px 11px", borderRadius: "var(--radius-sm)" },
    md: { fontSize: 13, padding: "8px 16px", borderRadius: "var(--radius-md)" },
  };
  const variants = {
    primary:   { background: "var(--jade-500)", color: "white", boxShadow: "var(--shadow-sm)" },
    secondary: { background: "var(--bg-surface)", color: "var(--text-primary)", border: "1px solid var(--border-default)", boxShadow: "var(--shadow-sm)" },
    ghost:     { background: "transparent", color: "var(--text-brand)" },
    danger:    { background: "var(--cinnabar-600)", color: "white" },
  };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant] }}>
    {icon && <Icon name={icon} size={13} />}
    {children}
  </button>;
}

// ── Input ───────────────────────────────────────────────────────
function Input({ label, value, onChange, placeholder, type = "text", hint, error, icon }) {
  const [focused, setFocused] = useState(false);
  return <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
    {label && <label style={{ fontSize: 12, fontWeight: 500, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>{label}</label>}
    <div style={{ position: "relative" }}>
      {icon && <span style={{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", color: "var(--text-muted)", display: "flex" }}>
        <Icon name={icon} size={14} />
      </span>}
      <input type={type} value={value} onChange={e => onChange && onChange(e.target.value)}
        placeholder={placeholder}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{
          fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-primary)",
          background: "var(--bg-surface)", border: `1px solid ${error ? "var(--border-danger)" : focused ? "var(--border-brand)" : "var(--border-default)"}`,
          borderRadius: "var(--radius-md)", padding: icon ? "7px 10px 7px 30px" : "7px 10px",
          outline: "none", width: "100%", boxShadow: focused ? "0 0 0 3px var(--brand-muted)" : "none",
          transition: "all 0.12s ease", boxSizing: "border-box"
        }} />
    </div>
    {error && <span style={{ fontSize: 11, color: "var(--text-danger)", fontFamily: "var(--font-sans)" }}>{error}</span>}
    {hint && !error && <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{hint}</span>}
  </div>;
}

// ── Sidebar ─────────────────────────────────────────────────────
function Sidebar({ activeScreen, onNavigate }) {
  const [collapsed, setCollapsed] = React.useState(false);

  const navGroups = [
    { label: "진료", items: [
      { key: "patients", icon: "layout-dashboard", label: "진료 현황" },
      { key: "chart",    icon: "stethoscope",       label: "진료 차트" },
      { key: "registry", icon: "users",            label: "환자 관리" },
      { key: "schedule", icon: "calendar",          label: "예약 관리" },
      { key: "payment",  icon: "credit-card",       label: "수납" },
      { key: "forms",    icon: "file-signature",    label: "서식 발급" },
    ]},
    { label: "청구", items: [
      { key: "claim",    icon: "file-text",         label: "보험 청구" },
    ]},
    { label: "처방", items: [
      { key: "prescriptions", icon: "flask-conical", label: "처방 관리" },
      { key: "inventory",     icon: "package",        label: "약재 재고" },
    ]},
    { label: "비품/운영", items: [
      { key: "supplies", icon: "boxes",          label: "소모품" },
      { key: "orders",   icon: "clipboard-list", label: "발주 이력" },
    ]},
    { label: "분석", items: [
      { key: "stats", icon: "bar-chart-2", label: "통계" },
      { key: "ai",    icon: "sparkles",    label: "AI 분석" },
    ]},
    { label: "조직", items: [
      { key: "staff", icon: "user-cog", label: "직원 관리" },
    ]},
  ];

  const navItem = (key, icon, label, isActive) => (
    <div key={key} onClick={() => onNavigate(key)} title={collapsed ? label : undefined}
      style={{
        display: "flex", alignItems: "center", justifyContent: collapsed ? "center" : "flex-start",
        gap: collapsed ? 0 : 8, padding: collapsed ? "8px 0" : "7px 8px",
        borderRadius: "var(--radius-md)", cursor: "pointer",
        background: isActive ? "var(--sidebar-active)" : "transparent",
        color: isActive ? "white" : "var(--ink-200)",
        fontSize: 13, fontWeight: isActive ? 500 : 400,
        transition: "background 0.12s ease, color 0.12s ease", fontFamily: "var(--font-sans)",
      }}>
      <Icon name={icon} size={15} />
      {!collapsed && label}
    </div>
  );

  return <div style={{
    width: collapsed ? 56 : 220, background: "var(--sidebar-bg)",
    display: "flex", flexDirection: "column", flexShrink: 0, height: "100%",
    transition: "width 0.2s ease", overflow: "hidden",
  }}>
    {collapsed ? (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "12px 0 10px", borderBottom: "1px solid rgba(255,255,255,0.08)", gap: 8, flexShrink: 0 }}>
        <div style={{ width: 30, height: 30, background: "var(--jade-500)", borderRadius: "var(--radius-sm)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 600, color: "white" }}>K</span>
        </div>
        <div key="expand-btn" onClick={() => setCollapsed(false)} style={{ cursor: "pointer", color: "var(--ink-300)", display: "flex", alignItems: "center", padding: 2, borderRadius: "var(--radius-sm)" }}>
          <Icon name="chevron-right" size={13} />
        </div>
      </div>
    ) : (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 14px 12px", borderBottom: "1px solid rgba(255,255,255,0.08)", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 30, height: 30, background: "var(--jade-500)", borderRadius: "var(--radius-sm)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <span style={{ fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 600, color: "white" }}>K</span>
          </div>
          <span style={{ fontFamily: "var(--font-serif)", fontSize: 15, fontWeight: 400, color: "var(--stone-50)", letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>KoMES</span>
        </div>
        <div key="collapse-btn" onClick={() => setCollapsed(true)} style={{ cursor: "pointer", color: "var(--ink-300)", display: "flex", alignItems: "center", padding: 3, borderRadius: "var(--radius-sm)" }}>
          <Icon name="chevron-left" size={13} />
        </div>
      </div>
    )}

    {navGroups.map(g => (
      <div key={g.label} style={{ padding: collapsed ? "10px 4px 2px" : "10px 8px 2px" }}>
        {!collapsed && <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.1em", color: "var(--ink-300)", textTransform: "uppercase", padding: "0 6px", marginBottom: 3 }}>{g.label}</div>}
        {g.items.map(item => navItem(item.key, item.icon, item.label, activeScreen === item.key))}
      </div>
    ))}

    <div style={{ padding: collapsed ? "10px 4px 2px" : "10px 8px 2px" }}>
      {navItem("settings", "settings", "설정", activeScreen === "settings")}
    </div>

    <div style={{ marginTop: "auto", padding: collapsed ? "10px 4px" : "10px 8px", borderTop: "1px solid rgba(255,255,255,0.08)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: collapsed ? "center" : "flex-start", gap: collapsed ? 0 : 8, padding: "6px 6px", borderRadius: "var(--radius-md)", cursor: "pointer" }}>
        <Avatar name="김" size={26} />
        {!collapsed && <>
          <div>
            <div style={{ fontSize: 12, color: "var(--bg-raised)", fontWeight: 500, fontFamily: "var(--font-sans)" }}>김민준</div>
            <div style={{ fontSize: 10, color: "var(--ink-300)", fontFamily: "var(--font-sans)" }}>원장</div>
          </div>
          <Icon name="chevrons-up-down" size={13} style={{ marginLeft: "auto", color: "var(--ink-300)" }} />
        </>}
      </div>
    </div>
  </div>;
}

// ── TopBar ──────────────────────────────────────────────────────
function TopBar({ title, subtitle, actions }) {
  return <div style={{
    height: 54, background: "var(--bg-surface)", borderBottom: "1px solid var(--border-subtle)",
    display: "flex", alignItems: "center", padding: "0 24px", gap: 12, flexShrink: 0
  }}>
    <div style={{ flex: 1 }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{title}</div>
      {subtitle && <div style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{subtitle}</div>}
    </div>
    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
      {actions}
      <div style={{ width: 1, height: 20, background: "var(--border-subtle)", margin: "0 4px" }}></div>
      <Icon name="bell" size={17} style={{ color: "var(--text-muted)", cursor: "pointer" }} />
    </div>
  </div>;
}

// Export everything
Object.assign(window, { Icon, Avatar, Badge, Button, Input, Sidebar, TopBar });

</script>

<script type="text/babel">
// KoMES — Left Rail: Mini Calendar + Tasks
const { useState: useStateRail, useMemo: useMemoRail } = React;

const KO_WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
const KO_MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

// Mock appointment density per day-of-month for the displayed month
const DAY_DENSITY = {
  3: 2, 4: 1, 5: 3, 8: 1, 10: 2, 11: 4, 12: 1, 15: 2, 17: 5, 18: 3,
  19: 2, 22: 1, 24: 3, 25: 2, 26: 4, 28: 1, 29: 2,
};

const SEED_TASKS = [
  { id: "t1", text: "한지민 환자 보험 청구 확인",     who: "김간호", due: "오늘 15:00", done: false, priority: "high" },
  { id: "t2", text: "재고 부족 약재 발주 (당귀, 황기)", who: "박실장", due: "오늘",       done: false, priority: "med"  },
  { id: "t3", text: "이민호 초진 차트 검토",            who: "원장",   due: "내일 09:00", done: false, priority: "med"  },
  { id: "t4", text: "정유미 처방 결과 추적 통화",       who: "김간호", due: "내일",       done: true,  priority: "low"  },
  { id: "t5", text: "주간 매출 보고서 정리",            who: "박실장", due: "금요일",     due_far: true, done: false, priority: "low"  },
];

function MiniCalendar() {
  const today = new Date();
  const [view, setView] = useStateRail({ y: today.getFullYear(), m: today.getMonth() }); // 0-indexed
  const [selected, setSelected] = useStateRail(today.getDate());

  const cells = useMemoRail(() => {
    const first = new Date(view.y, view.m, 1);
    const last = new Date(view.y, view.m + 1, 0);
    const startWeekday = first.getDay();
    const daysInMonth = last.getDate();
    const prevMonthLast = new Date(view.y, view.m, 0).getDate();
    const cells = [];
    // leading
    for (let i = startWeekday - 1; i >= 0; i--) {
      cells.push({ d: prevMonthLast - i, muted: true });
    }
    for (let d = 1; d <= daysInMonth; d++) cells.push({ d, muted: false });
    while (cells.length % 7 !== 0) cells.push({ d: cells.length - daysInMonth - startWeekday + 1, muted: true });
    return cells;
  }, [view]);

  const isToday = (cell) => !cell.muted && cell.d === today.getDate() && view.m === today.getMonth() && view.y === today.getFullYear();
  const move = (delta) => {
    const m = view.m + delta;
    if (m < 0) setView({ y: view.y - 1, m: 11 });
    else if (m > 11) setView({ y: view.y + 1, m: 0 });
    else setView({ y: view.y, m });
  };

  return (
    <div style={{ padding: "12px 14px 14px" }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
          <span style={{ fontFamily: "var(--font-serif)", fontSize: 16, fontWeight: 500, color: "var(--rail-text)", letterSpacing: "-0.01em" }}>
            {view.y}.{String(view.m + 1).padStart(2, "0")}
          </span>
          <span style={{ fontSize: 11, color: "var(--rail-text-muted)", fontFamily: "var(--font-sans)" }}>
            {KO_MONTHS[view.m]}
          </span>
        </div>
        <div style={{ display: "flex", gap: 2 }}>
          <button onClick={() => move(-1)} style={navBtn}><Icon name="chevron-left" size={13} /></button>
          <button onClick={() => { setView({ y: today.getFullYear(), m: today.getMonth() }); setSelected(today.getDate()); }}
            style={{ ...navBtn, fontSize: 10, fontWeight: 600, color: "var(--rail-text-secondary)", padding: "0 8px", width: "auto" }}>오늘</button>
          <button onClick={() => move(1)} style={navBtn}><Icon name="chevron-right" size={13} /></button>
        </div>
      </div>

      {/* Weekday header */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", marginBottom: 4 }}>
        {KO_WEEKDAYS.map((d, i) => (
          <div key={d} style={{
            textAlign: "center", fontSize: 10, fontWeight: 600,
            color: i === 0 ? "var(--cinnabar-600)" : i === 6 ? "var(--jade-600)" : "var(--rail-text-muted)",
            fontFamily: "var(--font-sans)", padding: "4px 0",
          }}>{d}</div>
        ))}
      </div>

      {/* Days grid */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
        {cells.map((cell, i) => {
          const dow = i % 7;
          const sel = !cell.muted && cell.d === selected;
          const td = isToday(cell);
          const density = !cell.muted ? DAY_DENSITY[cell.d] || 0 : 0;
          return (
            <div key={i} onClick={() => !cell.muted && setSelected(cell.d)}
              style={{
                aspectRatio: "1",
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                position: "relative", borderRadius: "var(--radius-sm)",
                cursor: cell.muted ? "default" : "pointer",
                background: sel ? "var(--jade-500)" : td ? "var(--brand-subtle)" : "transparent",
                border: td && !sel ? "1px solid var(--jade-300)" : "1px solid transparent",
                transition: "all 0.12s",
              }}>
              <span style={{
                fontSize: 12, fontWeight: sel || td ? 600 : 400,
                fontFamily: "var(--font-mono)",
                color: sel ? "#fff"
                  : cell.muted ? "var(--rail-text-muted)"
                  : dow === 0 ? "var(--cinnabar-600)"
                  : dow === 6 ? "var(--jade-600)"
                  : "var(--rail-text)",
              }}>{cell.d}</span>
              {density > 0 && !cell.muted && (
                <div style={{
                  position: "absolute", bottom: 3, display: "flex", gap: 1.5,
                }}>
                  {Array.from({ length: Math.min(density, 3) }).map((_, k) => (
                    <span key={k} style={{
                      width: 3, height: 3, borderRadius: "50%",
                      background: sel ? "rgba(255,255,255,0.85)" : "var(--jade-500)",
                    }} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Selected day summary */}
      <div style={{
        marginTop: 12, padding: "10px 12px",
        background: "var(--brand-subtle)", border: "1px solid var(--jade-100)",
        borderRadius: "var(--radius-md)",
        display: "flex", alignItems: "center", gap: 10,
      }}>
        <div style={{
          fontFamily: "var(--font-serif)", fontSize: 22, fontWeight: 500, color: "var(--text-brand)",
          lineHeight: 1, minWidth: 26, textAlign: "center",
        }}>{selected}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-sans)" }}>
            예약 {DAY_DENSITY[selected] || 0}건 · 대기 0건
          </div>
          <div style={{ fontSize: 10, color: "var(--rail-text-muted)", fontFamily: "var(--font-sans)" }}>
            {KO_MONTHS[view.m]} {selected}일 ({KO_WEEKDAYS[new Date(view.y, view.m, selected).getDay()]})
          </div>
        </div>
        <Icon name="chevron-right" size={14} style={{ color: "var(--jade-500)" }} />
      </div>
    </div>
  );
}

const navBtn = {
  width: 24, height: 24, display: "inline-flex", alignItems: "center", justifyContent: "center",
  background: "transparent", border: "1px solid var(--rail-border)", borderRadius: "var(--radius-sm)",
  cursor: "pointer", color: "var(--rail-text-secondary)",
};

function TaskItem({ task, onToggle }) {
  const priColors = {
    high: { dot: "var(--cinnabar-600)", text: "var(--status-danger-text)", bg: "var(--status-danger-bg)" },
    med:  { dot: "var(--amber-500)",    text: "var(--status-warning-text)",    bg: "var(--status-warning-bg)" },
    low:  { dot: "var(--ink-300)",      text: "var(--rail-text-muted)",   bg: "var(--bg-raised)" },
  }[task.priority] || {};
  return (
    <div style={{
      display: "flex", gap: 9, padding: "9px 12px",
      borderBottom: "1px solid var(--rail-divider)",
      opacity: task.done ? 0.55 : 1,
      cursor: "pointer",
    }} onClick={() => onToggle(task.id)}>
      <div style={{
        width: 14, height: 14, marginTop: 2, borderRadius: "var(--radius-sm)",
        border: `1.5px solid ${task.done ? "var(--jade-500)" : "var(--rail-border)"}`,
        background: task.done ? "var(--jade-500)" : "transparent",
        display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
      }}>
        {task.done && <Icon name="check" size={9} style={{ color: "#fff" }} />}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          fontSize: 12, fontWeight: 500, color: "var(--rail-text)",
          fontFamily: "var(--font-sans)", lineHeight: 1.4,
          textDecoration: task.done ? "line-through" : "none",
        }}>{task.text}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 4, flexWrap: "wrap" }}>
          <span style={{
            display: "inline-flex", alignItems: "center", gap: 3,
            fontSize: 10, color: "var(--rail-text-muted)", fontFamily: "var(--font-sans)",
          }}>
            <Icon name="user" size={9} />{task.who}
          </span>
          <span style={{
            fontSize: 10, fontFamily: "var(--font-mono)",
            color: task.due_far ? "var(--rail-text-muted)" : "var(--rail-text-secondary)",
            display: "inline-flex", alignItems: "center", gap: 3,
          }}>
            <Icon name="clock" size={9} />{task.due}
          </span>
          <span style={{
            display: "inline-flex", alignItems: "center", gap: 4,
            fontSize: 9, fontWeight: 600, color: priColors.text, background: priColors.bg,
            borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "1px 7px",
            fontFamily: "var(--font-sans)",
          }}>
            <span style={{ width: 5, height: 5, borderRadius: "50%", background: priColors.dot }} />
            {task.priority === "high" ? "높음" : task.priority === "med" ? "보통" : "낮음"}
          </span>
        </div>
      </div>
    </div>
  );
}

function TasksPanel() {
  const [tasks, setTasks] = useStateRail(SEED_TASKS);
  const [filter, setFilter] = useStateRail("open"); // open | all | done

  const visible = tasks.filter(t => filter === "all" ? true : filter === "done" ? t.done : !t.done);
  const openCount = tasks.filter(t => !t.done).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      {/* Section header */}
      <div style={{
        display: "flex", alignItems: "center", gap: 8,
        padding: "10px 14px 8px",
        borderBottom: "1px solid var(--rail-border)",
      }}>
        <Icon name="clipboard-list" size={14} style={{ color: "var(--jade-600)" }} />
        <span style={{
          fontFamily: "var(--font-sans)", fontSize: 13, fontWeight: 600, color: "var(--rail-text)",
        }}>업무</span>
        <span style={{
          fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 700, color: "var(--text-brand)",
          background: "var(--brand-muted)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
          padding: "1px 7px",
        }}>{openCount}</span>

        <button style={{
          marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 3,
          fontSize: 10, fontWeight: 500, color: "var(--text-brand)",
          background: "transparent", border: "1px solid var(--brand-muted)",
          borderRadius: "var(--radius-sm)", padding: "2px 7px", cursor: "pointer",
          fontFamily: "var(--font-sans)",
        }}>
          <Icon name="plus" size={10} />추가
        </button>
      </div>

      {/* Filter tabs */}
      <div style={{ display: "flex", gap: 4, padding: "8px 12px", borderBottom: "1px solid var(--rail-divider)" }}>
        {[{ k: "open", l: "진행 중" }, { k: "done", l: "완료" }, { k: "all", l: "전체" }].map(t => (
          <button key={t.k} onClick={() => setFilter(t.k)} style={{
            fontSize: 11, fontWeight: filter === t.k ? 600 : 400,
            padding: "3px 8px", borderRadius: "var(--radius-sm)",
            background: filter === t.k ? "var(--rail-surface)" : "transparent",
            border: filter === t.k ? "1px solid var(--rail-border)" : "1px solid transparent",
            color: filter === t.k ? "var(--rail-text)" : "var(--rail-text-muted)",
            cursor: "pointer", fontFamily: "var(--font-sans)",
          }}>{t.l}</button>
        ))}
      </div>

      {/* Task list */}
      <div style={{ flex: 1, overflowY: "auto", minHeight: 0 }}>
        {visible.length === 0 ? (
          <div style={{
            padding: "24px 16px", textAlign: "center",
            fontSize: 11, color: "var(--rail-text-muted)", fontFamily: "var(--font-sans)",
          }}>업무가 없습니다.</div>
        ) : visible.map(t => (
          <TaskItem key={t.id} task={t} onToggle={(id) => {
            setTasks(prev => prev.map(x => x.id === id ? { ...x, done: !x.done } : x));
          }} />
        ))}
      </div>
    </div>
  );
}

function LeftRail() {
  return (
    <div style={{
      width: 280, flexShrink: 0,
      background: "var(--rail-bg)",
      borderRight: "1px solid var(--rail-border)",
      display: "flex", flexDirection: "column",
      minHeight: 0,
    }}>
      <MiniCalendar />
      <div style={{ height: 8, background: "var(--rail-stripe)", borderTop: "1px solid var(--rail-border)", borderBottom: "1px solid var(--rail-border)" }} />
      <TasksPanel />
    </div>
  );
}

Object.assign(window, { LeftRail });

</script>

<script type="text/babel">
// KoMES — New Patient Registration Modal

const initialNP = {
  // 기본
  name: "", nameHanja: "", gender: "여", birth: "", rrnTail: "",
  phone: "", phone2: "",
  postcode: "", address: "", addressDetail: "",
  // 진료
  visitType: "초진", referrer: "", chief: "",
  category: "내과", room: "진료실 1", attendingDoctor: "김민준 원장",
  // 보험
  insuranceType: "건강보험", insuranceNo: "", relation: "본인",

  tags: [],
  // 관계도 (가족 / 지인 소개)

  // 메모

const TAG_OPTIONS = [
  { key: "VIP",     icon: "crown",      bg: "var(--status-warning-bg)",   color: "var(--status-warning-text)",   border: "var(--status-warning-border)" },
  { key: "임신부",  icon: "baby",       bg: "var(--status-danger-bg)", color: "var(--status-danger-text)", border: "var(--status-danger-border)" },
  { key: "알러지",  icon: "alert-triangle", bg: "var(--status-danger-bg)", color: "var(--status-danger-text)", border: "var(--status-danger-border)" },
  { key: "보호자",  icon: "users",      bg: "var(--bg-raised)",    color: "var(--text-secondary)",      border: "var(--border-subtle)" },
  { key: "노인",    icon: "user",       bg: "var(--bg-raised)",    color: "var(--text-secondary)",      border: "var(--border-subtle)" },
  { key: "소아",    icon: "smile",      bg: "var(--brand-muted)",     color: "var(--text-brand)",     border: "var(--brand-muted)" },
  { key: "산정특례",icon: "shield-check", bg: "var(--brand-muted)",   color: "var(--text-brand)",     border: "var(--brand-muted)" },
  { key: "연예인",  icon: "star",       bg: "var(--status-danger-bg)", color: "var(--status-danger-text)", border: "var(--status-danger-border)" },

function FieldLabel({ children, required, hint }) {

    <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 5 }}>

      </span>
      {required && <span style={{ color: "var(--cinnabar-600)", fontSize: 12 }}>*</span>}

    </div>

}

function TextField({ value, onChange, placeholder, mono, suffix, prefix, type = "text", disabled, monoMid }) {
  const [focused, setFocused] = useStateNP(false);
  return (
    <div style={{
      display: "flex", alignItems: "center",
      background: disabled ? "var(--bg-raised)" : "var(--bg-surface)",
      border: `1px solid ${focused ? "var(--border-brand)" : "var(--border-default)"}`,
      borderRadius: "var(--radius-md)",
      boxShadow: focused ? "0 0 0 3px var(--jade-100)" : "none",
      transition: "all 0.12s",
      paddingRight: suffix ? 10 : 0,
      paddingLeft: prefix ? 10 : 0,
    }}>
      {prefix && <span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginRight: 6 }}>{prefix}</span>}
      <input type={type} value={value} disabled={disabled}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        placeholder={placeholder}
        style={{
          flex: 1, border: "none", background: "transparent",
          padding: "8px 10px", fontSize: 13, outline: "none",

function SegmentedSelect({ options, value, onChange }) {

    <div style={{

        <button key={opt} onClick={() => onChange(opt)} style={{

          borderRadius: "var(--radius-sm)",
          boxShadow: value === opt ? "var(--shadow-sm)" : "none",
          fontFamily: "var(--font-sans)", transition: "all 0.12s",

}

function SelectField({ value, onChange, options }) {
  return (
    <div style={{ position: "relative" }}>
      <select value={value} onChange={e => onChange(e.target.value)} style={{
        width: "100%", padding: "8px 32px 8px 10px", fontSize: 13,
        fontFamily: "var(--font-sans)", color: "var(--text-primary)",
        background: "var(--bg-surface)", border: "1px solid var(--border-default)",
        borderRadius: "var(--radius-md)", appearance: "none", cursor: "pointer",
        outline: "none",
      }}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}

      <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", pointerEvents: "none", color: "var(--text-muted)" }}>

function SectionCard({ icon, title, hint, children, step }) {

      <div style={{
        display: "flex", alignItems: "center", gap: 10,
        padding: "12px 18px", borderBottom: "1px solid var(--border-subtle)",
        background: "var(--bg-raised)",
      }}>
        <div style={{
          width: 24, height: 24, borderRadius: "50%",

      </div>
      <div style={{ padding: "16px 18px" }}>{children}</div>
    </div>
  );
}

  const irClaimable = days <= 17; // 2주 3일 이내 IR 2부위 청구 가능

  const CHUNA_MAX = 20;
  const HERB_MAX = 21;

// ── 사용 한도 progress bar ───────────────────────────────────────
function UsageBar({ icon, label, used, max, unit, pct, warn, hint }) {
  const remaining = Math.max(0, max - used);
  const barColor = warn ? "var(--amber-400)" : "var(--brand)";
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 5, minWidth: 0 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <Icon name={icon} size={12} style={{ color: "var(--stone-200)", flexShrink: 0, alignSelf: "center" }} />
        <span style={{ fontSize: 11, fontWeight: 600, color: "var(--stone-100)", fontFamily: "var(--font-sans)", flexShrink: 0 }}>
          {label}
        </span>
        <span style={{ fontSize: 10, color: "var(--stone-400)", fontFamily: "var(--font-sans)", flexShrink: 0 }}>
          {hint}
        </span>
        <div style={{ flex: 1 }} />
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 600, color: warn ? "var(--status-warning-border)" : "var(--stone-50)", lineHeight: 1, letterSpacing: "-0.01em", flexShrink: 0 }}>
          {used}<span style={{ fontSize: 11, color: "var(--stone-400)", fontWeight: 400, margin: "0 1px" }}>/</span>{max}
          <span style={{ fontSize: 10, color: "var(--stone-300)", fontWeight: 400, marginLeft: 2 }}>{unit}</span>
        </span>
      </div>
      <div style={{ position: "relative", height: 6, background: "rgba(255,255,255,0.12)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", overflow: "hidden" }}>
        <div style={{
          width: `${pct}%`, height: "100%",
          background: barColor,
          transition: "width 0.3s",
        }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "var(--stone-400)", fontFamily: "var(--font-mono)" }}>
        <span>{used >= max ? "한도 도달" : `잔여 ${remaining}${unit}`}</span>
        <span>{Math.round(pct)}%</span>
      </div>
    </div>
  );
}

// ── 상병 섹션 ────────────────────────────────────────────────────
function DiagnosisSection({ initialDx = [] }) {
  const [dx, setDx] = useStateCAP(initialDx);
  const [adding, setAdding] = useStateCAP(false);
  const [query, setQuery] = useStateCAP("");

  const matches = query.trim()
    ? DIAGNOSIS_CATALOG.filter(c => c.name.includes(query) || c.code.toLowerCase().includes(query.toLowerCase())).slice(0, 6)
    : DIAGNOSIS_CATALOG.slice(0, 5);

  const aiSuggestions = ["S13.4", "M54.2"]
    .filter(c => !dx.find(d => d.code === c))
    .map(c => DIAGNOSIS_CATALOG.find(x => x.code === c))
    .filter(Boolean);

  const addDx = (item, primary = false) => {
    if (dx.find(d => d.code === item.code)) return;
    const exists = dx.find(d => d.primary);
    setDx(prev => [...prev, { ...item, primary: primary || !exists }]);
    setQuery(""); setAdding(false);
  };

  const remove = (code) => setDx(prev => prev.filter(d => d.code !== code));
  const setPrimary = (code) => setDx(prev => prev.map(d => ({ ...d, primary: d.code === code })));

  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)", padding: "14px 16px", marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="file-text" size={14} style={{ color: "var(--jade-600)" }} />
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>상병</span>
        <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>KCD-8</span>
        <span style={{ fontSize: 11, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-mono)", background: "var(--brand-muted)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "1px 7px" }}>
          {dx.length}건

          marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 4,
          fontSize: 11, fontWeight: 500, color: "var(--text-brand)",
          background: adding ? "var(--brand-muted)" : "var(--bg-surface)", border: "1px solid var(--brand-muted)",
          borderRadius: "var(--radius-sm)", padding: "3px 9px", cursor: "pointer", fontFamily: "var(--font-sans)",
        }}>
          <Icon name={adding ? "x" : "plus"} size={11} />{adding ? "닫기" : "상병 추가"}
        </button>
      </div>

      {/* 등록된 상병 */}
      {dx.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: adding ? 12 : 0 }}>
          {dx.map(d => (
            <div key={d.code} style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "7px 12px", borderRadius: "var(--radius-md)",
              border: `1px solid ${d.primary ? "var(--jade-300)" : "var(--border-subtle)"}`,
              background: d.primary ? "var(--brand-subtle)" : "var(--bg-raised)",
            }}>
              <span style={{
                fontSize: 9, fontWeight: 700, padding: "2px 6px",
                color: d.primary ? "#fff" : "var(--text-muted)",
                background: d.primary ? "var(--jade-500)" : "var(--bg-raised)",
                borderRadius: "var(--radius-sm)", letterSpacing: "0.04em",
                fontFamily: "var(--font-sans)",
                cursor: d.primary ? "default" : "pointer",
              }} onClick={() => !d.primary && setPrimary(d.code)}>
                {d.primary ? "주상병" : "부상병"}

              style={{ flex: 1, border: "none", outline: "none", fontSize: 13, fontFamily: "var(--font-sans)", background: "transparent" }} />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 3, maxHeight: 200, overflowY: "auto" }}>
            {matches.map(m => (
              <div key={m.code} onClick={() => addDx(m)} style={{
                display: "flex", alignItems: "center", gap: 10, padding: "6px 10px",
                background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",

              </div>
            ))}

        </div>
      )}
    </div>
  );

// ── Tab 자동완성 텍스트영역 ──────────────────────────────────────
function TabAutocompleteTextarea({ value, onChange, snippets = [], placeholder, rows = 2 }) {
  const ref = useRefCAP(null);

  const ghost = useMemoCAP(() => {
    if (!value) return "";
    const trimmedTail = value.split(/[.\n]/).pop().trim();
    if (!trimmedTail) return "";
    const match = snippets.find(s => trimmedTail.includes(s.trigger) && !value.includes(s.suffix.trim().slice(0, 8)));
    return match ? match.suffix : "";
  }, [value, snippets]);

  const onKey = (e) => {
    if (e.key === "Tab" && ghost) {
      e.preventDefault();
      onChange(value + ghost);
    }
  };

  return (
    <div style={{ position: "relative", width: "100%" }}>
      {/* Ghost shadow text overlay */}
      {ghost && (
        <div aria-hidden style={{
          position: "absolute", inset: 0,
          padding: "7px 10px", fontSize: 13, fontFamily: "var(--font-sans)",
          color: "transparent", pointerEvents: "none",
          whiteSpace: "pre-wrap", wordBreak: "break-word", lineHeight: 1.6,
          boxSizing: "border-box",
        }}>
          <span>{value}</span>
          <span style={{ color: "var(--jade-400)", background: "var(--brand-subtle)", borderRadius: 2, padding: "0 2px" }}>{ghost}</span>
        </div>
      )}

// ── 액팅 오더 섹션 (자보 경과 인지) ──────────────────────────────
function ActingOrderPanel({ injuryDate, today = new Date() }) {
  const days = injuryDate ? Math.max(0, Math.floor((today - new Date(injuryDate)) / 86400000)) : null;
  const phase = days == null ? null : days <= 7 ? 1 : days <= 28 ? 2 : 3;

  const [orders, setOrders] = useStateCAP(() => ACTING_ORDER_CATALOG.filter(c => c.default).map(c => ({
    code: c.code, sites: c.key === "경혈 침술 1부위" ? "백회, 풍지, 천주" : "견정, 견우, 곡지",
    count: 12, done: false,
  })));
  const [showCatalog, setShowCatalog] = useStateCAP(false);

  const addOrder = (cat) => {
    setOrders(prev => [...prev, { code: cat.code, sites: "", count: 10, done: false }]);
    setShowCatalog(false);
  };

  const removeOrder = (i) => setOrders(prev => prev.filter((_, idx) => idx !== i));
  const toggleDone = (i) => setOrders(prev => prev.map((o, idx) => idx === i ? { ...o, done: !o.done } : o));
  const updateSites = (i, v) => setOrders(prev => prev.map((o, idx) => idx === i ? { ...o, sites: v } : o));

  return (
    <div style={{ background: "var(--bg-surface)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)", padding: "14px 16px", marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="zap" size={14} style={{ color: "var(--jade-600)" }} />
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>액팅 오더</span>
        <span style={{ fontSize: 11, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-mono)", background: "var(--brand-muted)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "1px 7px" }}>
          {orders.length}건
        </span>
        {phase && (
          <span style={{ fontSize: 10, fontWeight: 600, color: "var(--text-muted)", fontFamily: "var(--font-sans)", background: "var(--bg-raised)", border: "1px solid var(--border-default)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "1px 8px" }}>
            자보 · {phase === 1 ? "급성기" : phase === 2 ? "아급성기" : "만성기"} 적용
          </span>
        )}
        <button onClick={() => setShowCatalog(!showCatalog)} style={{
          marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 4,
          fontSize: 11, fontWeight: 500, color: "var(--text-brand)",
          background: showCatalog ? "var(--brand-muted)" : "var(--bg-surface)", border: "1px solid var(--brand-muted)",
          borderRadius: "var(--radius-sm)", padding: "3px 9px", cursor: "pointer", fontFamily: "var(--font-sans)",
        }}>
          <Icon name={showCatalog ? "x" : "plus"} size={11} />{showCatalog ? "닫기" : "오더 추가"}
        </button>
      </div>

      {/* 등록된 액팅 오더 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: showCatalog ? 12 : 0 }}>
        {orders.map((o, i) => {
          const cat = ACTING_ORDER_CATALOG.find(c => c.code === o.code);
          if (!cat) return null;
          return (
            <div key={i} style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "7px 12px", borderRadius: "var(--radius-md)",
              background: o.done ? "var(--bg-raised)" : "var(--bg-surface)",
              border: `1px solid ${o.done ? "var(--border-subtle)" : "var(--border-default)"}`,
              opacity: o.done ? 0.7 : 1, transition: "all 0.12s",
            }}>
              <div onClick={() => toggleDone(i)} style={{
                width: 16, height: 16, borderRadius: "var(--radius-sm)",
                border: `2px solid ${o.done ? "var(--jade-400)" : "var(--border-default)"}`,
                background: o.done ? "var(--jade-400)" : "transparent",
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0, cursor: "pointer",
              }}>
                {o.done && <Icon name="check" size={10} style={{ color: "white" }} />}
              </div>
              <span style={{ fontSize: 9, fontWeight: 600, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{cat.code}</span>
              <span style={{ fontSize: 11, fontWeight: 700, color: cat.color, background: `${cat.color}18`, padding: "2px 7px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)", flexShrink: 0 }}>
                {cat.short}
              </span>
              <span style={{ fontSize: 12, fontWeight: 500, color: "var(--text-primary)", fontFamily: "var(--font-sans)", flexShrink: 0 }}>
                {cat.key}
              </span>
              <input value={o.sites} onChange={e => updateSites(i, e.target.value)}
                placeholder="부위 / 경혈"
                style={{ flex: 1, minWidth: 60, fontSize: 12, fontFamily: "var(--font-sans)", color: "var(--text-secondary)", border: "none", outline: "none", background: "transparent", padding: "2px 4px", borderBottom: "1px dashed var(--border-subtle)" }} />
              <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)", flexShrink: 0 }}>{cat.duration}분</span>
              <button onClick={() => removeOrder(i)} style={{ display: "inline-flex", alignItems: "center", padding: 3, background: "transparent", border: "none", color: "var(--text-muted)", cursor: "pointer" }}>
                <Icon name="x" size={13} />
              </button>
            </div>
          );
        })}
      </div>

      {/* AI 추천 액팅 */}
      {!showCatalog && phase && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
          <Icon name="sparkles" size={11} style={{ color: "var(--jade-600)" }} />
          <span style={{ fontSize: 10, fontWeight: 700, color: "var(--text-brand)", letterSpacing: "0.04em", textTransform: "uppercase", fontFamily: "var(--font-sans)" }}>AI 추천</span>
          {ACTING_ORDER_CATALOG
            .filter(c => c.allowedPhases.includes(phase) && !orders.find(o => o.code === c.code) && ["40080", "40300"].includes(c.code))
            .slice(0, 3)
            .map(c => (
              <button key={c.code} onClick={() => addOrder(c)} style={{
                display: "inline-flex", alignItems: "center", gap: 5,
                fontSize: 11, color: c.color,
                background: `${c.color}12`, border: `1px dashed ${c.color}55`,
                borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "3px 9px",
                cursor: "pointer", fontFamily: "var(--font-sans)",
              }}>
                <Icon name="plus" size={10} />
                {c.key}
              </button>
            ))}
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>· 상병 + 경과 단계 기반</span>
        </div>
      )}

      {/* 카탈로그 */}
      {showCatalog && (
        <div style={{ background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", padding: 12 }}>
          {phase && (
            <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 8 }}>
              <Icon name="info" size={10} style={{ verticalAlign: "middle", marginRight: 4 }} />
              자보 환자 — 현재 <strong>{phase === 1 ? "급성기" : phase === 2 ? "아급성기" : "만성기"}</strong> · 청구 가능한 항목만 활성화됩니다
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 6 }}>
            {ACTING_ORDER_CATALOG.map(c => {
              const allowed = !phase || c.allowedPhases.includes(phase);
              const already = orders.find(o => o.code === c.code);
              return (
                <button key={c.code} disabled={!allowed || already} onClick={() => addOrder(c)} style={{
                  display: "flex", alignItems: "center", gap: 8,
                  padding: "7px 10px", borderRadius: "var(--radius-sm)",
                  background: already ? "var(--bg-raised)" : "var(--bg-surface)",
                  border: `1px solid ${allowed ? "var(--border-subtle)" : "var(--status-danger-border)"}`,
                  opacity: allowed && !already ? 1 : 0.45,
                  cursor: allowed && !already ? "pointer" : "not-allowed",
                  textAlign: "left", transition: "all 0.12s",
                }}
                onMouseEnter={e => { if (allowed && !already) { e.currentTarget.style.background = "var(--brand-subtle)"; e.currentTarget.style.borderColor = "var(--jade-300)"; } }}
                onMouseLeave={e => { if (allowed && !already) { e.currentTarget.style.background = "var(--bg-surface)"; e.currentTarget.style.borderColor = "var(--border-subtle)"; } }}>
                  <span style={{ fontSize: 10, fontWeight: 700, color: c.color, background: `${c.color}18`, padding: "2px 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)", minWidth: 46, textAlign: "center", flexShrink: 0 }}>
                    {c.short}
                  </span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{c.key}</div>
                    <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{c.code} · {c.duration}분{c.note ? ` · ${c.note}` : ""}</div>
                  </div>
                  {already && <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>등록됨</span>}
                  {!allowed && <span style={{ fontSize: 9, color: "var(--status-danger-text)", fontWeight: 600, background: "var(--status-danger-bg)", borderRadius: "var(--radius-sm)", padding: "1px 5px", fontFamily: "var(--font-sans)" }}>청구 불가</span>}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── 액팅 오더 청구 요약 패널 (오늘 액팅 비용) ─────────────────────
function ActingBillingPanel({ orders = null, insurance = "건강보험" }) {
  // 데모: 현재 차트의 오늘 액팅 — 침-1 + 침-2 + 전침 + 건부항 (자보) 가정
  const demoOrders = orders || [
    { code: "40020", count: 1 },
    { code: "40021", count: 1 },
    { code: "40080", count: 1 },
    { code: "40300", count: 1 },
  ];

  const items = demoOrders
    .map(o => {
      const cat = ACTING_ORDER_CATALOG.find(c => c.code === o.code);
      if (!cat) return null;
      return { ...cat, count: o.count, subtotal: cat.fee * o.count };
    })
    .filter(Boolean);

  const total = items.reduce((s, it) => s + it.subtotal, 0);
  const isAuto = insurance === "자보";
  const patientPay = isAuto ? 0 : Math.round(total * 0.4); // 본인부담 40% 가정 (한방 외래)
  const insurancePay = total - patientPay;

  const fmt = (n) => n.toLocaleString("ko-KR");

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <Icon name="receipt" size={15} style={{ color: "var(--jade-600)" }} />
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>오늘 액팅 청구</span>
        <span style={{
          marginLeft: "auto", fontSize: 10, fontWeight: 600, color: isAuto ? "var(--status-danger-text)" : "var(--text-brand)",
          background: isAuto ? "var(--status-danger-bg)" : "var(--brand-muted)",
          border: `1px solid ${isAuto ? "var(--status-danger-border)" : "var(--brand-muted)"}`,
          borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "1px 8px", fontFamily: "var(--font-sans)",
        }}>{insurance}</span>
      </div>

      {/* 항목 라인 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
        {items.map((it, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: i < items.length - 1 ? "1px dashed var(--border-subtle)" : "none" }}>
            <span style={{ fontSize: 9, fontWeight: 700, color: "var(--text-muted)", fontFamily: "var(--font-mono)", minWidth: 36 }}>{it.code}</span>
            <span style={{ fontSize: 12, color: "var(--text-primary)", fontFamily: "var(--font-sans)", flex: 1 }}>
              {it.key}
              {it.count > 1 && <span style={{ fontSize: 10, color: "var(--text-muted)", marginLeft: 4, fontFamily: "var(--font-mono)" }}>×{it.count}</span>}
            </span>
            <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-mono)" }}>
              ₩{fmt(it.subtotal)}
            </span>
          </div>
        ))}
      </div>

      {/* 합계 */}
      <div style={{
        background: "var(--bg-raised)", border: "1px solid var(--border-subtle)",
        borderRadius: "var(--radius-md)", padding: "10px 12px",
        display: "flex", flexDirection: "column", gap: 6,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
          <span>총 진료비</span>
          <span style={{ fontFamily: "var(--font-mono)" }}>₩{fmt(total)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
          <span>{isAuto ? "보험사 청구" : "공단 부담"}</span>
          <span style={{ fontFamily: "var(--font-mono)" }}>₩{fmt(insurancePay)}</span>
        </div>
        <div style={{ height: 1, background: "var(--border-subtle)", margin: "2px 0" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>
            {isAuto ? "환자 부담" : "본인 부담"}
          </span>
          <span style={{ fontSize: 18, fontWeight: 700, color: isAuto ? "var(--text-brand)" : "var(--status-danger-text)", fontFamily: "var(--font-mono)", letterSpacing: "-0.01em" }}>
            ₩{fmt(patientPay)}
          </span>
        </div>
        {isAuto && (
          <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginTop: 2 }}>
            자보 환자 — 환자 본인부담금 없음
          </div>
        )}
      </div>

      <button style={{
        width: "100%", marginTop: 10, padding: "8px 12px",
        background: "var(--jade-500)", color: "#fff", border: "none",
        borderRadius: "var(--radius-md)", fontSize: 12, fontWeight: 600,
        cursor: "pointer", fontFamily: "var(--font-sans)",
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
        boxShadow: "var(--shadow-sm)",
      }}>
        <Icon name="credit-card" size={13} />수납 처리
      </button>
    </div>
  );
}

              patients={stagePatients}

}

      background: filter === item.key ? "var(--brand-muted)" : "transparent",
      color: filter === item.key ? "var(--text-brand)" : "var(--text-secondary)",
      fontSize: 12, fontWeight: filter === item.key ? 600 : 400,
      fontFamily: "var(--font-sans)", transition: "all 0.12s",
    }}>
      <Icon name={item.icon} size={13} />
      <span style={{ flex: 1 }}>{item.label}</span>
      <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: filter === item.key ? "var(--text-brand)" : "var(--text-muted)" }}>
        {counts[item.key] ?? 0}
      </span>
    </div>
  );

  return (
    <div style={{ width: 220, flexShrink: 0, borderRight: "1px solid var(--border-subtle)", background: "var(--bg-surface)", overflowY: "auto", padding: "14px 10px" }}>
      <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.08em", color: "var(--text-muted)", textTransform: "uppercase", padding: "0 10px", marginBottom: 6, fontFamily: "var(--font-sans)" }}>상태</div>
      {items.map(renderRow)}

      <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.08em", color: "var(--text-muted)", textTransform: "uppercase", padding: "0 10px", margin: "16px 0 6px", fontFamily: "var(--font-sans)" }}>태그</div>
      {tagItems.map(renderRow)}

      <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.08em", color: "var(--text-muted)", textTransform: "uppercase", padding: "0 10px", margin: "16px 0 6px", fontFamily: "var(--font-sans)" }}>관계도</div>
      {relItems.map(renderRow)}
    </div>
  );
}

// ── Patient Row ──────────────────────────────────────────────────

      borderBottom: "1px solid var(--border-subtle)",
      fontFamily: "var(--font-sans)",
      transition: "all 0.1s",
    }}
      onMouseEnter={e => { if (!selected) e.currentTarget.style.background = "var(--bg-raised)"; }}
      onMouseLeave={e => { if (!selected) e.currentTarget.style.background = "transparent"; }}>

      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", lineHeight: 1.3 }}>

        </div>
        <div style={{ fontSize: 10, color: "var(--text-muted)" }}>{p.gender} · 만 {p.age}세 · {p.dob}</div>

      <span style={{ fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{p.phone}</span>
      <span style={{ fontSize: 11, color: "var(--text-secondary)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.chief}</span>
      <span style={{
        fontSize: 10, fontWeight: 600, padding: "2px 8px",
        borderRadius: "var(--radius-full)", whiteSpace: "nowrap", textAlign: "center",
        ...tagStyle(p.insurance === "자보" ? "자보" : ""),
        background: p.insurance === "자보" ? "var(--status-danger-bg)" : "var(--bg-raised)",
        color: p.insurance === "자보" ? "var(--status-danger-text)" : "var(--text-secondary)",
        border: `1px solid ${p.insurance === "자보" ? "var(--status-danger-border)" : "var(--border-subtle)"}`,
        justifySelf: "start",
      }}>{p.insurance}</span>
      <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
        {p.tags.slice(0, 2).map(t => {
          const s = tagStyle(t);
          return (
            <span key={t} style={{
              fontSize: 10, fontWeight: 600, padding: "1px 7px",
              borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
              background: s.bg, color: s.color, border: `1px solid ${s.border}`,
            }}>{t}</span>

        {p.tags.length > 2 && <span style={{ fontSize: 10, color: "var(--text-muted)" }}>+{p.tags.length - 2}</span>}

}

// ── Relations Editor (관계도) ────────────────────────────────────
function RelationsPanel({ patient, allPatients, onPatientClick }) {
  const [relations, setRelations] = useStateMgr(patient.relations || []);
  const [adding, setAdding] = useStateMgr(false);
  const [searchQ, setSearchQ] = useStateMgr("");
  const [pickedType, setPickedType] = useStateMgr("배우자");

  useEffectMgr(() => {
    setRelations(patient.relations || []);
    setAdding(false);
    setSearchQ("");
  }, [patient.id]);

  const candidates = useMemoMgr(() => {
    const q = searchQ.trim();
    const excludeIds = new Set([patient.id, ...relations.map(r => r.id)]);
    let pool = allPatients.filter(p => !excludeIds.has(p.id));
    if (q) pool = pool.filter(p => p.name.includes(q) || p.phone.includes(q));
    return pool.slice(0, 6);
  }, [searchQ, relations, patient.id, allPatients]);

  const addRelation = (id) => {
    setRelations(prev => [...prev, { id, type: pickedType }]);
    setSearchQ("");
  };
  const removeRelation = (id) => setRelations(prev => prev.filter(r => r.id !== id));
  const setType = (id, type) => setRelations(prev => prev.map(r => r.id === id ? { ...r, type } : r));

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="share-2" size={14} style={{ color: "var(--jade-600)" }} />
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>관계도</span>
        <span style={{ fontSize: 11, fontWeight: 600, color: "var(--text-brand)", fontFamily: "var(--font-mono)", background: "var(--brand-muted)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", padding: "1px 7px" }}>
          {relations.length}건
        </span>
        <button onClick={() => setAdding(!adding)} style={{
          marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 4,
          fontSize: 11, fontWeight: 500, color: "var(--text-brand)",
          background: adding ? "var(--brand-muted)" : "transparent", border: "1px solid var(--brand-muted)",
          borderRadius: "var(--radius-sm)", padding: "3px 9px", cursor: "pointer", fontFamily: "var(--font-sans)",
        }}>
          <Icon name={adding ? "x" : "plus"} size={11} />{adding ? "닫기" : "관계 추가"}
        </button>
      </div>

      {/* Existing relations */}
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: adding ? 12 : 0 }}>
        {relations.length === 0 && (
          <div style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)", padding: "12px", textAlign: "center", border: "1px dashed var(--border-subtle)", borderRadius: "var(--radius-md)" }}>
            등록된 관계가 없습니다. 가족이나 지인을 추가해 보세요.
          </div>
        )}
        {relations.map(rel => {
          const target = PATIENT_BY_ID[rel.id];
          if (!target) return null;
          const typeInfo = RELATION_TYPES.find(t => t.key === rel.type) || RELATION_TYPES[0];
          return (
            <div key={rel.id} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
              border: "1px solid var(--border-subtle)", background: "var(--bg-raised)",
              borderRadius: "var(--radius-md)",
            }}>
              <select value={rel.type} onChange={e => setType(rel.id, e.target.value)} style={{
                fontSize: 10, fontWeight: 600, padding: "3px 6px",
                color: typeInfo.color, background: `${typeInfo.color}18`,
                border: `1px solid ${typeInfo.color}33`,
                borderRadius: "var(--radius-full)", whiteSpace: "nowrap", fontFamily: "var(--font-sans)",
                cursor: "pointer", outline: "none",
              }}>
                {RELATION_TYPES.map(t => <option key={t.key} value={t.key}>{t.key}</option>)}
              </select>
              <Avatar name={target.name} size={26} />
              <div onClick={() => onPatientClick(target)} style={{ cursor: "pointer", flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{target.name}</div>
                <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{target.gender} · {target.age}세 · 내원 {target.visitCount}회</div>
              </div>
              <button onClick={() => onPatientClick(target)} title="차트로 이동" style={{ ...iconBtnSmall, color: "var(--jade-600)" }}>
                <Icon name="external-link" size={12} />
              </button>
              <button onClick={() => removeRelation(rel.id)} title="삭제" style={iconBtnSmall}>
                <Icon name="x" size={12} />
              </button>
            </div>
          );
        })}
      </div>

      {/* Add new relation */}
      {adding && (
        <div style={{ background: "var(--brand-subtle)", border: "1px solid var(--brand-muted)", borderRadius: "var(--radius-md)", padding: 12 }}>
          {/* Type picker */}
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-brand)", marginBottom: 6, fontFamily: "var(--font-sans)" }}>관계 유형</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 12 }}>
            {RELATION_TYPES.map(t => {
              const active = pickedType === t.key;
              return (
                <button key={t.key} onClick={() => setPickedType(t.key)} style={{
                  display: "inline-flex", alignItems: "center", gap: 4,
                  fontSize: 11, padding: "3px 9px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                  border: `1px solid ${active ? t.color : "var(--border-subtle)"}`,
                  background: active ? `${t.color}22` : "var(--bg-surface)",
                  color: active ? t.color : "var(--text-secondary)",
                  fontWeight: active ? 600 : 400,
                  cursor: "pointer", fontFamily: "var(--font-sans)",
                }}>
                  <Icon name={t.icon} size={10} />{t.key}
                </button>
              );
            })}
          </div>

          {/* Patient search */}
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-brand)", marginBottom: 6, fontFamily: "var(--font-sans)" }}>환자 검색</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 10px", background: "var(--bg-surface)", border: "1px solid var(--border-default)", borderRadius: "var(--radius-md)", marginBottom: 8 }}>
            <Icon name="search" size={13} style={{ color: "var(--text-muted)" }} />
            <input value={searchQ} onChange={e => setSearchQ(e.target.value)} placeholder="등록된 환자 이름·연락처로 검색"
              style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 12, fontFamily: "var(--font-sans)", color: "var(--text-primary)" }}
            />
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
            {candidates.length === 0 && (
              <div style={{ fontSize: 11, color: "var(--text-muted)", padding: "8px", textAlign: "center", fontFamily: "var(--font-sans)" }}>
                검색 결과가 없습니다.
              </div>
            )}
            {candidates.map(c => (
              <button key={c.id} onClick={() => addRelation(c.id)} style={{
                display: "flex", alignItems: "center", gap: 10, padding: "7px 10px",
                background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
                borderRadius: "var(--radius-md)", cursor: "pointer", textAlign: "left",
                fontFamily: "var(--font-sans)", transition: "all 0.1s",
              }}
                onMouseEnter={e => e.currentTarget.style.borderColor = "var(--jade-300)"}
                onMouseLeave={e => e.currentTarget.style.borderColor = "var(--border-subtle)"}>
                <Avatar name={c.name} size={24} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, color: "var(--text-primary)" }}>{c.name}</div>
                  <div style={{ fontSize: 10, color: "var(--text-muted)" }}>{c.gender} · {c.age}세 · {c.phone}</div>
                </div>
                <Icon name="plus" size={13} style={{ color: "var(--jade-600)" }} />
              </button>
            ))}
          </div>

          {/* Quick: 외부 인물 (등록 안 된 사람) */}
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed var(--jade-200)" }}>
            <button style={{
              width: "100%", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 5,
              fontSize: 11, color: "var(--text-brand)", background: "transparent",
              border: "1px dashed var(--jade-300)", borderRadius: "var(--radius-sm)",
              padding: "6px 10px", cursor: "pointer", fontFamily: "var(--font-sans)",
            }}>
              <Icon name="user-plus" size={11} />등록되지 않은 인물 추가 (이름·연락처만)
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const iconBtnSmall = {
  width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center",
  background: "transparent", border: "1px solid var(--border-subtle)",

};

              총 {patient.visitCount}회 내원 · 최근 {patient.lastVisit}

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {[
                { date: patient.lastVisit, type: "재진", dx: patient.chief, dr: "김민준" },
                { date: "2026-04-10", type: "재진", dx: patient.chief, dr: "김민준" },
                { date: "2026-03-15", type: "초진", dx: patient.chief, dr: "김민준" },

                </div>
              ))}

          </div>
        )}
      </div>
    </div>
  );
}

      "new":     patients.filter(p => p.regDate >= "2026-04-01").length,
      "dormant": patients.filter(p => p.status === "dormant").length,

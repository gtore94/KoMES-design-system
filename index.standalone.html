                          setPermState(prev => prev.includes(p.key) ? prev.filter(x => x !== p.key) : [...prev, p.key])
                        } />
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === "hr" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {/* 연차 */}
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 9, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 8 }}>
                <Icon name="palmtree" size={10} />연차 사용 현황
              </div>
              {(() => {
                const total = staff.leaveBalance.annual;
                const used = staff.leaveBalance.used;
                const pct = total === 0 ? 0 : (used / total) * 100;
                return (
                  <div style={{ background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", padding: 12 }}>
                    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>
                        <span style={{ fontFamily: "var(--font-mono)" }}>{used}</span> / {total}일 사용
                      </span>
                      <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>잔여 <span style={{ color: "var(--text-brand)", fontWeight: 600, fontFamily: "var(--font-mono)" }}>{total - used}일</span></span>
                    </div>
                    <div style={{ height: 6, background: "var(--bg-raised)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", overflow: "hidden" }}>
                      <div style={{ width: `${pct}%`, height: "100%", background: "var(--jade-500)", borderRadius: "var(--radius-full)", whiteSpace: "nowrap" }} />
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* 급여 */}
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 9, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 8 }}>
                <Icon name="banknote" size={10} />급여
              </div>
              <div style={{ background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", padding: 12, display: "flex", alignItems: "center", gap: 12 }}>
                <Icon name="lock" size={16} style={{ color: "var(--text-muted)" }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{staff.salary.type}</div>
                  <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>금액은 원장 권한으로만 조회 가능</div>
                </div>
                <button style={{ fontSize: 11, color: "var(--text-brand)", background: "transparent", border: "1px solid var(--brand-muted)", borderRadius: "var(--radius-sm)", padding: "3px 9px", cursor: "pointer", fontFamily: "var(--font-sans)" }}>조회</button>
              </div>
            </div>

            {/* 인사 기록 */}
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 9, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 8 }}>
                <Icon name="history" size={10} />인사 기록
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {[
                  { date: staff.joinDate, type: "입사", note: `${staff.role} · ${staff.dept}` },
                  ...(staff.status === "leave" ? [{ date: "2026-03-04", type: "휴직", note: staff.note || "휴직 시작" }] : []),
                  ...(staff.status === "resigned" ? [{ date: "2026-02-28", type: "퇴사", note: staff.note || "퇴사" }] : []),
                  { date: "2025-12-15", type: "교육", note: "개인정보보호 의무 교육 이수" },
                  { date: "2025-01-01", type: "연봉 조정", note: "정기 연봉 협상" },
                ].map((r, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", background: "var(--bg-raised)", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)" }}>
                    <span style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--text-secondary)", minWidth: 88 }}>{r.date}</span>
                    <Badge variant={r.type === "입사" ? "brand" : r.type === "퇴사" ? "danger" : r.type === "휴직" ? "warning" : "neutral"}>{r.type}</Badge>
                    <span style={{ flex: 1, fontSize: 11, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{r.note}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Toggle ───────────────────────────────────────────────────────
function Toggle({ on, onChange }) {
  const [val, setVal] = useStateStaff(on);
  useEffectStaff(() => setVal(on), [on]);
  return (
    <button onClick={() => { const next = !val; setVal(next); onChange && onChange(next); }} style={{
      width: 32, height: 18, borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
      background: val ? "var(--jade-500)" : "var(--stone-300)",
      border: "none", position: "relative", cursor: "pointer",
      transition: "background 0.12s",
      flexShrink: 0,
    }}>
      <span style={{
        position: "absolute", top: 2, left: val ? 16 : 2,
        width: 14, height: 14, borderRadius: "50%", background: "#fff",
        boxShadow: "0 1px 2px rgba(0,0,0,0.2)", transition: "left 0.12s",
      }} />
    </button>
  );
}

// ── Summary tiles (top of list) ─────────────────────────────────
function SummaryTiles({ staff }) {
  const active = staff.filter(s => s.status === "active");
  const onToday = active.filter(s => s.todayStatus === "진료중" || s.todayStatus === "진료대기").length;
  const onLeave = staff.filter(s => s.status === "leave").length;
  const newThisYear = staff.filter(s => s.joinDate >= "2025-01-01" && s.status !== "resigned").length;

  const tiles = [
    { label: "전체 직원",   value: staff.length, sub: `재직 ${active.length}명`, icon: "users",       tone: "neutral" },
    { label: "오늘 출근",   value: onToday,       sub: `재직 ${active.length}명 중`, icon: "circle-dot",   tone: "brand" },
    { label: "휴직",       value: onLeave,       sub: "현재 휴직 중",          icon: "user-minus",   tone: "warning" },
    { label: "신규 (1년내)", value: newThisYear,  sub: "2025년 이후 입사",        icon: "user-plus",    tone: "info" },
  ];

  const toneColor = (t) => ({
    neutral: { bg: "var(--bg-raised)",   icon: "var(--ink-500)",      val: "var(--text-primary)" },
    brand:   { bg: "var(--brand-muted)",    icon: "var(--text-brand)",     val: "var(--text-brand)" },
    warning: { bg: "var(--status-warning-bg)",   icon: "var(--status-warning-text)",    val: "var(--status-warning-text)" },
    info:    { bg: "var(--status-danger-bg)", icon: "var(--status-danger-text)", val: "var(--status-danger-text)" },
  })[t];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, padding: "12px 16px", background: "var(--bg-page)" }}>
      {tiles.map(t => {
        const c = toneColor(t.tone);
        return (
          <div key={t.label} style={{
            background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
            borderRadius: "var(--radius-md)", padding: "10px 14px",
            display: "flex", alignItems: "center", gap: 12,
            boxShadow: "var(--shadow-sm)",
          }}>
            <div style={{
              width: 34, height: 34, borderRadius: "var(--radius-md)",
              background: c.bg, color: c.icon,
              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
            }}>
              <Icon name={t.icon} size={16} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{t.label}</div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginTop: 2 }}>
                <span style={{ fontSize: 22, fontWeight: 600, color: c.val, fontFamily: "var(--font-serif)", lineHeight: 1, letterSpacing: "-0.02em" }}>{t.value}</span>
                <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>{t.sub}</span>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Main Screen ──────────────────────────────────────────────────
function StaffManagementScreen() {
  const [staff] = useStateStaff(STAFF_MASTER);
  const [filter, setFilter] = useStateStaff("all");
  const [search, setSearch] = useStateStaff("");
  const [sort, setSort] = useStateStaff("role"); // role | join | name | tenure
  const [view, setView] = useStateStaff("list"); // list | cards
  const [selectedId, setSelectedId] = useStateStaff(staff[0]?.id);
  const [showNewStaff, setShowNewStaff] = useStateStaff(false);
  const [editStaff, setEditStaff] = useStateStaff(null);

  const counts = useMemoStaff(() => {
    const c = {
      "all":      staff.length,
      "active":   staff.filter(s => s.status === "active").length,
      "leave":    staff.filter(s => s.status === "leave").length,
      "resigned": staff.filter(s => s.status === "resigned").length,
      "today:on":  staff.filter(s => s.todayHours !== "—" && s.status === "active").length,
      "today:off": staff.filter(s => s.todayHours === "—" || s.status !== "active").length,
    };
    ROLE_GROUPS.forEach(g => {
      c[`role:${g.key}`] = staff.filter(s => s.roleKey === g.key).length;
    });
    return c;
  }, [staff]);

  const filtered = useMemoStaff(() => {
    let list = staff;
    if (filter === "active")        list = list.filter(s => s.status === "active");
    else if (filter === "leave")    list = list.filter(s => s.status === "leave");
    else if (filter === "resigned") list = list.filter(s => s.status === "resigned");
    else if (filter === "today:on") list = list.filter(s => s.todayHours !== "—" && s.status === "active");
    else if (filter === "today:off") list = list.filter(s => s.todayHours === "—" || s.status !== "active");
    else if (filter.startsWith("role:")) {
      const r = filter.slice(5);
      list = list.filter(s => s.roleKey === r);
    }

    if (search.trim()) {
      const q = search.trim();
      list = list.filter(s => s.name.includes(q) || s.role.includes(q) || s.dept.includes(q) || s.phone.includes(q) || s.specialty.includes(q));
    }

    const roleOrder = { doctor: 0, nurse: 1, pharmacist: 2, therapist: 3, admin: 4 };
    return [...list].sort((a, b) => {
      if (sort === "role")   return (roleOrder[a.roleKey] - roleOrder[b.roleKey]) || a.name.localeCompare(b.name, "ko");
      if (sort === "join")   return a.joinDate.localeCompare(b.joinDate);
      if (sort === "tenure") return a.joinDate.localeCompare(b.joinDate);
      if (sort === "name")   return a.name.localeCompare(b.name, "ko");
      return 0;
    });
  }, [staff, filter, search, sort]);

  const selected = staff.find(s => s.id === selectedId) || filtered[0];

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="직원 관리"
        subtitle={`전체 ${staff.length}명 · 재직 ${counts.active}명 · 휴직 ${counts.leave}명`}
        actions={<>
          <div style={{ width: 240 }}>
            <Input placeholder="이름·직책·부서·연락처 검색…" value={search} onChange={setSearch} icon="search" />
          </div>
          <Button variant="secondary" size="sm" icon="calendar-days">근무표</Button>
          <Button variant="secondary" size="sm" icon="download">내보내기</Button>
          <Button variant="primary" icon="user-plus" onClick={() => setShowNewStaff(true)}>직원 등록</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", minHeight: 0, overflow: "hidden" }}>
        <StaffFilterSidebar filter={filter} setFilter={setFilter} counts={counts} />

        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, overflow: "hidden" }}>
          {/* Sort/toolbar */}
          <div style={{ padding: "10px 16px", borderBottom: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 12, background: "var(--bg-surface)" }}>
            <span style={{ fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>
              <span style={{ fontWeight: 600, color: "var(--text-primary)" }}>{filtered.length}</span>명
            </span>
            <div style={{ width: 1, height: 16, background: "var(--border-subtle)" }} />
            <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>정렬</span>
            <div style={{ display: "flex", gap: 2, background: "var(--bg-raised)", borderRadius: "var(--radius-sm)", padding: 2 }}>
              {[
                { k: "role", l: "직책순" },
                { k: "join", l: "입사일순" },
                { k: "name", l: "가나다순" },
              ].map(o => (
                <button key={o.k} onClick={() => setSort(o.k)} style={{
                  fontSize: 11, fontWeight: sort === o.k ? 600 : 400,
                  padding: "3px 9px", borderRadius: "var(--radius-sm)",
                  border: "none", cursor: "pointer", fontFamily: "var(--font-sans)",
                  background: sort === o.k ? "var(--bg-surface)" : "transparent",
                  color: sort === o.k ? "var(--text-primary)" : "var(--text-muted)",
                  boxShadow: sort === o.k ? "var(--shadow-sm)" : "none",
                }}>{o.l}</button>
              ))}
            </div>

            <div style={{ marginLeft: "auto", display: "flex", gap: 2, background: "var(--bg-raised)", borderRadius: "var(--radius-sm)", padding: 2 }}>
              {[{ k: "list", i: "list" }, { k: "cards", i: "layout-grid" }].map(o => (
                <button key={o.k} onClick={() => setView(o.k)} title={o.k === "list" ? "리스트" : "카드"} style={{
                  width: 26, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center",
                  border: "none", cursor: "pointer", borderRadius: "var(--radius-sm)",
                  background: view === o.k ? "var(--bg-surface)" : "transparent",
                  color: view === o.k ? "var(--text-primary)" : "var(--text-muted)",
                  boxShadow: view === o.k ? "var(--shadow-sm)" : "none",
                }}>
                  <Icon name={o.i} size={13} />
                </button>
              ))}
            </div>
          </div>

          {view === "list" && (
            <>
              {/* Column headers */}
              <div style={{
                display: "grid",
                gridTemplateColumns: "40px 1.3fr 1fr 1fr 0.85fr 0.65fr 22px",
                alignItems: "center", gap: 10,
                padding: "8px 16px", background: "var(--bg-raised)",
                borderBottom: "1px solid var(--border-subtle)",
                fontSize: 9, fontWeight: 700, letterSpacing: "0.06em",
                textTransform: "uppercase", color: "var(--text-muted)",
                fontFamily: "var(--font-sans)",
              }}>
                <span></span>
                <span>직원 · 직책</span>
                <span>연락처</span>
                <span>오늘 근무</span>
                <span>입사일</span>
                <span>상태</span>
                <span></span>
              </div>

              <div style={{ flex: 1, overflowY: "auto", background: "var(--bg-surface)" }}>
                {filtered.length === 0 ? (
                  <div style={{ padding: "60px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)" }}>
                    <Icon name="users" size={32} style={{ color: "var(--stone-300)", marginBottom: 10 }} />
                    <div>조건에 맞는 직원이 없습니다.</div>
                  </div>
                ) : filtered.map(s => (
                  <StaffRow key={s.id} s={s} selected={selected?.id === s.id} onSelect={() => setSelectedId(s.id)} />
                ))}
              </div>
            </>
          )}

          {view === "cards" && (
            <div style={{ flex: 1, overflowY: "auto", padding: "14px 16px", background: "var(--bg-page)" }}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 12 }}>
                {filtered.map(s => {
                  const sel = selected?.id === s.id;
                  return (
                    <div key={s.id} onClick={() => setSelectedId(s.id)} style={{
                      background: "var(--bg-surface)",
                      border: `1px solid ${sel ? "var(--jade-500)" : "var(--border-subtle)"}`,
                      borderRadius: "var(--radius-md)",
                      padding: 14, cursor: "pointer",
                      boxShadow: sel ? "0 0 0 3px var(--jade-100)" : "var(--shadow-sm)",
                      transition: "all 0.12s",
                      opacity: s.status === "resigned" ? 0.65 : 1,
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <StaffAvatar staff={s} size={44} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 14, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)", display: "flex", alignItems: "center", gap: 5 }}>
                            {s.name}
                            {s.role === "원장" && <Icon name="crown" size={11} style={{ color: "var(--amber-600)" }} />}
                          </div>
                          <div style={{ fontSize: 11, color: s.color, fontWeight: 600, fontFamily: "var(--font-sans)" }}>{s.role}</div>
                        </div>
                        <TodayStatusPill status={s.todayStatus} />
                      </div>
                      <div style={{ marginTop: 10, fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
                        {s.dept} · {s.specialty}
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 10, paddingTop: 10, borderTop: "1px solid var(--border-subtle)" }}>
                        <div>
                          <div style={{ fontSize: 9, color: "var(--text-muted)", fontFamily: "var(--font-sans)", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>오늘</div>
                          <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--text-primary)" }}>{s.todayHours}</div>
                        </div>
                        <div>
                          <div style={{ fontSize: 9, color: "var(--text-muted)", fontFamily: "var(--font-sans)", fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>근속</div>
                          <div style={{ fontSize: 11, color: "var(--text-primary)", fontFamily: "var(--font-sans)" }}>{yearsOfService(s.joinDate)}</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {selected && (
          <StaffDetailPanel
            staff={selected}
            onClose={() => setSelectedId(null)}
            onEdit={s => setEditStaff(s)}
          />
        )}
      </div>

      {showNewStaff && (
        <NewStaffModal
          onClose={() => setShowNewStaff(false)}
          onSubmit={() => setShowNewStaff(false)}
        />
      )}
      {editStaff && (
        <NewStaffModal
          initialData={editStaff}
          onClose={() => setEditStaff(null)}
          onSubmit={() => setEditStaff(null)}
        />
      )}
    </div>
  );
}

Object.assign(window, { StaffManagementScreen });

</script>

<script type="text/babel">
// KoMES — Settings (테마 전환 포함)
const { useState: useStateSet, useEffect: useEffectSet } = React;

/* ────────────────────────────────────────────────────────────
   Theme application — global helper
   `data-theme` on <html> drives all token overrides in index.html.
   ──────────────────────────────────────────────────────────── */
const THEME_STORAGE_KEY = "komes_theme";
const THEME_COLOR_KEY   = "komes_color";

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === "auto") {
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", prefersDark ? "dark" : "light");
  } else {
    root.setAttribute("data-theme", theme);
  }
  root.setAttribute("data-theme-pref", theme);
}

function applyColor(color) {
  if (color === "navy") {
    document.documentElement.setAttribute("data-color", "navy");
  } else {
    document.documentElement.removeAttribute("data-color");
  }
}

// Init on first load (idempotent)
(function initTheme() {
  const saved = localStorage.getItem(THEME_STORAGE_KEY) || "light";
  applyTheme(saved);
  applyColor(localStorage.getItem(THEME_COLOR_KEY) || "jade");
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener && mq.addEventListener("change", () => {
      if ((localStorage.getItem(THEME_STORAGE_KEY) || "light") === "auto") applyTheme("auto");
    });
  }
})();

/* ────────────────────────────────────────────────────────────
   Reusable settings primitives
   ──────────────────────────────────────────────────────────── */
function SettingsSection({ title, description, children }) {
  return (
    <section style={{
      background: "var(--bg-surface)",
      border: "1px solid var(--border-subtle)",
      borderRadius: "var(--radius-lg)",
      boxShadow: "var(--shadow-sm)",
      marginBottom: 20,
      overflow: "hidden",
    }}>
      <header style={{
        padding: "18px 22px 14px",
        borderBottom: "1px solid var(--border-subtle)",
      }}>
        <div style={{
          fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500,
          color: "var(--text-primary)", letterSpacing: "-0.005em",
        }}>{title}</div>
        {description && (
          <div style={{
            fontSize: 12, color: "var(--text-muted)",
            fontFamily: "var(--font-sans)", marginTop: 3, lineHeight: 1.5,
          }}>{description}</div>
        )}
      </header>
      <div>{children}</div>
    </section>
  );
}

function Row({ label, hint, control, alignTop }) {
  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: "minmax(180px, 240px) 1fr",
      gap: 24,
      padding: "16px 22px",
      borderBottom: "1px solid var(--border-subtle)",
      alignItems: alignTop ? "flex-start" : "center",
    }}>
      <div>
        <div style={{
          fontSize: 13, fontWeight: 500, color: "var(--text-primary)",
          fontFamily: "var(--font-sans)",
        }}>{label}</div>
        {hint && (
          <div style={{
            fontSize: 11.5, color: "var(--text-muted)",
            fontFamily: "var(--font-sans)", marginTop: 3, lineHeight: 1.5,
          }}>{hint}</div>
        )}
      </div>
      <div>{control}</div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────
   Theme picker — three swatch cards
   ──────────────────────────────────────────────────────────── */
function ThemeCard({ value, label, hint, active, onSelect, preview }) {
  return (
    <button
      onClick={() => onSelect(value)}
      style={{
        position: "relative",
        display: "flex", flexDirection: "column",
        gap: 10, padding: 12,
        background: "var(--bg-surface)",
        border: `1.5px solid ${active ? "var(--border-brand)" : "var(--border-subtle)"}`,
        borderRadius: "var(--radius-lg)",
        boxShadow: active ? "0 0 0 3px var(--brand-subtle)" : "none",
        cursor: "pointer", textAlign: "left",
        fontFamily: "var(--font-sans)",
        transition: "all 0.14s ease",
        minWidth: 0,
      }}>
      {/* Mini preview */}
      <div style={{
        height: 100, borderRadius: "var(--radius-md)",
        background: preview.bg,
        border: `1px solid ${preview.border}`,
        padding: 10, display: "flex", flexDirection: "column", gap: 6,
        overflow: "hidden",
      }}>
        <div style={{ display: "flex", gap: 5 }}>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: preview.dot1 }} />
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: preview.dot2 }} />
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: preview.dot3 }} />
        </div>
        <div style={{
          height: 8, width: "70%", background: preview.line1, borderRadius: 2,
        }} />
        <div style={{
          height: 6, width: "45%", background: preview.line2, borderRadius: 2,
        }} />
        <div style={{
          marginTop: "auto", display: "flex", gap: 5,
        }}>
          <span style={{
            fontSize: 9, padding: "2px 7px", borderRadius: 999,
            background: preview.pill, color: preview.pillText,
            fontFamily: "var(--font-mono)", fontWeight: 600,
          }}>처방</span>
          <span style={{
            fontSize: 9, padding: "2px 7px", borderRadius: 999,
            border: `1px solid ${preview.border}`,
            color: preview.line1,
            fontFamily: "var(--font-mono)", fontWeight: 500,
          }}>대기</span>
        </div>
      </div>

      {/* Label row */}
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <div style={{
          width: 14, height: 14, borderRadius: "50%",
          border: `1.5px solid ${active ? "var(--brand)" : "var(--border-default)"}`,
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0,
        }}>
          {active && <span style={{
            width: 7, height: 7, borderRadius: "50%", background: "var(--brand)",
          }} />}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            fontSize: 13, fontWeight: 600, color: "var(--text-primary)",
          }}>{label}</div>
          <div style={{
            fontSize: 11, color: "var(--text-muted)", marginTop: 1,
          }}>{hint}</div>
        </div>
      </div>
    </button>
  );
}

const THEME_PREVIEWS = {
  light: {
    bg: "#FDFAF5", border: "#E4DDD4",
    dot1: "#C4594B", dot2: "#C4974B", dot3: "#4A7C6F",
    line1: "#2A3C3A", line2: "#8A9E9A",
    pill: "#D4EDE9", pillText: "#2E5C52",
  },
  dark: {
    bg: "#0B1413", border: "#2A3C3A",
    dot1: "#E09690", dot2: "#D4AE78", dot3: "#8DBFB3",
    line1: "#EEF4F3", line2: "#6B7E7B",
    pill: "rgba(74,124,111,0.18)", pillText: "#8DBFB3",
  },
  auto: {
    bg: "linear-gradient(120deg, #FDFAF5 0%, #FDFAF5 48%, #0B1413 52%, #0B1413 100%)",
    border: "#8A9E9A",
    dot1: "#C4594B", dot2: "#C4974B", dot3: "#8DBFB3",
    line1: "#6B7E7B", line2: "#6B7E7B",
    pill: "rgba(74,124,111,0.18)", pillText: "#4A7C6F",
  },
};

const COLOR_PREVIEWS = {
  jade: {
    bg: "#D4EDE9", border: "#9ECEC5",
    dot1: "#2E5C52", dot2: "#4A7C6F", dot3: "#B5D9D3",
    line1: "#2E5C52", line2: "#4A7C6F",
    pill: "#4A7C6F", pillText: "#FDFAF5",
  },
  navy: {
    bg: "#D6DEEB", border: "#8298BF",
    dot1: "#1E3252", dot2: "#355A82", dot3: "#8298BF",
    line1: "#1E3252", line2: "#5878A3",
    pill: "#355A82", pillText: "#EEF1F7",
  },
};

/* ────────────────────────────────────────────────────────────
   Toggle (used for several boolean prefs)
   ──────────────────────────────────────────────────────────── */
function Toggle({ checked, onChange, label }) {
  return (
    <button onClick={() => onChange(!checked)}
      role="switch" aria-checked={checked}
      style={{
        position: "relative",
        width: 38, height: 22, padding: 0,
        borderRadius: 999, cursor: "pointer",
        background: checked ? "var(--brand)" : "var(--stone-300)",
        border: "none",
        transition: "background 0.18s ease",
        flexShrink: 0,
      }}>
      <span style={{
        position: "absolute", top: 2,
        left: checked ? 18 : 2,
        width: 18, height: 18, borderRadius: "50%",
        background: "#fff",
        boxShadow: "0 1px 3px rgba(17,30,28,0.20)",
        transition: "left 0.18s ease",
      }} />
    </button>
  );
}

function SegBtn({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      padding: "6px 14px",
      fontFamily: "var(--font-sans)", fontSize: 12, fontWeight: 500,
      background: active ? "var(--bg-surface)" : "transparent",
      color: active ? "var(--text-primary)" : "var(--text-muted)",
      border: active ? "1px solid var(--border-default)" : "1px solid transparent",
      borderRadius: "var(--radius-sm)",
      cursor: "pointer",
      boxShadow: active ? "var(--shadow-sm)" : "none",
    }}>{children}</button>
  );
}

function SegGroup({ value, onChange, options }) {
  return (
    <div style={{
      display: "inline-flex", gap: 2, padding: 3,
      background: "var(--bg-raised)",
      borderRadius: "var(--radius-md)",
      border: "1px solid var(--border-subtle)",
    }}>
      {options.map(opt => (
        <SegBtn key={opt.value} active={value === opt.value} onClick={() => onChange(opt.value)}>
          {opt.label}
        </SegBtn>
      ))}
    </div>
  );
}

/* ────────────────────────────────────────────────────────────
   Main screen
   ──────────────────────────────────────────────────────────── */
function SettingsScreen() {
  const [tab, setTab] = useStateSet("appearance"); // appearance | general | account
  const [theme, setTheme] = useStateSet(() => localStorage.getItem(THEME_STORAGE_KEY) || "light");
  const [color, setColor] = useStateSet(() => localStorage.getItem(THEME_COLOR_KEY) || "jade");
  const [density, setDensity] = useStateSet(() => localStorage.getItem("komes_density") || "comfortable");
  const [fontSize, setFontSize] = useStateSet(() => localStorage.getItem("komes_font_size") || "default");
  const [reduceMotion, setReduceMotion] = useStateSet(() => localStorage.getItem("komes_reduce_motion") === "true");

  // Apply + persist
  useEffectSet(() => {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
    applyTheme(theme);
  }, [theme]);

  useEffectSet(() => {
    localStorage.setItem(THEME_COLOR_KEY, color);
    applyColor(color);
  }, [color]);

  useEffectSet(() => {
    localStorage.setItem("komes_density", density);
    document.documentElement.setAttribute("data-density", density);
  }, [density]);

  useEffectSet(() => {
    localStorage.setItem("komes_font_size", fontSize);
    document.documentElement.setAttribute("data-font-size", fontSize);
  }, [fontSize]);

  useEffectSet(() => {
    localStorage.setItem("komes_reduce_motion", String(reduceMotion));
    document.documentElement.setAttribute("data-reduce-motion", String(reduceMotion));
  }, [reduceMotion]);

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="설정"
        subtitle="외관, 일반 환경, 계정 정보를 관리합니다"
        actions={null}
      />

      <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>
        {/* Settings sidebar */}
        <aside style={{
          width: 200, flexShrink: 0,
          background: "var(--bg-surface)",
          borderRight: "1px solid var(--border-subtle)",
          padding: "20px 12px",
        }}>
          <div style={{
            fontSize: 10, fontWeight: 700, letterSpacing: "0.12em",
            color: "var(--text-muted)", textTransform: "uppercase",
            padding: "0 10px 8px",
          }}>설정</div>
          {[
            { key: "appearance", icon: "palette",   label: "외관" },
            { key: "general",    icon: "sliders-horizontal", label: "일반" },
            { key: "account",    icon: "user",      label: "계정" },
            { key: "clinic",     icon: "building-2", label: "한의원 정보" },
            { key: "billing",    icon: "receipt",   label: "청구 환경" },
            { key: "shortcuts",  icon: "command",   label: "단축키" },
          ].map(item => (
            <button key={item.key} onClick={() => setTab(item.key)} style={{
              display: "flex", alignItems: "center", gap: 9,
              width: "100%", padding: "8px 10px",
              border: "none", background: tab === item.key ? "var(--brand-subtle)" : "transparent",
              color: tab === item.key ? "var(--text-brand)" : "var(--text-secondary)",
              fontFamily: "var(--font-sans)", fontSize: 13,
              fontWeight: tab === item.key ? 600 : 400,
              borderRadius: "var(--radius-md)",
              cursor: "pointer", marginBottom: 2,
              textAlign: "left",
            }}>
              <Icon name={item.icon} size={14} />
              {item.label}
            </button>
          ))}
        </aside>

        {/* Main */}
        <main style={{ flex: 1, overflowY: "auto", padding: "28px 36px 60px" }}>
          <div style={{ maxWidth: 820 }}>

            {tab === "appearance" && (
              <>
                <SettingsSection
                  title="테마"
                  description="모드와 색상을 독립적으로 선택합니다. 변경은 즉시 반영됩니다.">
                  <div style={{ padding: "18px 22px 20px" }}>

                    <div style={{
                      fontSize: 11, fontWeight: 700, letterSpacing: "0.08em",
                      textTransform: "uppercase", color: "var(--text-muted)",
                      marginBottom: 10,
                    }}>모드</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
                      <ThemeCard value="light" label="라이트" hint="기본 한지 톤"
                        active={theme === "light"} onSelect={setTheme}
                        preview={THEME_PREVIEWS.light} />
                      <ThemeCard value="dark" label="다크" hint="야간 진료·당직용"
                        active={theme === "dark"} onSelect={setTheme}
                        preview={THEME_PREVIEWS.dark} />
                      <ThemeCard value="auto" label="시스템" hint="OS 설정을 따름"
                        active={theme === "auto"} onSelect={setTheme}
                        preview={THEME_PREVIEWS.auto} />
                    </div>

                    <div style={{
                      fontSize: 11, fontWeight: 700, letterSpacing: "0.08em",
                      textTransform: "uppercase", color: "var(--text-muted)",
                      marginTop: 20, marginBottom: 10,
                    }}>색상</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
                      <ThemeCard value="jade" label="재이드" hint="클래식 한의 톤"
                        active={color === "jade"} onSelect={setColor}
                        preview={COLOR_PREVIEWS.jade} />
                      <ThemeCard value="navy" label="네이비" hint="청색 브랜드 톤"
                        active={color === "navy"} onSelect={setColor}
                        preview={COLOR_PREVIEWS.navy} />
                    </div>

                    <div style={{
                      marginTop: 18, padding: "10px 14px",
                      background: "var(--brand-subtle)",
                      border: "1px solid var(--brand-muted)",
                      borderRadius: "var(--radius-md)",
                      display: "flex", alignItems: "center", gap: 10,
                      fontSize: 12, color: "var(--text-brand)",
                      fontFamily: "var(--font-sans)",
                    }}>
                      <Icon name="info" size={14} />
                      현재 적용: <strong style={{ fontWeight: 600 }}>{
                        theme === "light" ? "라이트" :
                        theme === "dark" ? "다크" : "시스템 자동"
                      }</strong>
                      {" · "}
                      <strong style={{ fontWeight: 600 }}>{color === "navy" ? "네이비" : "재이드"}</strong>
                      <span style={{
                        marginLeft: "auto", fontFamily: "var(--font-mono)",
                        fontSize: 11, opacity: 0.75,
                      }}>data-theme={theme}{color === "navy" ? " · navy" : ""}</span>
                    </div>
                  </div>
                </SettingsSection>

                <SettingsSection title="레이아웃" description="목록·테이블 행 간격과 글자 크기를 조정합니다.">
                  <Row
                    label="화면 밀도"
                    hint="진료 현황·환자 목록의 행 높이에 적용됩니다"
                    control={
                      <SegGroup value={density} onChange={setDensity} options={[
                        { value: "compact",     label: "조밀" },
                        { value: "comfortable", label: "기본" },
                        { value: "spacious",    label: "넉넉" },
                      ]} />
                    } />
                  <Row
                    label="글자 크기"
                    hint="본문 텍스트 기준 — 차트·처방 화면 모두에 적용"
                    control={
                      <SegGroup value={fontSize} onChange={setFontSize} options={[
                        { value: "small",   label: "작게" },
                        { value: "default", label: "기본" },
                        { value: "large",   label: "크게" },
                      ]} />
                    } />
                  <Row
                    label="모션 줄이기"
                    hint="화면 전환·애니메이션 효과를 최소화합니다"
                    control={
                      <Toggle checked={reduceMotion} onChange={setReduceMotion} />
                    } />
                </SettingsSection>
              </>
            )}

            {tab !== "appearance" && (
              <SettingsSection title={({
                general: "일반", account: "계정", clinic: "한의원 정보",
                billing: "청구 환경", shortcuts: "단축키",
              })[tab]} description="이 화면은 준비 중입니다.">
                <div style={{
                  padding: "44px 22px", textAlign: "center",
                  color: "var(--text-muted)", fontSize: 13,
                  fontFamily: "var(--font-sans)",
                }}>
                  <Icon name="construction" size={28} style={{ color: "var(--text-muted)", marginBottom: 10 }} />
                  <div>곧 제공될 예정입니다.</div>
                </div>
              </SettingsSection>
            )}

          </div>
        </main>
      </div>
    </div>
  );
}

Object.assign(window, { SettingsScreen, applyTheme });

</script>

<script type="text/babel">
const { useState, useEffect } = React;

const SCREENS = {
  patients: "patients",
  chart: "chart",
  prescribe: "prescribe",
};

function App() {
  const [nav, setNav] = useState(() => localStorage.getItem("komes_nav") || "patients");
  const [selectedPatient, setSelectedPatient] = useState(null);
  const [screen, setScreen] = useState(() => localStorage.getItem("komes_screen") || SCREENS.patients);
  const [recOpen, setRecOpen] = useState(false);
  const [recToast, setRecToast] = useState(null);
  const [draftsActive, setDraftsActive] = useState(null);  // null | "herb" | "supply" | "both"

  useEffect(() => { localStorage.setItem("komes_nav", nav); }, [nav]);
  useEffect(() => { localStorage.setItem("komes_screen", screen); }, [screen]);

  const handleSelectPatient = (p) => {
    setSelectedPatient(p);
    setScreen(SCREENS.chart);
    setNav("chart");
  };

  const handlePrescribe = () => setScreen(SCREENS.prescribe);

  const handleNavBack = () => {
    if (screen === SCREENS.prescribe) { setScreen(SCREENS.chart); setNav("chart"); }
    else { setScreen(SCREENS.patients); setNav("patients"); setSelectedPatient(null); }
  };

  // Non-implemented screens placeholder
  const PlaceholderScreen = ({ title }) => (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar title={title} />
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12 }}>
        <Icon name="construction" size={32} style={{ color: "var(--text-muted)" }} />
        <div style={{ fontSize: 14, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>이 화면은 준비 중입니다</div>
      </div>
    </div>
  );

  const renderMain = () => {
    if (nav === "patients") {
      return <PatientListScreen onSelectPatient={handleSelectPatient} />;
    }
    if (nav === "chart") {
      if (screen === SCREENS.prescribe && selectedPatient) {
        return <PrescriptionScreen patient={selectedPatient} onBack={handleNavBack} />;
      }
      return <PatientChartScreen patient={selectedPatient} onBack={handleNavBack} onPrescribe={handlePrescribe} onNavigate={handleNavigate} />;
    }
    if (nav === "registry") {
      return <PatientManagementScreen onOpenChart={handleSelectPatient} />;
    }
    if (nav === "schedule") {
      return <ScheduleScreen />;
    }
    if (nav === "payment") {
      return <PaymentScreen />;
    }
    if (nav === "claim") {
      return <InsuranceClaimScreen />;
    }
    if (nav === "forms") {
      return <MedicalFormScreen />;
    }
    if (nav === "inventory") {
      return <HerbInventoryScreen onNavigate={handleNavigate} onOpenRecSettings={() => setRecOpen(true)} onCreateDrafts={(scope) => setDraftsActive(scope)} />;
    }
    if (nav === "supplies") {
      return <SuppliesScreen onNavigate={handleNavigate} onOpenRecSettings={() => setRecOpen(true)} onCreateDrafts={(scope) => setDraftsActive(scope)} />;
    }
    if (nav === "orders") {
      return <PurchaseOrderHistoryScreen openSettings={() => setRecOpen(true)} />;
    }
    if (nav === "staff") {
      return <StaffManagementScreen />;
    }
    if (nav === "settings") {
      return <SettingsScreen />;
    }
    const labels = {
      prescriptions: "처방 관리",
      stats: "통계", ai: "AI 분석"
    };
    return <PlaceholderScreen title={labels[nav] || nav} />;
  };

  const handleNavigate = (key) => {
    setNav(key);
    if (key === "patients") {
      setScreen(SCREENS.patients);
    }
    if (key === "chart") {
      setScreen(SCREENS.chart);
    }
  };

  // 발주서 초안 편집 모드가 활성일 때 전체 화면 인계
  if (draftsActive) {
    const recs = computeRecommendations({ ...REC_DEFAULTS, scope: draftsActive });
    return (
      <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
        <Sidebar activeScreen={nav} onNavigate={(k) => { setDraftsActive(null); handleNavigate(k); }} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <PurchaseOrderDraftScreen
            key={draftsActive}
            initialRecommendations={recs}
            onClose={() => setDraftsActive(null)}
            onSubmit={({ draft, drafts }) => {
              setDraftsActive(null);
              setRecToast(draft
                ? `초안 ${drafts.length}건이 임시 저장되었습니다.`
                : `승인 요청 ${drafts.length}건이 원장님께 전송되었습니다.`);
              setTimeout(() => setRecToast(null), 2400);
            }}
          />
        </div>
        {recToast && (
          <div style={{
            position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
            background: "var(--ink-800)", color: "var(--stone-50)",
            padding: "10px 18px", borderRadius: "var(--radius-md)",
            fontSize: 13, boxShadow: "var(--shadow-lg)",
            display: "flex", alignItems: "center", gap: 8, zIndex: 300,
          }}>
            <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
            {recToast}
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <Sidebar activeScreen={nav} onNavigate={handleNavigate} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {renderMain()}
      </div>
      {recOpen && (
        <RecommendationSettingsModal
          onClose={() => setRecOpen(false)}
          onSave={() => { setRecOpen(false); setRecToast("추천 조건이 저장되었습니다."); setTimeout(() => setRecToast(null), 2200); }}
        />
      )}
      {recToast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--ink-800)", color: "var(--stone-50)",
          padding: "10px 18px", borderRadius: "var(--radius-md)",
          fontSize: 13, fontFamily: "var(--font-sans)", boxShadow: "var(--shadow-lg)",
          display: "flex", alignItems: "center", gap: 8, zIndex: 300,
        }}>
          <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
          {recToast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

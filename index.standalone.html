<script type="text/babel">
// KoMES — 약재 재고 조정 (실사 모드) 화면
// 워크플로우: 분류/위치 선택 → 실측 수량 입력 → 차이 확인 → 사유 → 일괄 확정

const { useState: useStHA, useMemo: useMemoHA } = React;

// 조정 사유 코드 (한방 클리닉 상황에 맞춤)
const ADJ_REASONS = [
  { key: "count",   label: "실사 보정",     hint: "정기 재고 실사로 발견된 차이" },
  { key: "damage",  label: "파손/오염",     hint: "보관 중 파손, 습기, 변색 등" },
  { key: "expire",  label: "유효기간 폐기", hint: "유효기간 경과로 폐기" },
  { key: "loss",    label: "분실",          hint: "도난 또는 식별 불가" },
  { key: "return",  label: "공급처 반품",   hint: "품질 이상으로 반품 처리" },
  { key: "other",   label: "기타",          hint: "직접 메모 필요" },
];

function HerbAdjustmentScreen({ onClose, onSubmit }) {
  // 조정 상태: { [herbId]: { counted: number | "", reason: string, memo: string } }
  const [edits, setEdits]           = useStHA({});
  const [category, setCategory]     = useStHA("all");
  const [filter, setFilter]         = useStHA("all"); // all | edited | diff | empty
  const [search, setSearch]         = useStHA("");
  const [confirmOpen, setConfirm]   = useStHA(false);

  // 필터링
  const rows = useMemoHA(() => {
    let out = HERBS.slice();
    if (category !== "all") out = out.filter(h => h.category === category);
    if (search) {
      const q = search.toLowerCase();
      out = out.filter(h => h.name.includes(search) || h.latin.toLowerCase().includes(q));
    }
    if (filter === "edited") out = out.filter(h => edits[h.id]?.counted !== undefined && edits[h.id]?.counted !== "");
    if (filter === "diff")   out = out.filter(h => {
      const c = edits[h.id]?.counted;
      return c !== undefined && c !== "" && Number(c) !== h.stock;
    });
    if (filter === "empty")  out = out.filter(h => edits[h.id]?.counted === undefined || edits[h.id]?.counted === "");
    return out;
  }, [category, search, filter, edits]);

  // 집계
  const summary = useMemoHA(() => {
    let counted = 0, diffPlus = 0, diffMinus = 0, valueDelta = 0, items = 0;
    Object.keys(edits).forEach(id => {
      const e = edits[id];
      const h = HERBS.find(x => x.id === id);
      if (!h || e.counted === "" || e.counted === undefined) return;
      counted++;
      const c = Number(e.counted);
      const d = c - h.stock;
      if (d > 0) diffPlus += d; else diffMinus += d;
      if (d !== 0) items++;
      valueDelta += d * h.unitPrice;
    });
    return { counted, diffPlus, diffMinus, valueDelta, items, total: HERBS.length };
  }, [edits]);

  const setEdit = (id, patch) =>
    setEdits(e => ({ ...e, [id]: { counted: "", reason: "count", memo: "", ...e[id], ...patch } }));

  const fillSystemStock = (h) =>
    setEdit(h.id, { counted: h.stock });

  const clearRow = (id) =>
    setEdits(e => { const next = { ...e }; delete next[id]; return next; });

  const cats = HERB_CATEGORIES;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      {/* Mode banner */}
      <div style={{
        background: "linear-gradient(90deg, var(--jade-800) 0%, var(--jade-700) 100%)",
        color: "white", padding: "10px 24px",
        display: "flex", alignItems: "center", gap: 12,
        boxShadow: "0 2px 4px rgba(17,30,28,0.1)",
      }}>
        <Icon name="clipboard-check" size={16} style={{ color: "var(--brand-muted)" }} />
        <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.04em" }}>재고 실사 모드</div>
        <div style={{ width: 1, height: 14, background: "rgba(255,255,255,0.2)" }}></div>
        <div style={{ fontSize: 11, color: "var(--brand-muted)" }}>약재 · 시스템 재고와 실측 수량의 차이를 보정합니다</div>
        <div style={{ flex: 1 }}></div>
        <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--brand-muted)" }}>
          담당 김민준 · 2026-05-16 14:32
        </div>
      </div>

      <TopBar
        title="약재 재고 조정"
        subtitle={`실측 ${summary.counted} / ${summary.total}종 · 차이 발생 ${summary.items}건`}
        actions={<>
          <Button variant="ghost" size="sm" icon="x" onClick={onClose}>취소</Button>
          <Button variant="secondary" size="sm" icon="save" onClick={() => onSubmit && onSubmit({ draft: true, edits })}>임시 저장</Button>
          <Button variant="primary" size="sm" icon="check-check"
            onClick={() => setConfirm(true)}
            disabled={summary.counted === 0}>조정 확정 ({summary.items})</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        {/* Main area */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>

          {/* Stats strip */}
          <div style={{ padding: "12px 24px 0", display: "flex", gap: 10 }}>
            <HAStatCard icon="boxes" label="실사 진행률" value={`${summary.counted}/${summary.total}`} sub={`${Math.round(summary.counted / summary.total * 100)}% 완료`} />
            <HAStatCard icon="trending-up" label="증가" value={`+${fmtMass(summary.diffPlus)}`} sub="실측 > 시스템" tone="success" />
            <HAStatCard icon="trending-down" label="감소" value={fmtMass(summary.diffMinus)} sub="실측 < 시스템" tone="danger" />
            <HAStatCard icon="banknote" label="가치 변동" value={(summary.valueDelta >= 0 ? "+" : "") + won(summary.valueDelta)} sub={`${summary.items}품목 차이 발생`} tone={summary.valueDelta < 0 ? "danger" : summary.valueDelta > 0 ? "success" : "neutral"} />
          </div>

          {/* Filter bar */}
          <div style={{ padding: "16px 24px 12px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 4, background: "var(--bg-raised)", padding: 3, borderRadius: "var(--radius-md)", border: "1px solid var(--border-subtle)" }}>
              {[
                { key: "all",    label: "전체",    count: HERBS.length },
                { key: "empty",  label: "미실사",  count: HERBS.length - summary.counted },
                { key: "edited", label: "실사 완료", count: summary.counted },
                { key: "diff",   label: "차이 발생", count: summary.items },
              ].map(t => (
                <button key={t.key} onClick={() => setFilter(t.key)}
                  style={{
                    padding: "5px 12px", fontFamily: "var(--font-sans)", fontSize: 12,
                    border: "none", cursor: "pointer", borderRadius: "var(--radius-sm)",
                    background: filter === t.key ? "var(--bg-surface)" : "transparent",
                    color: filter === t.key ? "var(--text-primary)" : "var(--text-secondary)",
                    fontWeight: filter === t.key ? 600 : 400,
                    boxShadow: filter === t.key ? "var(--shadow-sm)" : "none",
                    display: "inline-flex", alignItems: "center", gap: 6,
                  }}>
                  {t.label}
                  <span style={{
                    fontSize: 10, fontFamily: "var(--font-mono)",
                    background: filter === t.key ? (t.key === "diff" ? "var(--status-danger-bg)" : "var(--brand-muted)") : "var(--bg-raised)",
                    color: filter === t.key ? (t.key === "diff" ? "var(--status-danger-text)" : "var(--text-brand)") : "var(--text-muted)",
                    padding: "0 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
                  }}>{t.count}</span>
                </button>
              ))}
            </div>
            <div style={{ flex: 1 }}></div>
            <div style={{ width: 200 }}>
              <Input value={search} onChange={setSearch} placeholder="약재명 / 학명" icon="search" />
            </div>
            <select value={category} onChange={e => setCategory(e.target.value)}
              style={{
                fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
                background: "var(--bg-surface)", border: "1px solid var(--border-default)",
                borderRadius: "var(--radius-md)", padding: "7px 28px 7px 10px", outline: "none",
                appearance: "none", cursor: "pointer",
                backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9E9A' d='M0 0l5 6 5-6z'/></svg>\")",
                backgroundRepeat: "no-repeat", backgroundPosition: "right 10px center",
              }}>
              {cats.map(c => <option key={c.key} value={c.key}>{c.key === "all" ? "분류 전체" : c.label}</option>)}
            </select>
          </div>

          {/* Adjustment table */}
          <div style={{ flex: 1, overflowY: "auto", padding: "0 24px 20px" }}>
            <div style={{
              background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
              borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", overflow: "hidden",
            }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--font-sans)" }}>
                <thead>
                  <tr style={{ background: "var(--bg-raised)" }}>
                    <th style={hdrL}>약재</th>
                    <th style={hdrL}>위치</th>
                    <th style={hdrR}>시스템 재고</th>
                    <th style={{ ...hdrC, width: 180 }}>실측 수량</th>
                    <th style={hdrR}>차이</th>
                    <th style={hdrL}>조정 사유</th>
                    <th style={hdrL}>메모</th>
                    <th style={{ ...hdrC, width: 40 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(h => {
                    const e = edits[h.id];
                    const counted = e?.counted;
                    const hasCount = counted !== undefined && counted !== "";
                    const diff = hasCount ? Number(counted) - h.stock : 0;
                    const diffPct = hasCount && h.stock > 0 ? (diff / h.stock) * 100 : 0;
                    const reason = e?.reason || "count";
                    const memo = e?.memo || "";

                    const tone = !hasCount ? "muted" :
                      diff === 0 ? "match" :
                      Math.abs(diffPct) > 20 ? "alert" : "diff";

                    return (
                      <tr key={h.id} style={{
                        borderTop: "1px solid var(--border-subtle)",
                        background: tone === "match" ? "var(--brand-subtle)" :
                                    tone === "alert" ? "var(--status-danger-bg)" :
                                    tone === "diff"  ? "var(--status-warning-bg)" : "transparent",
                        transition: "background 0.1s ease",
                      }}>
                        <td style={{ padding: "10px 14px" }}>
                          <div style={{ fontSize: 13, fontWeight: 500, color: "var(--text-primary)" }}>{h.name}</div>
                          <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 1 }}>
                            <span style={{ fontSize: 10, color: "var(--text-muted)", fontStyle: "italic" }}>{h.latin}</span>
                            <span style={{ fontSize: 10, background: "var(--bg-raised)", color: "var(--text-secondary)", padding: "0 6px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", border: "1px solid var(--border-default)" }}>{h.category}</span>
                          </div>
                        </td>
                        <td style={{ padding: "10px 14px", fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{h.location}</td>
                        <td style={{ padding: "10px 14px", textAlign: "right" }}>
                          <div style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)", fontWeight: 500 }}>{fmtMass(h.stock)}</div>
                          <div style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)", marginTop: 1 }}>{won(h.stock * h.unitPrice)}</div>
                        </td>
                        <td style={{ padding: "8px 12px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <input type="number" value={counted ?? ""} placeholder="—"
                              onChange={ev => setEdit(h.id, { counted: ev.target.value })}
                              style={{
                                width: 110, padding: "7px 10px", textAlign: "right",
                                fontFamily: "var(--font-mono)", fontSize: 13, fontWeight: 600,
                                color: tone === "alert" ? "var(--status-danger-text)" :
                                       tone === "diff"  ? "var(--status-warning-text)" :
                                       tone === "match" ? "var(--text-brand)" : "var(--text-primary)",
                                background: "var(--bg-surface)",
                                border: `1px solid ${
                                  tone === "alert" ? "var(--cinnabar-400)" :
                                  tone === "diff"  ? "var(--amber-400)" :
                                  tone === "match" ? "var(--jade-300)" : "var(--border-default)"}`,
                                borderRadius: "var(--radius-md)", outline: "none",
                              }} />
                            <button onClick={() => fillSystemStock(h)}
                              title="시스템 재고와 동일"
                              style={{
                                padding: "6px 7px", border: "1px solid var(--border-default)",
                                background: "var(--bg-surface)", borderRadius: "var(--radius-sm)",
                                cursor: "pointer", color: "var(--text-muted)",
                                display: "inline-flex", alignItems: "center",
                              }}>
                              <Icon name="equal" size={12} />
                            </button>
                            <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>g</span>
                          </div>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right" }}>
                          {hasCount ? (
                            <>
                              <div style={{
                                fontSize: 13, fontFamily: "var(--font-mono)", fontWeight: 600,
                                color: diff > 0 ? "var(--text-brand)" :
                                       diff < 0 ? "var(--status-danger-text)" : "var(--text-muted)",
                              }}>
                                {diff > 0 ? "+" : ""}{diff !== 0 ? fmtMass(Math.abs(diff)).replace(/^/, diff < 0 ? "-" : "") : "±0"}
                              </div>
                              {diff !== 0 && (
                                <div style={{
                                  fontSize: 10, fontFamily: "var(--font-mono)", marginTop: 1,
                                  color: Math.abs(diffPct) > 20 ? "var(--status-danger-text)" : "var(--text-muted)",
                                }}>
                                  {diffPct > 0 ? "+" : ""}{diffPct.toFixed(1)}%
                                </div>
                              )}
                            </>
                          ) : (
                            <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>대기</span>
                          )}
                        </td>
                        <td style={{ padding: "8px 12px" }}>
                          <select value={reason} disabled={!hasCount || diff === 0}
                            onChange={ev => setEdit(h.id, { reason: ev.target.value })}
                            style={{
                              fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
                              background: !hasCount || diff === 0 ? "var(--bg-raised)" : "var(--bg-surface)",
                              border: "1px solid var(--border-default)",
                              borderRadius: "var(--radius-md)", padding: "6px 24px 6px 8px",
                              outline: "none", appearance: "none", cursor: hasCount && diff !== 0 ? "pointer" : "not-allowed",
                              opacity: !hasCount || diff === 0 ? 0.5 : 1, width: 120,
                              backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path fill='%238A9E9A' d='M0 0l4 5 4-5z'/></svg>\")",
                              backgroundRepeat: "no-repeat", backgroundPosition: "right 8px center",
                            }}>
                            {ADJ_REASONS.map(r => <option key={r.key} value={r.key}>{r.label}</option>)}
                          </select>
                        </td>
                        <td style={{ padding: "8px 12px" }}>
                          <input value={memo} disabled={!hasCount}
                            onChange={ev => setEdit(h.id, { memo: ev.target.value })}
                            placeholder={hasCount ? (reason === "other" ? "사유 직접 입력" : "선택") : "—"}
                            style={{
                              width: "100%", padding: "7px 10px",
                              fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
                              background: !hasCount ? "var(--bg-raised)" : "var(--bg-surface)",
                              border: "1px solid var(--border-default)",
                              borderRadius: "var(--radius-md)", outline: "none",
                              opacity: !hasCount ? 0.5 : 1, minWidth: 120,
                            }} />
                        </td>
                        <td style={{ padding: "10px 8px", textAlign: "center" }}>
                          {hasCount && (
                            <button onClick={() => clearRow(h.id)} title="실측값 삭제"
                              style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", padding: 4 }}>
                              <Icon name="rotate-ccw" size={13} />
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {rows.length === 0 && (
                <div style={{ padding: "40px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13 }}>
                  조건에 맞는 약재가 없습니다
                </div>
              )}
            </div>
          </div>
        </div>

        {/* Right summary sidebar */}
        <HAReviewPanel summary={summary} edits={edits} />
      </div>

      {confirmOpen && (
        <HAConfirmModal
          summary={summary}
          edits={edits}
          onClose={() => setConfirm(false)}
          onConfirm={() => { setConfirm(false); onSubmit && onSubmit({ draft: false, edits, summary }); }}
        />
      )}
    </div>
  );
}

// ── 스타일 헬퍼 ──────────────────────────────────────────────────
const hdrBase = {
  padding: "10px 14px", fontSize: 10, fontWeight: 700,
  color: "var(--text-muted)", letterSpacing: "0.06em",
  textTransform: "uppercase", whiteSpace: "nowrap",
};
const hdrL = { ...hdrBase, textAlign: "left" };
const hdrR = { ...hdrBase, textAlign: "right" };
const hdrC = { ...hdrBase, textAlign: "center" };

// ── KPI 카드 ─────────────────────────────────────────────────────
function HAStatCard({ icon, label, value, sub, tone = "neutral" }) {
  const tones = {
    neutral: { fg: "var(--text-primary)",  bg: "var(--bg-raised)",  iconFg: "var(--text-secondary)" },
    success: { fg: "var(--text-brand)",      bg: "var(--brand-subtle)",    iconFg: "var(--text-brand)" },
    danger:  { fg: "var(--status-danger-text)",  bg: "var(--status-danger-bg)", iconFg: "var(--status-danger-text)" },
  };
  const t = tones[tone];
  return (
    <div style={{
      flex: 1, background: "var(--bg-surface)",
      border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-lg)",
      padding: "12px 14px", display: "flex", alignItems: "center", gap: 12,
      boxShadow: "var(--shadow-sm)",
    }}>
      <div style={{
        width: 32, height: 32, borderRadius: "var(--radius-md)",
        background: t.bg, color: t.iconFg,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <Icon name={icon} size={16} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)" }}>{label}</div>
        <div style={{ fontSize: 18, fontWeight: 600, color: t.fg, fontFamily: "var(--font-mono)", marginTop: 2, lineHeight: 1.1 }}>{value}</div>
        <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 1 }}>{sub}</div>
      </div>
    </div>
  );
}

// ── 우측 검토 패널 ────────────────────────────────────────────────
function HAReviewPanel({ summary, edits }) {
  const changes = Object.keys(edits)
    .map(id => {
      const h = HERBS.find(x => x.id === id);
      const e = edits[id];
      if (!h || e.counted === "" || e.counted === undefined) return null;
      const diff = Number(e.counted) - h.stock;
      if (diff === 0) return null;
      return { h, diff, reason: e.reason };
    })
    .filter(Boolean)
    .sort((a, b) => Math.abs(b.diff * b.h.unitPrice) - Math.abs(a.diff * a.h.unitPrice));

  return (
    <div style={{
      width: 300, background: "var(--bg-surface)",
      borderLeft: "1px solid var(--border-subtle)", padding: "16px 18px",
      display: "flex", flexDirection: "column", gap: 16, flexShrink: 0, overflowY: "auto",
    }}>
      <div>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 6 }}>실사 진행</div>
        <div style={{ position: "relative", height: 8, background: "var(--bg-raised)", borderRadius: 4, overflow: "hidden" }}>
          <div style={{
            position: "absolute", top: 0, bottom: 0, left: 0,
            width: `${(summary.counted / summary.total) * 100}%`,
            background: "var(--jade-500)", transition: "width 0.2s ease",
          }}></div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 11, fontFamily: "var(--font-mono)" }}>
          <span style={{ color: "var(--text-secondary)" }}>{summary.counted} / {summary.total}종</span>
          <span style={{ color: "var(--text-muted)" }}>{Math.round(summary.counted / summary.total * 100)}%</span>
        </div>
      </div>

      <div>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>
          가장 큰 차이 ({changes.length}건)
        </div>
        {changes.length === 0 ? (
          <div style={{
            padding: "20px 12px", textAlign: "center", color: "var(--text-muted)",
            fontSize: 12, background: "var(--bg-raised)", borderRadius: "var(--radius-md)",
            border: "1px dashed var(--border-subtle)",
          }}>
            아직 차이가 발생한<br/>품목이 없습니다
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {changes.slice(0, 8).map(({ h, diff, reason }) => {
              const r = ADJ_REASONS.find(x => x.key === reason);
              const valueDelta = diff * h.unitPrice;
              return (
                <div key={h.id} style={{
                  padding: "8px 10px", border: "1px solid var(--border-subtle)",
                  borderRadius: "var(--radius-md)", background: "var(--bg-raised)",
                  display: "flex", flexDirection: "column", gap: 2,
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                    <span style={{ fontSize: 12, fontWeight: 500, color: "var(--text-primary)" }}>{h.name}</span>
                    <span style={{
                      fontSize: 12, fontFamily: "var(--font-mono)", fontWeight: 600,
                      color: diff > 0 ? "var(--text-brand)" : "var(--status-danger-text)",
                    }}>
                      {diff > 0 ? "+" : ""}{fmtMass(Math.abs(diff)).replace(/^/, diff < 0 ? "-" : "")}
                    </span>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>
                    <span>{r?.label}</span>
                    <span style={{ fontFamily: "var(--font-mono)" }}>{valueDelta > 0 ? "+" : ""}{won(valueDelta)}</span>
                  </div>
                </div>
              );
            })}
            {changes.length > 8 && (
              <div style={{ fontSize: 10, color: "var(--text-muted)", textAlign: "center", padding: "4px 0", fontFamily: "var(--font-mono)" }}>
                + {changes.length - 8}건 더
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{
        marginTop: "auto", padding: "12px 14px", background: "var(--brand-subtle)",
        border: "1px solid var(--brand-muted)", borderRadius: "var(--radius-md)",
        display: "flex", flexDirection: "column", gap: 8,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <span style={{ fontSize: 11, color: "var(--text-secondary)" }}>총 가치 변동</span>
          <span style={{
            fontSize: 16, fontWeight: 600, fontFamily: "var(--font-mono)",
            color: summary.valueDelta < 0 ? "var(--status-danger-text)" : summary.valueDelta > 0 ? "var(--text-brand)" : "var(--text-primary)",
          }}>
            {summary.valueDelta > 0 ? "+" : ""}{won(summary.valueDelta)}
          </span>
        </div>
        <div style={{ fontSize: 10, color: "var(--text-muted)", lineHeight: 1.5 }}>
          조정 확정 시 모든 차이는 재고 이력에 사유와 함께 기록되며 회계 처리됩니다.
        </div>
      </div>
    </div>
  );
}

// ── 확정 모달 ────────────────────────────────────────────────────
function HAConfirmModal({ summary, edits, onClose, onConfirm }) {
  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "var(--bg-overlay)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200,
      fontFamily: "var(--font-sans)",
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "var(--bg-surface)", borderRadius: "var(--radius-xl)",
        width: 460, padding: "24px 26px", boxShadow: "var(--shadow-xl)",
      }}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 16 }}>
          <div style={{
            width: 36, height: 36, borderRadius: "var(--radius-full)", whiteSpace: "nowrap",
            background: "var(--brand-muted)", color: "var(--text-brand)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <Icon name="check-check" size={18} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 17, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)" }}>재고 조정 확정</div>
            <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 2 }}>아래 내용으로 시스템 재고를 보정합니다</div>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 1, background: "var(--border-subtle)", borderRadius: "var(--radius-md)", overflow: "hidden", border: "1px solid var(--border-subtle)" }}>
          <HACfRow label="실사 완료" value={`${summary.counted}종 / 전체 ${summary.total}종`} />
          <HACfRow label="차이 발생 품목" value={`${summary.items}건`} />
          <HACfRow label="총 증가량" value={`+${fmtMass(summary.diffPlus)}`} accent="var(--text-brand)" />
          <HACfRow label="총 감소량" value={fmtMass(summary.diffMinus)} accent="var(--status-danger-text)" />
          <HACfRow label="가치 변동" value={`${summary.valueDelta > 0 ? "+" : ""}${won(summary.valueDelta)}`}
                   accent={summary.valueDelta < 0 ? "var(--status-danger-text)" : "var(--text-brand)"} bold />
        </div>

        <div style={{
          marginTop: 14, padding: "10px 12px", background: "var(--status-warning-bg)",
          border: "1px solid var(--status-warning-border)", borderRadius: "var(--radius-md)",
          fontSize: 11, color: "var(--status-warning-text)", display: "flex", gap: 8,
        }}>
          <Icon name="alert-triangle" size={13} style={{ flexShrink: 0, marginTop: 1 }} />
          <span>확정 후에는 개별 항목별로 사유를 수정할 수 있으나 전체 취소는 불가능합니다.</span>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 18 }}>
          <Button variant="secondary" size="md" onClick={onClose}>취소</Button>
          <Button variant="primary" size="md" icon="check-check" onClick={onConfirm}>조정 확정</Button>
        </div>
      </div>
    </div>
  );
}

function HACfRow({ label, value, accent, bold }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 12px", background: "var(--bg-surface)" }}>
      <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{label}</span>
      <span style={{
        fontSize: bold ? 14 : 12, fontFamily: "var(--font-mono)",
        color: accent || "var(--text-primary)", fontWeight: bold ? 600 : 400,
      }}>{value}</span>
    </div>
  );
}

Object.assign(window, { HerbAdjustmentScreen });

</script>

<script type="text/babel">
// KoMES — 약재 재고 관리 화면 (Herb Inventory)
// 종합 대시보드: KPI · AI 발주 추천 · 주의 필요 · 진행 중 발주 · 재고 테이블 + 우측 상세 패널

const { useState: useStHerb, useMemo: useMemoHerb } = React;

function HerbInventoryScreen({ onNavigate, onOpenRecSettings, onCreateDrafts }) {
  const [selectedId, setSelectedId]   = useStHerb("h-002");
  const [category, setCategory]       = useStHerb("all");
  const [statusFilter, setStatusFilter] = useStHerb("all");
  const [supplier, setSupplier]       = useStHerb("all");
  const [search, setSearch]           = useStHerb("");
  const [showAI, setShowAI]           = useStHerb(true);
  const [sortKey, setSortKey]         = useStHerb("name");
  const [sortDir, setSortDir]         = useStHerb("asc");
  const [toast, setToast]             = useStHerb(null);
  const [intakeOpen, setIntakeOpen]   = useStHerb(false);
  const [registerOpen, setRegister]   = useStHerb(false);
  const [adjustMode, setAdjustMode]   = useStHerb(false);

  // 알림 대상 (주의 필요)
  const alerts = useMemoHerb(() => HERBS.filter(h => {
    const st = herbStatus(h);
    return st.key !== "ok";
  }), []);

  // AI 발주 추천 — 잔여 14일 이하 OR 임계치 미만
  const aiSuggestions = useMemoHerb(() => {
    return HERBS
      .filter(h => h.stock < h.threshold || projectedRunOutDays(h) <= 14)
      .map(h => {
        const targetDays = 60;
        const need = Math.ceil((h.monthly / 30) * targetDays - h.stock);
        const suggestQty = Math.max(h.threshold, Math.ceil(need / 100) * 100);
        return { id: h.id, name: h.name, monthly: h.monthly, daysLeft: projectedRunOutDays(h), suggestQty, unitPrice: h.unitPrice };
      })
      .sort((a, b) => a.daysLeft - b.daysLeft);
  }, []);

  // 공급처 목록
  const suppliers = useMemoHerb(() => {
    const set = new Set(HERBS.map(h => h.supplier));
    return ["all", ...Array.from(set)];
  }, []);

  // 필터 + 정렬된 약재
  const rows = useMemoHerb(() => {
    let out = HERBS.slice();
    if (category !== "all")    out = out.filter(h => h.category === category);
    if (supplier !== "all")    out = out.filter(h => h.supplier === supplier);
    if (statusFilter !== "all") out = out.filter(h => herbStatus(h).key === statusFilter);
    if (search) {
      const q = search.toLowerCase();
      out = out.filter(h => h.name.includes(search) || h.latin.toLowerCase().includes(q));
    }
    out.sort((a, b) => {
      const dir = sortDir === "asc" ? 1 : -1;
      if (sortKey === "stock")    return (a.stock - b.stock) * dir;
      if (sortKey === "monthly")  return (a.monthly - b.monthly) * dir;
      if (sortKey === "value")    return (a.stock * a.unitPrice - b.stock * b.unitPrice) * dir;
      if (sortKey === "expiry")   return (daysUntil(a.expiry) - daysUntil(b.expiry)) * dir;
      if (sortKey === "lastIn")   return (new Date(a.lastIn) - new Date(b.lastIn)) * dir;
      return a.name.localeCompare(b.name, "ko") * dir;
    });
    return out;
  }, [category, supplier, statusFilter, search, sortKey, sortDir]);

  const selected = HERBS.find(h => h.id === selectedId) || null;

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(sortDir === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir("asc"); }
  };

  // 재고 조정 모드일 때는 전체 화면 인계
  if (adjustMode) {
    return <HerbAdjustmentScreen
      onClose={() => setAdjustMode(false)}
      onSubmit={({ draft, summary }) => {
        setAdjustMode(false);
        showToast(draft
          ? "재고 조정 내역이 임시 저장되었습니다."
          : `재고 조정 ${summary?.items || 0}건이 확정되었습니다.`);
      }} />;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar
        title="약재 재고"
        subtitle="현재 24종 · 마지막 동기화 2분 전"
        actions={<>
          <Button variant="ghost" size="sm" icon="download" onClick={() => showToast("재고 현황 엑셀을 내려받았습니다.")}>엑셀</Button>
          <Button variant="secondary" size="sm" icon="clipboard-edit" onClick={() => setAdjustMode(true)}>재고 조정</Button>
          <Button variant="secondary" size="sm" icon="plus" onClick={() => setRegister(true)}>약재 등록</Button>
          <Button variant="primary" size="sm" icon="package-plus" onClick={() => setIntakeOpen(true)}>입고 등록</Button>
        </>}
      />

      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        {/* Main column — block scroll wrapper, flex column inside */}
        <div style={{ flex: 1, overflowY: "auto", minWidth: 0 }}>
        <div style={{ padding: "20px 24px", display: "flex", flexDirection: "column", gap: 16 }}>
          <HIKpiStrip herbs={HERBS} alerts={alerts} openPOs={OPEN_PURCHASE_ORDERS} />

          {showAI && (
            <HIAICard
              suggestions={aiSuggestions}
              onApply={() => { setShowAI(false); onCreateDrafts && onCreateDrafts("herb"); }}
              onDismiss={() => setShowAI(false)}
              onOpenSettings={onOpenRecSettings}
            />
          )}

          <HIAlertSection alerts={alerts} onPick={setSelectedId} />

          <HIOpenPOs pos={OPEN_PURCHASE_ORDERS} onOpenHistory={() => onNavigate && onNavigate("orders")} />

          {/* Filters + Table */}
          <div style={{
            background: "var(--bg-surface)", border: "1px solid var(--border-subtle)",
            borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", overflow: "hidden",
          }}>
            {/* Filter bar */}
            <div style={{ padding: "12px 16px", borderBottom: "1px solid var(--border-subtle)", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-primary)", fontFamily: "var(--font-sans)", marginRight: 8 }}>전체 재고</span>
              <span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{rows.length} / {HERBS.length}종</span>
              <div style={{ flex: 1 }}></div>
              <div style={{ width: 200 }}>
                <Input value={search} onChange={setSearch} placeholder="약재명 / 학명 검색" icon="search" />
              </div>
              <HISelect value={category} onChange={setCategory}
                options={HERB_CATEGORIES.map(c => ({ value: c.key, label: c.label }))} />
              <HISelect value={supplier} onChange={setSupplier}
                options={suppliers.map(s => ({ value: s, label: s === "all" ? "공급처 전체" : s }))} />
              <HISelect value={statusFilter} onChange={setStatusFilter} options={[
                { value: "all",      label: "상태 전체" },
                { value: "ok",       label: "정상" },
                { value: "low",      label: "재고 부족" },
                { value: "critical", label: "소진 임박" },
                { value: "expiring", label: "유효기간 임박" },
              ]} />
            </div>

            {/* Table */}
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "var(--font-sans)" }}>
                <thead>
                  <tr style={{ background: "var(--bg-raised)" }}>
                    <HITh label="약재" sortable onClick={() => toggleSort("name")} active={sortKey==="name"} dir={sortDir} />
                    <HITh label="분류" />
                    <HITh label="재고 / 임계치" right sortable onClick={() => toggleSort("stock")} active={sortKey==="stock"} dir={sortDir} />
                    <HITh label="월 소비" right sortable onClick={() => toggleSort("monthly")} active={sortKey==="monthly"} dir={sortDir} />
                    <HITh label="최근 입고" sortable onClick={() => toggleSort("lastIn")} active={sortKey==="lastIn"} dir={sortDir} />
                    <HITh label="유효기간" sortable onClick={() => toggleSort("expiry")} active={sortKey==="expiry"} dir={sortDir} />
                    <HITh label="원산지 / 공급처" />
                    <HITh label="재고가치" right sortable onClick={() => toggleSort("value")} active={sortKey==="value"} dir={sortDir} />
                    <HITh label="위치" />
                    <HITh label="상태" />
                  </tr>
                </thead>
                <tbody>
                  {rows.map(h => {
                    const st = herbStatus(h);
                    const dExpiry = daysUntil(h.expiry);
                    const isSel = h.id === selectedId;
                    const value = h.stock * h.unitPrice;
                    const ratio = Math.min(h.stock / (h.threshold * 2), 1);
                    return (
                      <tr key={h.id} onClick={() => setSelectedId(h.id)}
                        style={{
                          borderTop: "1px solid var(--border-subtle)",
                          background: isSel ? "var(--brand-subtle)" : "transparent",
                          cursor: "pointer", transition: "background 0.1s ease",
                        }}
                        onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = "var(--bg-raised)"; }}
                        onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = "transparent"; }}>
                        <td style={{ padding: "10px 14px" }}>
                          <div style={{ fontSize: 13, fontWeight: 500, color: "var(--text-primary)" }}>{h.name}</div>
                          <div style={{ fontSize: 10, color: "var(--text-muted)", fontStyle: "italic", marginTop: 1 }}>{h.latin}</div>
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          <span style={{ fontSize: 11, background: "var(--bg-raised)", color: "var(--text-secondary)", padding: "2px 7px", borderRadius: "var(--radius-full)", border: "1px solid var(--border-default)", whiteSpace: "nowrap" }}>{h.category}</span>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", minWidth: 140 }}>
                          <div style={{ fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)", fontWeight: 500 }}>{fmtMass(h.stock)}</div>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "flex-end", marginTop: 4 }}>
                            <div style={{ width: 64, height: 4, background: "var(--bg-raised)", borderRadius: 2, overflow: "hidden" }}>
                              <div style={{
                                width: `${ratio * 100}%`, height: "100%",
                                background: st.key === "critical" ? "var(--cinnabar-500)" :
                                            st.key === "low"      ? "var(--amber-500)" :
                                                                    "var(--jade-500)",
                              }}></div>
                            </div>
                            <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>임 {fmtMass(h.threshold)}</span>
                          </div>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 13, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{fmtMass(h.monthly)}</td>
                        <td style={{ padding: "10px 14px", fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{h.lastIn}</td>
                        <td style={{ padding: "10px 14px" }}>
                          <div style={{ fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{h.expiry}</div>
                          <div style={{ fontSize: 10, color: dExpiry <= 90 ? "var(--status-danger-text)" : "var(--text-muted)", fontFamily: "var(--font-mono)", marginTop: 1 }}>D-{dExpiry}</div>
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{h.supplier}</div>
                          <div style={{ fontSize: 10, color: "var(--text-muted)" }}>{h.origin}</div>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontSize: 13, color: "var(--text-primary)", fontFamily: "var(--font-mono)" }}>{won(value)}</td>
                        <td style={{ padding: "10px 14px", fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-mono)" }}>{h.location}</td>
                        <td style={{ padding: "10px 14px" }}>
                          {st.key === "ok"
                            ? <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>정상</span>
                            : <Badge variant={st.tone}>{st.label}</Badge>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {rows.length === 0 && (
                <div style={{ padding: "32px 20px", textAlign: "center", color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)" }}>
                  조건에 맞는 약재가 없습니다.
                </div>
              )}
            </div>
          </div>
        </div>
        </div>

        {/* Right detail panel */}
        <HIDetailPanel herb={selected} onIntake={() => setIntakeOpen(true)} onToast={showToast} />
      </div>

      {/* Toast */}
      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--text-primary)", color: "var(--bg-raised)",
          padding: "10px 18px", borderRadius: "var(--radius-md)",
          fontSize: 13, fontFamily: "var(--font-sans)", boxShadow: "var(--shadow-lg)",
          display: "flex", alignItems: "center", gap: 8, zIndex: 100,
        }}>
          <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
          {toast}
        </div>
      )}

      {/* Intake modal */}
      {intakeOpen && (
        <HIIntakeModal herb={selected} onClose={() => setIntakeOpen(false)}
          onSubmit={(qty) => { setIntakeOpen(false); showToast(`${selected?.name} ${fmtMass(qty)} 입고 처리되었습니다.`); }} />
      )}

      {/* 신규 약재 등록 모달 */}
      {registerOpen && (
        <HerbRegistrationModal
          onClose={() => setRegister(false)}
          onSubmit={(data) => {
            setRegister(false);
            showToast(`신규 약재 '${data.name}'이(가) 등록되었습니다.`);
          }} />
      )}
    </div>
  );
}

// ── 작은 도우미들 ──────────────────────────────────────────────
function HITh({ label, sortable, onClick, active, dir, right }) {
  return (
    <th onClick={sortable ? onClick : undefined}
      style={{
        padding: "8px 14px", fontSize: 10, fontWeight: 700,
        color: active ? "var(--text-primary)" : "var(--text-muted)",
        textAlign: right ? "right" : "left", letterSpacing: "0.06em",
        textTransform: "uppercase", cursor: sortable ? "pointer" : "default",
        userSelect: "none", whiteSpace: "nowrap",
      }}>
      {label}
      {sortable && active && <span style={{ marginLeft: 4, fontSize: 9 }}>{dir === "asc" ? "▲" : "▼"}</span>}
    </th>
  );
}

function HISelect({ value, onChange, options }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)}
      style={{
        fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-primary)",
        background: "var(--bg-surface)", border: "1px solid var(--border-default)",
        borderRadius: "var(--radius-md)", padding: "6px 28px 6px 10px", outline: "none",
        appearance: "none",
        backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9E9A' d='M0 0l5 6 5-6z'/></svg>\")",
        backgroundRepeat: "no-repeat", backgroundPosition: "right 10px center",
        cursor: "pointer",
      }}>
      {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

// ── 우측 상세 패널 ──────────────────────────────────────────────
function HIDetailPanel({ herb, onIntake, onToast }) {
  if (!herb) {
    return (
      <div style={{ width: 320, background: "var(--bg-surface)", borderLeft: "1px solid var(--border-subtle)", padding: 20, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-muted)", fontSize: 13, fontFamily: "var(--font-sans)" }}>
        약재를 선택하면 상세가 표시됩니다
      </div>
    );
  }
  const st = herbStatus(herb);
  const dExpiry = daysUntil(herb.expiry);
  const runOut = projectedRunOutDays(herb);
  const value = herb.stock * herb.unitPrice;
  const history = HERB_HISTORY[herb.id] || [];

  return (
    <div style={{
      width: 320, background: "var(--bg-surface)", borderLeft: "1px solid var(--border-subtle)",
      padding: "16px 18px", display: "flex", flexDirection: "column", gap: 16,
      flexShrink: 0, overflowY: "auto",
    }}>
      <div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 2 }}>
          <span style={{ fontSize: 22, fontWeight: 600, fontFamily: "var(--font-serif)", color: "var(--text-primary)", letterSpacing: "-0.01em" }}>{herb.name}</span>
          <Badge variant={st.tone}>{st.label}</Badge>
        </div>
        <div style={{ fontSize: 11, color: "var(--text-muted)", fontStyle: "italic", fontFamily: "var(--font-sans)" }}>{herb.latin}</div>
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          <span style={{ fontSize: 11, background: "var(--bg-raised)", color: "var(--text-secondary)", padding: "2px 8px", borderRadius: "var(--radius-full)", border: "1px solid var(--border-default)", fontFamily: "var(--font-sans)", whiteSpace: "nowrap" }}>{herb.category}</span>
          <span style={{ fontSize: 11, background: "var(--bg-raised)", color: "var(--text-secondary)", padding: "2px 8px", borderRadius: "var(--radius-full)", whiteSpace: "nowrap", border: "1px solid var(--border-default)", fontFamily: "var(--font-sans)" }}>{herb.origin}</span>
        </div>
      </div>

      {/* Stock bar */}
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>현재 재고</span>
          <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>잔여 {runOut}일</span>
        </div>
        <div style={{ fontSize: 24, fontWeight: 600, fontFamily: "var(--font-mono)", color: "var(--text-primary)" }}>{fmtMass(herb.stock)}</div>
        <div style={{ position: "relative", height: 6, background: "var(--bg-raised)", borderRadius: 3, overflow: "hidden", marginTop: 6 }}>
          <div style={{
            position: "absolute", left: 0, top: 0, bottom: 0,
            width: `${Math.min(herb.stock / (herb.threshold * 2), 1) * 100}%`,
            background: st.key === "critical" ? "var(--cinnabar-500)" :
                        st.key === "low"      ? "var(--amber-500)" :
                                                "var(--jade-500)",
          }}></div>
          <div style={{
            position: "absolute", top: -2, bottom: -2,
            left: `${Math.min(herb.threshold / (herb.threshold * 2), 1) * 100}%`,
            width: 2, background: "var(--ink-500)",
          }}></div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>0</span>
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>임계치 {fmtMass(herb.threshold)}</span>
          <span style={{ fontSize: 10, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{fmtMass(herb.threshold * 2)}</span>
        </div>
      </div>

      {/* Quick actions */}
      <div style={{ display: "flex", gap: 6 }}>
        <Button variant="primary" size="sm" icon="package-plus" onClick={onIntake}>입고</Button>
        <Button variant="secondary" size="sm" icon="clipboard-edit" onClick={() => onToast("실사 보정 화면을 엽니다.")}>조정</Button>
        <Button variant="secondary" size="sm" icon="send" onClick={() => onToast(`${herb.name} 발주 라인이 추가되었습니다.`)}>발주</Button>
      </div>

      {/* Facts */}
      <div style={{ display: "flex", flexDirection: "column", gap: 1, background: "var(--border-subtle)", borderRadius: "var(--radius-md)", overflow: "hidden", border: "1px solid var(--border-subtle)" }}>
        <HIFact label="공급처"     value={herb.supplier} />
        <HIFact label="원산지"     value={herb.origin} />
        <HIFact label="단가"       value={`${won(herb.unitPrice)} / g`} />
        <HIFact label="재고가치"   value={won(value)} />
        <HIFact label="월 소비"    value={fmtMass(herb.monthly)} />
        <HIFact label="안전 임계치" value={fmtMass(herb.threshold)} />
        <HIFact label="최근 입고"   value={herb.lastIn} />
        <HIFact label="유효기간"   value={`${herb.expiry} · D-${dExpiry}`} accent={dExpiry <= 90 ? "var(--status-danger-text)" : undefined} />
        <HIFact label="보관 위치"  value={herb.location} />
      </div>

      {/* History */}
      <div>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", fontFamily: "var(--font-sans)", marginBottom: 8 }}>최근 이력</div>
        {history.length === 0
          ? <div style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-sans)", padding: "8px 0" }}>최근 90일간 이력이 없습니다.</div>
          : <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {history.map((h, i) => (
                <div key={i} style={{
                  display: "grid", gridTemplateColumns: "82px 38px 1fr auto", gap: 8, alignItems: "center",
                  padding: "7px 10px", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)",
                  background: "var(--bg-raised)",
                }}>
                  <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{h.date}</span>
                  <span style={{
                    fontSize: 10, fontWeight: 600, fontFamily: "var(--font-sans)",
                    color: h.type === "입고" ? "var(--text-brand)" : h.type === "사용" ? "var(--text-secondary)" : "var(--status-warning-text)",
                    background: h.type === "입고" ? "var(--brand-muted)" : h.type === "사용" ? "var(--bg-raised)" : "var(--status-warning-bg)",
                    padding: "1px 6px", borderRadius: "var(--radius-sm)", textAlign: "center",
                  }}>{h.type}</span>
                  <span style={{ fontSize: 11, color: "var(--text-secondary)", fontFamily: "var(--font-sans)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.note}</span>
                  <span style={{ fontSize: 12, fontFamily: "var(--font-mono)", color: h.qty > 0 ? "var(--text-brand)" : "var(--text-primary)" }}>
                    {h.qty > 0 ? "+" : ""}{h.qty}g
                  </span>
                </div>
              ))}
            </div>}
      </div>
    </div>
  );
}

function HIFact({ label, value, accent }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "8px 12px", background: "var(--bg-surface)" }}>
      <span style={{ fontSize: 12, color: "var(--text-secondary)", fontFamily: "var(--font-sans)" }}>{label}</span>
      <span style={{ fontSize: 12, color: accent || "var(--text-primary)", fontFamily: "var(--font-mono)", textAlign: "right" }}>{value}</span>
    </div>
  );
}

// ── 입고 등록 모달 ──────────────────────────────────────────────
function HIIntakeModal({ herb, onClose, onSubmit }) {
  const [qty, setQty]     = useStHerb("");
  const [lot, setLot]     = useStHerb("");

// 상태 판정
function supStatus(s) {
  const dExpiry = s.expiry ? daysUntil(s.expiry) : null;
  if (s.stock <= s.threshold * 0.5)                  return { key: "critical", label: "소진 임박",      tone: "danger"  };
  if (s.stock <  s.threshold)                        return { key: "low",      label: "재고 부족",      tone: "warning" };
  if (dExpiry !== null && dExpiry <= 90)             return { key: "expiring", label: "유효기간 임박", tone: "warning" };
  return                                                    { key: "ok",      label: "정상",          tone: "success" };
}

function supRunOut(s) {
  if (!s.monthly) return 999;
  return Math.round(s.stock / (s.monthly / 30));
}

function supFmt(qty, unit) {
  const num = Number.isInteger(qty) ? qty.toLocaleString("ko-KR") : qty.toFixed(1);
  return `${num} ${unit}`;
}

          const reason = st.key === "critical" ? `잔여 ${supRunOut(a)}일` :
                         st.key === "low"      ? `임계치 ${Math.round((a.threshold - a.stock) / a.threshold * 100)}% 미달` :

              </div>
            </div>

        })}
      </div>
    </div>
  );
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoMES — UI Kit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --ink-900: #111E1C; --ink-800: #1C2B2B; --ink-700: #2A3C3A; --ink-600: #3A4F4C;
  --ink-500: #4A5E5B; --ink-400: #6B7E7B; --ink-300: #8A9E9A; --ink-200: #B5C5C2;
  --ink-100: #D8E4E2; --ink-50:  #EEF4F3;
  --jade-900: #1A3C34; --jade-800: #2A5548; --jade-700: #2E5C52; --jade-600: #3A7065;
  --jade-500: #4A7C6F; --jade-400: #6B9E90; --jade-300: #8DBFB3; --jade-200: #B3D8D1;
  --jade-100: #D4EDE9; --jade-50:  #EEF8F6;
  --stone-900: #5C5248; --stone-800: #7A6E62; --stone-700: #9A8E82; --stone-600: #B8AFA4;
  --stone-500: #CEC6BC; --stone-400: #D8D0C4; --stone-300: #E4DDD4; --stone-200: #EDE7D9;
  --stone-100: #F5F0E8; --stone-50:  #FDFAF5;
  --cinnabar-900: #6B1A14; --cinnabar-800: #922420; --cinnabar-700: #B03028;
  --cinnabar-600: #C4594B; --cinnabar-500: #D4756A; --cinnabar-400: #E09690;
  --cinnabar-300: #EBB8B3; --cinnabar-200: #F3D4D1; --cinnabar-100: #FAEDEC;
  --amber-700: #8C5A1A; --amber-600: #B47A28; --amber-500: #C4974B; --amber-400: #D4AE78;
  --amber-200: #F0DFC0; --amber-100: #FAF2E4;
  --navy-900: #0E1A2E; --navy-800: #16263F; --navy-700: #1E3252; --navy-600: #294569;
  --navy-500: #355A82; --navy-400: #5878A3; --navy-300: #8298BF; --navy-200: #B3C0D7;
  --navy-100: #D6DEEB; --navy-50:  #EEF1F7;
  --bg-page: var(--stone-50); --bg-surface: #FFFFFF;
  --bg-raised: var(--stone-100); --bg-sunken: var(--stone-200);
  --bg-overlay: rgba(17, 30, 28, 0.48);
  --text-primary: var(--ink-800); --text-secondary: var(--ink-500);
  --text-muted: var(--ink-300); --text-disabled: var(--ink-200);
  --text-inverse: var(--stone-50); --text-brand: var(--jade-700);
  --text-danger: var(--cinnabar-600); --text-warning: var(--amber-600);
  --border-subtle: var(--stone-300); --border-default: var(--stone-400);
  --border-strong: var(--ink-200); --border-brand: var(--jade-500);
  --border-danger: var(--cinnabar-400);
  --brand: var(--jade-500); --brand-hover: var(--jade-600);
  --brand-active: var(--jade-700); --brand-subtle: var(--jade-50);
  --brand-muted: var(--jade-100);
  --status-success-bg: var(--jade-50); --status-success-text: var(--jade-700); --status-success-border: var(--jade-200);
  --status-warning-bg: var(--amber-100); --status-warning-text: var(--amber-700); --status-warning-border: var(--amber-200);
  --status-danger-bg: var(--cinnabar-100); --status-danger-text: var(--cinnabar-700); --status-danger-border: var(--cinnabar-200);
  --status-neutral-bg: var(--stone-100); --status-neutral-text: var(--ink-600); --status-neutral-border: var(--stone-300);
  --shadow-sm:  0 1px 2px rgba(17, 30, 28, 0.06), 0 1px 4px rgba(17, 30, 28, 0.04);
  --shadow-md:  0 2px 8px rgba(17, 30, 28, 0.08), 0 1px 3px rgba(17, 30, 28, 0.05);
  --shadow-lg:  0 4px 16px rgba(17, 30, 28, 0.10), 0 2px 6px rgba(17, 30, 28, 0.06);
  --shadow-xl:  0 8px 32px rgba(17, 30, 28, 0.12), 0 4px 12px rgba(17, 30, 28, 0.07);
  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;
  --font-serif: 'Noto Serif KR', 'Georgia', serif;
  --font-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
  --sidebar-bg: var(--ink-800);
  --sidebar-active: var(--jade-600);
  --rail-bg: var(--bg-surface);
  --rail-surface: var(--bg-surface);
  --rail-text: var(--text-primary);
  --rail-text-secondary: var(--text-secondary);
  --rail-text-muted: var(--text-muted);
  --rail-border: var(--border-subtle);
  --rail-stripe: var(--stone-100);
  --rail-divider: var(--stone-200);
  --board-appt-bg: #EEF1F6;  --board-appt-border: #CFD7E3;
  --board-wait-bg: #FAF2E4;  --board-wait-border: #F0DFC0;
  --board-treat-bg: #EAF4F1; --board-treat-border: #B3D8D1;
  --board-pay-bg: #F5F0E8;   --board-pay-border: #E4DDD4;
}

/* ── Dark theme overrides ──────────────────────────────────── */
[data-theme="dark"] {
  --bg-page:    #0B1413;
  --bg-surface: #131F1D;
  --bg-raised:  #1A2826;
  --bg-sunken:  #070D0C;
  --bg-overlay: rgba(0, 0, 0, 0.62);

  --text-primary:   var(--ink-50);
  --text-secondary: var(--ink-200);
  --text-muted:     var(--ink-300);
  --text-disabled:  var(--ink-500);
  --text-inverse:   var(--ink-800);
  --text-brand:     var(--jade-300);
  --text-danger:    var(--cinnabar-400);
  --text-warning:   var(--amber-400);

  --border-subtle:  #1F302D;
  --border-default: var(--ink-700);
  --border-strong:  var(--ink-600);
  --border-brand:   var(--jade-500);
  --border-danger:  var(--cinnabar-600);

  --brand:          var(--jade-400);
  --brand-hover:    var(--jade-300);
  --brand-active:   var(--jade-200);
  --brand-subtle:   rgba(74, 124, 111, 0.12);
  --brand-muted:    rgba(74, 124, 111, 0.22);

  --status-success-bg:     rgba(74, 124, 111, 0.14);
  --status-success-text:   var(--jade-300);
  --status-success-border: rgba(74, 124, 111, 0.35);
  --status-warning-bg:     rgba(196, 151, 75, 0.12);
  --status-warning-text:   var(--amber-400);
  --status-warning-border: rgba(196, 151, 75, 0.30);
  --status-danger-bg:      rgba(196, 89, 75, 0.12);
  --status-danger-text:    var(--cinnabar-400);
  --status-danger-border:  rgba(196, 89, 75, 0.30);
  --status-neutral-bg:     #1A2826;
  --status-neutral-text:   var(--ink-200);
  --status-neutral-border: var(--ink-700);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.40), 0 1px 4px rgba(0,0,0,0.25);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.28);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.50), 0 2px 6px rgba(0,0,0,0.30);
  --shadow-xl: 0 8px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.32);
  --board-appt-bg: #141C2B;  --board-appt-border: #1E2D45;
  --board-wait-bg: #1D1810;  --board-wait-border: #2D2418;
  --board-treat-bg: #101E1C; --board-treat-border: #1A3330;
  --board-pay-bg: #1A1510;   --board-pay-border: #2A2218;
}

/* ── Navy color — jade scale → navy (light mode) ───── */
[data-color="navy"] {
  --sidebar-bg: var(--navy-800);
  --sidebar-active: var(--navy-400);
  --rail-bg: var(--navy-900);
  --rail-surface: var(--navy-800);
  --rail-text: var(--navy-50);
  --rail-text-secondary: var(--navy-200);
  --rail-text-muted: var(--navy-300);
  --rail-border: var(--navy-800);
  --rail-stripe: rgba(255,255,255,0.04);
  --rail-divider: rgba(255,255,255,0.07);
  --jade-900: #0E1A2E; --jade-800: #16263F; --jade-700: #1E3252; --jade-600: #294569;
  --jade-500: #355A82; --jade-400: #5878A3; --jade-300: #8298BF; --jade-200: #B3C0D7;
  --jade-100: #D6DEEB; --jade-50:  #EEF1F7;
  --brand:        #355A82;
  --brand-hover:  #294569;
  --brand-active: #1E3252;
  --brand-subtle: #EEF1F7;
  --brand-muted:  #D6DEEB;
  --text-brand:   #1E3252;
  --border-brand: #355A82;
  --status-success-bg:     #EEF1F7;
  --status-success-text:   #1E3252;
  --status-success-border: #B3C0D7;
}

/* ── Navy color — dark mode override ─────────────── */
[data-theme="dark"][data-color="navy"] {
  --bg-page:    #080F1C;
  --bg-surface: #0E1A2E;
  --bg-raised:  #16263F;
  --bg-sunken:  #040810;
  --border-subtle:  #16263F;
  --brand:          #5878A3;
  --brand-hover:    #8298BF;
  --brand-active:   #B3C0D7;
  --brand-subtle:   rgba(53, 90, 130, 0.15);
  --brand-muted:    rgba(53, 90, 130, 0.28);
  --text-brand:     #8298BF;
  --border-brand:   #355A82;
  --status-success-bg:     rgba(53, 90, 130, 0.14);
  --status-success-text:   #8298BF;
  --status-success-border: rgba(53, 90, 130, 0.35);
}

[data-reduce-motion="true"] *,
[data-reduce-motion="true"] *::before,
[data-reduce-motion="true"] *::after {
  animation-duration: 0.001ms !important;
  transition-duration: 0.001ms !important;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { font-family: var(--font-sans); background-color: var(--bg-page); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: var(--bg-page); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Components.jsx?v=2"></script>
<script type="text/babel" src="LeftRail.jsx"></script>
<script type="text/babel" src="NewPatientModal.jsx"></script>
<script type="text/babel" src="ChartActingPanel.jsx"></script>
<script type="text/babel" src="PatientListScreen.jsx?v=2"></script>
<script type="text/babel" src="PatientManagementScreen.jsx"></script>
<script type="text/babel" src="PatientChartScreen.jsx"></script>
<script type="text/babel" src="PrescriptionScreen.jsx"></script>
<script type="text/babel" src="ScheduleScreen.jsx?v=4"></script>
<script type="text/babel" src="PaymentScreen.jsx"></script>
<script type="text/babel" src="herbData.jsx"></script>
<script type="text/babel" src="HerbInventoryParts.jsx?v=2"></script>
<script type="text/babel" src="HerbRegistrationModal.jsx"></script>
<script type="text/babel" src="HerbAdjustmentScreen.jsx"></script>
<script type="text/babel" src="HerbInventoryScreen.jsx?v=3"></script>
<script type="text/babel" src="suppliesData.jsx"></script>
<script type="text/babel" src="SuppliesParts.jsx?v=2"></script>
<script type="text/babel" src="SupplyRegistrationModal.jsx"></script>
<script type="text/babel" src="SupplyAdjustmentScreen.jsx"></script>
<script type="text/babel" src="SuppliesScreen.jsx?v=3"></script>
<script type="text/babel" src="purchaseOrdersData.jsx?v=2"></script>
<script type="text/babel" src="PurchaseOrderHistoryScreen.jsx"></script>
<script type="text/babel" src="PurchaseOrderDraftScreen.jsx"></script>
<script type="text/babel" src="RecommendationSettingsModal.jsx"></script>
<script type="text/babel" src="claimData.jsx"></script>
<script type="text/babel" src="ClaimSidebar.jsx"></script>
<script type="text/babel" src="ClaimList.jsx"></script>
<script type="text/babel" src="ClaimSubmissionFlow.jsx"></script>
<script type="text/babel" src="InsuranceClaimScreen.jsx"></script>
<script type="text/babel" src="PatientPickerData.jsx?v=1"></script>
<script type="text/babel" src="PatientPickerModal.jsx?v=1"></script>
<script type="text/babel" src="MedicalFormScreen.jsx?v=2"></script>
<script type="text/babel" src="PatientInstructionData.jsx"></script>
<script type="text/babel" src="PatientInstructionModal.jsx"></script>
<script type="text/babel" src="staffData.jsx?v=1"></script>
<script type="text/babel" src="NewStaffModal.jsx"></script>
<script type="text/babel" src="StaffManagementScreen.jsx?v=2"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const SCREENS = {
  patients: "patients",
  chart: "chart",
  prescribe: "prescribe",
};

function App() {
  const [nav, setNav] = useState(() => localStorage.getItem("komes_nav") || "patients");
  const [selectedPatient, setSelectedPatient] = useState(null);
  const [screen, setScreen] = useState(() => localStorage.getItem("komes_screen") || SCREENS.patients);
  const [recOpen, setRecOpen] = useState(false);
  const [recToast, setRecToast] = useState(null);
  const [draftsActive, setDraftsActive] = useState(null);  // null | "herb" | "supply" | "both"

  useEffect(() => { localStorage.setItem("komes_nav", nav); }, [nav]);
  useEffect(() => { localStorage.setItem("komes_screen", screen); }, [screen]);

  const handleSelectPatient = (p) => {
    setSelectedPatient(p);
    setScreen(SCREENS.chart);
    setNav("chart");
  };

  const handlePrescribe = () => setScreen(SCREENS.prescribe);

  const handleNavBack = () => {
    if (screen === SCREENS.prescribe) { setScreen(SCREENS.chart); setNav("chart"); }
    else { setScreen(SCREENS.patients); setNav("patients"); setSelectedPatient(null); }
  };

  // Non-implemented screens placeholder
  const PlaceholderScreen = ({ title }) => (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar title={title} />
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12 }}>
        <Icon name="construction" size={32} style={{ color: "var(--text-muted)" }} />
        <div style={{ fontSize: 14, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>이 화면은 준비 중입니다</div>
      </div>
    </div>
  );

  const renderMain = () => {
    if (nav === "patients") {
      return <PatientListScreen onSelectPatient={handleSelectPatient} />;
    }
    if (nav === "chart") {
      if (screen === SCREENS.prescribe && selectedPatient) {
        return <PrescriptionScreen patient={selectedPatient} onBack={handleNavBack} />;
      }
      return <PatientChartScreen patient={selectedPatient} onBack={handleNavBack} onPrescribe={handlePrescribe} onNavigate={handleNavigate} />;
    }
    if (nav === "registry") {
      return <PatientManagementScreen onOpenChart={handleSelectPatient} />;
    }
    if (nav === "schedule") {
      return <ScheduleScreen />;
    }
    if (nav === "payment") {
      return <PaymentScreen />;
    }
    if (nav === "claim") {
      return <InsuranceClaimScreen />;
    }
    if (nav === "forms") {
      return <MedicalFormScreen />;
    }
    if (nav === "inventory") {
      return <HerbInventoryScreen onNavigate={handleNavigate} onOpenRecSettings={() => setRecOpen(true)} onCreateDrafts={(scope) => setDraftsActive(scope)} />;
    }
    if (nav === "supplies") {
      return <SuppliesScreen onNavigate={handleNavigate} onOpenRecSettings={() => setRecOpen(true)} onCreateDrafts={(scope) => setDraftsActive(scope)} />;
    }
    if (nav === "orders") {
      return <PurchaseOrderHistoryScreen openSettings={() => setRecOpen(true)} />;
    }
    if (nav === "staff") {
      return <StaffManagementScreen />;
    }
    if (nav === "settings") {
      return <SettingsScreen />;
    }
    const labels = {
      prescriptions: "처방 관리",
      stats: "통계", ai: "AI 분석"
    };
    return <PlaceholderScreen title={labels[nav] || nav} />;
  };

  const handleNavigate = (key) => {
    setNav(key);
    if (key === "patients") {
      setScreen(SCREENS.patients);
    }
    if (key === "chart") {
      setScreen(SCREENS.chart);
    }
  };

  // 발주서 초안 편집 모드가 활성일 때 전체 화면 인계
  if (draftsActive) {
    const recs = computeRecommendations({ ...REC_DEFAULTS, scope: draftsActive });
    return (
      <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
        <Sidebar activeScreen={nav} onNavigate={(k) => { setDraftsActive(null); handleNavigate(k); }} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <PurchaseOrderDraftScreen
            key={draftsActive}
            initialRecommendations={recs}
            onClose={() => setDraftsActive(null)}
            onSubmit={({ draft, drafts }) => {
              setDraftsActive(null);
              setRecToast(draft
                ? `초안 ${drafts.length}건이 임시 저장되었습니다.`
                : `승인 요청 ${drafts.length}건이 원장님께 전송되었습니다.`);
              setTimeout(() => setRecToast(null), 2400);
            }}
          />
        </div>
        {recToast && (
          <div style={{
            position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
            background: "var(--ink-800)", color: "var(--stone-50)",
            padding: "10px 18px", borderRadius: "var(--radius-md)",
            fontSize: 13, boxShadow: "var(--shadow-lg)",
            display: "flex", alignItems: "center", gap: 8, zIndex: 300,
          }}>
            <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
            {recToast}
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <Sidebar activeScreen={nav} onNavigate={handleNavigate} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {renderMain()}
      </div>
      {recOpen && (
        <RecommendationSettingsModal
          onClose={() => setRecOpen(false)}
          onSave={() => { setRecOpen(false); setRecToast("추천 조건이 저장되었습니다."); setTimeout(() => setRecToast(null), 2200); }}
        />
      )}
      {recToast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--ink-800)", color: "var(--stone-50)",
          padding: "10px 18px", borderRadius: "var(--radius-md)",
          fontSize: 13, fontFamily: "var(--font-sans)", boxShadow: "var(--shadow-lg)",
          display: "flex", alignItems: "center", gap: 8, zIndex: 300,
        }}>
          <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
          {recToast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<script type="text/babel" src="PatientManagementScreen.jsx"></script>

<script type="text/babel" src="PrescriptionScreen.jsx"></script>
<script type="text/babel" src="PrescriptionManagementScreen.jsx"></script>
<script type="text/babel" src="ScheduleScreen.jsx?v=4"></script>
<script type="text/babel" src="PaymentScreen.jsx"></script>
<script type="text/babel" src="herbData.jsx"></script>
<script type="text/babel" src="HerbInventoryParts.jsx?v=2"></script>
<script type="text/babel" src="HerbRegistrationModal.jsx"></script>

<script type="text/babel" src="HoursEditModal.jsx?v=2"></script>
<script type="text/babel" src="ClinicSections.jsx?v=2"></script>
<script type="text/babel" src="AlertCenterModal.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const SCREENS = {
  patients: "patients",
  chart: "chart",
  prescribe: "prescribe",
};

function App() {
  const [nav, setNav] = useState(() => localStorage.getItem("komes_nav") || "patients");
  const [selectedPatient, setSelectedPatient] = useState(null);
  const [screen, setScreen] = useState(() => localStorage.getItem("komes_screen") || SCREENS.patients);
  const [recOpen, setRecOpen] = useState(false);
  const [recToast, setRecToast] = useState(null);
  const [draftsActive, setDraftsActive] = useState(null);  // null | "herb" | "supply" | "both"

  useEffect(() => { localStorage.setItem("komes_nav", nav); }, [nav]);
  useEffect(() => { localStorage.setItem("komes_screen", screen); }, [screen]);

  const handleSelectPatient = (p) => {
    setSelectedPatient(p);
    setScreen(SCREENS.chart);
    setNav("chart");
  };

  const handlePrescribe = () => setScreen(SCREENS.prescribe);

  const handleNavBack = () => {
    if (screen === SCREENS.prescribe) { setScreen(SCREENS.chart); setNav("chart"); }
    else { setScreen(SCREENS.patients); setNav("patients"); setSelectedPatient(null); }
  };

  // Non-implemented screens placeholder
  const PlaceholderScreen = ({ title }) => (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: "var(--bg-page)" }}>
      <TopBar title={title} />
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12 }}>
        <Icon name="construction" size={32} style={{ color: "var(--text-muted)" }} />
        <div style={{ fontSize: 14, color: "var(--text-muted)", fontFamily: "var(--font-sans)" }}>이 화면은 준비 중입니다</div>
      </div>
    </div>
  );

  const renderMain = () => {
    if (nav === "patients") {
      return <PatientListScreen onSelectPatient={handleSelectPatient} />;
    }
    if (nav === "chart") {
      if (screen === SCREENS.prescribe && selectedPatient) {
        return <PrescriptionScreen patient={selectedPatient} onBack={handleNavBack} />;
      }
      return <PatientChartScreen patient={selectedPatient} onBack={handleNavBack} onPrescribe={handlePrescribe} onNavigate={handleNavigate} />;
    }
    if (nav === "registry") {
      return <PatientManagementScreen onOpenChart={handleSelectPatient} />;
    }
    if (nav === "schedule") {
      return <ScheduleScreen />;
    }
    if (nav === "payment") {
      return <PaymentScreen />;
    }
    if (nav === "claim") {
      return <InsuranceClaimScreen />;
    }
    if (nav === "forms") {
      return <MedicalFormScreen />;
    }
    if (nav === "inventory") {
      return <HerbInventoryScreen onNavigate={handleNavigate} onOpenRecSettings={() => setRecOpen(true)} onCreateDrafts={(scope) => setDraftsActive(scope)} />;
    }
    if (nav === "supplies") {
      return <SuppliesScreen onNavigate={handleNavigate} onOpenRecSettings={() => setRecOpen(true)} onCreateDrafts={(scope) => setDraftsActive(scope)} />;
    }
    if (nav === "orders") {
      return <PurchaseOrderHistoryScreen openSettings={() => setRecOpen(true)} />;
    }
    if (nav === "clinic") {
      return <ClinicManagementScreen />;
    }
    if (nav === "settings") {
      return <SettingsScreen />;
    }
    if (nav === "prescriptions") {
      return <PrescriptionManagementScreen />;
    }
    const labels = {
      stats: "통계", ai: "AI 분석"
    };
    return <PlaceholderScreen title={labels[nav] || nav} />;
  };

  const handleNavigate = (key) => {
    setNav(key);
    if (key === "patients") {
      setScreen(SCREENS.patients);
    }
    if (key === "chart") {
      setScreen(SCREENS.chart);
    }
  };

  // 발주서 초안 편집 모드가 활성일 때 전체 화면 인계
  if (draftsActive) {
    const recs = computeRecommendations({ ...REC_DEFAULTS, scope: draftsActive });
    return (
      <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
        <Sidebar activeScreen={nav} onNavigate={(k) => { setDraftsActive(null); handleNavigate(k); }} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <PurchaseOrderDraftScreen
            key={draftsActive}
            initialRecommendations={recs}
            onClose={() => setDraftsActive(null)}
            onSubmit={({ draft, drafts }) => {
              setDraftsActive(null);
              setRecToast(draft
                ? `초안 ${drafts.length}건이 임시 저장되었습니다.`
                : `승인 요청 ${drafts.length}건이 원장님께 전송되었습니다.`);
              setTimeout(() => setRecToast(null), 2400);
            }}
          />
        </div>
        {recToast && (
          <div style={{
            position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
            background: "var(--ink-800)", color: "var(--stone-50)",
            padding: "10px 18px", borderRadius: "var(--radius-md)",
            fontSize: 13, boxShadow: "var(--shadow-lg)",
            display: "flex", alignItems: "center", gap: 8, zIndex: 300,
          }}>
            <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
            {recToast}
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <Sidebar activeScreen={nav} onNavigate={handleNavigate} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {renderMain()}
      </div>
      {recOpen && (
        <RecommendationSettingsModal
          onClose={() => setRecOpen(false)}
          onSave={() => { setRecOpen(false); setRecToast("추천 조건이 저장되었습니다."); setTimeout(() => setRecToast(null), 2200); }}
        />
      )}
      {recToast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: "var(--ink-800)", color: "var(--stone-50)",
          padding: "10px 18px", borderRadius: "var(--radius-md)",
          fontSize: 13, fontFamily: "var(--font-sans)", boxShadow: "var(--shadow-lg)",
          display: "flex", alignItems: "center", gap: 8, zIndex: 300,
        }}>
          <Icon name="check-circle" size={14} style={{ color: "var(--jade-300)" }} />
          {recToast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
